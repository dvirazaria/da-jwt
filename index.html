<script>
(function () {
  const MIN_BUYIN = 50;
  const BUYIN_OPTIONS = [50, 100, 150];
  // localStorage keys keep the historical "poker-settle" prefix for data continuity
  const KEY = "poker-settle-v1";
  const ME_KEY = "poker-settle-me";
  const THEME_KEY = "poker-settle-theme";
  const CONTACT_KEY = "poker-settle-contact";
  const PROFILE_DEBT_SEEN_KEY = "poker-settle-profile-debts-seen";
  const HISTORY_MAX = 400;
  const HOLD_TO_FORCE_CLOSE_MS = 1000;
  const FINISH_GAME_HOLD_MS = 1000;

  const EXAMPLE = {
    example: true,
    players: [
      { name: "דביר",  buyins: [50, 50], cashout: 180 },
      { name: "יוסי",  buyins: [50],     cashout: 0   },
      { name: "רותם",  buyins: [50, 50, 50], cashout: 95 },
      { name: "עמית",  buyins: [50],     cashout: 25  },
    ],
    history: [],
  };

  const expandedEntries = new Set();
  const expandedGameCards = new Set();
  const expandedGroupCards = new Set();
  const expandedGroupGames = new Set();
  let state = load();
  let appView = "games";         // "games" | "game" | "settle" | "profile" | "group"
  let currentGroupId = null;  // UI-only: which group's page is open when appView === "group"
  let openMenu = null;        // player name whose buy-in menu is open
  let menuJustOpened = null;  // menu that should animate open on the next render
  let exitOpen = null;        // player name whose exit (cashout) panel is open
  let exitJustOpened = null;  // exit panel that should animate open on the next render
  let pendingAmount = null;   // amount selected once, waiting for the confirming second tap
  let customOpen = null;      // player name whose custom-amount input is open
  let createGroupOpen = false;         // whether the create-group panel is expanded
  let createGroupJustOpened = false;   // panel should animate open on the next render
  let createGroupName = "";            // draft group name, kept across unrelated dashboard re-renders
  let createGroupAvatarDataUrl = null; // draft avatar preview (data URL), same reason
  let addMemberOpen = false;           // whether the "+ הוסף חבר" inline panel is expanded
  let addMemberJustOpened = false;     // panel should animate open on the next render
  let addMemberName = "";              // draft member name, kept across unrelated re-renders
  let removeMemberArmedId = null;      // memberId whose "הסר" is armed (two-step confirm)
  let removeMemberArmedTimeout = null; // auto-disarm timer for the above
  let formerMembersOpen = false;       // whether the "חברים לשעבר" collapsed list is expanded
  let formerMembersJustOpened = false; // list should animate open on the next render
  let startGameOpen = false;          // whether the group-page "start game" participant panel is expanded
  let startGameJustOpened = false;    // panel should animate open on the next render
  let startGameSelection = new Set(); // active-member ids selected as participants (creator preselected)
  let startGameGuests = [];           // [{ name, guestId }] ad-hoc guests added in the panel — not group members
  let animNext = "all";       // row entrance animation for the next render: "all" | "one" | null
  let animName = null;        // the player to animate when animNext === "one"
  let groupPageEnterNext = false; // group page sections should stagger in on the next renderGroupPage() —
                                   // set only by openGroup()/setAppView(), never by an in-place re-render
  let gamesPageEnterNext = false; // dashboard cards should stagger in on the next renderGamesDashboard() —
                                   // set only by setAppView(), never by an in-place re-render (Task 15, same
                                   // pattern as groupPageEnterNext above)
  let cardDetailsJustOpenedId = null; // gameId/groupId/historyGameId whose .games-card-details should
                                       // animate its grid-collapse open on the next render (Task 18 motion)
  let me = loadMe();
  let profileTab = "balance";
  let debtTab = "owed";

  // ---------- theme (default: dark), floating sun/moon toggle ----------
  const SUN_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5 5l1.8 1.8M17.2 17.2 19 19M19 5l-1.8 1.8M6.8 17.2 5 19"></path></svg>';
  const MOON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13.5A8 8 0 0 1 10.5 4a8 8 0 1 0 9.5 9.5Z"></path></svg>';
  try {
    if (localStorage.getItem(THEME_KEY) === "light") document.documentElement.dataset.theme = "light";
  } catch (e) {}
  function renderThemeIcon() {
    const isLight = document.documentElement.dataset.theme === "light";
    // show the appView you'll switch TO: moon while in light appView, sun while in dark
    document.getElementById("themeIcon").innerHTML = isLight ? MOON_SVG : SUN_SVG;
  }
  document.getElementById("themeBtn").addEventListener("click", () => toggleTheme());
  renderThemeIcon();

  function loadMe() {
    try { return localStorage.getItem(ME_KEY) || null; } catch (e) { return null; }
  }
  function saveMe() {
    try { me ? localStorage.setItem(ME_KEY, me) : localStorage.removeItem(ME_KEY); } catch (e) {}
  }

  function normalizePhase(value, source) {
    if (value === "active" || value === "settlement" || value === "closed") return value;
    if (source && !source.example && Array.isArray(source.players) && source.players.length) return "active";
    return "closed";
  }
  function initialAppView(gameState) {
    if (!gameState || gameState.example) return "games";
    if (gameState.phase === "active") return "game";
    if (gameState.phase === "settlement") return "settle";
    return "games";
  }

  function profileDebtIds(debts, userName) {
    return (Array.isArray(debts) ? debts : [])
      .filter(debt => debt && debt.status === "open" && (debt.debtorName === userName || debt.creditorName === userName))
      .map(debt => String(debt.id));
  }
  function hasUnseenProfileDebt(debts, userName, seenIds) {
    const seen = new Set(Array.isArray(seenIds) ? seenIds.map(String) : []);
    return profileDebtIds(debts, userName).some(id => !seen.has(id));
  }
  function markProfileDebtsSeen(debts, userName, seenIds) {
    return Array.from(new Set([
      ...(Array.isArray(seenIds) ? seenIds.map(String) : []),
      ...profileDebtIds(debts, userName),
    ]));
  }
  function loadProfileDebtSeen(userName) {
    if (!userName) return [];
    try {
      const saved = JSON.parse(localStorage.getItem(PROFILE_DEBT_SEEN_KEY) || "{}");
      return Array.isArray(saved[userName]) ? saved[userName].map(String) : [];
    } catch (e) { return []; }
  }
  function saveProfileDebtSeen(userName, ids) {
    if (!userName) return;
    try {
      const saved = JSON.parse(localStorage.getItem(PROFILE_DEBT_SEEN_KEY) || "{}");
      saved[userName] = Array.from(new Set(ids.map(String))).slice(-240);
      localStorage.setItem(PROFILE_DEBT_SEEN_KEY, JSON.stringify(saved));
    } catch (e) {}
  }
  function markProfileDebtsSeenForUser(debts, userName) {
    saveProfileDebtSeen(userName, markProfileDebtsSeen(debts, userName, loadProfileDebtSeen(userName)));
  }

  function normalizeDebt(debt) {
    if (!debt || typeof debt !== "object") return null;
    const gameId = String(debt.gameId || "");
    const debtorUserId = String(debt.debtorUserId || "");
    const creditorUserId = String(debt.creditorUserId || "");
    const debtorName = String(debt.debtorName || "");
    const creditorName = String(debt.creditorName || "");
    const amount = Math.round(Number(debt.amount) || 0);
    const createdAt = typeof debt.createdAt === "string" ? debt.createdAt : "";
    const gameDate = typeof debt.gameDate === "string" ? debt.gameDate : createdAt;
    const status = debt.status === "paid" ? "paid" : "open";
    return {
      id: String(debt.id || ["debt", gameId, debtorUserId || debtorName, creditorUserId || creditorName, amount].join("-")),
      gameId,
      groupId: debt.groupId || debt.clanId || null,
      debtorUserId, creditorUserId, debtorName, creditorName, amount,
      status, createdAt, gameDate,
      paidAt: status === "paid" && typeof debt.paidAt === "string" ? debt.paidAt : null,
    };
  }

  function normalize(s) {
    if (!s || !Array.isArray(s.players)) return null;
    // Deterministic legacy IDs let devices migrate the same old snapshot consistently.
    // Old amounts have no recorded time: never manufacture a timestamp for them.
    const gameId = s.gameId || "legacy-" + encodeURIComponent(JSON.stringify([
      s.updatedAt || "", s.players.map(p => p.name),
    ]));
    return {
      example: !!s.example,
      gameId,
      phase: normalizePhase(s.phase, s),
      players: s.players.map((p, index) => {
        const id = p.id || gameId + "-player-" + index;
        const buyins = Array.isArray(p.buyins) ? [...p.buyins] : [];
        return { ...p, id, buyins,
          status: p.status === "exited" ? "exited" : "active",
          exitedAt: typeof p.exitedAt === "string" ? p.exitedAt : null,
          userId: null, // pre-backend: forced like every other normalizer (no accounts yet)
          guestId: typeof p.guestId === "string" ? p.guestId : null,
          memberId: typeof p.memberId === "string" ? p.memberId : null,
          entryLog: buyins.map((amount, i) => {
          const saved = p.entryLog && p.entryLog[i];
          return saved && saved.amount === amount && saved.playerId === id && saved.gameId === gameId
            ? { ...saved }
            : { id: id + "-entry-" + i, timestamp: null, amount, playerId: id, gameId };
        }) };
      }),
      history: Array.isArray(s.history) ? s.history : [],
      debts: Array.isArray(s.debts) ? s.debts.map(normalizeDebt).filter(Boolean) : [],
      settlementStatuses: s.settlementStatuses && typeof s.settlementStatuses === "object"
        ? { ...s.settlementStatuses } : {},
      groupId: s.groupId || s.clanId || null,
      startedAt: typeof s.startedAt === "string" ? s.startedAt : null,
      // Shaped the same way `debts` is above: normalize each record and drop anything invalid
      // (e.g. missing id), so malformed or partial synced/legacy data can't corrupt state.
      groups: Array.isArray(s.groups) ? s.groups.map(normalizeGroup).filter(Boolean) : [],
      groupMembers: Array.isArray(s.groupMembers) ? s.groupMembers.map(normalizeGroupMember).filter(Boolean) : [],
      invites: Array.isArray(s.invites) ? s.invites.map(normalizeInvite).filter(Boolean) : [],
      friendships: Array.isArray(s.friendships) ? s.friendships.map(normalizeFriendship).filter(Boolean) : [],
      leaderRef: s.leaderRef ? normalizeParticipantRef(s.leaderRef) : null,
      updatedAt: typeof s.updatedAt === "string" ? s.updatedAt : "",
    };
  }
  function newId() {
    return typeof crypto.randomUUID === "function" ? crypto.randomUUID()
      : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
  }
  function addEntry(player, amount) {
    const entry = { id: newId(), timestamp: new Date().toISOString(),
      amount, playerId: player.id, gameId: state.gameId };
    player.buyins.push(amount);
    player.entryLog.push(entry);
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = normalize(JSON.parse(raw));
        if (s) return s;
      }
    } catch (e) {}
    return normalize(JSON.parse(JSON.stringify(EXAMPLE)));
  }
  function save() {
    pendingRemote = null; // a local edit supersedes any remote state parked for later
    state.updatedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    scheduleRemoteSave();
  }

  // --- server sync (shared document, survives devices and reloads) ---
  const CLIENT_ID = Math.random().toString(36).slice(2);
  let gameDoc = null;
  let saveTimer = null;
  let pendingRemote = null;
  let dirtyUntil = 0; // while set, fresh local edits outrank incoming remote state

  function setSync(on, label) {
    const d = document.getElementById("syncDot");
    if (d) { d.classList.toggle("on", on); d.title = label; }
  }

  function remoteBody() {
    return {
      by: CLIENT_ID,
      gameId: state.gameId,
      phase: state.phase,
      example: !!state.example,
      players: state.players,
      history: state.history,
      debts: state.debts,
      settlementStatuses: state.settlementStatuses,
      groupId: state.groupId || null,
      startedAt: state.startedAt || null,
      leaderRef: state.leaderRef || null,
      groups: state.groups || [],
      groupMembers: state.groupMembers || [],
      invites: state.invites || [],
      friendships: state.friendships || [],
      updatedAt: state.updatedAt || new Date().toISOString(),
    };
  }

  function scheduleRemoteSave() {
    dirtyUntil = Date.now() + 6000;
    if (!gameDoc) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      saveTimer = null;
      gameDoc.set(remoteBody()).catch(() => setSync(false, "שגיאת שמירה — נשמר מקומית"));
    }, 400);
  }

  function applyRemote(data) {
    // Snapshot bodies are frozen objects — deep-clone so later edits
    // (push into buyins, cashout assignment) don't silently fail.
    const incoming = normalize(JSON.parse(JSON.stringify({
      gameId: data.gameId,
      phase: data.phase,
      example: !!data.example,
      players: Array.isArray(data.players) ? data.players : [],
      history: Array.isArray(data.history) ? data.history : [],
      debts: Array.isArray(data.debts) ? data.debts : [],
      settlementStatuses: data.settlementStatuses && typeof data.settlementStatuses === "object" ? data.settlementStatuses : {},
      groupId: data.groupId || data.clanId || null,
      startedAt: typeof data.startedAt === "string" ? data.startedAt : null,
      leaderRef: data.leaderRef && typeof data.leaderRef === "object" ? data.leaderRef : null,
      groups: Array.isArray(data.groups) ? data.groups : [],
      groupMembers: Array.isArray(data.groupMembers) ? data.groupMembers : [],
      invites: Array.isArray(data.invites) ? data.invites : [],
      friendships: Array.isArray(data.friendships) ? data.friendships : [],
      updatedAt: typeof data.updatedAt === "string" ? data.updatedAt : "",
    })));
    if (JSON.stringify({ g: incoming.gameId, q: incoming.phase, e: incoming.example, p: incoming.players, h: incoming.history, d: incoming.debts, s: incoming.settlementStatuses, a: incoming.startedAt, gr: incoming.groups, gm: incoming.groupMembers, iv: incoming.invites, fr: incoming.friendships, gi: incoming.groupId, lr: incoming.leaderRef }) ===
        JSON.stringify({ g: state.gameId, q: state.phase, e: state.example, p: state.players, h: state.history, d: state.debts, s: state.settlementStatuses, a: state.startedAt, gr: state.groups, gm: state.groupMembers, iv: state.invites, fr: state.friendships, gi: state.groupId, lr: state.leaderRef })) return;
    // Don't yank the UI out from under an active edit — apply on blur.
    const ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT")) { pendingRemote = incoming; return; }
    state = incoming;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    render();
  }

  document.addEventListener("visibilitychange", () => {
    // Flush a pending debounced write immediately when the tab is hidden/closed.
    if (document.visibilityState === "hidden" && saveTimer && gameDoc) {
      clearTimeout(saveTimer);
      saveTimer = null;
      gameDoc.set(remoteBody()).catch(() => {});
    }
  });

  // Applies a parked remote snapshot once it is safe: not during an active
  // edit and not while a local write is pending — retries instead of dropping,
  // so an update from another device is never silently lost.
  function tryApplyParked() {
    if (!pendingRemote) return;
    const ae = document.activeElement;
    if (ae && ae.tagName === "INPUT") return; // will retry on the next focusout
    if (saveTimer || Date.now() < dirtyUntil) {
      setTimeout(tryApplyParked, 600);
      return;
    }
    const p = pendingRemote; pendingRemote = null;
    applyRemote(p);
  }
  document.addEventListener("focusout", () => {
    // let the click that caused this blur run first
    setTimeout(tryApplyParked, 50);
  });

  function initSync() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    window.claude.use("db").then((db) => {
      if (!db) return; // no server storage in this view — stay on localStorage
      gameDoc = db.doc("games/current");
      gameDoc.onSnapshot((snap) => {
        setSync(true, "מסונכרן");
        if (!snap.exists) {
          // First device seeds the shared game with whatever it has locally.
          if (!state.example && (state.players.length || state.history.length)) scheduleRemoteSave();
          return;
        }
        const data = snap.data();
        if (!data) return;
        if (data.by === CLIENT_ID) { dirtyUntil = 0; return; } // our own write confirmed
        // Local state that is strictly newer than the server doc (e.g. edits
        // made while a previous session's write failed) wins: push it up
        // instead of letting the stale doc overwrite it.
        if (state.updatedAt && data.updatedAt && state.updatedAt > data.updatedAt) {
          scheduleRemoteSave();
          return;
        }
        // A fresh local edit is still on its way to the server — don't let
        // an older remote snapshot overwrite it.
        if (saveTimer || Date.now() < dirtyUntil) return;
        applyRemote(data);
      }, () => setSync(false, "שמירה מקומית"));
    }).catch(() => {});
  }
  initSync();

  // Example data promises "any edit resets it": the first real interaction
  // wipes the demo players instead of quietly turning them into real ones.
  // Returns true when it wiped, so callers can stop their own action.
  function markReal() {
    if (!state.example) return false;
    state = newCurrentGame(state, { phase: "active", startedAt: new Date().toISOString() });
    expandedEntries.clear();
    return true;
  }

  // D3: wrapped in FSI/PDI (U+2068/U+2069) so the bidi algorithm treats the whole "₪123"/"-₪123"
  // as one isolated run — otherwise ₪ lands on a different side of the digits depending on sign
  // when this string sits inside RTL text. Digits/amount otherwise unchanged.
  const fmt = (n) => "⁨₪" + (Math.round(n * 100) / 100).toLocaleString("he-IL") + "⁩";
  const fmtSigned = (n) => "⁨" + ((n > 0 ? "+" : "") + fmt(n)).replace("₪-", "-₪") + "⁩";
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  const wholeMoney = (n) => Math.round(Number(n) || 0);

  function tableBalance(players) {
    const buy = players.reduce((total, p) => total + p.buyins.reduce((x, amount) => x + wholeMoney(amount), 0), 0);
    const out = players.reduce((total, p) => total + wholeMoney(p.cashout), 0);
    const difference = Math.round(buy - out);
    return { buy, out, difference, isBalanced: difference === 0 };
  }

  function totals() {
    const balance = tableBalance(state.players);
    return { buy: balance.buy, out: balance.out, diff: balance.difference };
  }

  function buildHistoryEntry(snapshot, balance, at, moves = [], paidStatuses = {}) {
    return {
      gameId: snapshot.gameId,
      at,
      groupId: snapshot.groupId || null,
      startedAt: snapshot.startedAt || null,
      leaderRef: snapshot.leaderRef || null,
      isBalanced: balance.isBalanced,
      balanceDifference: balance.difference,
      transfers: moves.map((move, index) => ({
        id: settlementKey(snapshot.gameId, move, index),
        from: move.from,
        to: move.to,
        amount: wholeMoney(move.amount),
        status: paidStatuses[settlementKey(snapshot.gameId, move, index)] ? "paid" : "open",
      })),
      players: snapshot.players.map(p => ({
        id: p.id,
        entryLog: p.entryLog.map(entry => ({ ...entry })),
        name: p.name,
        guestId: p.guestId || null,
        memberId: p.memberId || null,
        buyin: sum(p.buyins),
        cashout: Number(p.cashout) || 0,
        net: (Number(p.cashout) || 0) - sum(p.buyins),
        status: p.status === "exited" ? "exited" : "active",
        exitedAt: p.exitedAt || null,
      })),
    };
  }

  function balanceDescription(diff) {
    if (diff > 0) return "חסר " + fmt(diff);
    if (diff < 0) return "עודף " + fmt(Math.abs(diff));
    return "0";
  }

  function settlementKey(gameId, move, index) {
    return [gameId, index, move.from, move.to, wholeMoney(move.amount)].join("::");
  }

  function buildDebtRecords(snapshot, moves, paidStatuses, at) {
    return moves.reduce((debts, move, index) => {
      const key = settlementKey(snapshot.gameId, move, index);
      if (paidStatuses && paidStatuses[key]) return debts;
      const debtor = snapshot.players.find(p => p.name === move.from);
      const creditor = snapshot.players.find(p => p.name === move.to);
      if (!debtor || !creditor) return debts;
      debts.push({
        id: "debt-" + key,
        gameId: snapshot.gameId,
        groupId: snapshot.groupId || snapshot.clanId || null,
        debtorUserId: debtor.id,
        creditorUserId: creditor.id,
        debtorName: debtor.name,
        creditorName: creditor.name,
        amount: wholeMoney(move.amount),
        status: "open",
        createdAt: at,
        gameDate: at,
        paidAt: null,
      });
      return debts;
    }, []);
  }

  function updateDebtAsPaid(debts, debtId, actorName, paidAt) {
    const debt = debts.find(item => item.id === debtId);
    if (!debt || debt.status !== "open" || debt.creditorName !== actorName) return false;
    debt.status = "paid";
    debt.paidAt = paidAt;
    return true;
  }

  function closeButtonLabel(isBalanced, forceUnlocked, closeArmed) {
    if (!isBalanced) return forceUnlocked ? "סגור בכל זאת" : "לחיצה ארוכה כדי לסגור למרות הפער";
    return closeArmed ? "לסגור את השולחן? לחיצה נוספת מאשרת" : "סגירת שולחן ורישום לרקורד";
  }

  function setCloseButtonLabel(button, label) {
    const text = button.querySelector("#closeTableLabel");
    if (text) text.textContent = label;
    else button.textContent = label;
  }

  // Greedy settlement: fewest transfers between net winners and losers.
  function settle() {
    const nets = state.players
      .map(p => ({ name: p.name, net: (Number(p.cashout) || 0) - sum(p.buyins) }))
      .filter(p => Math.abs(p.net) > 0.005);
    const winners = nets.filter(p => p.net > 0).sort((a, b) => b.net - a.net);
    const losers  = nets.filter(p => p.net < 0).sort((a, b) => a.net - b.net);
    const moves = [];
    let i = 0, j = 0;
    while (i < losers.length && j < winners.length) {
      const pay = Math.min(-losers[i].net, winners[j].net);
      moves.push({ from: losers[i].name, to: winners[j].name, amount: pay });
      losers[i].net += pay;
      winners[j].net -= pay;
      if (-losers[i].net < 0.005) i++;
      if (winners[j].net < 0.005) j++;
    }
    return moves;
  }

  // ---------- friends (pure) ----------
  // FriendRequests = { incoming: [Friendship], outgoing: [Friendship], friends: [ParticipantRef] }
  // incoming/outgoing keep the raw Friendship (so a future UI can act on its id); friends
  // flattens to the other party's ref since there is no pending action on an accepted friendship.
  function friendRequestsFor(friendships, meRef) {
    const list = Array.isArray(friendships) ? friendships : [];
    const incoming = [];
    const outgoing = [];
    const friends = [];
    list.forEach(f => {
      if (!f) return;
      if (f.status === "pending") {
        if (sameIdentity(f.addressee, meRef)) incoming.push(f);
        else if (sameIdentity(f.requester, meRef)) outgoing.push(f);
      } else if (f.status === "accepted") {
        if (sameIdentity(f.requester, meRef)) friends.push(f.addressee);
        else if (sameIdentity(f.addressee, meRef)) friends.push(f.requester);
      }
    });
    return { incoming, outgoing, friends };
  }
  // Returns the new pending Friendship (pushed onto `friendships`), or null for a self-request,
  // or when a pending/accepted friendship already exists between the two in either direction.
  function createFriendRequest(friendships, fromRef, toRef, at) {
    const list = Array.isArray(friendships) ? friendships : [];
    if (sameIdentity(fromRef, toRef)) return null;
    const exists = list.some(f => f && (f.status === "pending" || f.status === "accepted") &&
      ((sameIdentity(f.requester, fromRef) && sameIdentity(f.addressee, toRef)) ||
       (sameIdentity(f.requester, toRef) && sameIdentity(f.addressee, fromRef))));
    if (exists) return null;
    const friendship = {
      id: newId(),
      requester: fromRef,
      addressee: toRef,
      status: "pending",
      createdAt: at,
      respondedAt: null,
    };
    friendships.push(friendship);
    return friendship;
  }
  // Returns false unless `id` names a pending friendship whose addressee is `meRef`; else sets
  // status to accepted/rejected and stamps respondedAt.
  function respondToFriendRequest(friendships, id, meRef, accept, at) {
    const list = Array.isArray(friendships) ? friendships : [];
    const friendship = list.find(f => f && f.id === id);
    if (!friendship || friendship.status !== "pending" || !sameIdentity(friendship.addressee, meRef)) return false;
    friendship.status = accept ? "accepted" : "rejected";
    friendship.respondedAt = at;
    return true;
  }

  // ---------- player exit (pure) ----------
  function exitPlayer(player, cashout, at) {
    if (!player || player.status === "exited") return false;
    const amount = Math.round(Number(cashout));
    if (!Number.isFinite(amount) || amount < 0) return false;
    player.status = "exited";
    player.exitedAt = at;
    player.cashout = amount;
    return true;
  }
  function updateExitCashout(player, cashout) {
    if (!player || player.status !== "exited") return false;
    const amount = Math.round(Number(cashout));
    if (!Number.isFinite(amount) || amount < 0) return false;
    player.cashout = amount;
    return true;
  }
  function activePlayers(players) {
    return players.filter(p => p.status !== "exited");
  }
  function exitedPlayers(players) {
    return players.filter(p => p.status === "exited");
  }
  function isExited(player) {
    return !!player && player.status === "exited";
  }

  // ---------- groups domain (pure) ----------
  // Pre-backend identity: userId is always null; guestId is the stable local identity
  // (resolveGuestId reuses one guestId per displayName across groups/history on this device).
  // ParticipantRef  = { userId: string|null, guestId: string|null, displayName: string }
  // Group           = { id, name, avatarDataUrl: string|null, createdBy: ParticipantRef, createdAt,
  //                     archivedAt: ISO|null, deletedAt: ISO|null }
  // GroupMember     = { id, groupId, userId: null, guestId, displayName, role: "admin"|"member",
  //                     status: "active"|"left"|"removed", joinedAt, leftAt: ISO|null }
  // Invite          = { id, groupId, token, createdBy: ParticipantRef, createdAt, revokedAt: ISO|null }
  // Friendship      = { id, requester: ParticipantRef, addressee: ParticipantRef,
  //                     status: "pending"|"accepted"|"rejected", createdAt, respondedAt: ISO|null }
  // GroupSummary     = { groupId, name, avatarDataUrl, memberCount, members: [displayName], hasActiveGame,
  //                      activeGamePhase, gameCount, lastGameAt, leaderNames: [displayName], isAdmin, isMember }
  // LeaderboardEntry = { rank, identityKey, displayName, gamesPlayed, wins, isFormerMember } -- no money field
  // GroupGameSummary = { gameId, at, startedAt, playerCount, playerNames, winnerNames, potSize, totalEntries,
  //                      isBalanced } -- no per-player net; built by toGroupGameSummary(historyEntry)
  function normalizeParticipantRef(ref) {
    const r = ref && typeof ref === "object" ? ref : {};
    return {
      userId: null,
      guestId: typeof r.guestId === "string" ? r.guestId : null,
      displayName: String(r.displayName || ""),
    };
  }
  function normalizeGroup(g) {
    if (!g || typeof g !== "object" || !g.id) return null;
    return {
      id: String(g.id),
      name: String(g.name || ""),
      avatarDataUrl: typeof g.avatarDataUrl === "string" ? g.avatarDataUrl : null,
      createdBy: normalizeParticipantRef(g.createdBy),
      createdAt: typeof g.createdAt === "string" ? g.createdAt : "",
      archivedAt: typeof g.archivedAt === "string" ? g.archivedAt : null,
      deletedAt: typeof g.deletedAt === "string" ? g.deletedAt : null,
    };
  }
  function normalizeGroupMember(m) {
    if (!m || typeof m !== "object" || !m.id) return null;
    return {
      id: String(m.id),
      groupId: String(m.groupId || ""),
      userId: null,
      guestId: typeof m.guestId === "string" ? m.guestId : null,
      displayName: String(m.displayName || ""),
      role: m.role === "admin" ? "admin" : "member",
      status: m.status === "left" || m.status === "removed" ? m.status : "active",
      joinedAt: typeof m.joinedAt === "string" ? m.joinedAt : "",
      leftAt: typeof m.leftAt === "string" ? m.leftAt : null,
    };
  }
  function normalizeInvite(i) {
    if (!i || typeof i !== "object" || !i.id) return null;
    return {
      id: String(i.id),
      groupId: String(i.groupId || ""),
      token: String(i.token || ""),
      createdBy: normalizeParticipantRef(i.createdBy),
      createdAt: typeof i.createdAt === "string" ? i.createdAt : "",
      revokedAt: typeof i.revokedAt === "string" ? i.revokedAt : null,
    };
  }
  function normalizeFriendship(f) {
    if (!f || typeof f !== "object" || !f.id) return null;
    return {
      id: String(f.id),
      requester: normalizeParticipantRef(f.requester),
      addressee: normalizeParticipantRef(f.addressee),
      status: f.status === "accepted" || f.status === "rejected" ? f.status : "pending",
      createdAt: typeof f.createdAt === "string" ? f.createdAt : "",
      respondedAt: typeof f.respondedAt === "string" ? f.respondedAt : null,
    };
  }
  function identityKey(ref) {
    const r = ref || {};
    if (r.userId) return "u:" + r.userId;
    if (r.guestId) return "g:" + r.guestId;
    return "n:" + (r.displayName || "");
  }
  function sameIdentity(a, b) {
    return identityKey(a) === identityKey(b);
  }
  // Reuses the guestId already on record for this displayName (an active/former group
  // member, or a player in a closed game) so the same person keeps one id on this device.
  function resolveGuestId(collections, displayName) {
    const c = collections || {};
    const members = Array.isArray(c.groupMembers) ? c.groupMembers : [];
    const knownMember = members.find(m => m && m.displayName === displayName && m.guestId);
    if (knownMember) return knownMember.guestId;
    const history = Array.isArray(c.history) ? c.history : [];
    for (const entry of history) {
      const players = entry && Array.isArray(entry.players) ? entry.players : [];
      const knownPlayer = players.find(p => p && p.name === displayName && p.guestId);
      if (knownPlayer) return knownPlayer.guestId;
    }
    return newId();
  }
  function findMyMembership(members, groupId, meName) {
    return (Array.isArray(members) ? members : [])
      .find(m => m && m.groupId === groupId && m.status === "active" && m.displayName === meName) || null;
  }
  function isGroupAdmin(members, groupId, meName) {
    const membership = findMyMembership(members, groupId, meName);
    return !!membership && membership.role === "admin";
  }
  function activeMembers(members, groupId) {
    return (Array.isArray(members) ? members : []).filter(m => m && m.groupId === groupId && m.status === "active");
  }
  function formerMembers(members, groupId) {
    return (Array.isArray(members) ? members : [])
      .filter(m => m && m.groupId === groupId && (m.status === "left" || m.status === "removed"));
  }
  function visibleGroups(groups) {
    return (Array.isArray(groups) ? groups : []).filter(g => g && !g.deletedAt && !g.archivedAt);
  }
  function archivedGroups(groups) {
    return (Array.isArray(groups) ? groups : []).filter(g => g && !g.deletedAt && g.archivedAt);
  }
  // History is stored newest-first (unshift on close); filtering preserves that order.
  function groupClosedGames(history, groupId) {
    return (Array.isArray(history) ? history : []).filter(h => h && h.groupId === groupId);
  }
  // D5: a game where nobody actually profited (max net <= 0 — everyone lost or, at best, broke
  // even) has no winner. Ties at a positive net still return every tied leader.
  function gameWinners(historyEntry) {
    const players = historyEntry && Array.isArray(historyEntry.players) ? historyEntry.players : [];
    if (!players.length) return [];
    const maxNet = Math.max(...players.map(p => Number(p.net) || 0));
    if (maxNet <= 0) return [];
    return players.filter(p => (Number(p.net) || 0) === maxNet);
  }
  // Builds a GroupGameSummary from a closed-game HistoryEntry for the group's last-game and
  // history rows. Deliberately has no net/cashout field — group screens never show another
  // person's exact P&L (Global Constraint 10). `ranking` is names only (net desc, ties by name).
  function toGroupGameSummary(historyEntry) {
    const entry = historyEntry || {};
    const players = Array.isArray(entry.players) ? entry.players : [];
    const ranking = players.slice().sort((a, b) => {
      const netA = Number(a.net) || 0, netB = Number(b.net) || 0;
      if (netB !== netA) return netB - netA;
      return String((a && a.name) || "").localeCompare(String((b && b.name) || ""), "he");
    }).map(p => p.name);
    const startedMs = entry.startedAt ? new Date(entry.startedAt).getTime() : NaN;
    const atMs = entry.at ? new Date(entry.at).getTime() : NaN;
    const durationMinutes = Number.isFinite(startedMs) && Number.isFinite(atMs)
      ? Math.max(0, Math.round((atMs - startedMs) / 60000))
      : null;
    return {
      gameId: entry.gameId,
      at: entry.at,
      startedAt: entry.startedAt || null,
      playerCount: players.length,
      playerNames: players.map(p => p.name),
      winnerNames: gameWinners(entry).map(p => p.name),
      ranking,
      durationMinutes,
      potSize: players.reduce((total, p) => total + (Number(p.buyin) || 0), 0),
      totalEntries: players.reduce((total, p) => total + (Array.isArray(p.entryLog) ? p.entryLog.length : 0), 0),
      isBalanced: !!entry.isBalanced,
    };
  }
  // Short Hebrew duration for group history rows: "Xשע׳ Yדק׳" / "Yדק׳" / "פחות מדקה". Empty
  // string when null (no startedAt on legacy/ungrouped games).
  function formatDuration(minutes) {
    if (minutes === null || minutes === undefined || !Number.isFinite(minutes)) return "";
    const total = Math.max(0, Math.round(minutes));
    const hours = Math.floor(total / 60);
    const mins = total % 60;
    if (hours <= 0) return mins > 0 ? mins + "דק׳" : "פחות מדקה";
    return mins > 0 ? hours + "שע׳ " + mins + "דק׳" : hours + "שע׳";
  }
  // Deviation (documented): a participant is eligible when their identity matches any
  // GroupMember of the group, active or former. Ad-hoc game guests who never joined are excluded.
  function isLeaderboardEligible(participant, members) {
    return (Array.isArray(members) ? members : []).some(m => m && sameIdentity(m, participant));
  }
  // Ranking: total net desc, then gamesPlayed desc, then displayName (he). Ties in net share a rank.
  // The returned entries never carry a money field.
  function buildLeaderboard(history, members, groupId) {
    const groupMembersList = (Array.isArray(members) ? members : []).filter(m => m && m.groupId === groupId);
    const stats = new Map();
    groupClosedGames(history, groupId).forEach(entry => {
      const players = Array.isArray(entry.players) ? entry.players : [];
      const winners = gameWinners(entry);
      players.forEach(player => {
        const ref = { userId: null, guestId: player.guestId || null, displayName: player.name || "" };
        if (!isLeaderboardEligible(ref, groupMembersList)) return;
        const key = identityKey(ref);
        if (!stats.has(key)) {
          const member = groupMembersList.find(m => sameIdentity(m, ref));
          stats.set(key, {
            identityKey: key, displayName: ref.displayName, net: 0, gamesPlayed: 0, wins: 0,
            isFormerMember: !member || member.status !== "active",
          });
        }
        const row = stats.get(key);
        row.displayName = ref.displayName || row.displayName;
        row.net += Number(player.net) || 0;
        row.gamesPlayed += 1;
        if (winners.includes(player)) row.wins += 1;
      });
    });
    const rows = Array.from(stats.values()).sort((a, b) => {
      if (b.net !== a.net) return b.net - a.net;
      if (b.gamesPlayed !== a.gamesPlayed) return b.gamesPlayed - a.gamesPlayed;
      return a.displayName.localeCompare(b.displayName, "he");
    });
    let rank = 0, lastNet = null;
    return rows.map((row, index) => {
      if (lastNet === null || row.net !== lastNet) rank = index + 1;
      lastNet = row.net;
      return { rank, identityKey: row.identityKey, displayName: row.displayName, gamesPlayed: row.gamesPlayed, wins: row.wins, isFormerMember: row.isFormerMember };
    });
  }
  function getGroupSummary(collections, groupId, meName) {
    const c = collections || {};
    const groups = Array.isArray(c.groups) ? c.groups : [];
    const group = groups.find(g => g && g.id === groupId);
    if (!group) return null;
    const members = Array.isArray(c.groupMembers) ? c.groupMembers : [];
    const history = Array.isArray(c.history) ? c.history : [];
    const active = activeMembers(members, groupId);
    const games = groupClosedGames(history, groupId);
    const currentGame = c.currentGame || {};
    const hasActiveGame = !currentGame.example && currentGame.groupId === groupId &&
      (currentGame.phase === "active" || currentGame.phase === "settlement");
    const leaderboard = buildLeaderboard(history, members, groupId);
    const topRank = leaderboard.length ? leaderboard[0].rank : null;
    const leaderNames = topRank === null ? [] : leaderboard.filter(l => l.rank === topRank).map(l => l.displayName);
    return {
      groupId: group.id,
      name: group.name,
      avatarDataUrl: group.avatarDataUrl,
      memberCount: active.length,
      members: active.map(m => m.displayName),
      hasActiveGame,
      activeGamePhase: hasActiveGame ? currentGame.phase : null,
      gameCount: games.length,
      lastGameAt: games.length ? games[0].at : null,
      leaderNames,
      isAdmin: isGroupAdmin(members, groupId, meName),
      isMember: !!findMyMembership(members, groupId, meName),
    };
  }
  function getGroupSummaries(collections, meName) {
    const c = collections || {};
    return visibleGroups(Array.isArray(c.groups) ? c.groups : [])
      .map(g => getGroupSummary(c, g.id, meName))
      .filter(Boolean);
  }
  // Same shape as getGroupSummaries, but for archived-not-deleted groups (archivedGroups) — the
  // dashboard's collapsed "ארכיון" list and the read-only archived group page read from this.
  function getArchivedGroupSummaries(collections, meName) {
    const c = collections || {};
    return archivedGroups(Array.isArray(c.groups) ? c.groups : [])
      .map(g => getGroupSummary(c, g.id, meName))
      .filter(Boolean);
  }
  // The engine has one current-game slot: a group can have at most one open game, and the
  // whole device can have only one open game at a time (documented limitation, see plan).
  function canStartGroupGame(collections, groupId) {
    const c = collections || {};
    const groups = Array.isArray(c.groups) ? c.groups : [];
    const group = groups.find(g => g && g.id === groupId);
    if (group && (group.archivedAt || group.deletedAt)) return { ok: false, reason: "group-archived" };
    const currentGame = c.currentGame || {};
    const isOpen = !currentGame.example && (currentGame.phase === "active" || currentGame.phase === "settlement");
    if (isOpen && currentGame.groupId === groupId) return { ok: false, reason: "group-has-open-game" };
    if (isOpen) return { ok: false, reason: "another-game-open" };
    return { ok: true, reason: null };
  }
  // Rebuilds the current-game slot for a new/reset game while preserving every other
  // collection on state (fixes a latent data-loss bug in the old hand-built object literals).
  function newCurrentGame(base, patch) {
    return {
      ...base,
      example: false,
      phase: "closed",
      gameId: newId(),
      players: [],
      settlementStatuses: {},
      groupId: null,
      startedAt: null,
      leaderRef: null,
      ...patch,
    };
  }
  // Builds a new Group and its creator GroupMember (role "admin", status "active") from a
  // typed name and optional avatar. The caller pushes both records and calls save().
  function buildGroupCreation(meName, name, avatarDataUrl, guestId, at) {
    const group = normalizeGroup({
      id: newId(),
      name: String(name || "").trim(),
      avatarDataUrl: avatarDataUrl || null,
      createdBy: { userId: null, guestId, displayName: meName },
      createdAt: at,
    });
    const member = normalizeGroupMember({
      id: newId(),
      groupId: group.id,
      guestId,
      displayName: meName,
      role: "admin",
      status: "active",
      joinedAt: at,
    });
    return { group, member };
  }
  // Adds a guest member by ParticipantRef (userId always null pre-backend). Refused (returns
  // null) when an ACTIVE member with the same identity (sameIdentity) or the same trimmed

  // identity is re-activated in place instead of creating a second record, so game-history
  // attribution (guestId) stays stable across a remove-then-rejoin.
  function addGroupMember(members, group, ref, role, at) {
    const list = Array.isArray(members) ? members : [];
    const groupId = group && group.id;
    const displayName = String((ref && ref.displayName) || "").trim();
    if (!groupId || !displayName) return null;
    const activeDuplicate = list.some(m => m && m.groupId === groupId && m.status === "active" &&
      (sameIdentity(m, ref) || m.displayName.trim() === displayName));
    if (activeDuplicate) return null;
    const former = list.find(m => m && m.groupId === groupId && m.status !== "active" && sameIdentity(m, ref));
    if (former) {
      former.status = "active";
      former.leftAt = null;
      former.joinedAt = at;
      return former;
    }
    const member = normalizeGroupMember({
      id: newId(), groupId, guestId: (ref && ref.guestId) || null,
      displayName, role, status: "active", joinedAt: at,
    });
    list.push(member);
    return member;
  }
  // Soft-removes an active member (status "removed", leftAt = at) so history/leaderboard
  // attribution survives. Refused (false, no mutation) when not found, already former, or the
  // group's last active admin — a group must always keep at least one admin.
  function removeGroupMember(members, memberId, at) {
    const list = Array.isArray(members) ? members : [];
    const member = list.find(m => m && m.id === memberId);
    if (!member || member.status !== "active") return false;
    if (isLastActiveAdmin(list, memberId)) return false;
    member.status = "removed";
    member.leftAt = at;
    return true;
  }
  // Self-service version of removeGroupMember: the caller leaves by their own displayName
  // (findMyMembership's identity rule) rather than a memberId. Same last-admin guard.
  function leaveGroup(members, groupId, meName, at) {
    const list = Array.isArray(members) ? members : [];
    const membership = findMyMembership(list, groupId, meName);
    if (!membership || isLastActiveAdmin(list, membership.id)) return false;
    membership.status = "left";
    membership.leftAt = at;
    return true;
  }
  // Promotes/demotes a member. Refused (false, no mutation) when not found, or when demoting
  // the group's last active admin would leave it with none.
  function setMemberRole(members, memberId, role) {
    const list = Array.isArray(members) ? members : [];
    const member = list.find(m => m && m.id === memberId);
    if (!member) return false;
    const nextRole = role === "admin" ? "admin" : "member";
    if (member.role === "admin" && nextRole !== "admin" && isLastActiveAdmin(list, memberId)) return false;
    member.role = nextRole;
    return true;
  }
  // Renames a group in place. Refused (false, no mutation) when the group is missing or the
  // trimmed name is empty or over 40 chars (same cap as the create-group name input).
  function renameGroup(groups, id, name) {
    const group = (Array.isArray(groups) ? groups : []).find(g => g && g.id === id);
    if (!group) return false;
    const trimmed = String(name || "").trim();
    if (!trimmed || trimmed.length > 40) return false;
    group.name = trimmed;
    return true;
  }
  // Sets or clears (dataUrl null) a group's avatar in place. Refused only when the group is missing.
  function setGroupAvatar(groups, id, dataUrl) {
    const group = (Array.isArray(groups) ? groups : []).find(g => g && g.id === id);
    if (!group) return false;
    group.avatarDataUrl = dataUrl || null;
    return true;
  }
  // Archives a group in place (soft: archivedAt). Refused when missing or already archived/deleted.
  function archiveGroup(groups, id, at) {
    const group = (Array.isArray(groups) ? groups : []).find(g => g && g.id === id);
    if (!group || group.archivedAt || group.deletedAt) return false;
    group.archivedAt = at;
    return true;
  }
  // Restores an archived group in place. Refused when missing, not archived, or deleted.
  function unarchiveGroup(groups, id) {
    const group = (Array.isArray(groups) ? groups : []).find(g => g && g.id === id);
    if (!group || !group.archivedAt || group.deletedAt) return false;
    group.archivedAt = null;
    return true;
  }
  // Soft-deletes a group in place (deletedAt). History entries and debts are untouched by
  // design — a deleted group's closed games stay in every player's personal history/profile
  // (Global Constraint: personal record safe). Refused when missing or already deleted.
  function deleteGroup(groups, id, at) {
    const group = (Array.isArray(groups) ? groups : []).find(g => g && g.id === id);
    if (!group || group.deletedAt) return false;
    group.deletedAt = at;
    return true;
  }
  // True when memberId is an active admin and no other active admin shares their group — i.e.
  // removing/demoting them, or letting them leave, would leave the group without one.
  function isLastActiveAdmin(members, memberId) {
    const list = Array.isArray(members) ? members : [];
    const member = list.find(m => m && m.id === memberId);
    if (!member || member.status !== "active" || member.role !== "admin") return false;
    return !list.some(m => m && m.id !== memberId && m.groupId === member.groupId && m.status === "active" && m.role === "admin");
  }
  // Builds a Player record for the current game. guestId/memberId stay null for an ungrouped
  // game; addPlayer and startGroupGame resolve them for a group game (Task 8).
  function createPlayer({ name, guestId, memberId }) {
    return {
      id: newId(), name, buyins: [], entryLog: [], cashout: "", status: "active", exitedAt: null,
      guestId: guestId || null, memberId: memberId || null, userId: null,
    };
  }
  // De-duplicates a startGroupGame participants list by trimmed name, keeping the first
  // occurrence. Members are always listed before guests in the caller's participants array
  // (renderStartGamePanel), so a member entry wins over a guest entry with the same name —
  // the second guard against the identity bug fixed in audit gap #1 (the first guard is the
  // duplicate-name check in renderStartGameAddGuest).
  function dedupeParticipants(participants) {
    const list = Array.isArray(participants) ? participants : [];
    const seen = new Set();
    return list.filter(p => {
      const name = String((p && p.name) || "").trim();
      if (seen.has(name)) return false;
      seen.add(name);
      return true;
    });
  }

  // ---------- invites (pure) ----------
  // One invite token model, three presentations (large code / link / QR placeholder). Joining
  // through an invite needs a backend and does not exist yet: parseJoinToken only recognizes a
  // token in the URL so boot can show a friendly notice; nothing here ever touches state.
  var INVITE_TOKEN_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no 0/O/1/I
  // randomBytes is a Uint8Array(8) the caller fills (crypto.getRandomValues, Math.random
  // fallback) — kept as an argument so this stays a pure, deterministically testable function.
  function generateInviteToken(randomBytes) {
    const bytes = randomBytes || [];
    let token = "";
    for (let i = 0; i < 8; i++) {
      token += INVITE_TOKEN_ALPHABET[bytes[i] % INVITE_TOKEN_ALPHABET.length];
    }
    return token;
  }
  function createInvite(invites, groupId, byRef, token, at) {
    const invite = normalizeInvite({ id: newId(), groupId, token, createdBy: byRef, createdAt: at, revokedAt: null });
    invites.push(invite);
    return invite;
  }
  // Latest (by createdAt) non-revoked invite for the group, or null.
  function activeInvite(invites, groupId) {
    const open = (Array.isArray(invites) ? invites : []).filter(i => i && i.groupId === groupId && !i.revokedAt);
    if (!open.length) return null;
    return open.reduce((latest, i) => (i.createdAt > latest.createdAt ? i : latest));
  }
  function revokeInvite(invites, inviteId, at) {
    const invite = (Array.isArray(invites) ? invites : []).find(i => i && i.id === inviteId);
    if (!invite || invite.revokedAt) return false;
    invite.revokedAt = at;
    return true;
  }
  function inviteLink(token, origin, pathname) {
    return origin + pathname + "?join=" + token;
  }
  function formatInviteCode(token) {
    const t = String(token || "");
    return t.slice(0, 4) + "-" + t.slice(4, 8);
  }
  // Reads a ?join= token out of a location.search string. Accepts a dash the way the formatted
  // code displays it, uppercases, and only returns 8 alphabet characters — anything else is null
  // so a malformed or foreign query can't be mistaken for a real invite.
  function parseJoinToken(search) {
    const match = String(search || "").match(/[?&]join=([^&]*)/);
    if (!match) return null;
    const token = decodeURIComponent(match[1]).toUpperCase().replace(/-/g, "");
    return new RegExp("^[" + INVITE_TOKEN_ALPHABET + "]{8}$").test(token) ? token : null;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  // Replays the shake animation on an input to signal invalid entry.
  function shakeEl(inp) {
    inp.classList.remove("shake");
    void inp.offsetWidth; // restart the animation
    inp.classList.add("shake");
    inp.focus();
  }
  function toggleTheme() {
    const nowLight = document.documentElement.dataset.theme !== "light";
    if (nowLight) document.documentElement.dataset.theme = "light";
    else delete document.documentElement.dataset.theme;
    try { localStorage.setItem(THEME_KEY, nowLight ? "light" : "dark"); } catch (e) {}
    renderThemeIcon();
  }

  // Plays the picker's collapse transition, then runs `done`. A call that
  // arrives while a close is already animating is DROPPED (not queued) —
  // this is what makes a rapid double-tap on a confirm harmless.
  let menuClosing = false;
  function animateMenuClose(done) {
    if (menuClosing) return;
    const m = document.querySelector(".pmenu.open");
    if (!m) { done(); return; }
    menuClosing = true;
    const plus = document.querySelector(".btn-plus.open");
    if (plus) plus.classList.remove("open");
    m.classList.remove("open");
    setTimeout(() => { menuClosing = false; done(); }, 300);
  }

  // Opens (or closes) the inline exit/cashout capsule for a player, reusing
  // the same .pmenu collapse animation as the buy-in menu. Only one of the
  // two kinds of panel is ever open at a time, across the whole table.
  function openExitPanel(name) {
    if (markReal()) { save(); render(); return; } // first touch wipes the demo data
    const opening = exitOpen !== name;
    if (!opening) {
      const closingFor = name;
      animateMenuClose(() => {
        if (exitOpen === closingFor) { exitOpen = null; render(); }
      });
      return;
    }
    const open = () => {
      exitOpen = name;
      exitJustOpened = name;
      render();
    };
    if (openMenu) {
      const closingFor = openMenu;
      animateMenuClose(() => {
        if (openMenu === closingFor) { openMenu = null; customOpen = null; pendingAmount = null; }
        open();
      });
    } else {
      open();
    }
  }

  // Confirms a buy-in: the picker collapses, then the money lands with a
  // count-up animation on the player's total, plus a light haptic.
  function confirmBuyin(p, idx, amount) {
    if (menuClosing) return; // a confirm is already in flight
    pendingAmount = null;
    dirtyUntil = Date.now() + 6000; // block remote overwrites during the animation window
    const closingFor = p.name;
    animateMenuClose(() => {
      // re-resolve the player: a remote sync may have replaced `state` meanwhile
      const player = state.players.find(x => x.id === p.id);
      if (openMenu === closingFor) { openMenu = null; customOpen = null; }
      if (!player) { render(); return; }
      const from = sum(player.buyins);
      addEntry(player, amount);
      save();
      try { if (navigator.vibrate) navigator.vibrate(20); } catch (e) {}
      render();
      const nidx = state.players.indexOf(player);
      const fresh = document.querySelectorAll(".prow")[nidx];
      const totalEl = fresh && fresh.querySelector(".pmeta b");
      if (totalEl) countUp(totalEl, from, from + amount);
    });
  }

  function countUp(elm, from, to) {
    const dur = 650;
    const t0 = performance.now();
    (function tick(now) {
      const t = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      elm.textContent = fmt(Math.round(from + (to - from) * eased));
      if (t < 1) requestAnimationFrame(tick);
      else {
        elm.classList.add("pulse");
        setTimeout(() => elm.classList.remove("pulse"), 600);
      }
    })(t0);
  }

  function setAppView(nextView) {
    appView = nextView;
    if (nextView !== "game") { openMenu = null; customOpen = null; exitOpen = null; exitJustOpened = null; }
    if (nextView !== "settle") {
      clearCloseHold();
      forceCloseArmed = false;
      forceCloseUnlocked = false;
      forceCloseUnlockDifference = null;
      longPressJustUnlocked = false;
      clearTimeout(closeArmTimer);
      closeArmTimer = null;
      closeArmed = false;
      const closeBtn = document.getElementById("closeTableBtn");
      if (closeBtn) {
        closeBtn.classList.remove("warn-state");
        setCloseButtonLabel(closeBtn, "סגירת שולחן ורישום לרקורד");
      }
    }
    resetStartGamePanel();
    resetCreateGroupPanel();
    disarmRemoveMember();
    animNext = "all";
    groupPageEnterNext = nextView === "group";
    gamesPageEnterNext = nextView === "games";
    render();
    flashViewEnter(nextView);
  }

  // Short fade+rise on the container that just became visible after a view switch (games/group
  // share #gamesHome; game/settle share #rows; profile is #profile). Adds the shared .load-in
  // class and removes it once its animation finishes so the next switch can replay it.
  function flashViewEnter(nextView) {
    const id = nextView === "profile" ? "profile" : (nextView === "game" || nextView === "settle") ? "rows" : "gamesHome";
    const container = document.getElementById(id);
    if (!container) return;
    container.classList.remove("load-in");
    void container.offsetWidth; // force reflow so re-adding the class restarts the animation
    container.classList.add("load-in");
    // B1: under prefers-reduced-motion the CSS kills the animation, so animationend never fires —
    // registering the listener anyway would leak one more never-firing listener on every view
    // switch. Skip it there; either way, a capped setTimeout fallback guarantees the class never
    // sticks even if animationend is missed for some other reason (e.g. an interrupted animation).
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      container.addEventListener("animationend", () => container.classList.remove("load-in"), { once: true });
    }
    setTimeout(() => container.classList.remove("load-in"), 600);
  }

  function startUngroupedGame() {
    state = newCurrentGame(state, { phase: "active", startedAt: new Date().toISOString(), groupId: null });
    expandedEntries.clear();
    openMenu = null; customOpen = null; pendingAmount = null; exitOpen = null; exitJustOpened = null;
    save();
    setAppView("game");
  }

  // Starts a game linked to a group: guarded by canStartGroupGame (the single-open-game rule)
  // and needing at least one participant. Each participant becomes a Player via the shared
  // createPlayer helper plus an immediate first buy-in (same product rule as addPlayer).
  function startGroupGame(groupId, participants) {
    const list = dedupeParticipants(participants);
    if (!canStartGroupGame(collectionsOf(state), groupId).ok || list.length < 1) return false;
    if (!findMyMembership(state.groupMembers, groupId, me)) return false;
    state = newCurrentGame(state, {
      phase: "active",
      groupId,
      startedAt: new Date().toISOString(),
      leaderRef: { userId: null, guestId: resolveGuestId(collectionsOf(state), me), displayName: me },
    });
    list.forEach(participant => {
      const player = createPlayer(participant);
      addEntry(player, MIN_BUYIN);
      state.players.push(player);
    });
    expandedEntries.clear();
    openMenu = customOpen = pendingAmount = null;
    animNext = "all";
    save();
    setAppView("game");
    return true;
  }

  function continueCurrentGame() {
    if (state.example || state.phase === "closed") return;
    setAppView(state.phase === "settlement" ? "settle" : "game");
  }

  function openGroup(groupId) {
    currentGroupId = String(groupId || "");
    setAppView("group");
  }

  // Creates a group and its creator admin membership. Requires a signed-in name; when there
  // isn't one the create panel stays open (with whatever was typed) and the user tries again
  // once they've picked a name in the login screen.
  function createGroup({ name, avatarDataUrl }) {
    if (!me) { showLogin(); return; }
    const at = new Date().toISOString();
    const guestId = resolveGuestId(collectionsOf(state), me);
    const { group, member } = buildGroupCreation(me, name, avatarDataUrl || null, guestId, at);
    state.groups.push(group);
    state.groupMembers.push(member);
    save();
    resetCreateGroupPanel(); // plain reset: openGroup's render replaces the dashboard next anyway
    openGroup(group.id);
  }

  // Fills a Uint8Array(8) with real randomness for a fresh invite token: crypto.getRandomValues
  // when available, Math.random otherwise. Not part of the pure section — it is the one place
  // that actually reaches for randomness; generateInviteToken() itself stays deterministic.
  function randomInviteBytes() {
    const bytes = new Uint8Array(8);
    if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function") crypto.getRandomValues(bytes);
    else for (let i = 0; i < 8; i++) bytes[i] = Math.floor(Math.random() * 256);
    return bytes;
  }

  function createGroupInvite(groupId) {
    const at = new Date().toISOString();
    const byRef = { userId: null, guestId: resolveGuestId(collectionsOf(state), me), displayName: me };
    createInvite(state.invites, groupId, byRef, generateInviteToken(randomInviteBytes()), at);
    save();
    renderGroupPage();
  }

  function revokeGroupInvite(groupId) {
    const invite = activeInvite(state.invites, groupId);
    if (!invite) return;
    revokeInvite(state.invites, invite.id, new Date().toISOString());
    save();
    renderGroupPage();
  }

  function resetCreateGroupPanel() {
    createGroupOpen = false;
    createGroupJustOpened = false;
    createGroupName = "";
    createGroupAvatarDataUrl = null;
  }

  function toggleCreateGroupPanel() {
    if (createGroupOpen) { closeCreateGroupPanel(); return; }
    createGroupOpen = true;
    createGroupJustOpened = true;
    renderGamesDashboard();
  }

  // Plays the panel's collapse transition (matching animateMenuClose's approach for .pmenu)
  // before clearing the draft name/avatar and rebuilding the dashboard without it.
  function closeCreateGroupPanel() {
    const panel = document.querySelector(".games-create-panel.open");
    const finish = () => { resetCreateGroupPanel(); renderGamesDashboard(); };
    if (!panel) { finish(); return; }
    panel.classList.remove("open");
    setTimeout(finish, 280);
  }

  // Adds a guest member by typed name (no accounts yet — see groups-domain decision doc:
  // userId stays null, resolveGuestId keeps one guestId per displayName on this device). A
  // duplicate active identity/displayName in the group is refused; the caller shakes its input.
  function addMemberByName(groupId, name) {
    const trimmed = String(name || "").trim();
    if (!trimmed) return null;
    const group = state.groups.find(g => g && g.id === groupId);
    if (!group) return null;
    const at = new Date().toISOString();
    const guestId = resolveGuestId(collectionsOf(state), trimmed);
    const ref = { userId: null, guestId, displayName: trimmed };
    const member = addGroupMember(state.groupMembers, group, ref, "member", at);
    if (!member) return null;
    save();
    renderGroupPage();
    return member;
  }

  // Removes (soft) a member from a group; see removeGroupMember for the history-preserving
  // and last-admin-guard rules. Scoped to groupId so a stale memberId can't cross groups.
  function removeMember(groupId, memberId) {
    const member = state.groupMembers.find(m => m && m.id === memberId && m.groupId === groupId);
    if (!member) return false;
    if (!removeGroupMember(state.groupMembers, memberId, new Date().toISOString())) return false;
    save();
    renderGroupPage();
    return true;
  }

  // Promotes a member to admin (cheap admin transfer/second-admin, Task 14). Scoped to groupId
  // like removeMember, above.
  function promoteMember(groupId, memberId) {
    const member = state.groupMembers.find(m => m && m.id === memberId && m.groupId === groupId);
    if (!member) return false;
    if (!setMemberRole(state.groupMembers, memberId, "admin")) return false;
    save();
    renderGroupPage();
    return true;
  }

  // Resizes/crops an image file to a 96×96 JPEG data URL (cover crop, quality 0.8) for a
  // group avatar. DOM-dependent (canvas/Image), so it lives outside the pure domain section.
  function resizeAvatarImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const size = 96;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("avatar image failed to load")); };
      img.src = url;
    });
  }

  // Builds the { groups, groupMembers, history, currentGame } shape the pure groups-domain
  // adapters take as input, from the single persisted state document.
  function collectionsOf(state) {
    return {
      groups: state.groups,
      groupMembers: state.groupMembers,
      history: state.history,
      currentGame: {
        gameId: state.gameId,
        phase: state.phase,
        groupId: state.groupId,
        players: state.players,
        startedAt: state.startedAt,
        example: state.example,
      },
    };
  }

  // groups is optional (existing single-argument callers/tests keep working): when omitted, or
  // when gameState.groupId doesn't match a group in it, title falls back to "משחק ללא קבוצה". A
  // match resolves the group's name even when the group is archived.
  function getActiveGameSummaries(gameState, groups) {
    if (!gameState || gameState.example || (gameState.phase !== "active" && gameState.phase !== "settlement")) return [];
    const validTime = value => typeof value === "string" && !Number.isNaN(Date.parse(value)) ? value : null;
    const players = (Array.isArray(gameState.players) ? gameState.players : []).map(player => {
      const buyins = Array.isArray(player.buyins) ? player.buyins : [];
      return {
        id: String(player.id || ""),
        name: String(player.name || ""),
        buyinTotal: buyins.reduce((total, amount) => total + Math.round(Number(amount) || 0), 0),
        entryCount: buyins.length,
      };
    });
    const groupList = Array.isArray(groups) ? groups : [];
    const matchedGroup = gameState.groupId ? groupList.find(g => g && g.id === gameState.groupId) : null;
    return [{
      gameId: String(gameState.gameId || ""),
      title: matchedGroup ? matchedGroup.name : "משחק ללא קבוצה",
      phase: gameState.phase,
      playerCount: players.length,
      playerNames: players.map(player => player.name),
      players,
      potSize: players.reduce((total, player) => total + player.buyinTotal, 0),
      totalEntries: players.reduce((total, player) => total + player.entryCount, 0),
      startedAt: validTime(gameState.startedAt),
      updatedAt: validTime(gameState.updatedAt),
    }];
  }

  function formatGameTime(timestamp) {
    if (!timestamp) return "";
    const date = new Date(timestamp);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
  }

  // Short form for group last-game/history rows: day + short month name, no year.
  function formatShortGameDate(timestamp) {
    if (!timestamp) return "";
    const date = new Date(timestamp);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleDateString("he-IL", { day: "numeric", month: "short" });
  }

  function formatPlayerNames(names) {
    const clean = (Array.isArray(names) ? names : []).filter(Boolean);
    if (!clean.length) return "אין שחקנים עדיין";
    const visible = clean.slice(0, 4).join(", ");
    return clean.length > 4 ? visible + " +" + (clean.length - 4) : visible;
  }

  function formatPlayerCount(count) {
    return count === 1 ? "שחקן אחד" : count + " שחקנים";
  }

  function formatEntryCount(count) {
    return count === 1 ? "כניסה אחת" : count + " כניסות";
  }

  function formatMemberCount(count) {
    return count === 1 ? "חבר אחד" : count + " חברים";
  }

  function formatGamesPlayedCount(count) {
    return count === 1 ? "משחק אחד" : count + " משחקים";
  }

  function formatWinsCount(count) {
    return count === 1 ? "ניצחון אחד" : count + " ניצחונות";
  }

  function renderQuickActions(parent) {
    const section = el("section", "games-section games-quick-section");
    section.appendChild(el("h3", "games-section-title", "פעולות מהירות"));
    const actions = el("div", "games-quick-actions");

    const createGroupBtn = el("button", "games-quick-action primary", "+ צור קבוצה");
    createGroupBtn.type = "button";
    createGroupBtn.setAttribute("aria-expanded", String(createGroupOpen));
    createGroupBtn.addEventListener("click", toggleCreateGroupPanel);

    const start = el("button", "games-quick-action", "משחק ללא קבוצה");
    start.type = "button";
    start.addEventListener("click", startUngroupedGame);

    actions.append(createGroupBtn, start);
    section.appendChild(actions);
    renderCreateGroupPanel(section);
    parent.appendChild(section);
  }

  function renderCreateGroupPanel(parent) {
    const panel = el("div", "games-create-panel");
    const panelIn = el("div", "games-create-panel-in");
    const content = el("div", "games-create-panel-content");

    const avatarBtn = el("button", "games-create-avatar");
    avatarBtn.type = "button";
    avatarBtn.setAttribute("aria-label", "הוספת תמונה לקבוצה");
    const applyAvatarPreview = () => {
      avatarBtn.innerHTML = "";
      if (createGroupAvatarDataUrl) {
        const img = document.createElement("img");
        img.src = createGroupAvatarDataUrl;
        img.alt = "";
        avatarBtn.appendChild(img);
      } else {
        avatarBtn.textContent = (createGroupName.trim() || "?").slice(0, 1);
      }
    };
    applyAvatarPreview();

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.hidden = true;
    fileInput.setAttribute("aria-hidden", "true");
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      if (!file) return;
      try {
        createGroupAvatarDataUrl = await resizeAvatarImage(file);
        applyAvatarPreview();
      } catch (e) {}
    });
    avatarBtn.addEventListener("click", () => fileInput.click());

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.maxLength = 40;
    nameInput.placeholder = "שם הקבוצה";
    nameInput.autocomplete = "off";
    nameInput.setAttribute("aria-label", "שם הקבוצה");
    nameInput.value = createGroupName;
    nameInput.addEventListener("input", () => {
      createGroupName = nameInput.value;
      if (!createGroupAvatarDataUrl) applyAvatarPreview();
    });

    const submit = () => {
      const name = nameInput.value.trim();
      if (!name) { shakeEl(nameInput); return; }
      createGroup({ name, avatarDataUrl: createGroupAvatarDataUrl });
    };
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
    });

    const submitBtn = el("button", "games-create-submit", "צור קבוצה");
    submitBtn.type = "button";
    submitBtn.addEventListener("click", submit);

    const cancelBtn = el("button", "games-create-cancel", "ביטול");
    cancelBtn.type = "button";
    cancelBtn.addEventListener("click", closeCreateGroupPanel);

    content.append(avatarBtn, fileInput, nameInput, submitBtn, cancelBtn);
    panelIn.appendChild(content);
    panel.appendChild(panelIn);

    if (createGroupOpen && createGroupJustOpened) {
      createGroupJustOpened = false;
      requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.add("open")));
    } else if (createGroupOpen) {
      panel.classList.add("open");
    }
    parent.appendChild(panel);
  }

  function renderActiveGameCard(summary, actions) {
    const card = el("article", "games-active-card" + (actions.anim ? " anim" : ""));
    if (actions.anim) card.style.animationDelay = (actions.animDelay || 0) + "ms";
    const status = el("span", "games-card-status" + (summary.phase === "settlement" ? " settlement" : ""), summary.phase === "settlement" ? "בסגירה" : "משחק פעיל");
    card.appendChild(status);
    if (summary.title) card.appendChild(el("span", "games-card-title", summary.title));
    card.appendChild(el("span", "games-card-meta", formatPlayerCount(summary.playerCount) + " · " + formatPlayerNames(summary.playerNames)));
    if (summary.startedAt) card.appendChild(el("span", "games-card-time", "התחיל ב־" + formatGameTime(summary.startedAt)));

    const cardActions = el("div", "games-card-actions");
    const enter = el("button", "games-card-enter", "כנס לשולחן");
    enter.type = "button";
    enter.addEventListener("click", actions.onEnter);
    const toggle = el("button", "games-card-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", actions.expanded ? "true" : "false");
    toggle.innerHTML = '<span>' + (actions.expanded ? "כווץ" : "הרחב") + '</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3 3.5-3"></path></svg>';
    toggle.addEventListener("click", actions.onToggle);
    cardActions.append(enter, toggle);
    card.appendChild(cardActions);

    const details = el("div", "games-card-details" + (actions.expanded ? " open" : ""));
    const detailsIn = el("div", "games-card-details-in");
    const content = el("div", "games-card-details-content");
    if (summary.players.length) {
      summary.players.forEach(player => {
        const row = el("div", "games-detail-row");
        row.append(el("span", "games-detail-name", player.name), el("span", "games-detail-meta", fmt(player.buyinTotal) + " · " + formatEntryCount(player.entryCount)));
        content.appendChild(row);
      });
    } else {
      content.appendChild(el("p", "games-empty", "אין שחקנים עדיין"));
    }
    const totalsLine = el("p", "games-detail-totals");
    totalsLine.append(el("span", "", "בקופה "), el("b", "", fmt(summary.potSize)), el("span", "", " · " + formatEntryCount(summary.totalEntries)));
    content.appendChild(totalsLine);
    if (summary.startedAt) content.appendChild(el("p", "games-detail-totals", "התחלה · " + formatGameTime(summary.startedAt)));
    if (summary.updatedAt) content.appendChild(el("p", "games-detail-totals", "עדכון אחרון · " + formatGameTime(summary.updatedAt)));
    detailsIn.appendChild(content);
    details.appendChild(detailsIn);
    card.appendChild(details);
    return card;
  }

  function renderActiveGamesSection(parent, summaries, enterStagger) {
    const section = el("section", "games-section");
    section.appendChild(el("h3", "games-section-title", "משחקים פעילים"));
    if (!summaries.length) {
      section.appendChild(el("p", "games-empty", "אין משחקים פעילים כרגע"));
    } else {
      summaries.forEach((summary, idx) => {
        section.appendChild(renderActiveGameCard(summary, {
          expanded: expandedGameCards.has(summary.gameId),
          anim: enterStagger,
          animDelay: idx * 50,
          onEnter: () => enterActiveGame(summary.gameId),
          onToggle: () => {
            expandedGameCards.has(summary.gameId) ? expandedGameCards.delete(summary.gameId) : expandedGameCards.add(summary.gameId);
            renderGamesDashboard();
          },
        }));
      });
    }
    parent.appendChild(section);
  }

  function renderGroupCard(group, actions) {
    const card = el("article", "games-group-card" + (actions.anim ? " anim" : ""));
    if (actions.anim) card.style.animationDelay = (actions.animDelay || 0) + "ms";
    const head = el("div", "games-group-head");
    head.setAttribute("role", "button");
    head.setAttribute("tabindex", "0");
    head.setAttribute("aria-label", "פתח את " + String(group.name || "הקבוצה"));
    head.addEventListener("click", actions.onOpen);
    head.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); actions.onOpen(); }
    });
    if (group.avatarDataUrl) {
      const avatar = el("img", "games-group-avatar");
      avatar.src = group.avatarDataUrl;
      avatar.alt = "";
      head.appendChild(avatar);
    } else {
      head.appendChild(el("span", "games-group-avatar", String(group.name || "?").slice(0, 1)));
    }
    const copy = el("div", "");
    const titleSpan = el("span", "games-card-title", String(group.name || ""));
    if (actions.archived) titleSpan.appendChild(el("span", "games-member-tag", "בארכיון"));
    copy.appendChild(titleSpan);
    const meta = el("span", "games-card-meta", formatMemberCount(Number(group.memberCount || 0)));
    if (group.hasActiveGame) {
      const isSettlement = group.activeGamePhase === "settlement";
      meta.appendChild(document.createTextNode(" · "));
      meta.appendChild(el("span", "games-card-status" + (isSettlement ? " settlement" : ""), isSettlement ? "בסגירה" : "משחק פעיל"));
    }
    copy.appendChild(meta);
    head.appendChild(copy);
    card.appendChild(head);

    const memberNames = Array.isArray(group.members) ? group.members : [];
    const lastGameLabel = group.lastGameAt ? formatShortGameDate(group.lastGameAt) : "";
    const leaderNames = Array.isArray(group.leaderNames) ? group.leaderNames : [];
    const hasDetails = memberNames.length || lastGameLabel || Number.isFinite(group.gameCount) || leaderNames.length;
    if (hasDetails) {
      const toggle = el("button", "games-card-toggle");
      toggle.type = "button";
      toggle.setAttribute("aria-expanded", actions.expanded ? "true" : "false");
      toggle.innerHTML = '<span>' + (actions.expanded ? "כווץ" : "הרחב") + '</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3 3.5-3"></path></svg>';
      toggle.addEventListener("click", actions.onToggle);
      card.appendChild(toggle);
      const details = el("div", "games-card-details");
      const detailsIn = el("div", "games-card-details-in");
      const content = el("div", "games-card-details-content");
      if (memberNames.length) content.appendChild(el("p", "games-detail-totals", "חברים · " + formatPlayerNames(memberNames)));
      if (Number.isFinite(group.gameCount)) content.appendChild(el("p", "games-detail-totals", "משחקים · " + group.gameCount));
      if (lastGameLabel) content.appendChild(el("p", "games-detail-totals", "משחק אחרון · " + lastGameLabel));
      if (leaderNames.length) content.appendChild(el("p", "games-detail-totals", "מוביל · " + leaderNames[0]));
      detailsIn.appendChild(content);
      details.appendChild(detailsIn);
      // First expand of this card plays the grid-collapse open transition (see cardDetailsJustOpenedId).
      const groupIdForAnim = String(group.groupId || "");
      if (actions.expanded && cardDetailsJustOpenedId === groupIdForAnim) {
        cardDetailsJustOpenedId = null;
        requestAnimationFrame(() => requestAnimationFrame(() => details.classList.add("open")));
      } else if (actions.expanded) {
        details.classList.add("open");
      }
      card.appendChild(details);
    }
    return card;
  }

  function renderGroupsSection(parent, groups, enterStagger) {
    const section = el("section", "games-section");
    section.appendChild(el("h3", "games-section-title", "הקבוצות שלי"));
    if (!groups.length) {
      section.appendChild(el("p", "games-empty", "אין לך קבוצות עדיין"));
    } else {
      groups.forEach((group, idx) => {
        const groupId = String(group.groupId || "");
        section.appendChild(renderGroupCard(group, {
          expanded: expandedGroupCards.has(groupId),
          anim: enterStagger,
          animDelay: idx * 50,
          onToggle: () => {
            if (expandedGroupCards.has(groupId)) expandedGroupCards.delete(groupId);
            else { expandedGroupCards.add(groupId); cardDetailsJustOpenedId = groupId; }
            renderGamesDashboard();
          },
          onOpen: () => openGroup(groupId),
        }));
      });
    }
    parent.appendChild(section);
  }

  // Collapsed "ארכיון (N)" line under "הקבוצות שלי", shown only when archived-not-deleted groups
  // exist on this device — same grid-collapse pattern as renderFormerMembers below. Reuses
  // renderGroupCard with the "archived" tag; opening a card leads to the read-only archived group page.
  function renderArchivedGroupsSection(parent, archived) {
    const list = Array.isArray(archived) ? archived : [];
    if (!list.length) return;
    const wrap = el("div", "games-former-members");
