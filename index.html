<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קופה סגורה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap">
<style>
  :root {
    --bg: #05070A;
    --text: #EAF4F4;
    --dim: #64707A;
    --faint: #39434C;
    --line: rgba(234,244,244,.09);
    --accent: #35E0DC;
    --accent-press: #8FF0EC;
    --bad: #FF6D6D;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  input, button, select, textarea { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Heebo", "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    direction: rtl;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 26px 18px 90px; }

  /* ---------- header ---------- */
  .eyebrow {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: .14em; color: var(--dim); font-weight: 500;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background .4s, box-shadow .4s; }
  .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 14px var(--accent); opacity: .7; } }
  h1 {
    font-weight: 900; font-size: 44px; letter-spacing: -0.02em;
    margin: 6px 0 0; line-height: 1.05; color: var(--text);
  }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { color: var(--dim); margin: 6px 0 0; font-size: 14px; font-weight: 300; }

  /* ---------- shared controls ---------- */
  button {
    font: inherit; cursor: pointer; background: none; border: none; color: var(--text);
    padding: 0; touch-action: manipulation;
    transition: transform .12s ease, color .18s ease, border-color .18s ease,
                background-color .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  button:active { transform: scale(.92); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  input[type="text"], input[type="number"] {
    -webkit-appearance: none; appearance: none;
    background: none; border: none; border-bottom: 1px solid var(--line);
    border-radius: 0; color: var(--text);
    font: inherit; font-variant-numeric: tabular-nums;
    padding: 8px 2px; min-height: 42px; width: 100%;
    transition: border-color .2s;
  }
  input:focus-visible { outline: none; border-bottom-color: var(--accent); }
  input::placeholder { color: var(--faint); }
  input[type=number]::-webkit-inner-spin-button { display: none; }

  /* ---------- add row ---------- */
  .addrow { display: flex; align-items: flex-end; gap: 14px; margin: 30px 0 6px; }
  .addrow input { flex: 1; font-size: 17px; }
  .btn-add {
    color: var(--accent); font-weight: 700; font-size: 15px;
    padding: 8px 2px 10px; white-space: nowrap; letter-spacing: .02em;
  }
  .btn-add:hover { color: var(--accent-press); }

  /* ---------- mode switch ---------- */
  .modes { display: flex; gap: 26px; margin: 26px 0 0; border-bottom: 1px solid var(--line); }
  .mode {
    color: var(--dim); font-weight: 500; font-size: 15px;
    padding: 6px 2px 12px; position: relative;
  }
  .mode::after {
    content: ""; position: absolute; right: 0; left: 0; bottom: -1px; height: 2px;
    background: var(--accent); transform: scaleX(0); transform-origin: right;
    transition: transform .25s ease;
  }
  .mode.on { color: var(--text); }
  .mode.on::after { transform: scaleX(1); }

  /* ---------- player rows ---------- */
  .rows {}
  .prow { border-bottom: 1px solid var(--line); }
  .prow-line { display: flex; align-items: center; gap: 12px; padding: 14px 0; min-height: 62px; }
  .pname { font-weight: 700; font-size: 17px; flex: 1; min-width: 72px; overflow-wrap: anywhere; }
  .pmeta { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 300; }
  .pmeta b { color: var(--text); font-weight: 500; display: inline-block; }
  .pmeta b.pulse { animation: pulseVal .55s ease; }
  @keyframes pulseVal { 30% { color: var(--accent); transform: scale(1.18); } }

  .prow.anim { animation: rise .38s ease both; }
  .load-in { animation: rise .5s ease both; }
  @keyframes shake {
    20%, 60% { transform: translateX(5px); }
    40%, 80% { transform: translateX(-5px); }
  }
  .shake { animation: shake .35s ease; }

  .btn-plus {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--accent); color: var(--accent);
    font-size: 22px; line-height: 1; font-weight: 400;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s ease, background-color .18s, color .18s, box-shadow .18s;
  }
  .btn-plus:hover { box-shadow: 0 0 12px rgba(53,224,220,.35); }
  .btn-plus.open { transform: rotate(45deg); background: var(--accent); color: var(--bg); }
  .btn-plus.open:active { transform: rotate(45deg) scale(.92); }

  .btn-x { color: var(--faint); font-size: 18px; padding: 6px; }
  .btn-x:hover { color: var(--bad); }

  /* expanding buy-in menu */
  .pmenu { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
  .pmenu.open { grid-template-rows: 1fr; }
  .pmenu-in { overflow: hidden; }
  .pmenu-row { display: flex; align-items: center; gap: 10px; padding: 2px 0 16px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 18px; min-height: 40px;
    color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px;
  }
  .chip:hover { border-color: var(--accent); }
  .chip:active { background: var(--accent); color: var(--bg); }
  .chip.flash { animation: flash .45s ease; }
  .chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  @keyframes flash {
    0% { background: var(--accent); color: var(--bg); box-shadow: 0 0 16px rgba(53,224,220,.6); }
  }
  .undo { color: var(--faint); font-size: 13px; margin-inline-start: auto; }
  .undo:hover { color: var(--bad); }

  .custom-line { display: flex; align-items: flex-end; gap: 12px; padding: 0 0 16px; animation: rise .3s ease both; }
  .custom-line input { flex: 1; min-width: 0; font-size: 16px; }
  .btn-confirm { color: var(--accent); font-weight: 700; font-size: 15px; padding: 8px 2px 10px; white-space: nowrap; }
  .btn-confirm:hover { color: var(--accent-press); }

  /* settle rows */
  input[type="number"].srow-input { width: 104px; flex: 0 0 104px; text-align: end; font-size: 17px; }
  .net { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 16px; min-width: 74px; text-align: left; }
  .net.pos { color: var(--accent); }
  .net.neg { color: var(--bad); }
  .net.zero { color: var(--faint); font-weight: 300; }

  /* ---------- stats / results ---------- */
  .statline {
    display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline;
    color: var(--dim); font-size: 14px; font-weight: 300;
    margin: 22px 0 0; font-variant-numeric: tabular-nums;
  }
  .statline b { color: var(--text); font-weight: 700; font-size: 16px; }
  .statline .sep { color: var(--faint); }
  .statline .bad { color: var(--bad); font-weight: 700; }
  .statline .good { color: var(--accent); font-weight: 700; }

  .warn { color: var(--bad); font-size: 14px; margin: 14px 0 0; font-weight: 400; animation: rise .3s ease both; }

  .results { margin-top: 34px; }
  .results h2 {
    font-size: 13px; letter-spacing: .16em; font-weight: 500;
    color: var(--dim); margin: 0 0 4px;
  }
  .transfer {
    display: flex; align-items: baseline; gap: 10px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
    animation: rise .3s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .transfer .who { font-weight: 700; font-size: 17px; }
  .transfer .arrow { color: var(--faint); font-size: 13px; }
  .transfer .amount {
    margin-inline-start: auto; font-weight: 900; font-size: 20px;
    color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .settle-empty { color: var(--faint); margin: 12px 0 0; font-size: 14px; font-weight: 300; }
  .closed-ok { color: var(--accent); font-size: 14px; margin: 14px 0 0; }

  /* ---------- footer ---------- */
  .footer { margin-top: 56px; display: flex; flex-direction: column; gap: 26px; }
  .btn-reset { color: var(--faint); font-size: 13px; align-self: flex-start; }
  .btn-reset:hover { color: var(--bad); }
  .roadmap { border-top: 1px solid var(--line); padding-top: 18px; color: var(--faint); font-size: 12px; font-weight: 300; line-height: 1.8; }
  .roadmap b { color: var(--dim); font-weight: 500; letter-spacing: .1em; }
  .example-tag { color: var(--accent); font-size: 12px; font-weight: 400; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>


<div class="wrap">
  <header class="load-in">
    <div class="eyebrow"><span class="dot" id="syncDot"></span><span id="syncText">שמירה מקומית</span><span>·</span><span>קאש · מינימום ₪50</span></div>
    <h1>קופה <em>סגורה</em></h1>
    <p class="sub">כניסות תוך כדי המשחק, צ'יפים בסוף — ומי משלם למי במינימום העברות.</p>
  </header>

  <div class="addrow load-in" style="animation-delay:.08s">
    <input type="text" id="newName" placeholder="שם שחקן חדש" autocomplete="off" aria-label="שם שחקן חדש">
    <button type="button" class="btn-add" id="addBtn">+ הוסף</button>
  </div>

  <nav class="modes load-in" style="animation-delay:.15s">
    <button type="button" class="mode on" id="modeGame">משחק</button>
    <button type="button" class="mode" id="modeSettle">התחשבנות</button>
  </nav>

  <div class="rows" id="rows"></div>

  <div class="statline load-in" style="animation-delay:.34s" id="statline"></div>
  <div id="warnbox"></div>

  <section class="results" id="results" hidden>
    <h2>מי משלם למי</h2>
    <div id="transfers"></div>
  </section>

  <div class="footer load-in" style="animation-delay:.42s">
    <button type="button" class="btn-reset" id="resetBtn">איפוס משחק</button>
    <div class="roadmap">
      <b>מתוכנן</b><br>
      כל שחקן מתחבר מהטלפון שלו לאותו משחק ורושם כניסות לעצמו · יומן פעולות בלתי ניתן לשינוי — כל כניסה, עדכון ומחיקה נרשמים עם מי ומתי.
    </div>
  </div>
</div>

<script>
(function () {
  const MIN_BUYIN = 50;
  const BUYIN_OPTIONS = [50, 100, 150];
  const KEY = "poker-settle-v1";

  const EXAMPLE = {
    example: true,
    players: [
      { name: "דביר",  buyins: [50, 50], cashout: 180 },
      { name: "יוסי",  buyins: [50],     cashout: 0   },
      { name: "רותם",  buyins: [50, 50, 50], cashout: 95 },
      { name: "עמית",  buyins: [50],     cashout: 25  },
    ],
  };

  let state = load();
  let mode = "game";          // "game" | "settle"
  let openMenu = null;        // player name whose buy-in menu is open
  let customOpen = null;      // player name whose custom-amount input is open
  let animNext = "all";       // row entrance animation for the next render: "all" | "one" | null
  let animName = null;        // the player to animate when animNext === "one"

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.players)) return s;
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(EXAMPLE));
  }
  function save() {
    pendingRemote = null; // a local edit supersedes any remote state parked for later
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    scheduleRemoteSave();
  }

  // --- server sync (shared document, survives devices and reloads) ---
  const CLIENT_ID = Math.random().toString(36).slice(2);
  let gameDoc = null;
  let saveTimer = null;
  let pendingRemote = null;
  let dirtyUntil = 0; // while set, fresh local edits outrank incoming remote state

  function setSync(on, label) {
    const d = document.getElementById("syncDot");
    const t = document.getElementById("syncText");
    if (d) d.classList.toggle("on", on);
    if (t) t.textContent = label;
  }

  function remoteBody() {
    return {
      by: CLIENT_ID,
      example: !!state.example,
      players: state.players,
      updatedAt: new Date().toISOString(),
    };
  }

  function scheduleRemoteSave() {
    dirtyUntil = Date.now() + 6000;
    if (!gameDoc) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      saveTimer = null;
      gameDoc.set(remoteBody()).catch(() => setSync(false, "שגיאת שמירה — נשמר מקומית"));
    }, 400);
  }

  function applyRemote(data) {
    const incoming = { example: !!data.example, players: Array.isArray(data.players) ? data.players : [] };
    if (JSON.stringify(incoming) === JSON.stringify({ example: state.example, players: state.players })) return;
    // Don't yank the UI out from under an active edit — apply on blur.
    const ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT")) { pendingRemote = incoming; return; }
    state = incoming;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    render();
  }

  document.addEventListener("visibilitychange", () => {
    // Flush a pending debounced write immediately when the tab is hidden/closed.
    if (document.visibilityState === "hidden" && saveTimer && gameDoc) {
      clearTimeout(saveTimer);
      saveTimer = null;
      gameDoc.set(remoteBody()).catch(() => {});
    }
  });

  document.addEventListener("focusout", () => {
    if (!pendingRemote) return;
    // Let the click that caused this blur run first; if it made a local
    // edit, that edit wins and the parked remote state is dropped.
    setTimeout(() => {
      if (!pendingRemote) return;
      if (saveTimer || Date.now() < dirtyUntil) { pendingRemote = null; return; }
      const p = pendingRemote; pendingRemote = null;
      applyRemote({ example: p.example, players: p.players });
    }, 50);
  });

  function initSync() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    window.claude.use("db").then((db) => {
      if (!db) return; // no server storage in this view — stay on localStorage
      gameDoc = db.doc("games/current");
      gameDoc.onSnapshot((snap) => {
        setSync(true, "מסונכרן");
        if (!snap.exists) {
          // First device seeds the shared game with whatever it has locally.
          if (!state.example && state.players.length) scheduleRemoteSave();
          return;
        }
        const data = snap.data();
        if (!data) return;
        if (data.by === CLIENT_ID) { dirtyUntil = 0; return; } // our own write confirmed
        // A fresh local edit is still on its way to the server — don't let
        // an older remote snapshot overwrite it.
        if (saveTimer || Date.now() < dirtyUntil) return;
        applyRemote(data);
      }, () => setSync(false, "שמירה מקומית"));
    }).catch(() => {});
  }
  initSync();

  function markReal() {
    if (state.example) state.example = false;
  }

  const fmt = (n) => "₪" + (Math.round(n * 100) / 100).toLocaleString("he-IL");
  const sum = (a) => a.reduce((x, y) => x + y, 0);

  function totals() {
    const buy = sum(state.players.map(p => sum(p.buyins)));
    const out = sum(state.players.map(p => Number(p.cashout) || 0));
    return { buy, out, diff: out - buy };
  }

  // Greedy settlement: fewest transfers between net winners and losers.
  function settle() {
    const nets = state.players
      .map(p => ({ name: p.name, net: (Number(p.cashout) || 0) - sum(p.buyins) }))
      .filter(p => Math.abs(p.net) > 0.005);
    const winners = nets.filter(p => p.net > 0).sort((a, b) => b.net - a.net);
    const losers  = nets.filter(p => p.net < 0).sort((a, b) => a.net - b.net);
    const moves = [];
    let i = 0, j = 0;
    while (i < losers.length && j < winners.length) {
      const pay = Math.min(-losers[i].net, winners[j].net);
      moves.push({ from: losers[i].name, to: winners[j].name, amount: pay });
      losers[i].net += pay;
      winners[j].net -= pay;
      if (-losers[i].net < 0.005) i++;
      if (winners[j].net < 0.005) j++;
    }
    return moves;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // Adds a buy-in for the player and replays the feedback animations
  // (chip flash + total pulse) on the freshly rendered row.
  function addBuyin(p, idx, amount, chipText) {
    p.buyins.push(amount);
    markReal(); save(); render();
    const fresh = document.querySelectorAll(".prow")[idx];
    if (!fresh) return;
    if (chipText) {
      const c = Array.from(fresh.querySelectorAll(".chip")).find(x => x.textContent === chipText);
      if (c) { c.classList.add("flash"); setTimeout(() => c.classList.remove("flash"), 500); }
    }
    const totalEl = fresh.querySelector(".pmeta b");
    if (totalEl) { totalEl.classList.add("pulse"); setTimeout(() => totalEl.classList.remove("pulse"), 600); }
  }

  function render() {
    const anim = animNext; animNext = null;
    document.getElementById("modeGame").classList.toggle("on", mode === "game");
    document.getElementById("modeSettle").classList.toggle("on", mode === "settle");

    const rows = document.getElementById("rows");
    rows.innerHTML = "";

    state.players.forEach((p, idx) => {
      const row = el("div", "prow");
      if (anim === "all") { row.classList.add("anim"); row.style.animationDelay = (idx * 50) + "ms"; }
      else if (anim === "one" && p.name === animName) { row.classList.add("anim"); }
      const line = el("div", "prow-line");

      line.appendChild(el("span", "pname", p.name));

      if (mode === "game") {
        const meta = el("span", "pmeta");
        meta.innerHTML = "<b>" + fmt(sum(p.buyins)) + "</b> · " + p.buyins.length + " כניסות";
        line.appendChild(meta);

        const plus = el("button", "btn-plus", "+");
        plus.type = "button";
        plus.setAttribute("aria-label", "הוסף כניסה ל" + p.name);
        plus.setAttribute("aria-expanded", openMenu === p.name ? "true" : "false");
        if (openMenu === p.name) plus.classList.add("open");
        plus.addEventListener("click", () => {
          openMenu = openMenu === p.name ? null : p.name;
          if (openMenu !== p.name) customOpen = null;
          render();
        });
        line.appendChild(plus);
        row.appendChild(line);

        const menu = el("div", "pmenu" + (openMenu === p.name ? " open" : ""));
        const inner = el("div", "pmenu-in");
        const mrow = el("div", "pmenu-row");
        BUYIN_OPTIONS.forEach(amount => {
          const chip = el("button", "chip", "₪" + amount + "+");
          chip.type = "button";
          chip.addEventListener("click", () => addBuyin(p, idx, amount, "₪" + amount + "+"));
          mrow.appendChild(chip);
        });
        const other = el("button", "chip" + (customOpen === p.name ? " active" : ""), "אחר");
        other.type = "button";
        other.addEventListener("click", () => {
          customOpen = customOpen === p.name ? null : p.name;
          render();
          if (customOpen === p.name) {
            const fresh = document.querySelectorAll(".prow")[idx];
            const ci = fresh && fresh.querySelector(".custom-line input");
            if (ci) ci.focus();
          }
        });
        mrow.appendChild(other);
        if (p.buyins.length > 0) {
          const undo = el("button", "undo", "בטל אחרונה (₪" + p.buyins[p.buyins.length - 1] + ")");
          undo.type = "button";
          undo.addEventListener("click", () => {
            p.buyins.pop();
            if (p.buyins.length === 0) state.players.splice(idx, 1); // no entries left = out of the game
            markReal(); save(); render();
          });
          mrow.appendChild(undo);
        }
        inner.appendChild(mrow);

        if (customOpen === p.name) {
          const cline = el("div", "custom-line");
          const cinp = document.createElement("input");
          cinp.type = "number";
          cinp.min = String(MIN_BUYIN);
          cinp.step = "1";
          cinp.inputMode = "decimal";
          cinp.placeholder = "סכום חופשי · מינימום ₪" + MIN_BUYIN;
          cinp.setAttribute("aria-label", "סכום כניסה חופשי עבור " + p.name);
          const confirmCustom = () => {
            const amount = Number(cinp.value);
            if (!cinp.value || !isFinite(amount) || amount < MIN_BUYIN) {
              cinp.classList.remove("shake");
              void cinp.offsetWidth; // restart the animation
              cinp.classList.add("shake");
              cinp.focus();
              return;
            }
            customOpen = null;
            addBuyin(p, idx, Math.round(amount));
          };
          cinp.addEventListener("keydown", (e) => {
            if (e.key === "Enter") { e.preventDefault(); confirmCustom(); }
          });
          const cbtn = el("button", "btn-confirm", "הוסף");
          cbtn.type = "button";
          cbtn.addEventListener("click", confirmCustom);
          cline.appendChild(cinp);
          cline.appendChild(cbtn);
          inner.appendChild(cline);
        }

        menu.appendChild(inner);
        row.appendChild(menu);
      } else {
        const inp = document.createElement("input");
        inp.type = "number";
        inp.min = "0";
        inp.step = "1";
        inp.inputMode = "decimal";
        inp.placeholder = "צ'יפים";
        inp.className = "srow-input";
        inp.value = p.cashout === "" ? "" : p.cashout;
        inp.setAttribute("aria-label", "שווי צ'יפים בסוף עבור " + p.name);
        inp.addEventListener("input", () => {
          p.cashout = inp.value === "" ? "" : Math.max(0, Number(inp.value));
          markReal(); save(); renderDerived();
        });
        line.appendChild(inp);

        const net = el("span", "net");
        net.dataset.net = idx;
        line.appendChild(net);
        row.appendChild(line);
      }

      rows.appendChild(row);
    });

    renderDerived();
  }

  function renderDerived() {
    const t = totals();

    if (mode === "settle") {
      state.players.forEach((p, idx) => {
        const e = document.querySelector('[data-net="' + idx + '"]');
        if (!e) return;
        const net = (Number(p.cashout) || 0) - sum(p.buyins);
        e.className = "net " + (net > 0.005 ? "pos" : net < -0.005 ? "neg" : "zero");
        e.textContent = (net > 0 ? "+" : "") + fmt(net).replace("₪-", "-₪");
      });
    }

    const stat = document.getElementById("statline");
    if (mode === "game") {
      stat.innerHTML =
        'בקופה <b>' + fmt(t.buy) + '</b><span class="sep">·</span>' +
        state.players.length + " שחקנים" +
        (state.example ? '<span class="sep">·</span><span class="example-tag">נתוני דוגמה — כל עריכה מאפסת אותם</span>' : "");
    } else {
      const diffTxt = (t.diff > 0 ? "+" : "") + fmt(t.diff).replace("₪-", "-₪");
      stat.innerHTML =
        'בקופה <b>' + fmt(t.buy) + '</b><span class="sep">·</span>' +
        'דווח <b>' + fmt(t.out) + '</b><span class="sep">·</span>' +
        'הפרש <span class="' + (Math.abs(t.diff) < 0.005 ? "good" : "bad") + '">' + (Math.abs(t.diff) < 0.005 ? "0 ✓" : diffTxt) + "</span>";
    }

    const warn = document.getElementById("warnbox");
    if (mode === "settle" && Math.abs(t.diff) >= 0.005 && t.buy > 0) {
      warn.innerHTML = '<p class="warn">הצ\'יפים לא סוגרים את הקופה — ספרו שוב לפני שמעבירים כסף. החישוב למטה לפי מה שהוזן.</p>';
    } else {
      warn.innerHTML = "";
    }

    const results = document.getElementById("results");
    results.hidden = mode !== "settle";
    if (mode === "settle") {
      const box = document.getElementById("transfers");
      const moves = settle();
      box.innerHTML = "";
      if (moves.length === 0) {
        box.innerHTML = '<p class="settle-empty">אין העברות — הזינו לכל שחקן את שווי הצ\'יפים שסיים איתו.</p>';
      } else {
        moves.forEach((m, i) => {
          const div = el("div", "transfer");
          div.style.animationDelay = (i * 60) + "ms";
          div.appendChild(el("span", "who", m.from));
          div.appendChild(el("span", "arrow", "משלם ל־"));
          div.appendChild(el("span", "who", m.to));
          div.appendChild(el("span", "amount", fmt(m.amount)));
          box.appendChild(div);
        });
      }
    }
  }

  function addPlayer() {
    const inp = document.getElementById("newName");
    const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    if (state.example) state = { example: false, players: [] };
    state.players.push({ name, buyins: [MIN_BUYIN], cashout: "" });
    inp.value = "";
    mode = "game";
    openMenu = name;
    customOpen = null;
    animNext = "one"; animName = name;
    save(); render();
  }
  document.getElementById("addBtn").addEventListener("click", addPlayer);
  document.getElementById("newName").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addPlayer(); }
  });

  document.getElementById("modeGame").addEventListener("click", () => {
    if (mode === "game") return;
    mode = "game"; animNext = "all"; render();
  });
  document.getElementById("modeSettle").addEventListener("click", () => {
    if (mode === "settle") return;
    mode = "settle"; openMenu = null; customOpen = null; animNext = "all"; render();
  });

  // window.confirm is blocked in the sandboxed frame — two-step confirm instead.
  let resetArmed = null;
  document.getElementById("resetBtn").addEventListener("click", (e) => {
    const btn = e.currentTarget;
    if (!resetArmed) {
      btn.textContent = "בטוחים? לחיצה נוספת תמחק הכול";
      resetArmed = setTimeout(() => {
        resetArmed = null;
        btn.textContent = "איפוס משחק";
      }, 4000);
      return;
    }
    clearTimeout(resetArmed);
    resetArmed = null;
    btn.textContent = "איפוס משחק";
    state = { example: false, players: [] };
    openMenu = null;
    save(); render();
  });

  render();
})();
</script>

</body>
</html>
