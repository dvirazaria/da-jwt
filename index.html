      row.appendChild(el("span", "games-member-tag", "לשעבר"));
      content.appendChild(row);
    });
    detailsIn.appendChild(content);
    details.appendChild(detailsIn);
    if (formerMembersOpen && formerMembersJustOpened) {
      formerMembersJustOpened = false;
      requestAnimationFrame(() => requestAnimationFrame(() => details.classList.add("open")));
    } else if (formerMembersOpen) {
      details.classList.add("open");
    }
    wrap.appendChild(details);
    return wrap;
  }
  // Plays the former-members list's collapse transition (matching closeAddMemberPanel's approach)
  // before flipping the state and rebuilding the group page without it.
  function closeFormerMembers() {
    const panel = document.querySelector(".games-former-members .games-card-details.open");
    const finish = () => { formerMembersOpen = false; formerMembersJustOpened = false; renderGroupPage(); };
    if (!panel) { finish(); return; }
    panel.classList.remove("open");
    setTimeout(finish, 250);
  }

  // One flat, tappable GroupGameSummary row: date · N שחקנים · winner(s), a quiet meta line
  // (pot, duration when known, "לא מאוזן" tag when unbalanced), and — expanded via the shared
  // grid-collapse details pattern — the full ranking by place, names only (no money).
  function renderGroupHistoryRow(game, expanded, onToggle) {
    const item = el("div", "games-history-item");
    const head = el("div", "games-history-head");
    head.setAttribute("role", "button");
    head.setAttribute("tabindex", "0");
    head.setAttribute("aria-expanded", expanded ? "true" : "false");
    const detailsId = "group-history-details-" + game.gameId;
    head.setAttribute("aria-controls", detailsId);
    const winners = (Array.isArray(game.winnerNames) ? game.winnerNames : []).filter(Boolean);
    const winnerLabel = winners.length ? (winners.length > 1 ? "מנצחים: " : "מנצח: ") + winners.join(", ") : "";
    const mainLine = [formatShortGameDate(game.at), formatPlayerCount(game.playerCount), winnerLabel].filter(Boolean).join(" · ");
    head.setAttribute("aria-label", mainLine);
    head.addEventListener("click", onToggle);
    head.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onToggle(); }
    });
    head.appendChild(el("p", "games-history-row", mainLine));
    const metaParts = ["בקופה " + fmt(game.potSize)];
    const durationLabel = formatDuration(game.durationMinutes);
    if (durationLabel) metaParts.push(durationLabel);
    const meta = el("p", "games-card-meta", metaParts.join(" · "));
    if (!game.isBalanced) meta.appendChild(el("span", "games-history-tag", "לא מאוזן"));
    head.appendChild(meta);
    item.appendChild(head);

    const details = el("div", "games-card-details");
    details.id = detailsId;
    const detailsIn = el("div", "games-card-details-in");
    const content = el("div", "games-card-details-content");
    const ranking = Array.isArray(game.ranking) ? game.ranking : [];
    ranking.forEach((name, idx) => {
      const row = el("p", "games-history-rank anim");
      row.style.animationDelay = (idx * 40) + "ms";
      const rank = el("span", "games-rank", (idx + 1) + ".");
      rank.dir = "ltr";
      row.appendChild(rank);
      row.appendChild(document.createTextNode(" " + name));
      content.appendChild(row);
    });
    detailsIn.appendChild(content);
    details.appendChild(detailsIn);
    // First expand of this row plays the grid-collapse open transition; a re-render while it's
    // already open (e.g. some other action on the page) just keeps it open with no replay.
    if (expanded && cardDetailsJustOpenedId === game.gameId) {
      cardDetailsJustOpenedId = null;
      requestAnimationFrame(() => requestAnimationFrame(() => details.classList.add("open")));
    } else if (expanded) {
      details.classList.add("open");
    }
    item.appendChild(details);
    return item;
  }

  // All GroupGameSummary rows, newest first (history is stored newest-first already). Owns the
  // shared "no games yet" empty state now that the redundant "last game" section is gone — the
  // first row here already shows date/players/winner, same as that section did.
  function renderGroupHistory(gameSummaries) {
    const section = el("section", "games-section");
    section.appendChild(el("h3", "games-section-title", "היסטוריית משחקים"));
    const list = Array.isArray(gameSummaries) ? gameSummaries : [];
    if (!list.length) {
      section.appendChild(el("p", "games-empty", "עוד אין משחקים"));
      return section;
    }
    list.forEach(game => {
      section.appendChild(renderGroupHistoryRow(game, expandedGroupGames.has(game.gameId), () => {
        if (expandedGroupGames.has(game.gameId)) expandedGroupGames.delete(game.gameId);
        else { expandedGroupGames.add(game.gameId); cardDetailsJustOpenedId = game.gameId; }
        renderGroupPage();
      }));
    });
    return section;
  }

  // The group's invite, rendered inside the group settings overlay (D1): any active member sees
  // it (returns null otherwise). No invite yet → "צור הזמנה". With one → the code, copy/share,
  // the shared server note, and, for admins only, a text action to revoke it (which brings back
  // "צור הזמנה").
  function renderGroupInvite(summary, invite, isAdmin) {
    if (!summary || !summary.isMember) return null;
    const section = el("section", "games-section games-invite-section");
    section.appendChild(el("h3", "games-section-title", "הזמנה לקבוצה"));
    if (!invite) {
      const createBtn = el("button", "games-invite-create", "צור הזמנה");
      createBtn.type = "button";
      createBtn.addEventListener("click", () => createGroupInvite(summary.groupId));
      section.appendChild(createBtn);
      return section;
    }
    const card = el("div", "games-invite-card");
    const code = el("p", "games-invite-code", formatInviteCode(invite.token));
    code.dir = "ltr";
    card.appendChild(code);

    const actions = el("div", "games-invite-actions");
    const copyBtn = el("button", "games-invite-action", "העתק קישור");
    copyBtn.type = "button";
    const copiedNote = el("span", "games-invite-copied", "הועתק ✓");
    copiedNote.setAttribute("role", "status");
    copiedNote.setAttribute("aria-live", "polite");
    copiedNote.hidden = true;
    copyBtn.addEventListener("click", () => {
      const link = inviteLink(invite.token, location.origin, location.pathname);
      const announceCopied = () => {
        copiedNote.hidden = false;
        setTimeout(() => { copiedNote.hidden = true; }, 2000);
      };
      const copyViaSelect = () => {
        const tmp = document.createElement("textarea");
        tmp.value = link;
        tmp.style.position = "fixed";
        tmp.style.opacity = "0";
        document.body.appendChild(tmp);
        tmp.focus();
        tmp.select();
        try { document.execCommand("copy"); } catch (err) { /* best effort */ }
        document.body.removeChild(tmp);
        announceCopied();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(announceCopied).catch(copyViaSelect);
      } else {
        copyViaSelect();
      }
    });
    actions.appendChild(copyBtn);
    actions.appendChild(copiedNote);

    if (typeof navigator.share === "function") {
      const shareBtn = el("button", "games-invite-action", "שתף");
      shareBtn.type = "button";
      shareBtn.addEventListener("click", () => {
        const link = inviteLink(invite.token, location.origin, location.pathname);
        navigator.share({ title: summary.name, url: link }).catch(() => {});
      });
      actions.appendChild(shareBtn);
    }
    card.appendChild(actions);

    // D6: no QR placeholder tile — a real QR will be generated from inviteLink(...) once a
    // backend can redeem it; until then the shared note below says exactly that, once.
    card.appendChild(el("p", "games-invite-note", SERVER_NOTE));

    if (isAdmin) {
      const revokeBtn = el("button", "games-invite-revoke", "בטל הזמנה");
      revokeBtn.type = "button";
      revokeBtn.addEventListener("click", () => revokeGroupInvite(summary.groupId));
      card.appendChild(revokeBtn);
    }
    section.appendChild(card);
    return section;
  }

  function renderGroupPage() {
    // A deferred call (a panel's collapse setTimeout, the async avatar handler) can still fire
    // after the user has navigated away from the group page — bail instead of rebuilding a
    // #gamesHome that's now showing a different view.
    if (appView !== "group") return;
    // Only a fresh navigation into the group page (openGroup()/setAppView) stagger-animates the
    // sections below; an in-place re-render after e.g. removing a member must not replay it.
    const enterStagger = groupPageEnterNext;
    groupPageEnterNext = false;
    const box = document.getElementById("gamesHome");
    box.innerHTML = "";
    const collections = collectionsOf(state);
    const rawGroup = (Array.isArray(collections.groups) ? collections.groups : []).find(g => g && g.id === currentGroupId);
    if (rawGroup && rawGroup.deletedAt) { setAppView("games"); return; } // a deleted group is gone — don't strand the user
    const summary = getGroupSummary(collections, currentGroupId, me);
    if (!summary) { setAppView("games"); return; } // the group is gone on this device — don't strand the user
    const isArchived = !!(rawGroup && rawGroup.archivedAt);
    const inner = el("div", "games-home-in");
    inner.appendChild(renderGroupHeader(summary));
    // Archived groups render read-only: no primary action, just a quiet note. Restoring
    // ("שחזר מהארכיון") lives in the settings overlay for admins.
    if (isArchived) {
      const note = el("div", "games-primary-action");
      note.appendChild(el("p", "games-primary-reason", "הקבוצה בארכיון"));
      const hideAction = !summary.isMember && renderHideGroupAction();
      if (hideAction) note.appendChild(hideAction);
      inner.appendChild(note);
    } else {
      inner.appendChild(renderGroupPrimaryAction(summary, canStartGroupGame(collections, currentGroupId)));
    }
    inner.appendChild(renderGroupLeaders(buildLeaderboard(collections.history, collections.groupMembers, currentGroupId)));
    const gameSummaries = groupClosedGames(collections.history, currentGroupId).map(toGroupGameSummary);
    inner.appendChild(renderGroupMembers(activeMembers(collections.groupMembers, currentGroupId), formerMembers(collections.groupMembers, currentGroupId), summary.isAdmin));
    inner.appendChild(renderGroupHistory(gameSummaries));
    // D1: the invite block and "+ הוסף חבר" live in the group settings overlay now — this page
    // stays short (header, primary action, דירוג, חברים, היסטוריה).
    if (enterStagger) {
      Array.from(inner.children).forEach((child, i) => {
        child.classList.add("anim");
        child.style.animationDelay = (i * 55) + "ms";
      });
    }
    box.appendChild(inner);
  }

  // Member chips above the "שם שחקן חדש" input, shown only for a group game (Task 9): one chip
  // per active member of the current group not yet at the table (matched by memberId, falling
  // back to displayName for members added before this device knew their memberId). Hidden for
  // an ungrouped game. Tapping a chip adds that member via the same addPlayerToTable() tail as
  // typed-name addPlayer(). The chip set only replays its entrance stagger when it actually
  // changes, so re-rendering for unrelated reasons (a buy-in, an entry toggle) doesn't re-animate it.
  let addRowChipsAnimKey = null;
  function renderAddRowChips() {
    const container = document.getElementById("addrowChips");
    if (!container) return;
    container.innerHTML = "";
    const group = state.groupId
      ? (Array.isArray(state.groups) ? state.groups : []).find(g => g && g.id === state.groupId)
      : null;
    if (!group) {
      container.hidden = true;
      addRowChipsAnimKey = null;
      return;
    }
    const members = activeMembers(state.groupMembers, state.groupId).filter(member =>
      !state.players.some(p => (member.id && p.memberId === member.id) || p.name === member.displayName));
    if (!members.length) {
      container.hidden = true;
      addRowChipsAnimKey = null;
      return;
    }
    container.hidden = false;
    const key = members.map(m => m.id).join(",");
    const justChanged = key !== addRowChipsAnimKey;
    addRowChipsAnimKey = key;
    members.forEach((member, i) => {
      const chip = el("button", justChanged ? "chip anim" : "chip", member.displayName);
      chip.type = "button";
      if (justChanged) chip.style.animationDelay = (i * 45) + "ms";
      chip.addEventListener("click", () => addPlayerToTable(member.displayName, { guestId: member.guestId, memberId: member.id }));
      container.appendChild(chip);
    });
  }

  // D2: the table (game) and settlement screens get a compact header line — back arrow, the
  // group name, and a quiet phase label — so a game opened from a group can get back to it. It
  // renders inside <header>, which already reserves 96px on the inline-end side for the corner
  // reset/theme controls, below the .game-view/.settle-view min-height that keeps them clear.
  // An ungrouped game gets the same line, going back to the games dashboard.
  function renderTableHeader() {
    const box = document.getElementById("tableHeader");
    if (!box) return;
    box.hidden = appView !== "game" && appView !== "settle";
    box.innerHTML = "";
    if (box.hidden) return;
    const group = state.groupId
      ? (Array.isArray(state.groups) ? state.groups : []).find(g => g && g.id === state.groupId)
      : null;
    const back = el("button", "back-arrow");
    back.type = "button";
    back.setAttribute("aria-label", group ? "חזרה לקבוצה" : "חזרה למשחקים");
    back.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>';
    back.addEventListener("click", () => { if (group) openGroup(state.groupId); else setAppView("games"); });
    box.appendChild(back);
    // The group name is user data — always a text node, never interpolated into innerHTML.
    box.appendChild(el("span", "table-header-name", group ? group.name : "משחק ללא קבוצה"));
    box.appendChild(el("span", "table-header-label", appView === "settle" ? "סגירה" : "שולחן"));
  }

  function render() {
    const anim = animNext; animNext = null;
    const inGames = appView === "games" || appView === "game" || appView === "settle" || appView === "group";
    document.body.classList.toggle("games-view", appView === "games");
    if (appView === "group") document.body.classList.add("games-view"); // group page reuses the dashboard shell
    document.body.classList.toggle("game-view", appView === "game");
    document.body.classList.toggle("settle-view", appView === "settle");
    document.body.classList.toggle("friends-view", appView === "friends");
    document.getElementById("modeFriends").classList.toggle("on", appView === "friends");
    document.getElementById("modeGames").classList.toggle("on", inGames);
    document.getElementById("modeProfile").classList.toggle("on", appView === "profile");
    document.getElementById("addrow").hidden = appView !== "game";
    renderTableHeader();
    renderAddRowChips();
    // Settings gear: profile, friends and the games dashboard. The group page has its own "הגדרות" (group
    // settings) in its header, and game/settle keep the reset control in that corner.
    document.getElementById("settingsBtn").hidden = appView !== "profile" && appView !== "games" && appView !== "friends";
    document.getElementById("resetBtn").hidden = appView === "profile" || appView === "friends" || appView === "games" || appView === "group";
    document.getElementById("gamesHome").hidden = appView !== "games" && appView !== "group";
    document.getElementById("friendsPage").hidden = appView !== "friends";

    const rows = document.getElementById("rows");
    rows.innerHTML = "";
    rows.hidden = !inGames || appView === "games" || appView === "group";

    if (appView === "game" || appView === "settle") state.players.forEach((p, idx) => {
      const row = el("div", "prow");
      if (anim === "all") { row.classList.add("anim"); row.style.animationDelay = (idx * 50) + "ms"; }
      else if (anim === "one" && p.name === animName) { row.classList.add("anim"); }
      const line = el("div", "prow-line");

      if (appView === "game") {
        if (isExited(p)) row.classList.add("exited");
        const heading = el("div", "player-heading");
        heading.appendChild(el("span", "pname", p.name));
        line.appendChild(heading);
        const details = el("div", "entry-details");
        details.id = "entry-details-" + idx;
        const detailsInner = el("div", "entry-details-in");
        const toggle = el("button", "entry-toggle", "פירוט כניסות");
        toggle.type = "button";
        toggle.setAttribute("aria-label", "פירוט כניסות של " + p.name);
        toggle.setAttribute("aria-controls", details.id);
        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        arrow.setAttribute("viewBox", "0 0 12 12");
        arrow.setAttribute("aria-hidden", "true");
        arrow.innerHTML = '<path d="M3 4.5 6 7.5 9 4.5"/>';
        toggle.appendChild(arrow);
        const updateExpanded = () => {
          const expanded = expandedEntries.has(p.id);
          toggle.setAttribute("aria-expanded", String(expanded));
          details.setAttribute("aria-hidden", String(!expanded));
          details.classList.toggle("open", expanded);
        };
        toggle.addEventListener("click", () => {
          if (expandedEntries.has(p.id)) expandedEntries.delete(p.id);
          else expandedEntries.add(p.id);
          updateExpanded();
        });
        updateExpanded();
        heading.appendChild(toggle);
        if (!isExited(p)) {
          const exitToggle = el("button", "exit-toggle", "יציאה");
          exitToggle.type = "button";
          exitToggle.setAttribute("aria-label", "יציאת " + p.name + " מהמשחק");
          exitToggle.setAttribute("aria-expanded", String(exitOpen === p.name));
          exitToggle.setAttribute("aria-controls", "exit-panel-" + idx);
          exitToggle.addEventListener("click", () => openExitPanel(p.name));
          heading.appendChild(exitToggle);
        }
        // Array order is the actual insertion order, including entries across midnight.
        const entries = p.entryLog.filter(entry => entry.gameId === state.gameId && entry.playerId === p.id);
        if (entries.length) {
          const list = el("ol", "entry-list");
          entries.forEach(entry => {
            const item = el("li", "entry-item");
            const date = entry.timestamp ? new Date(entry.timestamp) : null;
            const knownTime = date && Number.isFinite(date.getTime());
            const time = el("time", "entry-time", knownTime
              ? date.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }) : "—");
            time.dir = "ltr";
            if (knownTime) { time.dateTime = entry.timestamp; time.title = date.toLocaleString("he-IL"); }
            else { time.title = "שעת הכניסה לא תועדה"; time.setAttribute("aria-label", time.title); }
            const amount = el("span", "entry-amount", fmt(entry.amount));
            amount.dir = "ltr";
            item.append(time, el("span", "entry-divider"), amount);
            list.appendChild(item);
          });
          detailsInner.appendChild(list);
        } else detailsInner.appendChild(el("p", "entry-empty", "אין כניסות עדיין"));
        details.appendChild(detailsInner);
        const meta = el("span", "pmeta");
        meta.innerHTML = "<b>" + fmt(sum(p.buyins)) + "</b> · " + formatEntryCount(p.buyins.length);
        if (isExited(p)) {
          meta.appendChild(el("span", "exit-tag", " · יצא · " + fmt(p.cashout)));
          const editBtn = el("button", "exit-edit", "עריכה");
          editBtn.type = "button";
          editBtn.setAttribute("aria-label", "עריכת סכום היציאה של " + p.name);
          editBtn.setAttribute("aria-expanded", String(exitOpen === p.name));
          editBtn.setAttribute("aria-controls", "exit-panel-" + idx);
          editBtn.addEventListener("click", () => openExitPanel(p.name));
          meta.appendChild(editBtn);
        }
        line.appendChild(meta);

        if (!isExited(p)) {
          const plus = el("button", "btn-plus", "+");
          plus.type = "button";
          plus.setAttribute("aria-label", "הוסף כניסה ל" + p.name);
          plus.setAttribute("aria-expanded", openMenu === p.name ? "true" : "false");
          if (openMenu === p.name) plus.classList.add("open");
          plus.addEventListener("click", () => {
            if (markReal()) { save(); render(); return; } // first touch wipes the demo data
            const opening = openMenu !== p.name;
            if (!opening) {
              // animate the collapse before removing the menu from the DOM
              const closingFor = p.name;
              animateMenuClose(() => {
                // don't slam shut a different menu the user opened meanwhile
                if (openMenu === closingFor) {
                  openMenu = null; customOpen = null; pendingAmount = null;
                  render();
                }
              });
              return;
            }
            const openBuyinMenu = () => {
              openMenu = p.name;
              menuJustOpened = p.name;
              customOpen = null;
              pendingAmount = null;
              render();
            };
            if (exitOpen) {
              // an exit panel elsewhere is open — collapse it first
              const closingFor = exitOpen;
              animateMenuClose(() => {
                if (exitOpen === closingFor) exitOpen = null;
                openBuyinMenu();
              });
            } else {
              openBuyinMenu();
            }
          });
          line.appendChild(plus);
          row.appendChild(line);

          const isOpen = openMenu === p.name;
          const menu = el("div", "pmenu");
          if (isOpen && menuJustOpened === p.name) {
            // fresh open: start collapsed and let the transition play
            menuJustOpened = null;
            requestAnimationFrame(() => requestAnimationFrame(() => menu.classList.add("open")));
          } else if (isOpen) {
            menu.classList.add("open");
          }
          const inner = el("div", "pmenu-in");
          const mrow = el("div", "pmenu-row");
          // the "other" capsule collapses back to a plain chip
          const collapseOther = () => {
            customOpen = null;
            mrow.classList.remove("other-mode");
            cinp.value = "";
            cgo.hidden = true;
          };
          BUYIN_OPTIONS.forEach(amount => {
            const selected = isOpen && pendingAmount === amount;
            const chip = el("button", "chip" + (selected ? " active" : ""), "₪" + amount + "+");
            chip.type = "button";
            chip.setAttribute("aria-pressed", selected ? "true" : "false");
            chip.addEventListener("click", () => {
              if (pendingAmount === amount) {
                confirmBuyin(p, idx, amount); // second tap on the selected amount = confirm
              } else {
                pendingAmount = amount;       // first tap = select and highlight, in place
                collapseOther();
                mrow.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
                chip.classList.add("active");
              }
            });
            mrow.appendChild(chip);
          });

          // "other": the chip itself stretches into an input capsule
          const other = el("div", "chip chip-other");
          other.setAttribute("role", "button");
          other.setAttribute("tabindex", "0");
          const olabel = el("span", "other-label", "אחר");
          const cinp = document.createElement("input");
          cinp.type = "number";
          cinp.className = "other-input";
          cinp.min = String(MIN_BUYIN);
          cinp.step = "1";
          cinp.inputMode = "decimal";
          cinp.placeholder = "סכום · מינ' ₪" + MIN_BUYIN;
          cinp.setAttribute("aria-label", "סכום כניסה חופשי עבור " + p.name);
          const cgo = el("button", "other-go", "הוסף");
          cgo.type = "button";
          cgo.hidden = customOpen !== p.name;
          const confirmCustom = () => {
            const amount = Number(cinp.value);
            if (!cinp.value || !isFinite(amount) || amount < MIN_BUYIN) { shakeEl(cinp); return; }
            confirmBuyin(p, idx, Math.round(amount));
          };
          const expandOther = () => {
            customOpen = p.name;
            pendingAmount = null;
            mrow.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
            mrow.classList.add("other-mode");
            cgo.hidden = false;
            setTimeout(() => cinp.focus(), 180);
          };
          other.addEventListener("click", (e) => {
            if (e.target === cinp || e.target === cgo) return;
            if (mrow.classList.contains("other-mode")) collapseOther();
            else expandOther();
          });
          other.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !mrow.classList.contains("other-mode")) { e.preventDefault(); expandOther(); }
          });
          cinp.addEventListener("keydown", (e) => {
            if (e.key === "Enter") { e.preventDefault(); confirmCustom(); }
          });
          cgo.addEventListener("click", confirmCustom);
          other.appendChild(olabel);
          other.appendChild(cinp);
          other.appendChild(cgo);
          mrow.appendChild(other);
          if (customOpen === p.name) { mrow.classList.add("other-mode"); cgo.hidden = false; }
          if (p.buyins.length > 0) {
            const undo = el("button", "undo", "בטל אחרונה (₪" + p.buyins[p.buyins.length - 1] + ")");
            undo.type = "button";
            undo.addEventListener("click", () => {
              if (markReal()) { save(); render(); return; }
              p.buyins.pop();
              p.entryLog.pop();
              if (p.buyins.length === 0) state.players.splice(idx, 1); // no entries left = out of the game
              save(); render();
            });
            mrow.appendChild(undo);
          }
          inner.appendChild(mrow);
          menu.appendChild(inner);
          row.appendChild(menu);
        } else {
          row.appendChild(line);
        }

        // inline exit/cashout capsule — reuses the .pmenu/.pmenu-in grid transition;
        // shown for an active player exiting, or an exited player editing their cashout.
        const exitPanelOpen = exitOpen === p.name;
        const exitPanel = el("div", "pmenu exit-panel");
        exitPanel.id = "exit-panel-" + idx;
        if (exitPanelOpen && exitJustOpened === p.name) {
          exitJustOpened = null;
          requestAnimationFrame(() => requestAnimationFrame(() => exitPanel.classList.add("open")));
        } else if (exitPanelOpen) {
          exitPanel.classList.add("open");
        }
        const exitInner = el("div", "pmenu-in");
        const exitRow = el("div", "pmenu-row exit-row");
        const cashInp = document.createElement("input");
        cashInp.type = "number";
        cashInp.min = "0";
        cashInp.step = "1";
        cashInp.inputMode = "decimal";
        cashInp.className = "exit-cashout-input";
        cashInp.placeholder = "כמה יצא איתו";
        cashInp.setAttribute("aria-label", "כמה יצא איתו — " + p.name);
        if (isExited(p)) cashInp.value = String(p.cashout);
        const confirmExit = () => {
          const raw = cashInp.value;
          const amount = Math.round(Number(raw));
          if (raw === "" || !Number.isFinite(amount) || amount < 0) { shakeEl(cashInp); return; }
          const ok = isExited(p) ? updateExitCashout(p, amount) : exitPlayer(p, amount, new Date().toISOString());
          if (!ok) { shakeEl(cashInp); return; }
          exitOpen = null;
          save();
          render();
        };
        cashInp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); confirmExit(); }
        });
        const exitConfirmBtn = el("button", "chip exit-confirm", "אשר יציאה");
        exitConfirmBtn.type = "button";
        exitConfirmBtn.addEventListener("click", confirmExit);
        // Row 16: the currency sits with the field instead of the number arriving bare, and
        // "ביטול" closes the panel through the same collapse animation that opened it.
        const exitCancelBtn = el("button", "exit-cancel", "ביטול");
        exitCancelBtn.type = "button";
        exitCancelBtn.addEventListener("click", () => openExitPanel(p.name));
        const exitField = el("div", "exit-field");
        exitField.appendChild(el("span", "exit-currency", "₪"));
        exitField.appendChild(cashInp);
        exitRow.appendChild(exitField);
        exitRow.appendChild(exitConfirmBtn);
        exitRow.appendChild(exitCancelBtn);
        exitInner.appendChild(exitRow);
        exitPanel.appendChild(exitInner);
        row.appendChild(exitPanel);
        row.appendChild(details);
      } else {
        line.appendChild(el("span", "pname", p.name));
        if (isExited(p)) line.appendChild(el("span", "exit-tag", "יצא"));
        const inp = document.createElement("input");
        inp.type = "number";
        inp.min = "0";
        inp.step = "1";
        inp.inputMode = "decimal";
        inp.placeholder = "צ'יפים";
        inp.className = "srow-input";
        inp.value = p.cashout === "" ? "" : p.cashout;
        inp.setAttribute("aria-label", "שווי צ'יפים בסוף עבור " + p.name);
        inp.addEventListener("input", () => {
          if (markReal()) { save(); render(); return; }
          const raw = inp.value === "" ? "" : Number(inp.value);
          p.cashout = raw === "" ? "" : Math.max(0, raw);
          if (raw !== "" && raw < 0) inp.value = "0"; // keep the field consistent with the clamped state
          save(); renderDerived();
        });
        line.appendChild(inp);

        const net = el("span", "net");
        net.dataset.net = idx;
        line.appendChild(net);
        row.appendChild(line);
      }

      rows.appendChild(row);
    });

    renderDerived();
    renderProfile();
    renderFriendsPage();
    if (appView === "games") renderGamesDashboard();
    else if (appView === "group") renderGroupPage();
    // A remote sync (applyRemote -> render) can change group data while the settings overlay is
    // open on top of the group page — keep it in sync instead of showing stale name/admin state.
    if (!document.getElementById("groupSettings").hidden) refreshGroupSettings();
  }

  function renderDerived() {
    const t = totals();

    const finishBtn = document.getElementById("finishGameBtn");
    const finishHint = document.getElementById("finishGameHint");
    const returnBtn = document.getElementById("returnToGameBtn");
    const canFinishGame = appView === "game" && state.phase === "active" && isGameOpen(state);
    finishBtn.hidden = !canFinishGame;
    returnBtn.hidden = appView !== "settle" || state.example;
    if (!canFinishGame && (finishGameHoldTimer || finishGameCompletionTimer)) clearFinishGameHold();
    if (!canFinishGame && finishHint) finishHint.hidden = true;

    if (appView === "settle") {
      state.players.forEach((p, idx) => {
        const e = document.querySelector('[data-net="' + idx + '"]');
        if (!e) return;
        const net = (Number(p.cashout) || 0) - sum(p.buyins);
        e.className = "net " + (net > 0.005 ? "pos" : net < -0.005 ? "neg" : "zero");
        e.textContent = fmtSigned(net);
      });
    }

    const stat = document.getElementById("statline");
    stat.hidden = appView === "profile" || appView === "friends" || appView === "games" || appView === "group";
    if (appView === "game") {
      const exitedCount = exitedPlayers(state.players).length;
      const exitedLabel = exitedCount === 0 ? "" :
        '<span class="sep">·</span>' + (exitedCount === 1 ? "יצא אחד" : exitedCount + " יצאו");
      stat.innerHTML =
        'בקופה <b>' + fmt(t.buy) + '</b><span class="sep">·</span>' +
        formatPlayerCount(state.players.length) + exitedLabel +
        (state.example ? '<span class="sep">·</span><span class="example-tag">נתוני דוגמה — כל עריכה מאפסת אותם</span>' : "");
      // D2: the group name moved to the table header at the top of the screen (renderTableHeader).
    } else if (appView === "settle") {
      stat.innerHTML =
        'בקופה <b>' + fmt(t.buy) + '</b><span class="sep">·</span>' +
        'דווח <b>' + fmt(t.out) + '</b><span class="sep">·</span>' +
        // Row 20: the red sentence under the stat line is the one place the gap is flagged;
        // repeating it in red here said the same thing twice.
        'הפרש <span class="' + (t.diff === 0 ? "good" : "neutral") + '">' + (t.diff === 0 ? "0 ✓" : balanceDescription(t.diff)) + "</span>";
    } else stat.innerHTML = "";

    const warn = document.getElementById("warnbox");
    if (appView === "settle" && t.diff !== 0 && t.buy > 0) {
      warn.innerHTML = '<p class="warn">השולחן לא מאוזן — ' + balanceDescription(t.diff) + '.</p>';
    } else {
      warn.innerHTML = "";
    }

    const results = document.getElementById("results");
    results.hidden = appView !== "settle";
    if (appView === "settle") {
      const box = document.getElementById("transfers");
      const moves = settle();
      box.innerHTML = "";
      if (moves.length === 0) {
        box.innerHTML = '<p class="settle-empty">אין העברות — הזינו לכל שחקן את שווי הצ\'יפים שסיים איתו.</p>';
      } else {
        moves.forEach((m, i) => {
          const div = el("div", "transfer");
          div.style.animationDelay = (i * 60) + "ms";
          div.appendChild(el("span", "who", m.from));
          div.appendChild(el("span", "arrow", "משלם ל־"));
          div.appendChild(el("span", "who", m.to));
          div.appendChild(el("span", "amount", fmt(m.amount)));
          const paymentId = settlementKey(state.gameId, m, i);
          const paid = !!state.settlementStatuses[paymentId];
          const paidBtn = el("button", "transfer-paid" + (paid ? " is-paid" : ""), paid ? "✓ שולם" : "שולם");
          paidBtn.type = "button";
          paidBtn.setAttribute("aria-pressed", String(paid));
          paidBtn.addEventListener("click", () => {
            if (paid) delete state.settlementStatuses[paymentId];
            else state.settlementStatuses[paymentId] = true;
            save();
            renderDerived();
          });
          div.appendChild(paidBtn);
          box.appendChild(div);
        });
      }
      const closeBtn = document.getElementById("closeTableBtn");
      const forceConfirm = document.getElementById("forceCloseConfirm");
      const hasTable = state.players.length && !state.example;
      const balanced = t.diff === 0;
      if (!hasTable || balanced || (forceCloseUnlocked && forceCloseUnlockDifference !== t.diff)) {
        forceCloseUnlocked = false;
        forceCloseUnlockDifference = null;
        forceCloseArmed = false;
      }
      closeBtn.hidden = !hasTable;
      closeBtn.disabled = false;
      closeBtn.setAttribute("aria-disabled", String(!balanced && !forceCloseUnlocked));
      closeBtn.classList.toggle("blocked-state", !balanced && !forceCloseUnlocked);
      closeBtn.classList.toggle("force-state", !balanced && forceCloseUnlocked);
      closeBtn.classList.toggle("warn-state", closeArmed);
      forceConfirm.hidden = !hasTable || balanced || !forceCloseArmed;
      setCloseButtonLabel(closeBtn, closeButtonLabel(balanced, forceCloseUnlocked, closeArmed));
      if (forceCloseArmed) document.getElementById("forceCloseMessage").textContent =
        "השולחן לא מאוזן — " + balanceDescription(t.diff) + ". לסגור את המשחק בכל זאת?";
    }
  }

  // ---------- confetti (monochrome) for a balanced close ----------
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = document.createElement("canvas");
    cv.style.cssText = "position:fixed;inset:0;z-index:60;pointer-events:none";
    document.body.appendChild(cv);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);
    const styles = getComputedStyle(document.documentElement);
    const COLORS = [
      styles.getPropertyValue("--accent").trim(),
      styles.getPropertyValue("--text").trim(),
      styles.getPropertyValue("--dim").trim(),
    ];
    const parts = Array.from({ length: 90 }, () => ({
      x: Math.random() * innerWidth,
      y: -20 - Math.random() * innerHeight * 0.4,
      w: 5 + Math.random() * 5,
      h: 8 + Math.random() * 8,
      vy: 2.2 + Math.random() * 3,
      vx: -1 + Math.random() * 2,
      rot: Math.random() * Math.PI,
      vr: -0.12 + Math.random() * 0.24,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      alpha: 0.5 + Math.random() * 0.5,
    }));
    const t0 = performance.now();
    (function tick(now) {
      const elapsed = now - t0;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      const fade = elapsed > 2200 ? Math.max(0, 1 - (elapsed - 2200) / 500) : 1;
      parts.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin((now / 300) + p.rot) * 0.6; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = p.alpha * fade;
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (elapsed < 2700) requestAnimationFrame(tick);
      else cv.remove();
    })(t0);
  }

  // ---------- close table -> record ----------
  let closeArmed = false;
  let closeArmTimer = null;
  let forceCloseArmed = false;
  let forceCloseUnlocked = false;
  let forceCloseUnlockDifference = null;
  let closeHoldTimer = null;
  let closeHoldCompletionTimer = null;
  let closeHoldAwaitingRelease = false;
  let longPressJustUnlocked = false;
  let finishGameHoldTimer = null;
  let finishGameCompletionTimer = null;

  function clearFinishGameHold() {
    if (finishGameHoldTimer) clearTimeout(finishGameHoldTimer);
    if (finishGameCompletionTimer) clearTimeout(finishGameCompletionTimer);
    finishGameHoldTimer = null;
    finishGameCompletionTimer = null;
    const btn = document.getElementById("finishGameBtn");
    const hint = document.getElementById("finishGameHint");
    if (btn) btn.classList.remove("hold-state");
    if (hint) hint.hidden = true;
  }

  function beginFinishGameHold(e) {
    if (appView !== "game" || state.phase !== "active" || !isGameOpen(state)) return;
    if (e.button !== undefined && e.button !== 0) return;
    clearFinishGameHold();
    const btn = e.currentTarget;
    const hint = document.getElementById("finishGameHint");
    btn.classList.add("hold-state");
    if (hint) hint.hidden = false;
    if (btn.setPointerCapture && e.pointerId !== undefined) btn.setPointerCapture(e.pointerId);
    finishGameHoldTimer = setTimeout(() => {
      finishGameHoldTimer = null;
      finishGameCompletionTimer = setTimeout(() => {
        finishGameCompletionTimer = null;
        btn.classList.remove("hold-state");
        if (hint) hint.hidden = true;
        finishGame();
      }, 60);
    }, FINISH_GAME_HOLD_MS);
  }

  function endFinishGameHold(e) {
    if (finishGameHoldTimer) clearFinishGameHold();
    const btn = e.currentTarget;
    if (btn.releasePointerCapture && e.pointerId !== undefined && btn.hasPointerCapture && btn.hasPointerCapture(e.pointerId)) {
      btn.releasePointerCapture(e.pointerId);
    }
  }

  function finishGame() {
    if (state.phase !== "active" || !isGameOpen(state)) return;
    state.phase = "settlement";
    save();
    setAppView("settle");
  }

  function returnToGameEdit() {
    if (state.example || state.phase === "closed") return;
    state.phase = "active";
    save();
    setAppView("game");
  }

  function clearCloseHold() {
    if (closeHoldTimer) clearTimeout(closeHoldTimer);
    if (closeHoldCompletionTimer) clearTimeout(closeHoldCompletionTimer);
    closeHoldTimer = null;
    closeHoldCompletionTimer = null;
    closeHoldAwaitingRelease = false;
    const btn = document.getElementById("closeTableBtn");
    if (btn) btn.classList.remove("hold-state");
  }

  function beginCloseHold(e) {
    const t = totals();
    if (appView !== "settle" || !state.players.length || state.example || t.diff === 0 || forceCloseUnlocked) return;
    if (e.button !== undefined && e.button !== 0) return;
    clearCloseHold();
    const btn = e.currentTarget;
    btn.classList.add("hold-state");
    if (btn.setPointerCapture && e.pointerId !== undefined) btn.setPointerCapture(e.pointerId);
    closeHoldTimer = setTimeout(() => {
      closeHoldTimer = null;
      closeHoldAwaitingRelease = true;
      closeHoldCompletionTimer = setTimeout(() => {
        closeHoldCompletionTimer = null;
        const current = totals();
        if (appView !== "settle" || !state.players.length || state.example || current.diff === 0) {
          btn.classList.remove("hold-state");
          return;
        }
        btn.classList.remove("hold-state");
        forceCloseUnlocked = true;
        forceCloseUnlockDifference = current.diff;
        forceCloseArmed = false;
        renderDerived();
      }, 60);
    }, HOLD_TO_FORCE_CLOSE_MS);
  }

  function endCloseHold(e) {
    if (closeHoldTimer) clearCloseHold();
    else if (closeHoldAwaitingRelease) {
      if (e.type === "pointerup") longPressJustUnlocked = true;
      closeHoldAwaitingRelease = false;
    }
    const btn = e.currentTarget;
    if (btn.releasePointerCapture && e.pointerId !== undefined && btn.hasPointerCapture && btn.hasPointerCapture(e.pointerId)) {
      btn.releasePointerCapture(e.pointerId);
    }
  }

  function finishCloseTable() {
    const t = totals();
    const balanced = t.diff === 0;
    const btn = document.getElementById("closeTableBtn");
    const closingAt = new Date().toISOString();
    const closedGroupId = state.groupId;
    const moves = settle();
    const paidStatuses = { ...state.settlementStatuses };
    const newDebts = buildDebtRecords(state, moves, paidStatuses, closingAt);
    clearTimeout(closeArmTimer);
    closeArmed = false;
    forceCloseArmed = false;
    forceCloseUnlocked = false;
    forceCloseUnlockDifference = null;
    longPressJustUnlocked = false;
    btn.classList.remove("warn-state");
    setCloseButtonLabel(btn, "סגירת שולחן ורישום לרקורד");
    const entry = buildHistoryEntry(state, { difference: t.diff, isBalanced: balanced }, closingAt, moves, paidStatuses);
    state.debts = [...newDebts, ...state.debts];
    state.history.unshift(entry);
    if (state.history.length > HISTORY_MAX) state.history.length = HISTORY_MAX;
    state.players = [];
    state.gameId = newId();
    state.phase = "closed";
    state.settlementStatuses = {};
    state.groupId = null;
    state.leaderRef = null;
    state.startedAt = null;
    expandedEntries.clear();
    state.example = false;
    openMenu = null; customOpen = null;
    save();
    const closedGroup = closedGroupId && state.groups.find(g => g.id === closedGroupId && !g.deletedAt);
    if (closedGroup) openGroup(closedGroupId);
    else setAppView("games");
    if (balanced) confetti();
  }

  document.getElementById("closeTableBtn").addEventListener("click", (e) => {
    const btn = e.currentTarget;
    const t = totals();
    if (longPressJustUnlocked) {
      longPressJustUnlocked = false;
      return;
    }
    if (t.diff !== 0) {
      if (!forceCloseUnlocked) return;
      forceCloseArmed = true;
      renderDerived();
      return;
    }
    if (!closeArmed) {
      closeArmed = true;
      btn.classList.add("warn-state");
      setCloseButtonLabel(btn, "לסגור את השולחן? לחיצה נוספת מאשרת");
      closeArmTimer = setTimeout(() => {
        closeArmed = false;
        btn.classList.remove("warn-state");
        setCloseButtonLabel(btn, "סגירת שולחן ורישום לרקורד");
      }, 5000);
      return;
    }
    finishCloseTable();
  });

  const closeTableBtn = document.getElementById("closeTableBtn");
  closeTableBtn.addEventListener("pointerdown", beginCloseHold);
  closeTableBtn.addEventListener("pointerup", endCloseHold);
  closeTableBtn.addEventListener("pointercancel", endCloseHold);
  closeTableBtn.addEventListener("lostpointercapture", endCloseHold);
  const finishGameBtn = document.getElementById("finishGameBtn");
  finishGameBtn.addEventListener("pointerdown", beginFinishGameHold);
  finishGameBtn.addEventListener("pointerup", endFinishGameHold);
  finishGameBtn.addEventListener("pointercancel", endFinishGameHold);
  finishGameBtn.addEventListener("lostpointercapture", endFinishGameHold);
  document.getElementById("returnToGameBtn").addEventListener("click", returnToGameEdit);
  document.getElementById("forceCloseCancel").addEventListener("click", () => {
    forceCloseArmed = false;
    renderDerived();
  });
  document.getElementById("forceCloseConfirmBtn").addEventListener("click", () => {
    if (totals().diff === 0) { forceCloseArmed = false; renderDerived(); return; }
    finishCloseTable();
  });

  // ---------- auth (Supabase session) ----------
  // Phase 1 wires identity only: a real session, a `profiles` row, and `me` fed from it. No game
  // data moves to the server yet — save()/initSync()/remoteBody() are untouched, and nothing here
  // invents a `userId` on a participant ref (that is phase 2).
  let authUser = null;          // null | { id, email, displayName }
  let authAppliedUserId = null; // last session already turned into a profile — avoids double upserts
  let authEmailPending = "";    // address a code was sent to; "" while the email step is showing
  let authRedirectError = "";   // an error the OAuth redirect came back with, shown on the login screen

  function emailLocalPart(email) {
    const at = typeof email === "string" ? email.indexOf("@") : -1;
    return at > 0 ? email.slice(0, at) : "";
  }

  // profiles.display_name is NOT NULL, 1..40 chars. An existing row wins (the person may have
  // renamed themselves), then the local name this device already plays under, then what the
  // provider knows, then the email local part.
  function preferredDisplayName(user, existingName) {
    const meta = (user && user.user_metadata) || {};
    const candidates = [existingName, me, meta.full_name, meta.name, emailLocalPart(user && user.email)];
    for (const candidate of candidates) {
      const name = typeof candidate === "string" ? candidate.trim() : "";
      if (name) return name.slice(0, 40);
    }
    return "שחקן";
  }

  async function ensureProfile(user) {
    if (!supabase || !user) return null;
    let existingName = "";
    try {
      const { data } = await supabase.from("profiles").select("display_name").eq("id", user.id).maybeSingle();
      existingName = (data && data.display_name) || "";
    } catch (e) {}
    const displayName = preferredDisplayName(user, existingName);
    // Exactly the profiles columns this user is allowed to write (profiles_insert_self /
    // profiles_update_self): the row id must equal the auth user id.
    const row = { id: user.id, display_name: displayName, email: user.email || null };
    try { await supabase.from("profiles").upsert(row, { onConflict: "id" }); } catch (e) {}
    return { id: user.id, email: user.email || "", displayName };
  }

  async function applySession(session) {
    const user = session && session.user;
    if (!user) {
      if (!authUser && authAppliedUserId === null) return; // no session before, no session now
      authUser = null;
      authAppliedUserId = null;
      exitCloudMode(); // local records stay put; we simply stop pushing them
      render(); // `me` deliberately stays: local play continues after a sign-out
      return;
    }
    if (authAppliedUserId === user.id) return; // token refresh / repeated event — nothing to do
    authAppliedUserId = user.id;
    const profile = await ensureProfile(user);
    authUser = profile || { id: user.id, email: user.email || "", displayName: me || "" };
    if (authUser.displayName && authUser.displayName !== me) { me = authUser.displayName; saveMe(); }
    stripAuthParamsFromUrl();
    document.getElementById("login").hidden = true;
    render();
    enterCloudMode(); // phase 2a: groups/members/invites/friendships now live on the server
  }

  function initAuth() {
    if (!supabase) return;
    supabase.auth.getSession().then(({ data }) => applySession(data && data.session)).catch(() => {});
    supabase.auth.onAuthStateChange((event, session) => { applySession(session); });
  }

  function signOutAccount() {
    if (!supabase || !authUser) return;
    authUser = null;
    authAppliedUserId = null;
    exitCloudMode(); // applySession(null) short-circuits after this, so stop the pushes here
    supabase.auth.signOut().catch(() => {});
  }

  // A provider redirect comes back with ?code= (PKCE) or #access_token=; supabase-js consumes it
  // through detectSessionInUrl. We only tidy the address bar afterwards — and ?join= survives,
  // because the join notice below reads it from the same URL.
  function readAuthRedirectError() {
    const search = new URLSearchParams(location.search);
    const hash = new URLSearchParams((location.hash || "").replace(/^#/, ""));
    return search.get("error_description") || hash.get("error_description") ||
           search.get("error") || hash.get("error") || "";
  }
  function stripAuthParamsFromUrl() {
    const params = new URLSearchParams(location.search);
    let touched = /(access_token|refresh_token|error_description)=/.test(location.hash || "");
    ["code", "state", "error", "error_code", "error_description"].forEach(k => {
      if (params.has(k)) { params.delete(k); touched = true; }
    });
    if (!touched) return;
    const qs = params.toString();
    history.replaceState(null, "", location.pathname + (qs ? "?" + qs : ""));
  }

  function setAuthError(id, message) {
    const line = document.getElementById(id);
    if (!line) return;
    line.textContent = message || "";
    line.hidden = !message;
  }
  function setAuthBusy(id, busy, busyLabel, idleLabel) {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.disabled = !!busy;
    btn.textContent = busy ? busyLabel : idleLabel;
  }
  function setGoogleBusy(busy) {
    const btn = document.getElementById("authGoogleBtn");
    btn.disabled = !!busy;
    document.getElementById("authGoogleLabel").textContent = busy ? "מעביר…" : "המשך עם Google";
  }
  function setAuthStep(step) {
    const emailStep = document.getElementById("authEmailStep");
    const codeStep = document.getElementById("authCodeStep");
    emailStep.hidden = step !== "email";
    codeStep.hidden = step === "email";
    const shown = step === "email" ? emailStep : codeStep;
    shown.classList.remove("auth-step-in");
    void shown.offsetWidth; // restart the panel entrance
    shown.classList.add("auth-step-in");
    if (step !== "email") document.getElementById("authCodeSent").textContent = "שלחנו קוד ל־" + authEmailPending;
  }
  // The CDN script is deferred, so the account block may only become available after first paint.
  function refreshAuthBlock() {
    document.getElementById("authBlock").hidden = !supabase;
    document.getElementById("authOffline").hidden = !!supabase;
    document.getElementById("authLocal").classList.toggle("auth-local-only", !supabase);
  }

  async function signInWithGoogle() {
    if (!supabase) return;
    setAuthError("authGoogleError", "");
    setGoogleBusy(true);
    try {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: location.origin + location.pathname },
      });
      if (error) throw error;
    } catch (e) {
      setGoogleBusy(false);
      setAuthError("authGoogleError", "לא הצלחנו להתחבר עם Google");
    }
  }

  async function sendEmailCode() {
    if (!supabase) return;
    const input = document.getElementById("authEmail");
    const email = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setAuthError("authEmailError", "כתובת מייל לא תקינה");
      shakeEl(input);
      return;
    }
    setAuthError("authEmailError", "");
    setAuthBusy("authEmailBtn", true, "שולח…", "שלחו לי קוד");
    try {
      const { error } = await supabase.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
      if (error) throw error;
      authEmailPending = email;
      document.getElementById("authCode").value = "";
      setAuthStep("code");
      document.getElementById("authCode").focus();
    } catch (e) {
      setAuthError("authEmailError", "לא הצלחנו לשלוח מייל");
    }
    setAuthBusy("authEmailBtn", false, "שולח…", "שלחו לי קוד");
  }

  async function verifyEmailCode() {
    if (!supabase) return;
    const input = document.getElementById("authCode");
    const token = input.value.replace(/\D/g, "");
    if (token.length !== 6) {
      setAuthError("authCodeError", "הקוד לא נכון");
      shakeEl(input);
      return;
    }
    setAuthError("authCodeError", "");
    setAuthBusy("authCodeBtn", true, "בודק…", "אישור");
    try {
      const { error } = await supabase.auth.verifyOtp({ email: authEmailPending, token, type: "email" });
      if (error) throw error;
      authEmailPending = "";
    } catch (e) {
      setAuthError("authCodeError", "הקוד לא נכון");
    }
    setAuthBusy("authCodeBtn", false, "בודק…", "אישור");
  }

  document.getElementById("authGoogleBtn").addEventListener("click", signInWithGoogle);
  document.getElementById("authEmailBtn").addEventListener("click", sendEmailCode);
  document.getElementById("authEmail").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); sendEmailCode(); }
  });
  document.getElementById("authCodeBtn").addEventListener("click", verifyEmailCode);
  document.getElementById("authCode").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); verifyEmailCode(); }
  });
  document.getElementById("authCodeBackBtn").addEventListener("click", () => {
    authEmailPending = "";
    setAuthError("authCodeError", "");
    setAuthStep("email");
  });

  // ---------- login (who are you — asked once per device, on first open) ----------
  function showLogin() {
    const box = document.getElementById("login");
    box.hidden = false;
    refreshAuthBlock();
    setAuthStep(authEmailPending ? "code" : "email");
    setAuthError("authGoogleError", authRedirectError);
    authRedirectError = ""; // shown once — a later visit to this screen starts clean
    setAuthError("authEmailError", "");
    setAuthError("authCodeError", "");
    const chips = document.getElementById("loginChips");
    chips.innerHTML = "";
    knownNames().forEach(n => {
      const chip = el("button", "chip", n);
      chip.type = "button";
      chip.addEventListener("click", () => {
        me = n; saveMe();
        box.hidden = true;
        render();
      });
      chips.appendChild(chip);
    });
  }
  function confirmLogin() {
    const inp = document.getElementById("loginName");
    const name = inp.value.trim();
    if (!name) { shakeEl(inp); return; }
    me = name; saveMe();
    inp.value = "";
    document.getElementById("login").hidden = true;
    render();
  }
  document.getElementById("loginGo").addEventListener("click", confirmLogin);
  document.getElementById("loginName").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); confirmLogin(); }
  });
  document.getElementById("loginSkip").addEventListener("click", () => {
    document.getElementById("login").hidden = true;
  });

  // ---------- profile ----------
  function knownNames() {
    const names = [];
    state.history.forEach(g => {
      if (!Array.isArray(g.players)) return; // malformed/legacy history entry — skip, don't throw
      g.players.forEach(p => { if (!names.includes(p.name)) names.push(p.name); });
    });
    state.players.forEach(p => { if (!state.example && !names.includes(p.name)) names.push(p.name); });
    return names;
  }

  function debtDateLabel(debt) {
    const date = new Date(debt.gameDate || debt.createdAt);
    if (Number.isNaN(date.getTime())) return "תאריך לא ידוע";
    return date.toLocaleDateString("he-IL", { day: "numeric", month: "short" });
  }

  function markDebtPaid(debtId) {
    if (!updateDebtAsPaid(state.debts, debtId, me, new Date().toISOString())) return;
    save();
    render();
  }

  function renderDebtGroup(parent, title, debts, creditorView, showTitle = true) {
    const group = el("div", "debt-group");
    if (showTitle) group.appendChild(el("h3", "", title));
    if (debts.length === 0) {
      group.appendChild(el("p", "empty-note", "אין חובות פתוחות"));
      parent.appendChild(group);
      return;
    }
    debts.forEach(debt => {
      const row = el("div", "debt-row");
      const copy = el("div", "debt-copy");
      copy.appendChild(el("span", "debt-person", creditorView ? debt.debtorName : debt.creditorName));
      copy.appendChild(el("span", "debt-meta", debtDateLabel(debt) + " · ממתין לתשלום"));
      row.appendChild(copy);
      // D4: the amount alone says which way the debt runs — turquoise when it is coming to me,
      // red when I owe it — so the row reads without leaning on the selected tab.
      row.appendChild(el("span", "debt-amount" + (creditorView ? " pos" : " neg"), fmt(debt.amount)));
      if (creditorView) {
        const paid = el("button", "debt-paid-btn", "שולם");
        paid.type = "button";
        paid.addEventListener("click", () => markDebtPaid(debt.id));
        row.appendChild(paid);
      }
      group.appendChild(row);
    });
    parent.appendChild(group);
  }

  // Flat .debt-row-style rows for one friends list (friends / incoming / outgoing). No action
  // buttons in this phase: createFriendRequest/respondToFriendRequest exist and are tested for
  // the backend, but nothing in the UI may call them yet (no fake local friendships).
  function renderFriendGroup(parent, title, refs, metaLabel) {
    const group = el("div", "debt-group");
    group.appendChild(el("h3", "", title));
    refs.forEach((ref, i) => {
      const row = el("div", "debt-row");
      row.style.animationDelay = (i * 45) + "ms";
      const copy = el("div", "debt-copy");
      copy.appendChild(el("span", "debt-person", ref.displayName));
      if (metaLabel) copy.appendChild(el("span", "debt-meta", metaLabel));
      row.appendChild(copy);
      group.appendChild(row);
    });
    parent.appendChild(group);
  }

  function renderFriendsPage() {
    const box = document.getElementById("friendsPage");
    box.hidden = appView !== "friends";
    if (appView !== "friends") return;
    box.innerHTML = "";

    const friendsSec = el("section", "psection debt-section");
    friendsSec.style.animationDelay = ".03s";
    const friendData = me
      ? friendRequestsFor(state.friendships || [], {
          userId: null,
          guestId: resolveGuestId(collectionsOf(state), me),
          displayName: me,
        })
      : { friends: [], incoming: [], outgoing: [] };
    const hasFriendData = friendData.friends.length || friendData.incoming.length || friendData.outgoing.length;
    if (!hasFriendData) {
      friendsSec.appendChild(el("p", "empty-note", "עוד אין חברים"));
    } else {
      renderFriendGroup(friendsSec, "חברים", friendData.friends, "");
      renderFriendGroup(friendsSec, "בקשות שהתקבלו", friendData.incoming.map(f => f.requester), "ממתין לאישור שלך");
      renderFriendGroup(friendsSec, "בקשות שנשלחו", friendData.outgoing.map(f => f.addressee), "ממתין לאישור");
    }
    const addFriendBtn = el("button", "btn-primary", "הוסף חבר");
    addFriendBtn.type = "button";
    addFriendBtn.disabled = true;
    addFriendBtn.setAttribute("aria-disabled", "true");
    addFriendBtn.style.marginTop = "14px";
    friendsSec.appendChild(addFriendBtn);
    friendsSec.appendChild(el("p", "friend-helper", SERVER_NOTE));
    box.appendChild(friendsSec);
  }

  function renderProfile() {
    const box = document.getElementById("profile");
    box.hidden = appView !== "profile";
    if (appView !== "profile") return;
    box.innerHTML = "";
    if (profileTab !== "balance" && profileTab !== "debts") profileTab = "balance";

    if (!me) {
      const sec = el("section", "psection");
      sec.appendChild(el("h2", "ptitle", "פרופיל"));
      sec.appendChild(el("p", "empty-note", "עוד לא בחרת שם, ולכן אין רקורד אישי לשמור."));
      const connect = el("button", "btn-primary", "בחירת שם");
      connect.type = "button";
      connect.style.marginTop = "14px";
      connect.addEventListener("click", () => showLogin());
      sec.appendChild(connect);
      box.appendChild(sec);
      return;
    }

    const games = state.history
      .map(g => ({ at: g.at, players: g.players, mine: g.players.find(p => p.name === me) }))
      .filter(g => g.mine);
    const total = sum(games.map(g => g.mine.net));
    const wins = games.filter(g => g.mine.net > 0.005).length;
    const best = games.length ? Math.max(...games.map(g => g.mine.net)) : 0;
    const worst = games.length ? Math.min(...games.map(g => g.mine.net)) : 0;
    const openDebts = (state.debts || []).filter(debt => debt.status === "open");
    if (profileTab === "debts") markProfileDebtsSeenForUser(openDebts, me);
    const hasNewProfileDebts = hasUnseenProfileDebt(openDebts, me, loadProfileDebtSeen(me));

    // identity
    const idSec = el("section", "psection pid");
    const idName = el("div", "pname-big", me);
    idSec.appendChild(idName);
    const tabs = el("div", "profile-tabs");
    tabs.setAttribute("role", "tablist");
    [
      ["balance", "מאזן"],
      ["debts", "חובות"],
    ].forEach(([key, label]) => {
      const tab = el("button", "profile-tab" + (profileTab === key ? " active" : ""), label);
      tab.type = "button";
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-selected", String(profileTab === key));
      if (key === "debts" && hasNewProfileDebts) {
        const badge = el("span", "profile-tab-badge");
        badge.title = "חובות חדשים";
        badge.setAttribute("aria-label", "חובות חדשים");
        tab.appendChild(badge);
      }
      tab.addEventListener("click", () => {
        if (profileTab === key) return;
        profileTab = key;
        if (key === "debts") markProfileDebtsSeenForUser(openDebts, me);
        renderProfile();
      });
      tabs.appendChild(tab);
    });
    idSec.appendChild(tabs);
    box.appendChild(idSec);

    const debtSec = el("section", "psection debt-section");
    debtSec.style.animationDelay = ".03s";
    debtSec.hidden = profileTab !== "debts";
    // Row 12: no "חובות"/"חברים" section title here — the selected tab above already says it.
    const debtTabs = el("div", "debt-tabs");
    debtTabs.setAttribute("role", "tablist");
    const debtTabOptions = [
      ["owed", "אני חייב", openDebts.filter(debt => debt.debtorName === me), false],
      ["owedToMe", "חייבים לי", openDebts.filter(debt => debt.creditorName === me), true],
    ];
    debtTabOptions.forEach(([key, label]) => {
      const tab = el("button", "debt-tab" + (debtTab === key ? " active" : ""), label);
      tab.type = "button";
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-selected", String(debtTab === key));
      tab.addEventListener("click", () => {
        if (debtTab === key) return;
        debtTab = key;
        renderProfile();
      });
      debtTabs.appendChild(tab);
    });
    debtSec.appendChild(debtTabs);
    const selectedDebtTab = debtTabOptions.find(([key]) => key === debtTab) || debtTabOptions[0];
    const debtPane = el("div", "debt-pane");
    renderDebtGroup(debtPane, selectedDebtTab[1], selectedDebtTab[2], selectedDebtTab[3], false);
    debtSec.appendChild(debtPane);
    box.appendChild(debtSec);

    // total balance
    const balSec = el("section", "psection");
    balSec.style.animationDelay = ".06s";
    balSec.hidden = profileTab !== "balance";
    balSec.appendChild(el("h2", "ptitle", "מאזן כולל"));
    const big = el("div", "bignum " + (total > 0.005 ? "pos" : total < -0.005 ? "neg" : "zero"), fmtSigned(total));
    balSec.appendChild(big);
    const grid = el("div", "pgrid");
    // Row 10: the best/worst night carry the same pos/neg/zero colouring as the same numbers
    // in the list below them; counts stay neutral (no tone).
    const tone = (n) => n > 0.005 ? " pos" : n < -0.005 ? " neg" : " zero";
    [
      ["ערבים ששוחקו", String(games.length), ""],
      ["ערבים ברווח", String(wins), ""],
      ["הערב הטוב ביותר", fmtSigned(best), tone(best)],
      ["הערב הגרוע ביותר", fmtSigned(worst), tone(worst)],
    ].forEach(([lab, val, cls]) => {
      const cell = el("div", "pcell");
      cell.appendChild(el("span", "plab", lab));
      cell.appendChild(el("span", "pval" + cls, val));
      grid.appendChild(cell);
    });
    balSec.appendChild(grid);
    box.appendChild(balSec);

    // recent nights
    const histSec = el("section", "psection");
    histSec.style.animationDelay = ".12s";
    histSec.hidden = profileTab !== "balance";
    histSec.appendChild(el("h2", "ptitle", "ערבים אחרונים"));
    if (games.length === 0) {
      histSec.appendChild(el("p", "empty-note", "עוד אין ערבים ברקורד. אחרי סגירת שולחן הערב יופיע כאן."));
    } else {
      games.slice(0, 12).forEach((g, i) => {
        const row = el("div", "hgame");
        row.style.animationDelay = (i * 40) + "ms";
        const d = new Date(g.at);
        row.appendChild(el("span", "hdate", d.toLocaleDateString("he-IL", { day: "numeric", month: "short" })));
        row.appendChild(el("span", "hplayers", formatPlayerCount(g.players.length)));
        const net = el("span", "hnet " + (g.mine.net > 0.005 ? "pos" : g.mine.net < -0.005 ? "neg" : "zero"), fmtSigned(g.mine.net));
        row.appendChild(net);
        histSec.appendChild(row);
      });
    }
    box.appendChild(histSec);
  }

  // Shared tail of "add a player to the open table": builds the Player, gives it its first
  // buy-in, clears any buy-in-menu draft, and saves/re-renders. Used by both addPlayer() (typed name)
  // and the group member chips in renderAddRowChips() (tapped member, memberId/guestId known).
  function addPlayerToTable(name, opts) {
    const o = opts || {};
    const player = createPlayer({ name, guestId: o.guestId || null, memberId: o.memberId || null });
    addEntry(player, MIN_BUYIN);
    state.players.push(player);
    state.phase = "active";
    appView = "game";
    openMenu = null;
    customOpen = null;
    pendingAmount = null;
    animNext = "one"; animName = name;
    save(); render();
    return player;
  }

  function addPlayer() {
    const inp = document.getElementById("newName");
    const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    markReal();
    if (state.players.some(x => x.name === name)) {
      shakeEl(inp); // duplicate names would merge menus, records and transfers
      return;
    }
    // Every player gets the stable per-person guestId this device already uses for that name --
    // an ad-hoc table too, because game_participants_identity_chk needs an identity per row and a
    // player with neither profile nor guest simply cannot be stored.
    const guestId = resolveGuestId(collectionsOf(state), name);
    let memberId = null;
    if (state.groupId) {
      const member = activeMembers(state.groupMembers, state.groupId).find(m => m.displayName === name);
      memberId = member ? member.id : null;
    }
    inp.value = "";
    addPlayerToTable(name, { guestId, memberId });
  }
  document.getElementById("addBtn").addEventListener("click", addPlayer);
  document.getElementById("newName").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addPlayer(); }
  });

  document.getElementById("modeGames").addEventListener("click", () => setAppView("games"));
  document.getElementById("modeFriends").addEventListener("click", () => setAppView("friends"));
  document.getElementById("modeProfile").addEventListener("click", () => setAppView("profile"));

  // confirm() is blocked in the artifact sandbox; the two-step arm/confirm
  // pattern works everywhere, so it is the deliberate choice on all builds.
  let resetArmed = null;
  document.getElementById("resetBtn").addEventListener("click", (e) => {
    const btn = e.currentTarget;
    const label = document.getElementById("resetLabel");
    if (!resetArmed) {
      btn.classList.add("danger-armed");
      label.textContent = "בטוח?";
      resetArmed = setTimeout(() => {
        resetArmed = null;
        btn.classList.remove("danger-armed");
        label.textContent = "איפוס";
      }, 4000);
      return;
    }
    clearTimeout(resetArmed);
    resetArmed = null;
    btn.classList.remove("danger-armed");
    label.textContent = "איפוס";
    state = newCurrentGame(state, { phase: "closed" });
    expandedEntries.clear();
    openMenu = null; customOpen = null;
    save();
    setAppView("games");
  });

  // ---------- group settings overlay: UI-only state ----------
  let groupLeaveArmed = false;         // "עזוב קבוצה" two-step confirm state
  let groupLeaveArmedTimeout = null;
  let groupDeleteArmed = false;        // "מחק קבוצה" two-step confirm state
  let groupDeleteArmedTimeout = null;
  let archivedGroupsOpen = false;      // dashboard "ארכיון (N)" collapsed toggle
  let archivedGroupsJustOpened = false; // list should animate open on the next render

  // ---------- group settings overlay ----------
  // Reachable by any active member (so "עזוב קבוצה" always has a way in); admin-only controls
  // (avatar, name, archive/unarchive, delete) are shown/hidden per-open by refreshGroupSettings().
  function resetGroupLeaveArm() {
    clearTimeout(groupLeaveArmedTimeout);
    groupLeaveArmed = false;
    groupLeaveArmedTimeout = null;
    const btn = document.getElementById("groupSetLeaveBtn");
    if (btn) { btn.textContent = "עזוב קבוצה"; btn.classList.remove("armed"); }
  }
  function resetGroupDeleteArm() {
    clearTimeout(groupDeleteArmedTimeout);
    groupDeleteArmed = false;
    groupDeleteArmedTimeout = null;
    const btn = document.getElementById("groupSetDeleteBtn");
    if (btn) { btn.textContent = "מחק קבוצה"; btn.classList.remove("armed"); }
  }
  function closeGroupSettings() {
    document.getElementById("groupSettings").hidden = true;
  }
  function refreshGroupSettings() {
    const group = (state.groups || []).find(g => g && g.id === currentGroupId);
    const summary = getGroupSummary(collectionsOf(state), currentGroupId, me);
    if (!group || !summary) { closeGroupSettings(); return; }
    resetGroupLeaveArm();
    resetGroupDeleteArm();

    // D1: the invite block (every active member) and the add-member panel (admins only) are
    // rebuilt here, above the name/avatar and management actions, from the same renderers the
    // group page used to call.
    const inviteBox = document.getElementById("groupSetInvite");
    inviteBox.innerHTML = "";
    const inviteSection = renderGroupInvite(summary, activeInvite(state.invites, currentGroupId), summary.isAdmin);
    if (inviteSection) inviteBox.appendChild(inviteSection);
    inviteBox.hidden = !inviteSection;

    const addMemberBox = document.getElementById("groupSetAddMember");
    addMemberBox.innerHTML = "";
    addMemberBox.hidden = !summary.isAdmin;
    if (summary.isAdmin) addMemberBox.appendChild(renderAddMemberPanel());

    const avatarBtn = document.getElementById("groupSetAvatarBtn");
    avatarBtn.innerHTML = "";
    if (group.avatarDataUrl) {
      const img = document.createElement("img");
      img.src = group.avatarDataUrl;
      img.alt = "";
      avatarBtn.appendChild(img);
    } else {
      avatarBtn.textContent = String(group.name || "?").slice(0, 1);
    }
    avatarBtn.disabled = !summary.isAdmin;

    const nameInput = document.getElementById("groupSetName");
    nameInput.value = group.name || "";
    nameInput.disabled = !summary.isAdmin;

    const archiveBtn = document.getElementById("groupSetArchiveBtn");
    archiveBtn.hidden = !summary.isAdmin;
    archiveBtn.textContent = group.archivedAt ? "שחזר מהארכיון" : "העבר לארכיון";
    // Archiving is blocked while the group has an open game (same rule as delete); restoring
    // from the archive is always allowed.
    const archiveBlocked = !group.archivedAt && summary.hasActiveGame;
    archiveBtn.disabled = archiveBlocked;
    const archiveReason = document.getElementById("groupSetArchiveReason");
    archiveReason.hidden = !archiveBlocked;
    archiveReason.textContent = archiveBlocked ? "סגור קודם את המשחק הפעיל" : "";

    const deleteBtn = document.getElementById("groupSetDeleteBtn");
    deleteBtn.hidden = !summary.isAdmin;
    deleteBtn.disabled = summary.hasActiveGame;
    const deleteReason = document.getElementById("groupSetDeleteReason");
    deleteReason.hidden = !summary.hasActiveGame;
    deleteReason.textContent = summary.hasActiveGame ? "סגור קודם את המשחק הפעיל" : "";

    const membership = findMyMembership(state.groupMembers, currentGroupId, me);
    const isLastAdmin = !!membership && isLastActiveAdmin(state.groupMembers, membership.id);
    const leaveBtn = document.getElementById("groupSetLeaveBtn");
    leaveBtn.hidden = !membership;
    leaveBtn.disabled = isLastAdmin;
    const leaveReason = document.getElementById("groupSetLeaveReason");
    leaveReason.hidden = !isLastAdmin;
    leaveReason.textContent = isLastAdmin ? "העבר ניהול לחבר אחר קודם" : "";
  }
  function openGroupSettings() {
    refreshGroupSettings();
    document.getElementById("groupSettings").hidden = false;
  }
  document.getElementById("groupSetBackBtn").addEventListener("click", closeGroupSettings);
  document.getElementById("groupSetName").addEventListener("change", (e) => {
    if (!renameGroup(state.groups, currentGroupId, e.target.value)) { shakeEl(e.target); refreshGroupSettings(); return; }
    save();
    renderGroupPage();
    refreshGroupSettings();
  });
  document.getElementById("groupSetAvatarBtn").addEventListener("click", () => {
    const summary = getGroupSummary(collectionsOf(state), currentGroupId, me);
    if (!summary || !summary.isAdmin) return;
    document.getElementById("groupSetAvatarFile").click();
  });
  document.getElementById("groupSetAvatarFile").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const dataUrl = await resizeAvatarImage(file);
      setGroupAvatar(state.groups, currentGroupId, dataUrl);
      save();
      renderGroupPage();
      refreshGroupSettings();
    } catch (err) {}
  });
  document.getElementById("groupSetArchiveBtn").addEventListener("click", () => {
    const group = (state.groups || []).find(g => g && g.id === currentGroupId);
    if (!group) return;
    const wasArchived = !!group.archivedAt;
    const summary = getGroupSummary(collectionsOf(state), currentGroupId, me);
    if (!wasArchived && summary && summary.hasActiveGame) return; // refused — inline reason already shown
    const ok = wasArchived ? unarchiveGroup(state.groups, currentGroupId) : archiveGroup(state.groups, currentGroupId, new Date().toISOString());
    if (!ok) return;
    save();
    closeGroupSettings();
    if (wasArchived) renderGroupPage(); else setAppView("games");
  });
  document.getElementById("groupSetDeleteBtn").addEventListener("click", (e) => {
    const summary = getGroupSummary(collectionsOf(state), currentGroupId, me);
    if (!summary || summary.hasActiveGame) return; // refused — inline reason already shown
    const btn = e.currentTarget;
    if (!groupDeleteArmed) {
      groupDeleteArmed = true;
      btn.textContent = "בטוח? ההיסטוריה הקבוצתית תוסתר";
      btn.classList.add("armed");
      groupDeleteArmedTimeout = setTimeout(resetGroupDeleteArm, 4000);
      return;
    }
    resetGroupDeleteArm();
    // Refused only when the group is gone/already deleted: close the overlay and let the page
    // bounce to the dashboard instead of leaving the tap a silent no-op.
    if (!deleteGroup(state.groups, currentGroupId, new Date().toISOString())) { closeGroupSettings(); renderGroupPage(); return; }
    save();
    closeGroupSettings();
    setAppView("games");
  });
  document.getElementById("groupSetLeaveBtn").addEventListener("click", (e) => {
    const membership = findMyMembership(state.groupMembers, currentGroupId, me);
    if (!membership || isLastActiveAdmin(state.groupMembers, membership.id)) return; // refused — inline reason already shown
    const btn = e.currentTarget;
    if (!groupLeaveArmed) {
      groupLeaveArmed = true;
      btn.textContent = "בטוח?";
      btn.classList.add("armed");
      groupLeaveArmedTimeout = setTimeout(resetGroupLeaveArm, 4000);
      return;
    }
    resetGroupLeaveArm();
    if (!leaveGroup(state.groupMembers, currentGroupId, me, new Date().toISOString())) return;
    save();
    closeGroupSettings();
    setAppView("games");
  });

  // ---------- settings overlay ----------
  function loadContact() {
    try { return JSON.parse(localStorage.getItem(CONTACT_KEY)) || {}; } catch (e) { return {}; }
  }
  function refreshSettings() {
    document.getElementById("setAvatar").textContent = me ? me.trim()[0] : "?";
    document.getElementById("setName").textContent = me || "אורח";
    // The signed-in address sits under the name so "התנתקות" below is unambiguous about what
    // it disconnects. Local-only play shows nothing here.
    const account = document.getElementById("setAccount");
    account.textContent = (authUser && authUser.email) || "";
    account.hidden = !account.textContent;
    // No session but a client is reachable: offer a way back in without wiping the local name/
    // history, and relabel the button below — it now swaps the local name, not a real sign-out.
    const canSignIn = !authUser && !!supabase;
    document.getElementById("setSignInNote").hidden = !canSignIn;
    document.getElementById("setSignInBtn").hidden = !canSignIn;
    document.getElementById("setSwapBtn").textContent = canSignIn ? "החלף שם" : "התנתקות";
    const c = loadContact();
    document.getElementById("setPhone").value = c.phone || "";
    document.getElementById("setEmail").value = c.email || "";
    const isLight = document.documentElement.dataset.theme === "light";
    const sw = document.getElementById("setThemeSwitch");
    sw.classList.toggle("on", isLight);
    sw.setAttribute("aria-checked", isLight ? "true" : "false");
  }
  function saveContact() {
    try {
      localStorage.setItem(CONTACT_KEY, JSON.stringify({
        phone: document.getElementById("setPhone").value.trim(),
        email: document.getElementById("setEmail").value.trim(),
      }));
    } catch (e) {}
  }
  document.getElementById("setPhone").addEventListener("change", saveContact);
  document.getElementById("setEmail").addEventListener("change", saveContact);
  document.getElementById("settingsBtn").addEventListener("click", () => {
    refreshSettings();
    document.getElementById("settings").hidden = false;
  });
  document.getElementById("setBackBtn").addEventListener("click", () => {
    document.getElementById("settings").hidden = true;
  });
  document.getElementById("setThemeSwitch").addEventListener("click", () => {
