<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סוגרים קופה">
<title>סוגרים קופה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap">
<style>
  :root {
    --bg: #05070A;
    --text: #EAF4F4;
    --dim: #64707A;
    --faint: #39434C;
    --line: rgba(234,244,244,.09);
    --accent: #35E0DC;
    --accent-press: #8FF0EC;
    --bad: #FF6D6D;
    --bad-press: #FF8A8A;
    --close-hold-fill: #EAF4F4;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #F5F8F9;
    --text: #0C1519;
    --dim: #5A6870;
    --faint: #9AA8AE;
    --line: rgba(12,21,25,.12);
    --accent: #089E98;
    --accent-press: #0CC2BB;
    --bad: #D4403E;
    --bad-press: #B92F2C;
    --close-hold-fill: #05070A;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  input, button, select, textarea { color-scheme: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Heebo", "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    direction: rtl;
    transition: background-color .3s, color .3s;
  }
  .wrap {
    max-width: 520px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(110px + env(safe-area-inset-bottom, 0px));
  }

  /* ---------- header ---------- */
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: .06em; color: var(--dim); font-weight: 400;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background .4s, box-shadow .4s; }
  .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 14px var(--accent); opacity: .7; } }
  h1 {
    font-weight: 800; font-size: clamp(26px, 7vw, 34px); letter-spacing: -0.02em;
    margin: 14px 0 0; line-height: 1.05; color: var(--text);
  }
  h1 em { font-style: normal; color: inherit; }

  /* ---------- shared controls ---------- */
  button {
    font: inherit; cursor: pointer; background: none; border: none; color: var(--text);
    padding: 0; touch-action: manipulation;
    transition: transform .12s ease, color .18s ease, border-color .18s ease,
                background-color .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  button:active { transform: scale(.92); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  input[type="text"], input[type="number"], input[type="tel"], input[type="email"] {
    -webkit-appearance: none; appearance: none;
    background: none; border: none; border-bottom: 1px solid var(--line);
    border-radius: 0; color: var(--text);
    font: inherit; font-variant-numeric: tabular-nums;
    padding: 8px 2px; min-height: 42px; width: 100%;
    transition: border-color .2s;
  }
  input:focus-visible { outline: none; border-bottom-color: var(--accent); }
  input::placeholder { color: var(--faint); }
  input[type=number]::-webkit-inner-spin-button { display: none; }

  /* ---------- add row ---------- */
  .addrow { display: flex; align-items: flex-end; gap: 14px; margin: 18px 0 2px; flex-wrap: wrap; }
  .addrow input { flex: 1; font-size: 17px; }
  /* group member chips above the name input (Task 9) — forced onto their own line inside the
     wrapping .addrow flex row; chip entrance stagger reuses .chip + .anim (see .addrow above). */
  #addrowChips { flex-basis: 100%; margin-top: 0; }
  .btn-add {
    color: var(--accent); font-weight: 700; font-size: 15px;
    padding: 8px 2px 10px; white-space: nowrap; letter-spacing: .02em;
  }
  .btn-add:hover { color: var(--accent-press); }

  /* ---------- floating bottom tab bar ---------- */
  :root { --bar-bg: rgba(13,17,22,.78); }
  :root[data-theme="light"] { --bar-bg: rgba(245,248,249,.9); }
  html { background: var(--bg); }
  .tabbar {
    position: fixed; bottom: 10px; inset-inline: 17px; margin-inline: auto;
    max-width: 470px; z-index: 20;
    background: var(--bar-bg);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
    transition: transform .25s ease, opacity .25s ease;
  }
  :root[data-theme="light"] .tabbar { box-shadow: 0 8px 24px rgba(12,21,25,.14); }
  .tabbar.kb-open { transform: translateY(120px); opacity: 0; pointer-events: none; }
  .tabbar-in {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    width: 100%;
  }
  .tab {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--dim); font-size: 14px; font-weight: 700;
    border-radius: 999px; padding: 10px; min-height: 44px;
    transition: background-color .25s ease, color .25s ease, flex-grow .25s ease, transform .12s ease;
  }
  .tab svg { width: 22px; height: 22px; flex: 0 0 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab .tlabel {
    max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap;
    transition: max-width .3s ease, opacity .22s ease;
  }
  .tab.on {
    flex-grow: 1.7;
    background: var(--accent); color: var(--bg);
  }
  .tab.on .tlabel { max-width: 90px; opacity: 1; }
  .tab:active { transform: scale(.94); }

  /* ---------- player rows ---------- */
  .prow { border-bottom: 1px solid var(--line); }
  .anim { animation: rise .38s ease both; }
  .load-in { animation: rise .5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  /* small fade-in for feedback text/tags that appear in place (no movement) */
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes shake {
    20%, 60% { transform: translateX(5px); }
    40%, 80% { transform: translateX(-5px); }
  }
  .shake { animation: shake .35s ease; }
  .prow-line { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 56px; }
  .pname { font-weight: 700; font-size: 17px; flex: 1; min-width: 72px; overflow-wrap: anywhere; }
  .pmeta { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 300; }
  .pmeta b { color: var(--text); font-weight: 500; display: inline-block; }
  .pmeta b.pulse { animation: pulseVal .55s ease; }
  @keyframes pulseVal { 30% { color: var(--accent); transform: scale(1.18); } }

  .btn-plus {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); color: var(--dim);
    font-size: 21px; line-height: 1; font-weight: 400;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s ease, background-color .18s, color .18s, border-color .18s;
  }
  /* Row 30: the circle stays 38px, the touch area is 44px. */
  .btn-plus { position: relative; }
  .btn-plus::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; }
  .btn-plus:hover { border-color: var(--accent); color: var(--accent); }
  .btn-plus.open { transform: rotate(45deg); background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn-plus.open:active { transform: rotate(45deg) scale(.92); }

  /* expanding buy-in menu */
  .pmenu { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
  .pmenu.open { grid-template-rows: 1fr; }
  .pmenu-in { overflow: hidden; }
  .pmenu-row { display: flex; align-items: center; gap: 10px; padding: 2px 0 16px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 18px; min-height: 40px; max-width: 160px;
    color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 15px;
    transition: max-width .3s ease, padding .3s ease, opacity .25s ease,
                border-color .2s, background-color .18s, color .18s, transform .12s ease;
    white-space: nowrap; overflow: hidden;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip:active { background: var(--accent); color: var(--bg); }
  .chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }

  /* staggered entrance for the amount chips when the picker opens */
  .pmenu.open .pmenu-row > * { animation: chipIn .32s ease both; }
  .pmenu.open .pmenu-row > :nth-child(1) { animation-delay: .04s; }
  .pmenu.open .pmenu-row > :nth-child(2) { animation-delay: .09s; }
  .pmenu.open .pmenu-row > :nth-child(3) { animation-delay: .14s; }
  .pmenu.open .pmenu-row > :nth-child(4) { animation-delay: .19s; }
  .pmenu.open .pmenu-row > :nth-child(5) { animation-delay: .24s; }
  @keyframes chipIn { from { opacity: 0; transform: translateY(6px) scale(.9); } }

  /* "other" chip morphs into a full-width input capsule overlaying the row */
  .pmenu-row { position: relative; }
  .chip-other { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
  .pmenu-row.other-mode > .chip:not(.chip-other),
  .pmenu-row.other-mode > .undo {
    opacity: 0; pointer-events: none;
  }
  .pmenu-row.other-mode .chip-other {
    position: absolute; inset-inline: 0; top: 0; z-index: 2;
    max-width: none; overflow: visible;
    background: var(--bg); border-color: var(--accent);
    transform-origin: left center;
    transition: none; /* the grow animation alone drives the expansion */
    animation: capsuleGrow .3s ease;
  }
  @keyframes capsuleGrow { from { transform: scaleX(.28); opacity: .6; } }
  .other-label { flex: 0 0 auto; }
  .other-mode .chip-other .other-label { color: var(--accent); }
  input.other-input {
    flex: 0 1 0%; width: 0; min-width: 0; min-height: 0; opacity: 0;
    border: none; background: none; padding: 0; margin: 0;
    font: inherit; color: var(--text); font-variant-numeric: tabular-nums;
    transition: opacity .2s ease;
  }
  .other-mode input.other-input { flex: 1 1 auto; width: auto; opacity: 1; }
  input.other-input:focus-visible { outline: none; }
  .other-go { color: var(--accent); font-weight: 700; font-size: 14px; padding: 4px 6px; white-space: nowrap; }
  .undo { color: var(--faint); font-size: 13px; margin-inline-start: auto; }
  .undo:hover { color: var(--bad); }


  /* entry details — quiet, inline, using the existing row language */
  /* D2: a flex row so "יציאה" (exit-toggle) sits beside "פירוט כניסות" (entry-toggle) instead of
     wrapping under it; the name forces its own line via flex-basis so long names don't crowd
     the two text actions onto a half-width row. */
  .player-heading {
    flex: 1; min-width: 0;
    display: flex; flex-wrap: wrap; align-items: center; column-gap: 14px; row-gap: 2px;
  }
  .player-heading .pname { flex-basis: 100%; }
  .entry-toggle {
    display: flex; align-items: center; gap: 5px; padding: 10px 0;
    color: var(--dim); font-size: 12px; font-weight: 400;
  }
  .entry-toggle:hover { color: var(--accent); }
  .entry-toggle svg {
    width: 12px; height: 12px; fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .25s ease;
  }
  .entry-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .exit-toggle {
    display: flex; align-items: center; min-height: 44px; padding: 10px 0;
    color: var(--bad); font-size: 12px; font-weight: 400;
    margin-inline-start: 10px; transition: color .2s;
  }
  .exit-toggle:hover { color: var(--bad-press); }
  .exit-tag { color: var(--dim); font-size: 12px; animation: fadeIn .25s ease; }
  /* Row 17: "עריכה" is an action, not another piece of meta — a 12px gap and a hairline
     separate it from the "יצא · ₪X" tag instead of one more middot in the same run. */
  .exit-edit {
    color: var(--dim); font-size: 12px; font-weight: 400;
    padding: 6px 0 6px 12px; margin-inline-start: 12px; transition: color .2s;
    border-inline-start: 1px solid var(--line);
  }
  .exit-edit:hover { color: var(--accent); }
  .prow.exited .pname { opacity: .55; }
  .exit-row { align-items: center; }
  input.exit-cashout-input {
    flex: 1 1 auto; min-width: 0; min-height: 42px;
    border: none; border-bottom: 1px solid var(--line); background: none;
    border-radius: 0; padding: 8px 2px; margin: 0;
    font: inherit; color: var(--text); font-variant-numeric: tabular-nums;
    transition: border-color .2s;
  }
  input.exit-cashout-input:focus-visible { outline: none; border-bottom-color: var(--accent); }
  .exit-field {
    flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px;
    border-bottom: 1px solid var(--line); transition: border-color .2s;
  }
  .exit-field:focus-within { border-bottom-color: var(--accent); }
  .exit-currency { flex: 0 0 auto; color: var(--dim); font-size: 15px; }
  .exit-field input.exit-cashout-input { border-bottom: none; }
  .exit-confirm {
    flex: 0 0 auto; min-height: 44px;
    border-color: var(--bad); color: var(--bad); font-weight: 700;
    white-space: nowrap;
  }
  .exit-confirm:active { background: var(--bad-press); border-color: var(--bad-press); color: var(--bg); }
  .exit-cancel {
    flex: 0 0 auto; min-height: 44px; padding: 10px 6px;
    color: var(--dim); font-size: 13px; font-weight: 400; transition: color .2s;
  }
  .exit-cancel:hover { color: var(--text); }
  .entry-details { display: grid; grid-template-rows: 0fr; visibility: hidden;
    transition: grid-template-rows .28s ease, visibility .28s; }
  .entry-details.open { grid-template-rows: 1fr; visibility: visible; }
  .entry-details-in { overflow: hidden; min-height: 0; }
  .entry-list { margin: 0; padding: 2px 0 12px; list-style: none; }
  .entry-item { display: flex; justify-content: flex-start; align-items: baseline;
    gap: 8px; padding: 5px 0; font-size: 13px; font-variant-numeric: tabular-nums; }
  .entry-time { color: var(--dim); font-weight: 300; }
  .entry-divider { width: 14px; height: 1px; flex: 0 0 14px; background: var(--line); }
  .entry-amount { color: var(--text); font-weight: 500; }
  .entry-empty { color: var(--dim); font-size: 12px; margin: 0; padding: 4px 0 12px; }

  /* settle rows */
  input[type="number"].srow-input { width: 104px; flex: 0 0 104px; text-align: end; font-size: 17px; }
  .net { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 16px; min-width: 74px; text-align: left; }
  .net.pos { color: var(--accent); }
  .net.neg { color: var(--bad); }
  .net.zero { color: var(--faint); font-weight: 300; }

  /* ---------- stats / results ---------- */
  .statline {
    display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline;
    color: var(--dim); font-size: 14px; font-weight: 300;
    margin: 16px 0 0; font-variant-numeric: tabular-nums;
  }
  .statline b { color: var(--text); font-weight: 700; font-size: 16px; }
  .statline .sep { color: var(--faint); }
  .statline .bad { color: var(--bad); font-weight: 700; }
  .statline .good { color: var(--accent); font-weight: 700; }
  /* Row 20: the gap is called out once, in the red sentence below — the stat itself stays neutral. */
  .statline .neutral { color: var(--text); font-weight: 700; }

  .warn { color: var(--bad); font-size: 14px; margin: 14px 0 0; font-weight: 400; animation: rise .3s ease both; }

  .results { margin-top: 24px; }
  /* Row 14: one section title across the dashboard, the group page, the profile and the
     results — same size, weight, colour, tracking and bottom margin, whatever the class name. */
  .games-section-title, .ptitle, .results h2, .debt-group h3 {
    font-size: 13px; letter-spacing: .04em; font-weight: 500;
    color: var(--dim); margin: 0 0 10px;
  }
  .transfer {
    display: flex; align-items: baseline; gap: 10px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
    animation: rise .3s ease both;
  }
  .transfer .who { font-weight: 700; font-size: 17px; }
  .transfer .arrow { color: var(--faint); font-size: 13px; }
  .transfer .amount {
    margin-inline-start: auto; font-weight: 900; font-size: 20px;
    color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .transfer-paid {
    flex: 0 0 auto; margin-inline-start: 10px; border: 1px solid var(--line);
    border-radius: 999px; color: var(--dim); font-size: 12px; font-weight: 500;
    padding: 4px 10px; min-height: 30px;
  }
  .transfer-paid:hover { color: var(--text); border-color: var(--dim); }
  .transfer-paid.is-paid { color: var(--accent); border-color: var(--accent); }
  .settle-empty { color: var(--faint); margin: 12px 0 0; font-size: 14px; font-weight: 300; }

  /* ---------- Games dashboard ---------- */
  .games-view header { text-align: center; }
  /* The sync dot stays at the inline-start corner (same spot as on the profile) — the eyebrow is never centered. */
  .games-home { margin-top: 26px; animation: rise .4s ease both; text-align: center; }
  .games-home-in { width: 100%; max-width: 380px; margin: 0 auto; }
  /* No big title on the dashboard: the column starts below the corner stack (theme + settings, ~86px)
     so the lead line and the quick actions never sit beside the gear. */
  .games-home-dash { padding-top: 52px; }
  .games-home-lead { color: var(--dim); font-size: 14px; font-weight: 300; margin: 0 0 26px; }
  .games-section { margin-top: 24px; text-align: center; }
  .games-section:first-of-type { margin-top: 0; }
  .games-quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .games-quick-action {
    min-width: 0; min-height: 46px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    color: var(--text); font-size: 14px; font-weight: 600;
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .games-quick-action.primary { border-color: var(--accent); color: var(--accent); }
  .games-quick-action:disabled { opacity: .45; cursor: default; color: var(--faint); }
  .games-active-card, .games-group-card { padding: 15px 0; border-bottom: 1px solid var(--line); text-align: center; }
  .games-card-status { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 11px; font-weight: 400; }
  .games-card-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .games-card-status.settlement::before { background: var(--faint); }
  .games-card-title { display: block; color: var(--text); font-size: 16px; font-weight: 700; }
  .games-card-meta, .games-card-time { display: block; color: var(--dim); font-size: 12px; font-weight: 300; }
  .games-card-time { margin-top: 2px; }
  .games-card-actions { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 10px; }
  .games-card-enter { border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); font-size: 13px; font-weight: 700; padding: 6px 15px; min-height: 34px; transition: background-color .2s, color .2s, border-color .2s; }
  .games-card-toggle { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; padding: 6px 0; transition: color .2s; }
  .games-card-toggle:hover { color: var(--accent); }
  .games-card-toggle svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .22s ease; }
  .games-card-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .games-card-details { display: grid; grid-template-rows: 0fr; visibility: hidden; transition: grid-template-rows .25s ease, visibility .25s; }
  .games-card-details.open { grid-template-rows: 1fr; visibility: visible; }
  .games-card-details-in { min-height: 0; overflow: hidden; }
  .games-card-details-content { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .games-detail-row { display: flex; align-items: baseline; justify-content: center; gap: 8px; padding: 3px 0; font-size: 12px; }
  .games-detail-name { color: var(--text); font-weight: 600; }
  .games-detail-meta { color: var(--dim); font-weight: 300; font-variant-numeric: tabular-nums; }
  .games-detail-totals { color: var(--dim); font-size: 12px; font-weight: 300; margin: 8px 0 0; }
  .games-detail-totals b { color: var(--text); font-weight: 600; }
  .games-group-head { display: flex; align-items: center; justify-content: flex-start; gap: 10px; text-align: start; }
  .games-group-head[role="button"] { cursor: pointer; transition: opacity .18s ease, transform .12s ease; }
  .games-group-head[role="button"]:active { transform: scale(.97); }
  .games-group-head[role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
  .games-group-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; display: flex; align-items: center; justify-content: center; background: var(--line); color: var(--dim); font-weight: 700; }
  .games-empty { color: var(--faint); font-size: 14px; font-weight: 300; margin: 0; }

  /* create-group inline panel — same grid-collapse transition as .pmenu */
  .games-create-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; margin-top: 14px; }
  .games-create-panel.open { grid-template-rows: 1fr; }
  .games-create-panel-in { overflow: hidden; }
  .games-create-panel-content { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 0 6px; }
  .games-create-avatar {
    width: 56px; height: 56px; border-radius: 50%; flex: 0 0 auto;
    border: 1px solid var(--line); background: var(--line); color: var(--dim);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-size: 22px; font-weight: 700;
  }
  .games-create-avatar:hover { border-color: var(--accent); color: var(--accent); }
  .games-create-avatar img { width: 100%; height: 100%; object-fit: cover; }
  /* Row 32: one inline-panel shape — a title, a full-width field, then confirm + cancel. */
  .games-create-panel-content input[type="text"] { width: 100%; max-width: 100%; text-align: center; }
  .games-create-panel-content > .games-section-title { align-self: stretch; margin-bottom: 0; }
  .games-create-submit {
    border: 1px solid var(--accent); border-radius: 999px; color: var(--accent);
    font-weight: 700; font-size: 15px; padding: 10px 24px; min-height: 44px;
  }
  .games-create-cancel { color: var(--dim); font-size: 13px; padding: 6px 2px; }
  .games-create-cancel:hover { color: var(--text); }

  /* group-page "start game" participant panel (Task 8) — checkbox rows + guest add, reusing
     .games-create-panel above for the collapse/expand animation */
  .group-start-panel { margin-top: 14px; }
  .group-start-title { align-self: stretch; margin-bottom: 0; }
  /* Row 15: "נבחרו N מתוך M", updated in place as rows are ticked. */
  .group-start-counter {
    align-self: stretch; margin: 0 0 4px;
    color: var(--dim); font-size: 12px; font-weight: 300; animation: fadeIn .25s ease;
    transition: color .2s;
  }
  .group-start-member {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px;
    padding: 8px 4px; border-bottom: 1px solid var(--line);
    color: var(--text); font-size: 15px; font-weight: 600; text-align: start;
  }
  .group-start-member:last-of-type { border-bottom: none; }
  .group-start-check {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px;
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    transition: border-color .18s, background-color .18s;
  }
  .group-start-member[aria-checked="true"] .group-start-check { background: var(--accent); border-color: var(--accent); }
  .group-start-check svg {
    width: 13px; height: 13px; opacity: 0; stroke: var(--bg); stroke-width: 2.4;
    fill: none; stroke-linecap: round; stroke-linejoin: round; transform: scale(.4);
    transition: opacity .15s, transform .15s ease;
  }
  .group-start-member[aria-checked="true"] .group-start-check svg { opacity: 1; transform: scale(1); }
  .group-start-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .group-start-guests { margin-top: 4px; }
  .group-start-guest-row {
    display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 4px;
    border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 600; color: var(--text);
  }
  .group-start-guest-remove { margin-inline-start: auto; color: var(--dim); font-size: 12px; font-weight: 400; }
  .group-start-guest-remove:hover { color: var(--bad); }
  .group-start-add { margin-top: 10px; text-align: center; }
  .group-start-add-label { margin: 0 0 8px; color: var(--dim); font-size: 13px; font-weight: 600; }
  .group-start-add-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .group-start-confirm { transition: background-color .2s, color .2s, border-color .2s; }

  /* group page: header, primary action, leaderboard, last game, members, history */
  .games-group-header { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 40px; text-align: center; }
  .games-group-header-avatar {
    width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    background: var(--line); color: var(--dim); font-weight: 700; font-size: 26px;
  }
  .games-group-header-name { margin: 6px 0 0; font-size: 24px; font-weight: 800; }
  .games-group-header-meta { margin: 0; color: var(--dim); font-size: 13px; font-weight: 300; }
  .games-primary-action { margin-top: 22px; text-align: center; }
  .games-primary-action .btn-primary { min-width: 200px; }
  .btn-primary:disabled { opacity: .45; cursor: default; border-color: var(--line); color: var(--faint); }
  /* status line above the CTA when the group's own game is open (Task 9): phase + player count + start time */
  .games-primary-status { margin: 0; color: var(--text); font-size: 13px; font-weight: 500; animation: fadeIn .25s ease; }
  .games-primary-reason { margin: 10px 0; color: var(--dim); font-size: 12px; font-weight: 300; animation: fadeIn .25s ease; }
  /* D8: leaving is step one; this removes the group from THIS device only. */
  .games-hide-group { margin-top: 10px; animation: fadeIn .25s ease; }
  .games-hide-group-btn { font-size: 15px; min-height: 44px; }
  .games-hide-group .games-primary-reason { max-width: 300px; margin-inline: auto; }
  .games-leader-row, .games-member-row {
    margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line);
    font-size: 15px; font-weight: 600; color: var(--text); overflow-wrap: anywhere;
  }
  .games-leader-row:last-of-type, .games-member-row:last-of-type { border-bottom: none; }
  .games-member-tag { margin-inline-start: 6px; color: var(--dim); font-size: 12px; font-weight: 400; animation: fadeIn .25s ease; }

  /* group members: tappable admin rows, their action strip, add-member panel, former members */
  /* D3: the separator moves to the wrapper so the strip below a row stays inside the same block. */
  .games-member-item { border-bottom: 1px solid var(--line); }
  .games-member-item:last-of-type { border-bottom: none; }
  .games-member-item .games-member-row { border-bottom: none; }
  .games-member-row.with-actions { display: flex; align-items: center; gap: 10px; text-align: start; min-height: 44px; }
  .games-member-row[role="button"] { cursor: pointer; transition: opacity .18s ease, transform .12s ease; }
  .games-member-row[role="button"]:active { transform: scale(.97); }
  .games-member-row[role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
  .games-member-name { flex: 1 1 auto; min-width: 0; display: inline-flex; align-items: center; flex-wrap: wrap; }
  .games-member-chevron { flex: 0 0 auto; display: inline-flex; color: var(--dim); }
  .games-member-chevron svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .22s ease; }
  .games-member-row[aria-expanded="true"] .games-member-chevron svg { transform: rotate(180deg); }
  /* Row 18: a text action gets a real touch target, and the destructive one keeps its distance. */
  .games-member-action {
    flex: 0 0 auto; min-height: 44px; padding: 10px 0;
    font-size: 13px; font-weight: 500; transition: color .2s;
  }
  .games-member-actions .games-card-details-content {
    margin-top: 0; padding-top: 0; border-top: none;
    display: flex; align-items: center; flex-wrap: wrap; gap: 16px; padding-bottom: 6px;
  }
  .games-member-remove { color: var(--dim); margin-inline-start: auto; transition: color .2s; }
  .games-member-remove:hover, .games-member-remove.armed { color: var(--bad); }
  .games-member-note { margin: 0; padding: 8px 0; color: var(--dim); font-size: 12px; font-weight: 300; animation: fadeIn .25s ease; }
  .games-member-add { margin-top: 14px; text-align: center; }
  .games-member-add-toggle { color: var(--dim); font-size: 13px; font-weight: 600; padding: 6px 2px; transition: color .2s; }
  .games-member-add-toggle:hover { color: var(--accent); }
  .games-member-add-note { margin: 0; color: var(--dim); font-size: 12px; font-weight: 300; }
  .games-former-members { margin-top: 14px; text-align: center; }
  .games-former-toggle { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; font-weight: 500; padding: 6px 2px; transition: color .2s; }
  .games-former-toggle:hover { color: var(--accent); }
  .games-former-toggle svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .22s ease; }
  .games-former-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }

  /* group history: tappable rows expanding into a per-game ranking (Task 11) */
  .games-history-item { padding: 8px 0; border-bottom: 1px solid var(--line); text-align: center; }
  .games-history-item:last-of-type { border-bottom: none; }
  .games-history-head { cursor: pointer; transition: opacity .18s ease, transform .12s ease; }
  .games-history-head:active { transform: scale(.97); }
  .games-history-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
  .games-history-row { margin: 0; font-size: 15px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
  .games-history-tag { margin-inline-start: 6px; color: var(--bad); font-size: 12px; font-weight: 500; animation: fadeIn .25s ease; }
  .games-history-rank { margin: 0; padding: 4px 0; padding-inline-start: 14px; font-size: 13px; font-weight: 500; color: var(--dim); }
  /* Rank number ("1.") isolated in its own dir="ltr" span so the digit+dot never gets reversed
     by the bidi algorithm inside an RTL row (D4) — used by both the leaderboard and history rank. */
  .games-rank { margin-inline-end: 4px; font-variant-numeric: tabular-nums; }

  .btn-close-table {
    position: relative; overflow: hidden; isolation: isolate;
    display: block; width: min(100%, 340px); margin: 26px auto 0;
    border: 1px solid var(--accent); border-radius: 999px;
    color: var(--accent); font-weight: 700; font-size: 15px;
    padding: 12px 26px; min-height: 48px; touch-action: manipulation;
    white-space: nowrap; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .btn-close-table > span { position: relative; z-index: 1; }
  .btn-close-table::before {
    content: ""; position: absolute; z-index: 0;
    inset: 3px; border-radius: 999px;
    transform: scaleX(0); transform-origin: right center;
    background: var(--close-hold-fill); opacity: .18; pointer-events: none;
    transition: transform .18s ease-out;
  }
  .btn-close-table.warn-state { border-color: var(--bad); color: var(--bad); }
  .btn-close-table.blocked-state { cursor: default; opacity: .45; border-color: var(--line); color: var(--dim); }
  .btn-close-table.hold-state { opacity: 1; border-color: var(--accent); color: var(--accent); }
  .btn-close-table.hold-state::before { transform: scaleX(1); transition: transform 1s linear; }
  .btn-close-table.hold-state:active { transform: scale(.98); }
  .btn-close-table.force-state { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn-close-table.force-state::before { transform: scaleX(0); transition: none; }
  .finish-game-hint { color: var(--dim); font-size: 12px; font-weight: 300; text-align: center; margin: 8px 0 0; }
  .return-edit-btn { display: block; margin: 18px auto 0; color: var(--dim); font-size: 13px; font-weight: 500; padding: 6px 2px; }
  .return-edit-btn:hover { color: var(--text); }
  .force-close-confirm { margin-top: 12px; color: var(--dim); font-size: 13px; }
  .force-close-confirm p { margin: 0 0 8px; }
  .force-close-actions { display: flex; align-items: center; gap: 14px; }
  .force-close-actions button { font-size: 13px; padding: 5px 2px; }
  .force-close-cancel { color: var(--dim); }
  .force-close-submit { color: var(--text); font-weight: 700; }

  /* ---------- profile (centered) ---------- */
  .profile { margin-top: 6px; text-align: center; }
  .psection { margin-top: 24px; animation: rise .4s ease both; }
  .profile .psection { display: flex; flex-direction: column; align-items: center; }
  .profile .pgrid { justify-items: center; width: 100%; max-width: 340px; }
  .profile .hgame { justify-content: center; width: 100%; }
  .profile .hgame .hnet { margin-inline-start: 0; min-width: 74px; text-align: start; }
  .profile-tabs { display: flex; justify-content: center; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); }
  .profile-tab { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 14px; font-weight: 500; padding: 7px 18px 8px; border-bottom: 2px solid transparent; }
  .profile-tab:hover { color: var(--text); }
  .profile-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .profile-tab-badge { width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(53,224,220,.1); }
  .debt-tabs { display: flex; justify-content: center; gap: 4px; width: 100%; max-width: 360px; margin: 0 auto 14px; border-bottom: 1px solid var(--line); }
  .debt-tab { flex: 1; color: var(--dim); font-size: 16px; font-weight: 500; padding: 8px 18px 9px; border-bottom: 2px solid transparent; }
  .debt-tab:hover { color: var(--text); }
  .debt-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .who-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .bignum {
    font-size: 52px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .bignum.pos { color: var(--accent); }
  .bignum.neg { color: var(--bad); }
  .bignum.zero { color: var(--dim); }
  .pstats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; color: var(--dim); font-size: 14px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .pstats b { color: var(--text); font-weight: 700; }
  .hgame {
    display: flex; align-items: baseline; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums; animation: rise .3s ease both;
  }
  .hgame .hdate { color: var(--dim); font-size: 13px; font-weight: 300; }
  .hgame .hplayers { color: var(--faint); font-size: 12px; font-weight: 300; }
  .hgame .hnet { margin-inline-start: auto; font-weight: 700; font-size: 17px; }
  .hnet.pos { color: var(--accent); } .hnet.neg { color: var(--bad); } .hnet.zero { color: var(--faint); font-weight: 300; }
  .debt-section { width: 100%; max-width: 380px; text-align: start; }
  .debt-pane { width: 100%; }
  .debt-group .empty-note { width: 100%; text-align: center; }
  .debt-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); animation: rise .3s ease both; }
  .debt-copy { min-width: 0; flex: 1; }
  .debt-person { display: block; color: var(--text); font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
  .debt-meta { display: block; color: var(--dim); font-size: 12px; font-weight: 300; }
  .debt-amount { flex: 0 0 auto; color: var(--text); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  /* D4: direction of the debt, readable from the row itself. */
  .debt-amount.pos { color: var(--accent); }
  .debt-amount.neg { color: var(--bad); }
  .debt-paid-btn { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); font-size: 12px; font-weight: 500; padding: 4px 10px; min-height: 30px; }
  .debt-paid-btn:hover { color: var(--accent); border-color: var(--accent); }
  .friend-helper { color: var(--dim); font-size: 12px; font-weight: 300; margin-top: 8px; text-align: center; }
  .empty-note { color: var(--dim); font-size: 14px; font-weight: 300; margin-top: 10px; }
  .pid { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .pname-big { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin-top: 16px; }
  .pcell { display: flex; flex-direction: column; gap: 1px; }
  .plab { font-size: 12px; color: var(--dim); font-weight: 300; }
  .pval { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pval.pos { color: var(--accent); } .pval.neg { color: var(--bad); } .pval.zero { color: var(--faint); font-weight: 300; }

  .example-tag { color: var(--accent); font-size: 12px; font-weight: 400; }

  /* ---------- corner controls (top-left, scroll with the page) ---------- */
  .corner {
    position: absolute; top: calc(6px + env(safe-area-inset-top, 0px)); left: 18px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    z-index: 30;
  }
  .corner-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--dim); font-size: 10px; font-weight: 500;
  }
  .corner-btn .cicon { display: flex; transition: transform .25s ease; }
  .corner-btn svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .corner-btn:hover { color: var(--accent); }
  .corner-btn:active .cicon { transform: scale(.85) rotate(-30deg); }
  .corner-btn.danger-armed { color: var(--bad); }
  header { padding-inline-end: 96px; }
  /* Keep the main content below the fixed corner controls after the app title was removed. */
  .game-view .wrap > header, .settle-view .wrap > header { min-height: 64px; }
  /* D2: back-to-the-group line on the table and settlement screens. It sits inside <header>, so
     it inherits the 96px inline-end padding that keeps the corner reset/theme controls clear. */
  .table-header {
    display: flex; align-items: center; gap: 10px;
    margin-top: 4px; min-height: 44px;
    animation: rise .3s ease both;
  }
  .table-header .back-arrow {
    position: static; flex: 0 0 auto;
    display: inline-flex; align-items: center; padding: 8px; margin-inline-start: -8px;
  }
  .table-header-name {
    min-width: 0; font-size: 17px; font-weight: 700; color: var(--text); overflow-wrap: anywhere;
  }
  .table-header-label {
    margin-inline-start: auto; flex: 0 0 auto;
    color: var(--dim); font-size: 12px; font-weight: 400; white-space: nowrap;
  }

  /* ---------- login overlay ---------- */
  .login {
    position: fixed; inset: 0; z-index: 40;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .login-in { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 18px; animation: rise .45s ease both; }
  /* D1: the group settings overlay carries the invite block and the add-member panel now, so it
     scrolls from the top instead of centring a column that can outgrow the screen. */
  #groupSettings {
    align-items: flex-start; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding-block: calc(58px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  }
  #groupSettings .login-in { margin-inline: auto; }
  .group-set-section { width: 100%; }
  .group-set-section .games-section { margin-top: 0; }
  .join-notice-actions { display: flex; align-items: center; gap: 16px; }
  .login .eyebrow { justify-content: flex-start; }
  .login h2 { font-weight: 900; font-size: 34px; margin: 0; line-height: 1.1; }
  .login p { color: var(--dim); font-size: 14px; font-weight: 300; margin: -8px 0 0; }
  .login .who-row { margin-top: 0; }
  .btn-primary {
    border: 1px solid var(--accent); border-radius: 999px;
    color: var(--accent); font-weight: 700; font-size: 15px;
    padding: 12px 26px; min-height: 48px; align-self: flex-start;
  }
  .btn-skip { color: var(--dim); font-size: 13px; align-self: flex-start; }

  /* sign-in: the account block sits above, the existing local name flow stays below it, quieter */
  .auth-block, .auth-step, .auth-local { display: flex; flex-direction: column; gap: 14px; }
  .auth-local { gap: 12px; padding-top: 4px; border-top: 1px solid var(--line); }
  /* when there is no client at all the local flow is the only flow: no rule, no "בלי חשבון" label */
  .auth-local.auth-local-only { border-top: none; padding-top: 0; }
  .auth-local.auth-local-only .auth-local-title { display: none; }
  .login .auth-local-title { color: var(--faint); font-size: 12px; font-weight: 700; letter-spacing: .04em; margin: 6px 0 -4px; }
  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 999px;
    color: var(--text); font-weight: 700; font-size: 15px;
    padding: 12px 22px; min-height: 48px; width: 100%;
  }
  .btn-google:hover { border-color: var(--accent); }
  .btn-google:active { transform: scale(.97); }
  .btn-google:disabled { opacity: .45; cursor: default; }
  .btn-google svg { width: 20px; height: 20px; flex: 0 0 20px; }
  .auth-divider { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12px; }
  .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  /* the email → code swap reuses the standard panel entrance instead of a hard cut */
  .auth-step.auth-step-in { animation: rise .28s ease both; }
  .login .auth-note { color: var(--dim); font-size: 13px; margin: 0; }
  .login .auth-error { color: var(--bad); font-size: 13px; margin: -6px 0 0; animation: fadeIn .25s ease both; }
  .login .set-account { color: var(--dim); font-size: 12px; margin: -16px 0 0; overflow-wrap: anywhere; }

  /* settings — flat, centered */
  .back-arrow {
    position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); inset-inline-start: 18px;
    color: var(--dim); padding: 8px;
  }
  .back-arrow svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .back-arrow:hover { color: var(--accent); }
  .set-in { align-items: center; text-align: center; gap: 20px; }
  .avatar {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--accent); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 800;
  }
  .set-name { font-size: 22px; font-weight: 800; margin-top: -6px; }
  .set-in input { max-width: 260px; text-align: center; font-size: 16px; }
  .theme-row { display: flex; align-items: center; gap: 14px; color: var(--dim); margin-top: 4px; }
  .theme-row svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .switch {
    width: 54px; height: 31px; border-radius: 999px;
    border: 1px solid var(--line); position: relative; flex: 0 0 54px;
    transition: border-color .25s;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; inset-inline-start: 3px;
    width: 23px; height: 23px; border-radius: 50%; background: var(--dim);
    transition: transform .25s ease, background-color .25s;
  }
  .switch.on { border-color: var(--accent); }
  .switch.on::after { transform: translateX(-23px); background: var(--accent); }
  .set-flat { font-size: 17px; font-weight: 500; color: var(--text); padding: 10px; min-height: 46px; transition: color .2s, background-color .2s, border-color .2s; }
  .set-flat:hover { color: var(--accent); }
  .set-flat.danger { color: var(--bad); }
  .set-flat.danger:hover, .set-flat.danger.armed { color: var(--bad); }

  /* group page: invite (code / link / QR placeholder) */
  .games-invite-create {
    border: 1px solid var(--accent); border-radius: 999px; color: var(--accent);
    font-weight: 700; font-size: 15px; padding: 10px 24px; min-height: 44px;
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .games-invite-card { display: flex; flex-direction: column; align-items: center; gap: 12px; animation: rise .3s ease both; }
  .games-invite-code {
    margin: 0; text-align: center; color: var(--text);
    font-size: 28px; font-weight: 800; letter-spacing: .12em;
    font-variant-numeric: tabular-nums;
  }
  /* D6: the join-notice's own code display reads quieter than the group settings invite code. */
  #joinNoticeCode { color: var(--dim); }
  .games-invite-actions { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .games-invite-action {
    border: 1px solid var(--line); border-radius: 999px; color: var(--text);
    font-size: 13px; font-weight: 600; padding: 8px 16px; min-height: 40px;
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .games-invite-action:hover { border-color: var(--accent); color: var(--accent); }
  .games-invite-copied { color: var(--accent); font-size: 12px; font-weight: 500; animation: fadeIn .25s ease; }
  .games-invite-note { margin: 0; color: var(--dim); font-size: 12px; font-weight: 300; max-width: 280px; }
  .games-invite-revoke { color: var(--dim); font-size: 12px; font-weight: 400; padding: 4px 0; transition: color .2s; }
  .games-invite-revoke:hover { color: var(--bad); }

  /* group page: settings corner button, member promote action, disabled group avatar picker */
  .games-group-settings-btn {
    position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); inset-inline-end: 0;
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
    color: var(--dim); font-size: 13px; font-weight: 500; padding: 10px 8px;
    transition: color .2s;
  }
  .games-group-settings-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .games-group-settings-btn:hover { color: var(--accent); }
  .games-member-promote { color: var(--dim); }
  .games-member-promote:hover { color: var(--accent); }
  .games-create-avatar:disabled { cursor: default; opacity: .55; }
  .set-flat:disabled { color: var(--faint); cursor: default; }
  .set-flat:disabled:hover { color: var(--faint); }

  /* Background hover feedback belongs only to devices that can actually hover. */
  @media (hover: hover) {
    .exit-confirm:hover { background: var(--bad-press); border-color: var(--bad-press); color: var(--bg); }
    .games-quick-action.primary:hover { background: var(--accent); color: var(--bg); }
    .games-card-enter:hover { background: var(--accent); color: var(--bg); }
    .games-create-submit:hover { background: var(--accent); color: var(--bg); }
    .btn-close-table:hover { background: var(--accent); color: var(--bg); }
    .btn-close-table.warn-state:hover { background: var(--bad); color: var(--bg); box-shadow: none; }
    .btn-close-table.blocked-state:hover { background: none; color: var(--dim); }
    .btn-close-table.force-state:hover { background: var(--accent-press); color: var(--bg); }
    .btn-close-table.hold-state:hover { background: none; border-color: var(--accent); color: var(--accent); }
    .btn-primary:hover { background: var(--accent); color: var(--bg); }
    .btn-primary:disabled:hover { background: none; color: var(--faint); }
    .games-invite-create:hover { background: var(--accent); color: var(--bg); }
  }

  /* iOS cannot be locked to portrait, so a short landscape phone gets a quiet, blocking cue. */
  #rotateNotice {
    position: fixed; inset: 0; z-index: 50; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: var(--bg); color: var(--dim); text-align: center; padding: 24px;
  }
  #rotateNotice svg {
    width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
  }
  #rotateNotice strong { color: var(--text); font-size: 17px; font-weight: 700; }
  #rotateNotice span { color: var(--dim); font-size: 14px; font-weight: 400; }
  @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
    #rotateNotice { display: flex; pointer-events: auto; animation: fadeIn .3s ease both; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

  async function pushCloud() {

    const previous = lastPushedRows || EMPTY_CLOUD_ROWS;
    const confirmed = { ...previous };
    // A game the server already holds as CLOSED is frozen: RLS refuses it and the immutability
    // triggers raise on any UPDATE or DELETE of it or its children. Never write to one again.
    const frozen = new Set((previous.gamesClosed || []).map(row => String(row.id)));
    const notFrozen = row => !frozen.has(String(row.game_id || row.id || ""));
    // A real DELETE is only ever the current open table's own undo. A game that merely dropped
    // out of the payload (a local reset, a closed game aged out of history) must never take the
    // server's rows with it.
    const editable = new Set((next.games || []).map(row => String(row.id)));
    const isEditable = row => editable.has(String(row.game_id || ""));

        // a game the server already closed, and never deletes them either.

        const diff = diffCollections(previous[pair[0]] || [], rows, "id");

          // open before it can be closed (games_insert_member forbids inserting a closed game).
          const known = new Set((previous.games || []).map(row => String(row.id))
            .concat((previous.gamesClosed || []).map(row => String(row.id))));
          const shells = (next.gamesClosed || [])
            .filter(row => !known.has(String(row.id)))
            .map(cloudGameOpenShell);

          // closed), so re-sending it would be a hard error, not a no-op.
          upserts = upserts.filter(row => !frozen.has(String(row.id)));

          const result = CLOUD_INSERT_ONLY[pair[0]]
            ? await supabase.from(pair[1]).upsert(upserts, { onConflict: "id", ignoreDuplicates: true })

          if (result && result.error) throw result.error;
        }
        confirmed[pair[0]] = rows;
        if (pair[0] === "gameParticipants" || pair[0] === "entries") {
          await pushCloudGameDeletes(pair[1], diff.deletes.filter(row => notFrozen(row) && isEditable(row)));
        }
      }
      // The one thing a closed game still allows: the creditor marking a debt paid
      // (GRANT UPDATE (status, paid_at, paid_by_profile_id), debts_update_creditor).
      const payments = diffCollections(previous.debtPayments || [], next.debtPayments, "id");
      for (const payment of payments.upserts) {
        const result = await supabase.from("debts")
          .update({ status: payment.status, paid_at: payment.paid_at, paid_by_profile_id: payment.paid_by_profile_id })
          .eq("id", payment.id);
        if (result && result.error) throw result.error;
      }
      confirmed.debtPayments = next.debtPayments;
      (next.games || []).concat(next.gamesClosed || []).forEach(row => {
        if (row.created_by) cloudGameCreators[String(row.id)] = row.created_by;
      });
    } catch (e) {
      // An RLS refusal (editing a group I no longer administer, or a close the server rejects) is
      // not a retry: the server is right and the next pull brings its version back — the local
      // history entry stays exactly where it is. A network failure retries on the next save.
      lastPushedRows = confirmed;
      setSync(false, "שגיאת שמירה — נשמר מקומית");
      scheduleCloudPull(1200);
      return;
    }
    lastPushedRows = confirmed;
    dirtyUntil = 0;
    setSync(true, "מסונכרן לחשבון");
    syncCloudGameChannel();
  }

  // "בטל אחרונה" really removes an entry, and undoing a player's last buy-in removes the player.
  // entries_delete_open_game / game_participants_delete allow exactly that, and only while the
  // game is open — a row whose game has since closed is simply left alone.
  async function pushCloudGameDeletes(table, deletes) {
    if (!supabase || !authUser) return;
    const ids = (deletes || []).map(row => String(row.id)).filter(isCloudId);
    if (!ids.length) return;
    const result = await supabase.from(table).delete().in("id", ids);
    if (result && result.error) throw result.error;
  }

  async function pullCloud() {
    if (!supabase || !authUser) return;
    if (cloudPulling) return;
    cloudPulling = true;
    try {
      // RLS already narrows this to the groups I am an active member of (or created), so there
      // is nothing to filter here — group_members/invites then follow those ids.
      const groupsResult = await supabase.from("groups").select("*");
      if (groupsResult.error) { setSync(false, "שגיאת סנכרון — נשמר מקומית"); return; }
      const groupRows = groupsResult.data || [];
      const groupIds = groupRows.map(row => row.id).filter(Boolean);
      let memberRows = [];
      let inviteRows = [];
      if (groupIds.length) {
        const membersResult = await supabase.from("group_members").select("*").in("group_id", groupIds);
        if (membersResult.error) { setSync(false, "שגיאת סנכרון — נשמר מקומית"); return; }
        memberRows = membersResult.data || [];
        const invitesResult = await supabase.from("invites").select("*").in("group_id", groupIds);
        if (!invitesResult.error) inviteRows = invitesResult.data || [];
      }
      const friendsResult = await supabase.from("friendships").select("*");
      // games_select is app_can_read_game(): my groups' games plus any ad-hoc game I created or
      // played in. Only the most recent closed games are worth carrying to the device.
      const gamesResult = await supabase.from("games").select("*");
      if (gamesResult.error) { setSync(false, "שגיאת סנכרון — נשמר מקומית"); return; }
      const allGames = gamesResult.data || [];
      const openGames = allGames.filter(row => row && row.phase !== "closed");
      const closedGames = allGames.filter(row => row && row.phase === "closed")
        .sort((a, b) => String(b.closed_at || "").localeCompare(String(a.closed_at || "")))
        .slice(0, CLOUD_HISTORY_LIMIT);
      const gameIds = openGames.concat(closedGames).map(row => row.id).filter(Boolean);
      const children = await fetchCloudGameChildren(gameIds);
      const debtsResult = await supabase.from("debts").select("*");
      applyCloudPull({
        groups: groupRows,
        members: memberRows,
        invites: inviteRows,
        friendships: friendsResult.error ? [] : (friendsResult.data || []),
        openGames,
        closedGames,
        participants: children.participants,
        entries: children.entries,
        transfers: children.transfers,
        debts: debtsResult.error ? [] : (debtsResult.data || []),
      });
    } catch (e) {
      setSync(false, "שגיאת סנכרון — נשמר מקומית");
    } finally {
      cloudPulling = false;
    }
  }

  // The three child tables of a set of games, in the order the local model wants them: entries by
  // server insert time (recorded_at is always present; created_at can be NULL on a legacy row),
  // participants by seating order, transfers by the settlement's own sort_order.
  async function fetchCloudGameChildren(gameIds) {
    const empty = { participants: [], entries: [], transfers: [] };
    if (!supabase || !authUser) return empty;
    if (!gameIds || !gameIds.length) return empty;
    const participants = await supabase.from("game_participants").select("*")
      .in("game_id", gameIds).order("created_at", { ascending: true });
    if (participants.error) return empty;
    const entries = await supabase.from("entries").select("*")
      .in("game_id", gameIds).order("recorded_at", { ascending: true });
    const transfers = await supabase.from("transfers").select("*")
      .in("game_id", gameIds).order("sort_order", { ascending: true });
    return {
      participants: participants.data || [],
      entries: entries.error ? [] : (entries.data || []),
      transfers: transfers.error ? [] : (transfers.data || []),
    };
  }
  // Groups the child rows of one game together, so the mappers get exactly their own game.
  function cloudChildrenOf(gameId, payload) {
    const id = String(gameId);
    const of = list => (Array.isArray(list) ? list : []).filter(row => row && String(row.game_id) === id);
    return { participants: of(payload.participants), entries: of(payload.entries), transfers: of(payload.transfers) };
  }

  function applyCloudPull(payload) {
    if (!authUser) return;
    const groupRows = payload.groups || [];
    const memberRows = payload.members || [];
    const inviteRows = payload.invites || [];
    const friendshipRows = payload.friendships || [];
    // Learn every profile id the server showed us before mapping: a row belonging to another
    // account then maps to a stable local identity and back to the same row on the next push.
    const seen = new Set(cloudProfileIds);
    seen.add(authUser.id);
    groupRows.forEach(row => { if (row && row.created_by_profile_id) seen.add(row.created_by_profile_id); });
    memberRows.forEach(row => { if (row && row.profile_id) seen.add(row.profile_id); });
    inviteRows.forEach(row => { if (row && row.created_by_profile_id) seen.add(row.created_by_profile_id); });
    friendshipRows.forEach(row => {
      if (!row) return;
      if (row.requester_profile_id) seen.add(row.requester_profile_id);
      if (row.addressee_profile_id) seen.add(row.addressee_profile_id);
    });
    cloudProfileIds = Array.from(seen);
    // Never yank a field out from under an active edit, and never let the server undo an edit
    // that has not been pushed yet — the same rule the document sync has always used.
    const active = document.activeElement;
    if ((active && active.tagName === "INPUT") || cloudPushTimer || Date.now() < dirtyUntil) {
      scheduleCloudPull(800);
      return;
    }
    (payload.openGames || []).concat(payload.closedGames || []).forEach(row => {
      if (row && row.id && row.created_by) cloudGameCreators[String(row.id)] = row.created_by;
    });
    const ctx = cloudContext();
    // Members first: rowsToPlayers resolves memberId against them, so the context has to know the
    // membership the server just sent, not the one this device had a moment ago.
    const pulledMembers = memberRows.map(row => rowToGroupMember(row, ctx));
    const gameCtx = { ...ctx, groupMembers: pulledMembers };
    const history = (payload.closedGames || []).map(row => {
      const kids = cloudChildrenOf(row.id, payload);
      return buildHistoryEntryFromCloud(row, kids.participants, kids.entries, kids.transfers, gameCtx);
    });
    // A game this device already closed is never reopened by a pull: the close may simply not
    // have reached the server yet (a failed push retries it), and history is the local truth.
    const closedHere = new Set((state.history || []).map(entry => String(entry && entry.gameId)));
    const openCandidates = (payload.openGames || [])
      .filter(row => row && !closedHere.has(String(row.id)))
      .map(row => {
        const kids = cloudChildrenOf(row.id, payload);
        return buildOpenGameFromCloud(row, kids.participants, kids.entries, kids.transfers, gameCtx);
      });
    const picked = pickCloudOpenGame(state, openCandidates);
    if (picked.action === "keep" && openCandidates.length) {
      // The single-slot limitation, out loud: this device is at a different table, so the server's
      // open game waits until that one is closed.
      console.warn("cloud: another open game is waiting on the server", openCandidates.map(g => g.gameId));
    }
    const transfersByGame = {};
    (payload.transfers || []).forEach(row => {
      if (row && row.id) transfersByGame[String(row.id)] = String(row.settlement_key || "");
    });
    const pulled = {
      groups: groupRows.map(row => rowToGroup(row, ctx)),
      groupMembers: pulledMembers,
      invites: inviteRows.map(row => rowToInvite(row, ctx)),
      friendships: friendshipRows.map(row => rowToFriendship(row, ctx)),
      history,
      debts: (payload.debts || []).map(row => rowToDebt(row, ctx, transfersByGame)),
      game: picked.action === "load" ? picked.game : null,
    };
    const merged = normalize(mergeCloudIntoState(state, pulled, { keepLocalIds: cloudUnconfirmedIds() }));
    if (merged) state = merged;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    // The baseline is what the SERVER holds, not what we now hold: a record the merge kept is
    // absent from it and goes up on the next push (that is the first-device seeding rule).
    lastPushedRows = buildCloudRows({
      ...pulled,
      games: (picked.action === "load" && picked.game ? [gameSnapshotFromState({ ...picked.game, example: false })] : [])
        .concat(history.map(gameSnapshotFromHistory)),
      debts: pulled.debts,
    }, cloudContext());
    setSync(true, "מסונכרן לחשבון");
    render();
    syncCloudGameChannel();
  }

  // ---- realtime: the open table ----
  // postgres_changes respects RLS, so a member only ever receives rows they could have SELECTed.
  // The channel is per game and torn down the moment the slot changes or the game closes.
  function syncCloudGameChannel() {
    if (!supabase || !authUser) return leaveCloudGameChannel();
    const id = (!state.example && state.phase !== "closed" && isCloudId(state.gameId)) ? String(state.gameId) : "";
    if (id === cloudGameChannelId) return;
    leaveCloudGameChannel();
    if (!id) return;
    cloudGameChannelId = id;
    const onChange = () => scheduleCloudGamePull();
    try {
      cloudGameChannel = supabase.channel("game:" + id)
        .on("postgres_changes", { event: "*", schema: "public", table: "games", filter: "id=eq." + id }, onChange)
        .on("postgres_changes", { event: "*", schema: "public", table: "game_participants", filter: "game_id=eq." + id }, onChange)
        .on("postgres_changes", { event: "*", schema: "public", table: "entries", filter: "game_id=eq." + id }, onChange)
        .subscribe();
    } catch (e) {
      cloudGameChannel = null;
      cloudGameChannelId = "";
    }
  }
  function leaveCloudGameChannel() {
    clearTimeout(cloudGameEventTimer);
    cloudGameEventTimer = null;
    const channel = cloudGameChannel;
    cloudGameChannel = null;
    cloudGameChannelId = "";
    if (!supabase || !channel) return;
    try { supabase.removeChannel(channel); } catch (e) {}
  }
  // A buy-in on the other phone fires three events; 300ms of debounce turns them into one read.
  function scheduleCloudGamePull() {
    clearTimeout(cloudGameEventTimer);
    cloudGameEventTimer = setTimeout(() => {
      cloudGameEventTimer = null;
      pullCloudGame(cloudGameChannelId);
    }, 300);
  }
  async function pullCloudGame(gameId) {
    if (!supabase || !authUser || !gameId) return;
    try {
      const gameResult = await supabase.from("games").select("*").eq("id", gameId).maybeSingle();
      if (gameResult.error || !gameResult.data) return;
      const row = gameResult.data;
      // A close is more than the table: history, debts and the emptied slot all move, so it goes
      // through the full pull rather than the game-only fast path.
      if (row.phase === "closed") { pullCloud(); return; }
      const children = await fetchCloudGameChildren([gameId]);
      applyCloudGame(row, children.participants, children.entries, children.transfers);
    } catch (e) {}
  }
  function applyCloudGame(gameRow, participantRows, entryRows, transferRows) {
    if (!authUser) return;
    // Same rule as the full pull: a game already in this device's history stays closed here.
    if ((state.history || []).some(entry => entry && String(entry.gameId) === String(gameRow.id))) return;
    const incoming = buildOpenGameFromCloud(gameRow, participantRows, entryRows, transferRows, cloudContext());
    // A local edit that has not been pushed yet outranks the server, exactly like the document
    // sync always did: park it and try again.
    if (cloudPushTimer || Date.now() < dirtyUntil) {
      pendingCloudGame = incoming;
      setTimeout(tryApplyParked, 600);
      return;
    }
    const active = document.activeElement;
    const hasActiveInput = !!(active && active.tagName === "INPUT");
    if (!shouldApplyIncomingGame(state, incoming, hasActiveInput)) {
      if (hasActiveInput) pendingCloudGame = incoming; // retried on focusout
      return;
    }
    pendingCloudGame = null;
    const merged = normalize(mergeCloudIntoState(state, { game: incoming }, {}));
    if (!merged) return;
    state = merged;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    setSync(true, "מסונכרן לחשבון");
    render();
  }

  // A session has arrived: hand ownership over once, seed the server with whatever this device
  // has that it does not, and stop the Claude-document sync for good.
  function enterCloudMode() {
    if (!supabase || !authUser) return;
    clearTimeout(saveTimer);
    saveTimer = null;
    gameDoc = null;
    pendingRemote = null;
    lastPushedRows = null;
    cloudGameCreators = {};
    pullCloud().then(() => { if (cloudMode()) return pushCloud(); }).catch(() => {});
  }
  // Signed out: keep every local record exactly as it is and simply stop talking to the server.
  function exitCloudMode() {
    clearTimeout(cloudPushTimer);
    clearTimeout(cloudPullTimer);
    cloudPushTimer = null;
    cloudPullTimer = null;
    cloudPulling = false;
    lastPushedRows = null;
    cloudProfileIds = [];
    cloudGameCreators = {};
    pendingCloudGame = null;
    leaveCloudGameChannel();
    setSync(false, "שמירה מקומית");
  }

  // Example data promises "any edit resets it": the first real interaction
  // wipes the demo players instead of quietly turning them into real ones.
  // Returns true when it wiped, so callers can stop their own action.
  function markReal() {
    if (!state.example) return false;
    state = newCurrentGame(state, { phase: "active", startedAt: new Date().toISOString() });
    expandedEntries.clear();
    return true;
  }

  // D3: wrapped in FSI/PDI (U+2068/U+2069) so the bidi algorithm treats the whole "₪123"/"-₪123"
  // as one isolated run — otherwise ₪ lands on a different side of the digits depending on sign
  // when this string sits inside RTL text. Digits/amount otherwise unchanged.
  const fmt = (n) => "⁨₪" + (Math.round(n * 100) / 100).toLocaleString("he-IL") + "⁩";
  const fmtSigned = (n) => "⁨" + ((n > 0 ? "+" : "") + fmt(n)).replace("₪-", "-₪") + "⁩";
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  const wholeMoney = (n) => Math.round(Number(n) || 0);

  function tableBalance(players) {
    const buy = players.reduce((total, p) => total + p.buyins.reduce((x, amount) => x + wholeMoney(amount), 0), 0);
    const out = players.reduce((total, p) => total + wholeMoney(p.cashout), 0);
    const difference = Math.round(buy - out);
    return { buy, out, difference, isBalanced: difference === 0 };
  }

  function totals() {
    const balance = tableBalance(state.players);
    return { buy: balance.buy, out: balance.out, diff: balance.difference };
  }

  function buildHistoryEntry(snapshot, balance, at, moves = [], paidStatuses = {}) {
    return {
      gameId: snapshot.gameId,
      at,
      groupId: snapshot.groupId || null,
      startedAt: snapshot.startedAt || null,
      leaderRef: snapshot.leaderRef || null,
      isBalanced: balance.isBalanced,
      balanceDifference: balance.difference,
      transfers: moves.map((move, index) => ({
        id: settlementKey(snapshot.gameId, move, index),
        from: move.from,
        to: move.to,
        amount: wholeMoney(move.amount),
        status: paidStatuses[settlementKey(snapshot.gameId, move, index)] ? "paid" : "open",
      })),
      players: snapshot.players.map(p => ({
        id: p.id,
        entryLog: p.entryLog.map(entry => ({ ...entry })),
        name: p.name,
        guestId: p.guestId || null,
        memberId: p.memberId || null,
        buyin: sum(p.buyins),
        cashout: Number(p.cashout) || 0,
        net: (Number(p.cashout) || 0) - sum(p.buyins),
        status: p.status === "exited" ? "exited" : "active",
        exitedAt: p.exitedAt || null,
      })),
    };
  }

  function balanceDescription(diff) {
    if (diff > 0) return "חסר " + fmt(diff);
    if (diff < 0) return "עודף " + fmt(Math.abs(diff));
    return "0";
  }

  function settlementKey(gameId, move, index) {
    return [gameId, index, move.from, move.to, wholeMoney(move.amount)].join("::");
  }

  function buildDebtRecords(snapshot, moves, paidStatuses, at) {
    return moves.reduce((debts, move, index) => {
      const key = settlementKey(snapshot.gameId, move, index);
      if (paidStatuses && paidStatuses[key]) return debts;
      const debtor = snapshot.players.find(p => p.name === move.from);
      const creditor = snapshot.players.find(p => p.name === move.to);
      if (!debtor || !creditor) return debts;
      debts.push({
        id: "debt-" + key,
        gameId: snapshot.gameId,
        groupId: snapshot.groupId || snapshot.clanId || null,
        debtorUserId: debtor.id,
        creditorUserId: creditor.id,
        debtorName: debtor.name,
        creditorName: creditor.name,
        amount: wholeMoney(move.amount),
        status: "open",
        createdAt: at,
        gameDate: at,
        paidAt: null,
      });
      return debts;
    }, []);
  }

  function updateDebtAsPaid(debts, debtId, actorName, paidAt) {
    const debt = debts.find(item => item.id === debtId);
    if (!debt || debt.status !== "open" || debt.creditorName !== actorName) return false;
    debt.status = "paid";
    debt.paidAt = paidAt;
    return true;
  }

  function closeButtonLabel(isBalanced, forceUnlocked, closeArmed) {
    if (!isBalanced) return forceUnlocked ? "סגור בכל זאת" : "לחיצה ארוכה כדי לסגור למרות הפער";
    return closeArmed ? "לסגור את השולחן? לחיצה נוספת מאשרת" : "סגירת שולחן ורישום לרקורד";
  }

  function setCloseButtonLabel(button, label) {
    const text = button.querySelector("#closeTableLabel");
    if (text) text.textContent = label;
    else button.textContent = label;
  }

  // Greedy settlement: fewest transfers between net winners and losers.
  function settle() {
    const nets = state.players
      .map(p => ({ name: p.name, net: (Number(p.cashout) || 0) - sum(p.buyins) }))
      .filter(p => Math.abs(p.net) > 0.005);
    const winners = nets.filter(p => p.net > 0).sort((a, b) => b.net - a.net);
    const losers  = nets.filter(p => p.net < 0).sort((a, b) => a.net - b.net);
    const moves = [];
    let i = 0, j = 0;
    while (i < losers.length && j < winners.length) {
      const pay = Math.min(-losers[i].net, winners[j].net);
      moves.push({ from: losers[i].name, to: winners[j].name, amount: pay });
      losers[i].net += pay;
      winners[j].net -= pay;
      if (-losers[i].net < 0.005) i++;
      if (winners[j].net < 0.005) j++;
    }
    return moves;
  }

  // ---------- friends (pure) ----------
  // FriendRequests = { incoming: [Friendship], outgoing: [Friendship], friends: [ParticipantRef] }
  // incoming/outgoing keep the raw Friendship (so a future UI can act on its id); friends
  // flattens to the other party's ref since there is no pending action on an accepted friendship.
  function friendRequestsFor(friendships, meRef) {
    const list = Array.isArray(friendships) ? friendships : [];
    const incoming = [];
    const outgoing = [];
    const friends = [];
    list.forEach(f => {
      if (!f) return;
      if (f.status === "pending") {
        if (sameIdentity(f.addressee, meRef)) incoming.push(f);
        else if (sameIdentity(f.requester, meRef)) outgoing.push(f);
      } else if (f.status === "accepted") {
        if (sameIdentity(f.requester, meRef)) friends.push(f.addressee);
        else if (sameIdentity(f.addressee, meRef)) friends.push(f.requester);
      }
    });
    return { incoming, outgoing, friends };
  }
  // Returns the new pending Friendship (pushed onto `friendships`), or null for a self-request,
  // or when a pending/accepted friendship already exists between the two in either direction.
  function createFriendRequest(friendships, fromRef, toRef, at) {
    const list = Array.isArray(friendships) ? friendships : [];
    if (sameIdentity(fromRef, toRef)) return null;
    const exists = list.some(f => f && (f.status === "pending" || f.status === "accepted") &&
      ((sameIdentity(f.requester, fromRef) && sameIdentity(f.addressee, toRef)) ||
       (sameIdentity(f.requester, toRef) && sameIdentity(f.addressee, fromRef))));
    if (exists) return null;
    const friendship = {
      id: newId(),
      requester: fromRef,
      addressee: toRef,
      status: "pending",
      createdAt: at,
      respondedAt: null,
    };
    friendships.push(friendship);
    return friendship;
  }
  // Returns false unless `id` names a pending friendship whose addressee is `meRef`; else sets
  // status to accepted/rejected and stamps respondedAt.
  function respondToFriendRequest(friendships, id, meRef, accept, at) {
    const list = Array.isArray(friendships) ? friendships : [];
    const friendship = list.find(f => f && f.id === id);
    if (!friendship || friendship.status !== "pending" || !sameIdentity(friendship.addressee, meRef)) return false;
    friendship.status = accept ? "accepted" : "rejected";
    friendship.respondedAt = at;
    return true;
  }

  // ---------- player exit (pure) ----------
  function exitPlayer(player, cashout, at) {
    if (!player || player.status === "exited") return false;
    const amount = Math.round(Number(cashout));
    if (!Number.isFinite(amount) || amount < 0) return false;
    player.status = "exited";
    player.exitedAt = at;
    player.cashout = amount;
    return true;
  }
  function updateExitCashout(player, cashout) {
    if (!player || player.status !== "exited") return false;
    const amount = Math.round(Number(cashout));
    if (!Number.isFinite(amount) || amount < 0) return false;
    player.cashout = amount;
    return true;
  }
  function activePlayers(players) {
    return players.filter(p => p.status !== "exited");
  }
  function exitedPlayers(players) {
    return players.filter(p => p.status === "exited");
  }
  function isExited(player) {
    return !!player && player.status === "exited";
  }

  // ---------- groups domain (pure) ----------
  // Pre-backend identity: userId is always null; guestId is the stable local identity
  // (resolveGuestId reuses one guestId per displayName across groups/history on this device).
  // ParticipantRef  = { userId: string|null, guestId: string|null, displayName: string }
  // Group           = { id, name, avatarDataUrl: string|null, createdBy: ParticipantRef, createdAt,
  //                     archivedAt: ISO|null, deletedAt: ISO|null }
  // GroupMember     = { id, groupId, userId: null, guestId, displayName, role: "admin"|"member",

      gameId: String(g.id || ""),
      phase: g.phase === "settlement" ? "settlement" : "active",
      groupId: g.group_id || null,
      startedAt: cloudIso(g.started_at),
      leaderRef: (leaderRow.profile_id || leaderRow.guest_id)
        ? identityRowToRef(leaderRow, ctx, leaderParticipant ? String(leaderParticipant.display_name_snapshot || "") : "")
        : null,
      players: rowsToPlayers(participantRows, entryRows, g.group_id || null, ctx),
      settlementStatuses: statuses,
    };
  }

  // THE single-slot rule, in one place. The app holds exactly one current game; the server may
  // legitimately hold several open ones (one per group). An empty, closed or example slot takes
  // the server's game, the same game replaces itself, and a DIFFERENT open game on this device
  // wins -- the local table is the one somebody is standing at. Documented limitation, not a bug:
  // the second open game becomes reachable only once that local one is closed.
  function pickCloudOpenGame(localGame, openGames) {
    const games = (Array.isArray(openGames) ? openGames : []).filter(Boolean);
    if (!games.length) return { action: "keep", game: null };
    const local = localGame || {};
    const localId = String(local.gameId || "");
    const localOpen = !!localId && !local.example && local.phase !== "closed";
    if (!localOpen) return { action: "load", game: games[0] };
    const same = games.find(g => String(g.gameId || g.id || "") === localId);
    if (same) return { action: "load", game: same };
    return { action: "keep", game: null };
  }
  // The realtime apply guard: never overwrite a table somebody is typing into, and never let one
  // game's events replace a different game's slot.
  function shouldApplyIncomingGame(localState, incoming, hasActiveInput) {
    if (!incoming) return false;
    if (hasActiveInput) return false;
    const local = localState || {};
    const localId = String(local.gameId || "");
    if (!localId || local.example || local.phase === "closed") return true;
    return localId === String(incoming.gameId || incoming.id || "");
  }


  function groupToRow(group, ctx) {
    const g = group || {};
    const creator = refToIdentityRow(g.createdBy, ctx);
    // groups.avatar_url is an object-storage URL; the local 96x96 avatarDataUrl has no column
    // and stays on the device (mergeCloudIntoState carries it across a pull).
    return {
      id: String(g.id || ""),
      name: String(g.name || "").trim().slice(0, 40),
      created_by_profile_id: creator.profile_id || (ctx || {}).profileId || null,
      created_at: cloudIsoOr(g.createdAt),
      archived_at: cloudIso(g.archivedAt),
      deleted_at: cloudIso(g.deletedAt),
    };
  }
  function rowToGroup(row, ctx) {
    const r = row || {};
    return {
      id: String(r.id || ""),
      name: String(r.name || ""),
      avatarDataUrl: null,
      createdBy: identityRowToRef({ profile_id: r.created_by_profile_id, guest_id: null }, ctx,
        cloudProfileName(r.created_by_profile_id, ctx)),
      createdAt: String(r.created_at || ""),
      archivedAt: cloudIso(r.archived_at),
      deletedAt: cloudIso(r.deleted_at),
    };
  }
