  function groupMemberToRow(member, ctx) {
    const m = member || {};
    const identity = refToIdentityRow({ userId: m.userId, guestId: m.guestId, displayName: m.displayName }, ctx);
    const status = m.status === "left" || m.status === "removed" ? m.status : "active";
    const joinedAt = cloudIsoOr(m.joinedAt);
    // hiddenAt has no column (see the schema follow-ups in the phase 2a report): it is a purely
    // device-local "drop this group from my dashboard" flag and must never reach another device.
    return {
      id: String(m.id || ""),
      group_id: String(m.groupId || ""),
      profile_id: identity.profile_id,
      guest_id: identity.guest_id,
      display_name_snapshot: String(m.displayName || ""),
      role: m.role === "admin" ? "admin" : "member",
      status,
      joined_at: joinedAt,
      // group_members_left_at_chk / group_members_active_chk: a former member must have a
      // left_at and an active one must not.
      left_at: status === "active" ? null : cloudIsoOr(m.leftAt, joinedAt),
    };
  }
  function rowToGroupMember(row, ctx) {
    const r = row || {};
    const name = String(r.display_name_snapshot || "");
    const status = r.status === "left" || r.status === "removed" ? r.status : "active";
    const ref = identityRowToRef(r, ctx, name);
    return {
      id: String(r.id || ""),
      groupId: String(r.group_id || ""),
      userId: ref.userId,
      guestId: ref.guestId,
      displayName: name,
      role: r.role === "admin" ? "admin" : "member",
      status,
      joinedAt: String(r.joined_at || ""),
      leftAt: status === "active" ? null : cloudIso(r.left_at),
      hiddenAt: null,
    };
  }

  function inviteToRow(invite, ctx) {
    const i = invite || {};
    const creator = refToIdentityRow(i.createdBy, ctx);
    // expires_at is deliberately not written: the local Invite has no expiry field, and sending
    // the column would wipe an expiry set anywhere else.
    return {
      id: String(i.id || ""),
      group_id: String(i.groupId || ""),
      token: String(i.token || ""),
      created_by_profile_id: creator.profile_id || (ctx || {}).profileId || null,
      created_at: cloudIsoOr(i.createdAt),
      revoked_at: cloudIso(i.revokedAt),
    };
  }
  function rowToInvite(row, ctx) {
    const r = row || {};
    return {
      id: String(r.id || ""),
      groupId: String(r.group_id || ""),
      token: String(r.token || ""),
      createdBy: identityRowToRef({ profile_id: r.created_by_profile_id, guest_id: null }, ctx,
        cloudProfileName(r.created_by_profile_id, ctx)),
      createdAt: String(r.created_at || ""),
      revokedAt: cloudIso(r.revoked_at),
    };
  }

  function friendshipToRow(friendship, ctx) {
    const f = friendship || {};
    const status = f.status === "accepted" || f.status === "rejected" ? f.status : "pending";
    const createdAt = cloudIsoOr(f.createdAt);
    return {
      id: String(f.id || ""),
      requester_profile_id: refToIdentityRow(f.requester, ctx).profile_id,
      addressee_profile_id: refToIdentityRow(f.addressee, ctx).profile_id,
      status,
      created_at: createdAt,
      // friendships_responded_chk: pending means no responded_at, answered means one.
      responded_at: status === "pending" ? null : cloudIsoOr(f.respondedAt, createdAt),
    };
  }
  function rowToFriendship(row, ctx) {
    const r = row || {};
    const status = r.status === "accepted" || r.status === "rejected" ? r.status : "pending";
    return {
      id: String(r.id || ""),
      requester: identityRowToRef({ profile_id: r.requester_profile_id, guest_id: null }, ctx,
        cloudProfileName(r.requester_profile_id, ctx)),
      addressee: identityRowToRef({ profile_id: r.addressee_profile_id, guest_id: null }, ctx,
        cloudProfileName(r.addressee_profile_id, ctx)),
      status,
      createdAt: String(r.created_at || ""),
      respondedAt: status === "pending" ? null : cloudIso(r.responded_at),
    };
  }

  // guests.display_name is CHECK (length(btrim(...)) BETWEEN 1 AND 40) and created_by must be the
  // pusher (guests_insert), so a guest row is only ever minted for a member this device knows.
  function guestToRow(guestId, displayName, createdBy) {
    const name = String(displayName || "").trim().slice(0, 40);
    return { id: String(guestId || ""), display_name: name || "אורח", created_by: String(createdBy || "") };
  }

  // What each table will accept. A row that fails here is dropped before the request rather than
  // sent and rejected — legacy "legacy-…" ids, a member with no identity, a token below the
  // schema's 8-character floor.
  const CLOUD_PUSHABLE = {
    guests: row => isCloudId(row.id) && !!row.display_name && isCloudId(row.created_by),
    groups: row => isCloudId(row.id) && !!row.name && isCloudId(row.created_by_profile_id),
    groupMembers: row => isCloudId(row.id) && isCloudId(row.group_id)
      && (isCloudId(row.profile_id) ? !row.guest_id : isCloudId(row.guest_id)),
    invites: row => isCloudId(row.id) && isCloudId(row.group_id)
      && String(row.token || "").length >= 8 && isCloudId(row.created_by_profile_id),
    friendships: row => isCloudId(row.id) && isCloudId(row.requester_profile_id)
      && isCloudId(row.addressee_profile_id) && row.requester_profile_id !== row.addressee_profile_id,
    games: row => isCloudId(row.id) && isCloudId(row.created_by)
      && (row.group_id === null || isCloudId(row.group_id))
      && !(row.leader_profile_id && row.leader_guest_id)
      && (row.phase === "closed"
        ? (!!row.closed_at && row.is_balanced !== null && row.balance_difference !== null)
        : !row.closed_at),
    gameParticipants: row => isCloudId(row.id) && isCloudId(row.game_id)
      && !!String(row.display_name_snapshot || "").trim()
      && (isCloudId(row.profile_id) ? !row.guest_id : isCloudId(row.guest_id))
      && (row.status === "exited" ? !!row.exited_at : !row.exited_at)
      && (row.cashout === null || (Number.isInteger(row.cashout) && row.cashout >= 0)),
    entries: row => isCloudId(row.id) && isCloudId(row.game_id) && isCloudId(row.participant_id)
      && Number.isInteger(row.amount) && row.amount > 0,
    transfers: row => isCloudId(row.id) && isCloudId(row.game_id)
      && isCloudId(row.from_participant_id) && isCloudId(row.to_participant_id)
      && row.from_participant_id !== row.to_participant_id
      && Number.isInteger(row.amount) && row.amount > 0 && !!row.settlement_key,
    debts: row => isCloudId(row.id) && isCloudId(row.game_id)
      && Number.isInteger(row.amount) && row.amount > 0
      && !!row.debtor_name && !!row.creditor_name
      && (isCloudId(row.debtor_profile_id) ? !row.debtor_guest_id : isCloudId(row.debtor_guest_id))
      && (isCloudId(row.creditor_profile_id) ? !row.creditor_guest_id : isCloudId(row.creditor_guest_id)),
  };

  // The whole push payload for one device, keyed in FK order (guests before the members that
  // reference them, groups before their children).
  function buildCloudRows(collections, ctx) {
    const c = collections || {};
    const myProfileId = (ctx || {}).profileId || null;
    const groups = (Array.isArray(c.groups) ? c.groups : [])
      .map(g => groupToRow(g, ctx)).filter(CLOUD_PUSHABLE.groups);
    const groupIds = new Set(groups.map(g => g.id));
    const groupMembers = (Array.isArray(c.groupMembers) ? c.groupMembers : [])
      .map(m => groupMemberToRow(m, ctx))
      .filter(m => CLOUD_PUSHABLE.groupMembers(m) && groupIds.has(m.group_id));
    const invites = (Array.isArray(c.invites) ? c.invites : [])
      .map(i => inviteToRow(i, ctx))
      .filter(i => CLOUD_PUSHABLE.invites(i) && groupIds.has(i.group_id));
    // RLS lets the requester create a pending request and only the addressee answer one, so a
    // row this device may not legally write is never attempted.
    const friendships = (Array.isArray(c.friendships) ? c.friendships : [])
      .map(f => friendshipToRow(f, ctx))
      .filter(f => CLOUD_PUSHABLE.friendships(f) && (f.status === "pending"
        ? f.requester_profile_id === myProfileId
        : f.addressee_profile_id === myProfileId));
    // Games. A game is all-or-nothing: if any of its participants has no identity the schema
    // could store (a legacy player, an ad-hoc guest this device never gave a guestId), the whole
    // game stays home rather than arriving on the server half-recorded.
    const games = [];
    const gamesClosed = [];
    const gameParticipants = [];
    const entries = [];
    const transfers = [];
    const pushedGameIds = new Set();
    const identityByGameName = new Map();
    (Array.isArray(c.games) ? c.games : []).forEach(snapshot => {
      if (!snapshot) return;
      const gameRow = gameToRow(snapshot, ctx);
      if (!CLOUD_PUSHABLE.games(gameRow)) return;
      const players = Array.isArray(snapshot.players) ? snapshot.players : [];
      if (!players.length) return;
      const participantRows = players.map(p => participantToRow(p, gameRow.id, ctx));
      if (!participantRows.every(CLOUD_PUSHABLE.gameParticipants)) return;
      const idByName = {};
      const identityByName = {};
      participantRows.forEach(row => {
        idByName[row.display_name_snapshot] = row.id;
        identityByName[row.display_name_snapshot] = { profile_id: row.profile_id, guest_id: row.guest_id };
      });
      const entryRows = [];
      let entriesOk = true;
      players.forEach(p => (Array.isArray(p.entryLog) ? p.entryLog : []).forEach(entry => {
        const row = entryToRow(entry, gameRow.id, p.id);
        if (!CLOUD_PUSHABLE.entries(row)) entriesOk = false;
        entryRows.push(row);
      }));
      if (!entriesOk) return;
      const transferRows = (Array.isArray(snapshot.transfers) ? snapshot.transfers : [])
        .map((transfer, index) => transferToRow(transfer, gameRow.id, index, idByName))
        .filter(CLOUD_PUSHABLE.transfers);
      (gameRow.phase === "closed" ? gamesClosed : games).push(gameRow);
      pushedGameIds.add(gameRow.id);
      identityByGameName.set(gameRow.id, identityByName);
      participantRows.forEach(row => gameParticipants.push(row));
      entryRows.forEach(row => entries.push(row));
      transferRows.forEach(row => transfers.push(row));
    });
    // Debts ride along with their game: without the participants there is no identity to write.
    const debts = [];
    const debtPayments = [];
    (Array.isArray(c.debts) ? c.debts : []).forEach(debt => {
      if (!debt || !pushedGameIds.has(String(debt.gameId || ""))) return;
      const identityByName = identityByGameName.get(String(debt.gameId)) || {};
      const row = debtToRow(debt, ctx, identityByName);
      if (!CLOUD_PUSHABLE.debts(row)) return;
      debts.push(row);
      const payment = debtPaymentRow(debt, ctx, identityByName);
      if (payment) debtPayments.push(payment);
    });
    const guests = [];
    const seenGuests = new Set();
    const addGuest = (guestId, displayName) => {
      if (!guestId || seenGuests.has(guestId)) return;
      seenGuests.add(guestId);
      const row = guestToRow(guestId, displayName, myProfileId);
      if (CLOUD_PUSHABLE.guests(row)) guests.push(row);
    };
    groupMembers.forEach(m => addGuest(m.guest_id, m.display_name_snapshot));
    gameParticipants.forEach(row => addGuest(row.guest_id, row.display_name_snapshot));
    return { guests, groups, groupMembers, invites, friendships,
      games, gameParticipants, entries, transfers, gamesClosed, debts, debtPayments };
  }

  // What changed since the baseline (the rows the last pull/push confirmed the server holds).
  // Deep-equal by JSON: both sides come out of the same mapper, so key order matches.
  function diffCollections(prevRows, nextRows, key) {
    const k = key || "id";
    const before = new Map();
    (Array.isArray(prevRows) ? prevRows : []).forEach(row => {
      if (row && row[k] != null) before.set(String(row[k]), row);
    });
    const upserts = [];
    const seen = new Set();
    (Array.isArray(nextRows) ? nextRows : []).forEach(row => {
      if (!row || row[k] == null) return;
      const id = String(row[k]);
      seen.add(id);
      const previous = before.get(id);
      if (!previous || JSON.stringify(previous) !== JSON.stringify(row)) upserts.push(row);
    });
    const deletes = [];
    before.forEach((row, id) => { if (!seen.has(id)) deletes.push(row); });
    return { upserts, deletes };
  }

  // The server owns groups / groupMembers / invites / friendships; every other collection on the
  // state document (players, history, debts, settlementStatuses, …) is passed through untouched.
  // Three things still have to survive a pull:
  //   * local-only fields with no column — a group's avatarDataUrl and my own hiddenAt;
  //   * records the server could not have returned — a legacy non-uuid id or one this device has
  //     not confirmed pushing yet (options.keepLocalIds), which is what makes first-device
  //     seeding safe;
  //   * everything under a group this device soft-deleted, because RLS hides a deleted group
  //     from SELECT and the local tombstone still titles that group's closed games.
  function mergeCloudIntoState(state, pulled, options) {
    const s = state || {};
    const p = pulled || {};
    const keep = new Set(((options || {}).keepLocalIds || []).map(String));
    const byId = list => {
      const map = new Map();
      (Array.isArray(list) ? list : []).forEach(record => {
        if (record && record.id) map.set(String(record.id), record);
      });
      return map;
    };
    const localGroups = Array.isArray(s.groups) ? s.groups : [];
    const pulledGroups = Array.isArray(p.groups) ? p.groups : [];
    const serverGroupIds = new Set(pulledGroups.map(g => String(g.id)));
    const prevGroups = byId(localGroups);
    const prevMembers = byId(s.groupMembers);
    const keptGroups = localGroups.filter(g => g && g.id && !serverGroupIds.has(String(g.id))
      && (keep.has(String(g.id)) || !!g.deletedAt));
    const keptGroupIds = new Set(keptGroups.map(g => String(g.id)));
    const isKeptChild = record => !!record && !!record.id
      && (keep.has(String(record.id)) || keptGroupIds.has(String(record.groupId)));
    const mergeKept = (pulledList, localList, mergeOne) => {
      const merged = (Array.isArray(pulledList) ? pulledList : []).map(mergeOne);
      const mergedIds = new Set(merged.map(record => String(record.id)));
      return merged.concat((Array.isArray(localList) ? localList : [])
        .filter(record => isKeptChild(record) && !mergedIds.has(String(record.id))));
    };
    return {
      ...s,
      // The four group collections move together, and only when the caller actually fetched them:
      // a realtime update that carries nothing but the open game must not blank them.
      ...(Array.isArray(p.groups) ? {
        groups: pulledGroups.map(g => {
          const before = prevGroups.get(String(g.id));
          return before ? { ...g, avatarDataUrl: before.avatarDataUrl } : g;
        }).concat(keptGroups),
        groupMembers: mergeKept(p.groupMembers, s.groupMembers, m => {
          const before = prevMembers.get(String(m.id));
          return before ? { ...m, hiddenAt: before.hiddenAt } : m;
        }),
        invites: mergeKept(p.invites, s.invites, i => i),
        friendships: mergeKept(p.friendships, s.friendships, f => f),
      } : {}),
      // The server owns a closed game once it holds one; a local-only entry (legacy, or closed
      // before this device ever had a session) simply stays. Newest first, like unshift() leaves it.
      ...(Array.isArray(p.history) ? { history: mergeCloudHistory(s.history, p.history) } : {}),
      // A debt is server-owned by id too, so a "paid" flipped on another device lands here.
      ...(Array.isArray(p.debts) ? { debts: mergeCloudDebts(s.debts, p.debts) } : {}),
      // The current-game slot: only ever replaced by pickCloudOpenGame's decision.
      ...(p.game ? {
        example: false,
        gameId: p.game.gameId,
        phase: p.game.phase,
        groupId: p.game.groupId || null,
        startedAt: p.game.startedAt || null,
        leaderRef: p.game.leaderRef || null,
        players: p.game.players || [],
        settlementStatuses: p.game.settlementStatuses
          || (s.settlementStatuses && typeof s.settlementStatuses === "object" ? s.settlementStatuses : {}),
      } : {}),
    };
  }
  function mergeCloudHistory(localHistory, pulledHistory) {
    const local = Array.isArray(localHistory) ? localHistory : [];
    const pulled = Array.isArray(pulledHistory) ? pulledHistory : [];
    const serverIds = new Set(pulled.map(entry => String(entry && entry.gameId)));
    const merged = pulled.concat(local.filter(entry => entry && !serverIds.has(String(entry.gameId))));
    return merged.sort((a, b) => String((b && b.at) || "").localeCompare(String((a && a.at) || "")));
  }
  function mergeCloudDebts(localDebts, pulledDebts) {
    const local = Array.isArray(localDebts) ? localDebts : [];
    const pulled = Array.isArray(pulledDebts) ? pulledDebts : [];
    const serverIds = new Set(pulled.map(debt => String(debt && debt.id)));
    return pulled.concat(local.filter(debt => debt && !serverIds.has(String(debt.id))));
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  // Replays the shake animation on an input to signal invalid entry.
  function shakeEl(inp) {
    inp.classList.remove("shake");
    void inp.offsetWidth; // restart the animation
    inp.classList.add("shake");
    inp.focus();
  }
  function toggleTheme() {
    const nowLight = document.documentElement.dataset.theme !== "light";
    if (nowLight) document.documentElement.dataset.theme = "light";
    else delete document.documentElement.dataset.theme;
    try { localStorage.setItem(THEME_KEY, nowLight ? "light" : "dark"); } catch (e) {}
    renderThemeIcon();
  }

  // Plays the picker's collapse transition, then runs `done`. A call that
  // arrives while a close is already animating is DROPPED (not queued) —
  // this is what makes a rapid double-tap on a confirm harmless.
  let menuClosing = false;
  function animateMenuClose(done) {
    if (menuClosing) return;
    const m = document.querySelector(".pmenu.open");
    if (!m) { done(); return; }
    menuClosing = true;
    const plus = document.querySelector(".btn-plus.open");
    if (plus) plus.classList.remove("open");
    m.classList.remove("open");
    setTimeout(() => { menuClosing = false; done(); }, 300);
  }

  // Opens (or closes) the inline exit/cashout capsule for a player, reusing
  // the same .pmenu collapse animation as the buy-in menu. Only one of the
  // two kinds of panel is ever open at a time, across the whole table.
  function openExitPanel(name) {
    if (markReal()) { save(); render(); return; } // first touch wipes the demo data
    const opening = exitOpen !== name;
    if (!opening) {
      const closingFor = name;
      animateMenuClose(() => {
        if (exitOpen === closingFor) { exitOpen = null; render(); }
      });
      return;
    }
    const open = () => {
      exitOpen = name;
      exitJustOpened = name;
      render();
    };
    if (openMenu) {
      const closingFor = openMenu;
      animateMenuClose(() => {
        if (openMenu === closingFor) { openMenu = null; customOpen = null; pendingAmount = null; }
        open();
      });
    } else {
      open();
    }
  }

  // Confirms a buy-in: the picker collapses, then the money lands with a
  // count-up animation on the player's total, plus a light haptic.
  function confirmBuyin(p, idx, amount) {
    if (menuClosing) return; // a confirm is already in flight
    pendingAmount = null;
    dirtyUntil = Date.now() + 6000; // block remote overwrites during the animation window
    const closingFor = p.name;
    animateMenuClose(() => {
      // re-resolve the player: a remote sync may have replaced `state` meanwhile
      const player = state.players.find(x => x.id === p.id);
      if (openMenu === closingFor) { openMenu = null; customOpen = null; }
      if (!player) { render(); return; }
      const from = sum(player.buyins);
      addEntry(player, amount);
      save();
      try { if (navigator.vibrate) navigator.vibrate(20); } catch (e) {}
      render();
      const nidx = state.players.indexOf(player);
      const fresh = document.querySelectorAll(".prow")[nidx];
      const totalEl = fresh && fresh.querySelector(".pmeta b");
      if (totalEl) countUp(totalEl, from, from + amount);
    });
  }

  function countUp(elm, from, to) {
    const dur = 650;
    const t0 = performance.now();
    (function tick(now) {
      const t = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      elm.textContent = fmt(Math.round(from + (to - from) * eased));
      if (t < 1) requestAnimationFrame(tick);
      else {
        elm.classList.add("pulse");
        setTimeout(() => elm.classList.remove("pulse"), 600);
      }
    })(t0);
  }

  function setAppView(nextView) {
    // Leaving the table (game/settle) with nobody seated: the game never existed — reset the slot
    // to a closed empty game (newCurrentGame keeps groups/history/debts) with no history entry.
    // Strict guard: only a real (non-example) open phase with zero players is ever discarded.
    const leavingTable = (appView === "game" || appView === "settle") && nextView !== "game" && nextView !== "settle";
    if (leavingTable && isEmptyOpenGame(state)) {
      state = newCurrentGame(state, { phase: "closed" });
      expandedEntries.clear();
      save();
    }
    appView = nextView;
    if (nextView !== "game") { openMenu = null; customOpen = null; exitOpen = null; exitJustOpened = null; }
    if (nextView !== "settle") {
      clearCloseHold();
      forceCloseArmed = false;
      forceCloseUnlocked = false;
      forceCloseUnlockDifference = null;
      longPressJustUnlocked = false;
      clearTimeout(closeArmTimer);
      closeArmTimer = null;
      closeArmed = false;
      const closeBtn = document.getElementById("closeTableBtn");
      if (closeBtn) {
        closeBtn.classList.remove("warn-state");
        setCloseButtonLabel(closeBtn, "סגירת שולחן ורישום לרקורד");
      }
    }
    resetStartGamePanel();
    resetCreateGroupPanel();
    disarmRemoveMember();
    memberActionsOpenId = null;
    memberActionsJustOpenedId = null;
    clearTimeout(hideGroupArmedTimeout);
    hideGroupArmed = false;
    animNext = "all";
    groupPageEnterNext = nextView === "group";
    gamesPageEnterNext = nextView === "games";
    render();
    flashViewEnter(nextView);
  }

  // Short fade+rise on the container that just became visible after a view switch (games/group
  // share #gamesHome; game/settle share #rows; profile/friends use their own sections). Adds the shared .load-in
  // class and removes it once its animation finishes so the next switch can replay it.
  function flashViewEnter(nextView) {
    const id = nextView === "profile" ? "profile" : nextView === "friends" ? "friendsPage" : (nextView === "game" || nextView === "settle") ? "rows" : "gamesHome";
    const container = document.getElementById(id);
    if (!container) return;
    container.classList.remove("load-in");
    void container.offsetWidth; // force reflow so re-adding the class restarts the animation
    container.classList.add("load-in");
    // B1: under prefers-reduced-motion the CSS kills the animation, so animationend never fires —
    // registering the listener anyway would leak one more never-firing listener on every view
    // switch. Skip it there; either way, a capped setTimeout fallback guarantees the class never
    // sticks even if animationend is missed for some other reason (e.g. an interrupted animation).
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      container.addEventListener("animationend", () => container.classList.remove("load-in"), { once: true });
    }
    setTimeout(() => container.classList.remove("load-in"), 600);
  }

  // Refused while a real game (with players) is open — newCurrentGame would silently replace it.
  // The dashboard renders the quick action disabled in that state; this guard is the backstop.
  function startUngroupedGame() {
    if (isGameOpen(state)) return;
    state = newCurrentGame(state, { phase: "active", startedAt: new Date().toISOString(), groupId: null });
    expandedEntries.clear();
    openMenu = null; customOpen = null; pendingAmount = null; exitOpen = null; exitJustOpened = null;
    save();
    setAppView("game");
  }

  // Starts a game linked to a group: guarded by canStartGroupGame (the single-open-game rule)
  // and needing at least one participant. Each participant becomes a Player via the shared
  // createPlayer helper plus an immediate first buy-in (same product rule as addPlayer).
  function startGroupGame(groupId, participants) {
    const list = dedupeParticipants(participants);
    if (!canStartGroupGame(collectionsOf(state), groupId).ok || list.length < 1) return false;
    if (!findMyMembership(state.groupMembers, groupId, me)) return false;
    state = newCurrentGame(state, {
      phase: "active",
      groupId,
      startedAt: new Date().toISOString(),
      leaderRef: { userId: null, guestId: resolveGuestId(collectionsOf(state), me), displayName: me },
    });
    list.forEach(participant => {
      const player = createPlayer(participant);
      addEntry(player, MIN_BUYIN);
      state.players.push(player);
    });
    expandedEntries.clear();
    openMenu = customOpen = pendingAmount = null;
    animNext = "all";
    save();
    setAppView("game");
    return true;
  }

  function continueCurrentGame() {
    if (!isGameOpen(state)) return;
    setAppView(state.phase === "settlement" ? "settle" : "game");
  }

  function openGroup(groupId) {
    currentGroupId = String(groupId || "");
    setAppView("group");
  }

  // Creates a group and its creator admin membership. Requires a signed-in name; when there
  // isn't one the create panel stays open (with whatever was typed) and the user tries again
  // once they've picked a name in the login screen.
  function createGroup({ name, avatarDataUrl }) {
    if (!me) { showLogin(); return; }
    const at = new Date().toISOString();
    const guestId = resolveGuestId(collectionsOf(state), me);
    const { group, member } = buildGroupCreation(me, name, avatarDataUrl || null, guestId, at);
    state.groups.push(group);
    state.groupMembers.push(member);
    save();
    resetCreateGroupPanel(); // plain reset: openGroup's render replaces the dashboard next anyway
    openGroup(group.id);
  }

  // Fills a Uint8Array(8) with real randomness for a fresh invite token: crypto.getRandomValues
  // when available, Math.random otherwise. Not part of the pure section — it is the one place
  // that actually reaches for randomness; generateInviteToken() itself stays deterministic.
  function randomInviteBytes() {
    const bytes = new Uint8Array(8);
    if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function") crypto.getRandomValues(bytes);
    else for (let i = 0; i < 8; i++) bytes[i] = Math.floor(Math.random() * 256);
    return bytes;
  }

  function createGroupInvite(groupId) {
    const at = new Date().toISOString();
    const byRef = { userId: null, guestId: resolveGuestId(collectionsOf(state), me), displayName: me };
    createInvite(state.invites, groupId, byRef, generateInviteToken(randomInviteBytes()), at);
    save();
    renderGroupPage();
    refreshGroupSettings(); // the invite block lives in the settings overlay now (D1)
  }

  function revokeGroupInvite(groupId) {
    const invite = activeInvite(state.invites, groupId);
    if (!invite) return;
    revokeInvite(state.invites, invite.id, new Date().toISOString());
    save();
    renderGroupPage();
    refreshGroupSettings(); // the invite block lives in the settings overlay now (D1)
  }

  function resetCreateGroupPanel() {
    createGroupOpen = false;
    createGroupJustOpened = false;
    createGroupName = "";
    createGroupAvatarDataUrl = null;
  }

  function toggleCreateGroupPanel() {
    if (createGroupOpen) { closeCreateGroupPanel(); return; }
    createGroupOpen = true;
    createGroupJustOpened = true;
    renderGamesDashboard();
  }

  // Plays the panel's collapse transition (matching animateMenuClose's approach for .pmenu)
  // before clearing the draft name/avatar and rebuilding the dashboard without it.
  function closeCreateGroupPanel() {
    const panel = document.querySelector(".games-create-panel.open");
    const finish = () => { resetCreateGroupPanel(); renderGamesDashboard(); };
    if (!panel) { finish(); return; }
    panel.classList.remove("open");
    setTimeout(finish, 280);
  }

  // Adds a guest member by typed name (no accounts yet — see groups-domain decision doc:
  // userId stays null, resolveGuestId keeps one guestId per displayName on this device). A
  // duplicate active identity/displayName in the group is refused; the caller shakes its input.
  function addMemberByName(groupId, name) {
    const trimmed = String(name || "").trim();
    if (!trimmed) return null;
    const group = state.groups.find(g => g && g.id === groupId);
    if (!group) return null;
    const at = new Date().toISOString();
    const guestId = resolveGuestId(collectionsOf(state), trimmed);
    const ref = { userId: null, guestId, displayName: trimmed };
    const member = addGroupMember(state.groupMembers, group, ref, "member", at);
    if (!member) return null;
    save();
    renderGroupPage();
    return member; // the caller (renderAddMemberPanel) refreshes the overlay as it closes
  }

  // Removes (soft) a member from a group; see removeGroupMember for the history-preserving
  // and last-admin-guard rules. Scoped to groupId so a stale memberId can't cross groups.
  function removeMember(groupId, memberId) {
    const member = state.groupMembers.find(m => m && m.id === memberId && m.groupId === groupId);
    if (!member) return false;
    if (!removeGroupMember(state.groupMembers, memberId, new Date().toISOString())) return false;
    save();
    renderGroupPage();
    return true;
  }

  // Promotes a member to admin (cheap admin transfer/second-admin, Task 14). Scoped to groupId
  // like removeMember, above.
  function promoteMember(groupId, memberId) {
    const member = state.groupMembers.find(m => m && m.id === memberId && m.groupId === groupId);
    if (!member) return false;
    if (!setMemberRole(state.groupMembers, memberId, "admin")) return false;
    save();
    renderGroupPage();
    return true;
  }

  // The mirror of promoteMember (D3's "הסר ניהול"). setMemberRole keeps the last-admin guard,
  // so demoting the group's only admin is refused there, not here.
  function demoteMember(groupId, memberId) {
    const member = state.groupMembers.find(m => m && m.id === memberId && m.groupId === groupId);
    if (!member) return false;
    if (!setMemberRole(state.groupMembers, memberId, "member")) return false;
    save();
    renderGroupPage();
    return true;
  }

  // Resizes/crops an image file to a 96×96 JPEG data URL (cover crop, quality 0.8) for a
  // group avatar. DOM-dependent (canvas/Image), so it lives outside the pure domain section.
  function resizeAvatarImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const size = 96;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("avatar image failed to load")); };
      img.src = url;
    });
  }

  // Builds the { groups, groupMembers, history, currentGame } shape the pure groups-domain
  // adapters take as input, from the single persisted state document.
  function collectionsOf(state) {
    return {
      groups: state.groups,
      groupMembers: state.groupMembers,
      history: state.history,
      currentGame: {
        gameId: state.gameId,
        phase: state.phase,
        groupId: state.groupId,
        players: state.players,
        startedAt: state.startedAt,
        example: state.example,
      },
    };
  }

  // groups is optional (existing single-argument callers/tests keep working): when omitted, or
  // when gameState.groupId doesn't match a group in it, title falls back to "משחק ללא קבוצה". A
  // match resolves the group's name even when the group is archived.
  function getActiveGameSummaries(gameState, groups) {
    if (!isGameOpen(gameState)) return []; // an empty table is not a game (see isGameOpen)
    const validTime = value => typeof value === "string" && !Number.isNaN(Date.parse(value)) ? value : null;
    const players = (Array.isArray(gameState.players) ? gameState.players : []).map(player => {
      const buyins = Array.isArray(player.buyins) ? player.buyins : [];
      return {
        id: String(player.id || ""),
        name: String(player.name || ""),
        buyinTotal: buyins.reduce((total, amount) => total + Math.round(Number(amount) || 0), 0),
        entryCount: buyins.length,
      };
    });
    const groupList = Array.isArray(groups) ? groups : [];
    const matchedGroup = gameState.groupId ? groupList.find(g => g && g.id === gameState.groupId) : null;
    return [{
      gameId: String(gameState.gameId || ""),
      title: matchedGroup ? matchedGroup.name : "משחק ללא קבוצה",
      phase: gameState.phase,
      playerCount: players.length,
      playerNames: players.map(player => player.name),
      players,
      potSize: players.reduce((total, player) => total + player.buyinTotal, 0),
      totalEntries: players.reduce((total, player) => total + player.entryCount, 0),
      startedAt: validTime(gameState.startedAt),
      updatedAt: validTime(gameState.updatedAt),
    }];
  }

  function formatGameTime(timestamp) {
    if (!timestamp) return "";
    const date = new Date(timestamp);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
  }

  // Short form for group last-game/history rows: day + short month name, no year.
  function formatShortGameDate(timestamp) {
    if (!timestamp) return "";
    const date = new Date(timestamp);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleDateString("he-IL", { day: "numeric", month: "short" });
  }

  function formatPlayerNames(names) {
    const clean = (Array.isArray(names) ? names : []).filter(Boolean);
    if (!clean.length) return "אין שחקנים עדיין";
    const visible = clean.slice(0, 4).join(", ");
    return clean.length > 4 ? visible + " +" + (clean.length - 4) : visible;
  }

  function formatPlayerCount(count) {
    return count === 1 ? "שחקן אחד" : count + " שחקנים";
  }

  function formatEntryCount(count) {
    return count === 1 ? "כניסה אחת" : count + " כניסות";
  }

  function formatMemberCount(count) {
    return count === 1 ? "חבר אחד" : count + " חברים";
  }

  function formatGamesPlayedCount(count) {
    return count === 1 ? "משחק אחד" : count + " משחקים";
  }

  function formatWinsCount(count) {
    return count === 1 ? "ניצחון אחד" : count + " ניצחונות";
  }

  function renderQuickActions(parent) {
    // D7: no section title — the two capsules explain themselves and sit straight under the lead.
    const section = el("section", "games-section games-quick-section");
    const actions = el("div", "games-quick-actions");

    const createGroupBtn = el("button", "games-quick-action primary", "+ צור קבוצה");
    createGroupBtn.type = "button";
    createGroupBtn.setAttribute("aria-expanded", String(createGroupOpen));
    createGroupBtn.addEventListener("click", toggleCreateGroupPanel);

    const start = el("button", "games-quick-action", "משחק ללא קבוצה");
    start.type = "button";
    // Data-loss guard: while a game with players is open the slot is taken — the active card's
    // "כנס לשולחן"/"המשך סגירה" is the way in. Same disabled + quiet reason pattern as the group
    // page's "התחל משחק" (renderGroupPrimaryAction), same wording.
    const gameOpen = isGameOpen(state);
    if (gameOpen) {
      start.disabled = true;
      start.setAttribute("aria-disabled", "true");
    } else start.addEventListener("click", startUngroupedGame);

    actions.append(createGroupBtn, start);
    section.appendChild(actions);
    if (gameOpen) section.appendChild(el("p", "games-primary-reason", "יש משחק פעיל אחר — סגור אותו קודם"));
    renderCreateGroupPanel(section);
    parent.appendChild(section);
  }

  function renderCreateGroupPanel(parent) {
    const panel = el("div", "games-create-panel");
    const panelIn = el("div", "games-create-panel-in");
    const content = el("div", "games-create-panel-content");
    content.appendChild(el("h3", "games-section-title", "קבוצה חדשה"));

    const avatarBtn = el("button", "games-create-avatar");
    avatarBtn.type = "button";
    avatarBtn.setAttribute("aria-label", "הוספת תמונה לקבוצה");
    const applyAvatarPreview = () => {
      avatarBtn.innerHTML = "";
      if (createGroupAvatarDataUrl) {
        const img = document.createElement("img");
        img.src = createGroupAvatarDataUrl;
        img.alt = "";
        avatarBtn.appendChild(img);
      } else {
        avatarBtn.textContent = (createGroupName.trim() || "?").slice(0, 1);
      }
    };
    applyAvatarPreview();

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.hidden = true;
    fileInput.setAttribute("aria-hidden", "true");
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      if (!file) return;
      try {
        createGroupAvatarDataUrl = await resizeAvatarImage(file);
        applyAvatarPreview();
      } catch (e) {}
    });
    avatarBtn.addEventListener("click", () => fileInput.click());

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.maxLength = 40;
    nameInput.placeholder = "שם הקבוצה";
    nameInput.autocomplete = "off";
    nameInput.setAttribute("aria-label", "שם הקבוצה");
    nameInput.value = createGroupName;
    nameInput.addEventListener("input", () => {
      createGroupName = nameInput.value;
      if (!createGroupAvatarDataUrl) applyAvatarPreview();
    });

    const submit = () => {
      const name = nameInput.value.trim();
      if (!name) { shakeEl(nameInput); return; }
      createGroup({ name, avatarDataUrl: createGroupAvatarDataUrl });
    };
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
    });

    const submitBtn = el("button", "games-create-submit", "צור קבוצה");
    submitBtn.type = "button";
    submitBtn.addEventListener("click", submit);

    const cancelBtn = el("button", "games-create-cancel", "ביטול");
    cancelBtn.type = "button";
    cancelBtn.addEventListener("click", closeCreateGroupPanel);

    content.append(avatarBtn, fileInput, nameInput, submitBtn, cancelBtn);
    panelIn.appendChild(content);
    panel.appendChild(panelIn);

    if (createGroupOpen && createGroupJustOpened) {
      createGroupJustOpened = false;
      requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.add("open")));
    } else if (createGroupOpen) {
      panel.classList.add("open");
    }
    parent.appendChild(panel);
  }

  function renderActiveGameCard(summary, actions) {
    const card = el("article", "games-active-card" + (actions.anim ? " anim" : ""));
    if (actions.anim) card.style.animationDelay = (actions.animDelay || 0) + "ms";
    const status = el("span", "games-card-status" + (summary.phase === "settlement" ? " settlement" : ""), summary.phase === "settlement" ? "בסגירה" : "משחק פעיל");
    card.appendChild(status);
    if (summary.title) card.appendChild(el("span", "games-card-title", summary.title));
    card.appendChild(el("span", "games-card-meta", formatPlayerCount(summary.playerCount) + " · " + formatPlayerNames(summary.playerNames)));
    if (summary.startedAt) card.appendChild(el("span", "games-card-time", "התחיל ב־" + formatGameTime(summary.startedAt)));

    const cardActions = el("div", "games-card-actions");
    const enter = el("button", "games-card-enter", "כנס לשולחן");
    enter.type = "button";
    enter.addEventListener("click", actions.onEnter);
    const toggle = el("button", "games-card-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", actions.expanded ? "true" : "false");
    toggle.innerHTML = '<span>' + (actions.expanded ? "כווץ" : "הרחב") + '</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3 3.5-3"></path></svg>';
    toggle.addEventListener("click", actions.onToggle);
    cardActions.append(enter, toggle);
    card.appendChild(cardActions);

    const details = el("div", "games-card-details" + (actions.expanded ? " open" : ""));
    const detailsIn = el("div", "games-card-details-in");
    const content = el("div", "games-card-details-content");
    if (summary.players.length) {
      summary.players.forEach(player => {
        const row = el("div", "games-detail-row");
        row.append(el("span", "games-detail-name", player.name), el("span", "games-detail-meta", fmt(player.buyinTotal) + " · " + formatEntryCount(player.entryCount)));
        content.appendChild(row);
      });
    } else {
      content.appendChild(el("p", "games-empty", "אין שחקנים עדיין"));
    }
    const totalsLine = el("p", "games-detail-totals");
    totalsLine.append(el("span", "", "בקופה "), el("b", "", fmt(summary.potSize)), el("span", "", " · " + formatEntryCount(summary.totalEntries)));
    content.appendChild(totalsLine);
    if (summary.startedAt) content.appendChild(el("p", "games-detail-totals", "התחלה · " + formatGameTime(summary.startedAt)));
    if (summary.updatedAt) content.appendChild(el("p", "games-detail-totals", "עדכון אחרון · " + formatGameTime(summary.updatedAt)));
    detailsIn.appendChild(content);
    details.appendChild(detailsIn);
    card.appendChild(details);
    return card;
  }

  function renderActiveGamesSection(parent, summaries, enterStagger) {
    const section = el("section", "games-section");
    section.appendChild(el("h3", "games-section-title", "משחקים פעילים"));
    if (!summaries.length) {
      section.appendChild(el("p", "games-empty", "אין משחקים פעילים כרגע"));
    } else {
      summaries.forEach((summary, idx) => {
        section.appendChild(renderActiveGameCard(summary, {
          expanded: expandedGameCards.has(summary.gameId),
          anim: enterStagger,
          animDelay: idx * 50,
          onEnter: () => enterActiveGame(summary.gameId),
          onToggle: () => {
            expandedGameCards.has(summary.gameId) ? expandedGameCards.delete(summary.gameId) : expandedGameCards.add(summary.gameId);
            renderGamesDashboard();
          },
        }));
      });
    }
    parent.appendChild(section);
  }

  function renderGroupCard(group, actions) {
    const card = el("article", "games-group-card" + (actions.anim ? " anim" : ""));
    if (actions.anim) card.style.animationDelay = (actions.animDelay || 0) + "ms";
    const head = el("div", "games-group-head");
    head.setAttribute("role", "button");
    head.setAttribute("tabindex", "0");
    head.setAttribute("aria-label", "פתח את " + String(group.name || "הקבוצה"));
    head.addEventListener("click", actions.onOpen);
    head.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); actions.onOpen(); }
    });
    if (group.avatarDataUrl) {
      const avatar = el("img", "games-group-avatar");
      avatar.src = group.avatarDataUrl;
      avatar.alt = "";
      head.appendChild(avatar);
    } else {
      head.appendChild(el("span", "games-group-avatar", String(group.name || "?").slice(0, 1)));
    }
    const copy = el("div", "");
    const titleSpan = el("span", "games-card-title", String(group.name || ""));
    if (actions.archived) titleSpan.appendChild(el("span", "games-member-tag", "בארכיון"));
    copy.appendChild(titleSpan);
    const meta = el("span", "games-card-meta", formatMemberCount(Number(group.memberCount || 0)));
    if (group.hasActiveGame) {
      const isSettlement = group.activeGamePhase === "settlement";
      meta.appendChild(document.createTextNode(" · "));
      meta.appendChild(el("span", "games-card-status" + (isSettlement ? " settlement" : ""), isSettlement ? "בסגירה" : "משחק פעיל"));
    }
    copy.appendChild(meta);
    head.appendChild(copy);
    card.appendChild(head);

    const memberNames = Array.isArray(group.members) ? group.members : [];
    const lastGameLabel = group.lastGameAt ? formatShortGameDate(group.lastGameAt) : "";
    const leaderNames = Array.isArray(group.leaderNames) ? group.leaderNames : [];
    const hasDetails = memberNames.length || lastGameLabel || Number.isFinite(group.gameCount) || leaderNames.length;
    if (hasDetails) {
      const toggle = el("button", "games-card-toggle");
      toggle.type = "button";
      toggle.setAttribute("aria-expanded", actions.expanded ? "true" : "false");
      toggle.innerHTML = '<span>' + (actions.expanded ? "כווץ" : "הרחב") + '</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3 3.5-3"></path></svg>';
      toggle.addEventListener("click", actions.onToggle);
      card.appendChild(toggle);
      const details = el("div", "games-card-details");
      const detailsIn = el("div", "games-card-details-in");
      const content = el("div", "games-card-details-content");
      if (memberNames.length) content.appendChild(el("p", "games-detail-totals", "חברים · " + formatPlayerNames(memberNames)));
      if (Number.isFinite(group.gameCount)) content.appendChild(el("p", "games-detail-totals", "משחקים · " + group.gameCount));
      if (lastGameLabel) content.appendChild(el("p", "games-detail-totals", "משחק אחרון · " + lastGameLabel));
      if (leaderNames.length) content.appendChild(el("p", "games-detail-totals", "מוביל · " + leaderNames[0]));
      detailsIn.appendChild(content);
      details.appendChild(detailsIn);
      // First expand of this card plays the grid-collapse open transition (see cardDetailsJustOpenedId).
      const groupIdForAnim = String(group.groupId || "");
      if (actions.expanded && cardDetailsJustOpenedId === groupIdForAnim) {
        cardDetailsJustOpenedId = null;
        requestAnimationFrame(() => requestAnimationFrame(() => details.classList.add("open")));
      } else if (actions.expanded) {
        details.classList.add("open");
      }
      card.appendChild(details);
    }
    return card;
  }

  function renderGroupsSection(parent, groups, enterStagger) {
    const section = el("section", "games-section");
    section.appendChild(el("h3", "games-section-title", "הקבוצות שלי"));
    if (!groups.length) {
      section.appendChild(el("p", "games-empty", "אין לך קבוצות עדיין"));
    } else {
      groups.forEach((group, idx) => {
        const groupId = String(group.groupId || "");
        section.appendChild(renderGroupCard(group, {
          expanded: expandedGroupCards.has(groupId),
          anim: enterStagger,
          animDelay: idx * 50,
          onToggle: () => {
            if (expandedGroupCards.has(groupId)) expandedGroupCards.delete(groupId);
            else { expandedGroupCards.add(groupId); cardDetailsJustOpenedId = groupId; }
            renderGamesDashboard();
          },
          onOpen: () => openGroup(groupId),
        }));
      });
    }
    parent.appendChild(section);
  }

  // Collapsed "ארכיון (N)" line under "הקבוצות שלי", shown only when archived-not-deleted groups
  // exist on this device — same grid-collapse pattern as renderFormerMembers below. Reuses
  // renderGroupCard with the "archived" tag; opening a card leads to the read-only archived group page.
  function renderArchivedGroupsSection(parent, archived) {
    const list = Array.isArray(archived) ? archived : [];
    if (!list.length) return;
    const wrap = el("div", "games-former-members");
    const toggle = el("button", "games-former-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", String(archivedGroupsOpen));
    toggle.innerHTML = "<span>ארכיון (" + list.length + ")</span>" +
      '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3 3.5-3"></path></svg>';
    toggle.addEventListener("click", () => {
      if (archivedGroupsOpen) { closeArchivedGroups(); return; }
      archivedGroupsOpen = true;
      archivedGroupsJustOpened = true;
      renderGamesDashboard();
    });
    wrap.appendChild(toggle);

    const details = el("div", "games-card-details");
    const detailsIn = el("div", "games-card-details-in");
    const content = el("div", "games-card-details-content");
    list.forEach(group => {
      const groupId = String(group.groupId || "");
      content.appendChild(renderGroupCard(group, {
        expanded: expandedGroupCards.has(groupId),
        archived: true,
        onToggle: () => {
          if (expandedGroupCards.has(groupId)) expandedGroupCards.delete(groupId);
          else { expandedGroupCards.add(groupId); cardDetailsJustOpenedId = groupId; }
          renderGamesDashboard();
        },
        onOpen: () => openGroup(groupId),
      }));
    });
    detailsIn.appendChild(content);
    details.appendChild(detailsIn);
    if (archivedGroupsOpen && archivedGroupsJustOpened) {
      archivedGroupsJustOpened = false;
      requestAnimationFrame(() => requestAnimationFrame(() => details.classList.add("open")));
    } else if (archivedGroupsOpen) {
      details.classList.add("open");
    }
    wrap.appendChild(details);
    parent.appendChild(wrap);
  }
  // Plays the archive list's collapse transition (matching closeAddMemberPanel's approach)
  // before flipping the state and rebuilding the dashboard without it.
  function closeArchivedGroups() {
    const panel = document.querySelector(".games-former-members .games-card-details.open");
    const finish = () => { archivedGroupsOpen = false; archivedGroupsJustOpened = false; renderGamesDashboard(); };
    if (!panel) { finish(); return; }
    panel.classList.remove("open");
    setTimeout(finish, 250);
  }

  function enterActiveGame(gameId) {
    if (String(state.gameId || "") !== String(gameId || "")) return;
    continueCurrentGame();
  }

  function renderGamesDashboard() {
    // A deferred call (a panel's collapse setTimeout) can still fire after the user has
    // navigated away from the dashboard — bail instead of rebuilding a #gamesHome that's now
    // showing a different view (same guard as renderGroupPage).
    if (appView !== "games") return;
    // Only a fresh navigation into the dashboard (setAppView) stagger-animates the cards below;
    // an in-place re-render after e.g. toggling a card's expand state must not replay it (Task 15,
    // same pattern as renderGroupPage's enterStagger).
    const enterStagger = gamesPageEnterNext;
    gamesPageEnterNext = false;
    const box = document.getElementById("gamesHome");
    box.innerHTML = "";
    const inner = el("div", "games-home-in games-home-dash");
    inner.appendChild(el("p", "games-home-lead", "המשחקים הפעילים והקבוצות שלך במקום אחד."));
    renderQuickActions(inner);
    renderActiveGamesSection(inner, getActiveGameSummaries(state, state.groups), enterStagger);
    renderGroupsSection(inner, getGroupSummaries(collectionsOf(state), me), enterStagger);
    renderArchivedGroupsSection(inner, getArchivedGroupSummaries(collectionsOf(state), me));
    box.appendChild(inner);
  }

  // Back arrow, 64px avatar (image or initial), name and member count — the top of the group page.
  function renderGroupHeader(summary) {
    const header = el("div", "games-group-header");
    const back = el("button", "back-arrow");
    back.type = "button";
    back.setAttribute("aria-label", "חזרה");
    back.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>';
    back.addEventListener("click", () => setAppView("games"));
    header.appendChild(back);
    // Reachable by any active member — not admin-only — since "עזוב קבוצה" must stay reachable
    // for everyone; admin-only controls (rename, avatar, archive, delete) live inside the overlay.
    if (summary.isMember) {
      const settingsBtn = el("button", "games-group-settings-btn");
      settingsBtn.type = "button";
      settingsBtn.setAttribute("aria-label", "הגדרות קבוצה");
      // Row 34: same gear as the profile's corner control, so "הגדרות" looks the same in both.
      settingsBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>';
      settingsBtn.appendChild(el("span", "", "הגדרות"));
      settingsBtn.addEventListener("click", openGroupSettings);
      header.appendChild(settingsBtn);
    }
    if (summary.avatarDataUrl) {
      const avatar = el("img", "games-group-header-avatar");
      avatar.src = summary.avatarDataUrl;
      avatar.alt = "";
      header.appendChild(avatar);
    } else {
      header.appendChild(el("span", "games-group-header-avatar", String(summary.name || "?").slice(0, 1)));
    }
    header.appendChild(el("h2", "games-group-header-name", summary.name));
    header.appendChild(el("p", "games-group-header-meta", formatMemberCount(summary.memberCount)));
    return header;
  }

  // The group's own game has an active table → jump straight into it / its settlement, with a
  // status line ("משחק פעיל · N שחקנים · התחיל ב־HH:mm") and player names above the CTA. Otherwise
  // "התחל משחק" opens the inline start-game panel (toggleStartGamePanel/renderStartGamePanel)
  // when canStartGroupGame().ok and the current user is an active member; it renders disabled
  // with a quiet reason line under the button otherwise — a left-group reason ("עזבת את הקבוצה")
  // takes priority over canStartGroupGame()'s own reason (group archived / a game already open).
  function renderGroupPrimaryAction(summary, gate) {
    const wrap = el("div", "games-primary-action");
    const btn = el("button", "btn-primary");
    btn.type = "button";
    let reason = null;
    const canStart = !summary.hasActiveGame && summary.isMember && gate && gate.ok;
    if (summary.hasActiveGame) {
      const activeSummary = getActiveGameSummaries(state, state.groups)[0];
      if (activeSummary) {
        const phaseLabel = summary.activeGamePhase === "settlement" ? "בסגירה" : "משחק פעיל";
        const statusParts = [phaseLabel, formatPlayerCount(activeSummary.playerCount)];
        if (activeSummary.startedAt) statusParts.push("התחיל ב־" + formatGameTime(activeSummary.startedAt));
        wrap.appendChild(el("p", "games-primary-status", statusParts.join(" · ")));
        wrap.appendChild(el("p", "games-primary-reason", formatPlayerNames(activeSummary.playerNames)));
      }
      btn.textContent = summary.activeGamePhase === "settlement" ? "המשך סגירה" : "כנס לשולחן";
      btn.addEventListener("click", continueCurrentGame);
    } else if (canStart) {
      btn.textContent = "התחל משחק";
      btn.setAttribute("aria-expanded", String(startGameOpen));
      // Row 15: while the picker is open the panel owns the screen's one turquoise capsule
      // ("פתח שולחן"); the CTA that opened it steps aside instead of competing with it.
      btn.hidden = startGameOpen;
      btn.addEventListener("click", toggleStartGamePanel);
    } else {
      btn.textContent = "התחל משחק";
      btn.disabled = true;
      btn.setAttribute("aria-disabled", "true");
      if (!summary.isMember) {
        reason = leftGroupReason();
      } else if (gate && gate.ok === false) {
        const reasons = {
          "group-has-open-game": "יש כבר משחק פתוח בקבוצה",
          "another-game-open": "יש משחק פעיל אחר — סגור אותו קודם",
          "group-archived": "הקבוצה בארכיון",
        };
        reason = reasons[gate.reason] || null;
      }
    }
    wrap.appendChild(btn);
    if (reason) wrap.appendChild(el("p", "games-primary-reason", reason));
    const hideAction = !summary.isMember && renderHideGroupAction();
    if (hideAction) wrap.appendChild(hideAction);
    if (canStart) wrap.appendChild(renderStartGamePanel());
    return wrap;
  }

  // The reason line under the blocked primary button when I have no active membership here:
  // "עזבת"/"הוסרת" when a left/removed row of mine exists, and — when no row of mine exists at
  // all (this device's name matches none of the membership names) — an honest "לא חבר" line
  // that names the identity I am using, instead of a false "עזבת" over a dead-end action.
  function leftGroupReason() {
    const former = findMyFormerMembership(state.groupMembers, currentGroupId, me);
    if (former) return former.status === "removed" ? "הוסרת מהקבוצה" : "עזבת את הקבוצה";
    return "אתה לא חבר בקבוצה הזו — מחובר בשם " + me;
  }

  // D8, step two of leaving: once I am out of a group, the page offers to drop it from this
  // device. Same two-step armed pattern as every other destructive action here (no confirm()),
  // auto-disarming after 4s. hideGroupForMember only stamps my own membership — the group and
  // everybody else's history are untouched, which is what the helper line promises. Returns
  // null (nothing destructive to offer) when I have no left/removed membership to stamp — the
  // confirm tap must never be a silent no-op.
  function renderHideGroupAction() {
    if (!findMyFormerMembership(state.groupMembers, currentGroupId, me)) return null;
    const wrap = el("div", "games-hide-group");
    const btn = el("button", "set-flat danger games-hide-group-btn" + (hideGroupArmed ? " armed" : ""),
      hideGroupArmed ? "בטוח? הקבוצה תוסר מהמכשיר" : "מחק קבוצה");
    btn.type = "button";
    btn.addEventListener("click", () => {
      if (!hideGroupArmed) {
        hideGroupArmed = true;
        hideGroupArmedTimeout = setTimeout(() => { hideGroupArmed = false; renderGroupPage(); }, 4000);
        renderGroupPage();
        return;
      }
      clearTimeout(hideGroupArmedTimeout);
      hideGroupArmed = false;
      // Refused (membership changed under us): re-render to the page's honest state — the
      // armed label must not linger over a no-op.
      if (!hideGroupForMember(state.groupMembers, currentGroupId, me, new Date().toISOString())) { renderGroupPage(); return; }
      save();
      setAppView("games");
    });
    wrap.appendChild(btn);
    wrap.appendChild(el("p", "games-primary-reason", "הקבוצה תוסר מהמכשיר שלך. ההיסטוריה של שאר החברים נשמרת."));
    return wrap;
  }

  // Inline participant panel opened by the "התחל משחק" primary button (Task 8), gated by
  // canStartGroupGame(...).ok. Same grid-collapse pattern/CSS as .games-create-panel. Toggling
  // a member checkbox updates just that row + the confirm button in place (no full re-render),
  // so a guest name mid-typing in the add-guest input below is never wiped out.
  function renderStartGamePanel() {
    const wrap = el("div", "group-start-panel");
    const panel = el("div", "games-create-panel");
    const panelIn = el("div", "games-create-panel-in");
    const content = el("div", "games-create-panel-content");

    const members = activeMembers(state.groupMembers, currentGroupId);
    content.appendChild(el("h3", "games-section-title group-start-title", "מי משחק?"));
    content.appendChild(el("p", "group-start-counter",
      startGameCounterLabel(startGameSelection.size + startGameGuests.length, members.length + startGameGuests.length)));
    members.forEach((member, i) => content.appendChild(renderStartGameMemberRow(member, i)));

    if (startGameGuests.length) content.appendChild(renderStartGameGuestsList());
    content.appendChild(renderStartGameAddGuest());

    const confirmBtn = el("button", "btn-primary group-start-confirm", "פתח שולחן");
    confirmBtn.type = "button";
    const total = startGameSelection.size + startGameGuests.length;
    confirmBtn.disabled = total < 1;
    confirmBtn.setAttribute("aria-disabled", String(total < 1));
    confirmBtn.addEventListener("click", () => {
      if (startGameSelection.size + startGameGuests.length < 1) return;
      const participants = members
        .filter(m => startGameSelection.has(m.id))
        .map(m => ({ name: m.displayName, guestId: m.guestId || null, memberId: m.id }))
        .concat(startGameGuests.map(g => ({ name: g.name, guestId: g.guestId, memberId: null })));
      startGroupGame(currentGroupId, participants);
    });
    content.appendChild(confirmBtn);

    const cancelBtn = el("button", "games-create-cancel", "ביטול");
    cancelBtn.type = "button";
    cancelBtn.addEventListener("click", closeStartGamePanel);
    content.appendChild(cancelBtn);

    panelIn.appendChild(content);
    panel.appendChild(panelIn);
    if (startGameOpen && startGameJustOpened) {
      startGameJustOpened = false;
      requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.add("open")));
    } else if (startGameOpen) {
      panel.classList.add("open");
    }
    wrap.appendChild(panel);
    return wrap;
  }

  // A single checkbox row for an active member (custom control: button[role=checkbox], ≥44px).
  function renderStartGameMemberRow(member, index) {
    const checked = startGameSelection.has(member.id);
    const row = el("button", "group-start-member anim");
    row.style.animationDelay = ((index || 0) * 40) + "ms";
    row.type = "button";
    row.setAttribute("role", "checkbox");
    row.setAttribute("aria-checked", String(checked));
    const check = el("span", "group-start-check");
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 12 12");
    svg.setAttribute("aria-hidden", "true");
    svg.innerHTML = '<path d="M2.5 6.2 5 8.7 9.5 3.2"/>';
    check.appendChild(svg);
    row.appendChild(check);
    row.appendChild(el("span", "group-start-name", member.displayName));
    row.addEventListener("click", () => {
      const next = !startGameSelection.has(member.id);
      if (next) startGameSelection.add(member.id); else startGameSelection.delete(member.id);
      row.setAttribute("aria-checked", String(next));
      updateStartGameConfirmState();
    });
    return row;
  }

  // Row 15: "נבחרו N מתוך M" above the checkbox rows, so the picker says what it has.
  function startGameCounterLabel(selected, total) {
    return "נבחרו " + selected + " מתוך " + total;
  }

  // Keeps the "פתח שולחן" button's disabled state and the counter in sync after an in-place
  // row toggle (the panel is not re-rendered, so a half-typed guest name survives).
  function updateStartGameConfirmState() {
    const btn = document.querySelector(".group-start-confirm");
    if (!btn) return;
    const selected = startGameSelection.size + startGameGuests.length;
    btn.disabled = selected < 1;
    btn.setAttribute("aria-disabled", String(selected < 1));
    const counter = document.querySelector(".group-start-counter");
    if (counter) {
      const total = activeMembers(state.groupMembers, currentGroupId).length + startGameGuests.length;
      counter.textContent = startGameCounterLabel(selected, total);
    }
  }

  // Ad-hoc guests added in the panel; NOT group members (no addGroupMember call — see Task 8).
  // Removing one re-renders the group page, a low-frequency action unlike the checkbox toggle.
  function renderStartGameGuestsList() {
    const wrap = el("div", "group-start-guests");
    startGameGuests.forEach((guest, idx) => {
      const row = el("div", "group-start-guest-row anim");
      row.style.animationDelay = (idx * 40) + "ms";
      row.appendChild(el("span", "group-start-name", guest.name));
      const removeBtn = el("button", "group-start-guest-remove", "הסר");
      removeBtn.type = "button";
      removeBtn.addEventListener("click", () => {
        startGameGuests.splice(idx, 1);
        renderGroupPage();
      });
      row.appendChild(removeBtn);
      wrap.appendChild(row);
    });
    return wrap;
  }

  // Inline "+ הוסף אורח" name input, same resolveGuestId reuse as addMemberByName. A duplicate
  // of ANY active group member (selected or not — a name that matches an unselected member can
  // still collide with them once selected) or an already-added guest name shakes the input
  // instead of silently failing (guests never become group members, so there is no
  // addGroupMember guard; startGroupGame's dedupeParticipants is the second guard, audit gap #1).
  function renderStartGameAddGuest() {
    const wrap = el("div", "group-start-add");
    wrap.appendChild(el("p", "group-start-add-label", "+ הוסף אורח"));
    const row = el("div", "group-start-add-row");
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.maxLength = 40;
    nameInput.placeholder = "שם";
    nameInput.autocomplete = "off";
    nameInput.setAttribute("aria-label", "שם האורח");

    const submit = () => {
      const name = nameInput.value.trim();
      if (!name) { shakeEl(nameInput); return; }
      const members = activeMembers(state.groupMembers, currentGroupId);
      const memberNames = members.map(m => m.displayName);
      const guestNames = startGameGuests.map(g => g.name);
      if (memberNames.includes(name) || guestNames.includes(name)) { shakeEl(nameInput); return; }
      startGameGuests.push({ name, guestId: resolveGuestId(collectionsOf(state), name) });
      renderGroupPage();
    };
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
    });

    const submitBtn = el("button", "games-create-submit", "הוסף");
    submitBtn.type = "button";
    submitBtn.addEventListener("click", submit);

    row.append(nameInput, submitBtn);
    wrap.appendChild(row);
    return wrap;
  }

  function toggleStartGamePanel() {
    if (startGameOpen) { closeStartGamePanel(); return; }
    const members = activeMembers(state.groupMembers, currentGroupId);
    const mine = members.find(m => m && m.displayName === me);
    startGameOpen = true;
    startGameJustOpened = true;
    startGameSelection = new Set(mine ? [mine.id] : []);
    startGameGuests = [];
    renderGroupPage();
  }

  // Plays the panel's collapse transition (matching closeAddMemberPanel's approach) before
  // resetting its draft state and rebuilding the group page without it.
  function closeStartGamePanel() {
    const panel = document.querySelector(".group-start-panel .games-create-panel.open");
    const finish = () => { resetStartGamePanel(); renderGroupPage(); };
    if (!panel) { finish(); return; }
    panel.classList.remove("open");
    setTimeout(finish, 280);
  }

  function resetStartGamePanel() {
    startGameOpen = false;
    startGameJustOpened = false;
    startGameSelection = new Set();
    startGameGuests = [];
  }

  // Full LeaderboardEntry list, names only — no amounts (Global Constraint 10). Tie ranks share
  // the same number. Former members get a quiet "לשעבר" tag next to their name.
  function renderGroupLeaders(entries) {
    const section = el("section", "games-section");
    section.appendChild(el("h3", "games-section-title", "דירוג"));
    const list = Array.isArray(entries) ? entries : [];
    if (!list.length) {
      section.appendChild(el("p", "games-empty", "הדירוג יופיע אחרי המשחק הראשון"));
    } else {
      list.forEach((entry, i) => {
        const row = el("p", "games-leader-row anim");
        row.style.animationDelay = (i * 45) + "ms";
        // Rank number isolated in its own dir="ltr" span so "1." doesn't read reversed inside
        // the RTL row (D4).
        const rank = el("span", "games-rank", entry.rank + ".");
        rank.dir = "ltr";
        row.appendChild(rank);
        const name = el("span", "", entry.displayName);
        if (entry.isFormerMember) name.appendChild(el("span", "games-member-tag", "לשעבר"));
        row.appendChild(name);
        row.appendChild(el("span", "games-card-meta", formatGamesPlayedCount(entry.gamesPlayed) + " · " + formatWinsCount(entry.wins)));
        section.appendChild(row);
      });
    }
    return section;
  }

  // Flat member rows, name + a quiet "מנהל" tag for admins. For an admin each row is tappable
  // and opens an inline action strip (D3); "+ הוסף חבר" moved to the settings overlay (D1).
  // Former members appear collapsed under a toggle, shown only when there are any.
  function renderGroupMembers(members, former, isAdmin) {
    const section = el("section", "games-section");
    section.appendChild(el("h3", "games-section-title", "חברים"));
    const list = Array.isArray(members) ? members : [];
    list.forEach(member => section.appendChild(renderMemberRow(member, list, isAdmin)));
    const formerList = Array.isArray(former) ? former : [];
    if (formerList.length) section.appendChild(renderFormerMembers(formerList));
    return section;
  }

  // D3: a member row shows name + role tag only. For an admin the row itself is the control
  // (role="button", Enter/Space, aria-expanded) and taps open an inline action strip below it —
  // one row at a time, so a destructive "הסר" is never a stray tap away in a dense list. The row
  // stays a <p> inside a .games-member-item wrapper, which now carries the hairline separator.
  function renderMemberRow(member, activeList, isAdmin) {
    const item = el("div", "games-member-item");
    const row = el("p", "games-member-row");
    const name = el("span", "games-member-name", member.displayName);
    if (member.role === "admin") name.appendChild(el("span", "games-member-tag", "מנהל"));
    row.appendChild(name);
    if (!isAdmin) { item.appendChild(row); return item; }

    const open = memberActionsOpenId === member.id;
    const actionsId = "member-actions-" + member.id;
    row.classList.add("with-actions");
    row.setAttribute("role", "button");
    row.setAttribute("tabindex", "0");
    row.setAttribute("aria-expanded", open ? "true" : "false");
    row.setAttribute("aria-controls", actionsId);
    row.setAttribute("aria-label", "פעולות עבור " + member.displayName);
    const chevron = el("span", "games-member-chevron");
    chevron.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3 3.5-3"></path></svg>';
    row.appendChild(chevron);
    const toggle = () => {
      const next = memberActionsOpenId === member.id ? null : member.id;
      disarmRemoveMember(); // an armed "הסר" belongs to the row that was open
      memberActionsOpenId = next;
      memberActionsJustOpenedId = next;
      renderGroupPage();
    };
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
    item.appendChild(row);
    item.appendChild(renderMemberActions(member, activeList, actionsId, open));
    return item;
  }

  // The strip itself: the shared .games-card-details grid-collapse, holding "הפוך למנהל" (or
  // "הסר ניהול" for an admin who isn't the last one) and the two-step "הסר". The group's last
  // active admin gets neither — only the quiet reason line, same wording as the settings overlay.
  function renderMemberActions(member, activeList, actionsId, open) {
    const details = el("div", "games-card-details games-member-actions");
    details.id = actionsId;
    const detailsIn = el("div", "games-card-details-in");
    const content = el("div", "games-card-details-content games-member-actions-row");
    const isLastAdmin = isLastActiveAdmin(activeList, member.id);
    if (member.role !== "admin") content.appendChild(renderMakeAdminButton(member));
    else if (!isLastAdmin) content.appendChild(renderRemoveAdminButton(member));
    if (member.displayName !== me && !isLastAdmin) content.appendChild(renderRemoveMemberButton(member));
    if (isLastAdmin) content.appendChild(el("p", "games-member-note", "העבר ניהול לחבר אחר קודם"));
    detailsIn.appendChild(content);
    details.appendChild(detailsIn);
    if (open && memberActionsJustOpenedId === member.id) {
      memberActionsJustOpenedId = null;
      requestAnimationFrame(() => requestAnimationFrame(() => details.classList.add("open")));
    } else if (open) {
      details.classList.add("open");
    }
    return details;
  }
  function renderMakeAdminButton(member) {
    const btn = el("button", "games-member-action games-member-promote", "הפוך למנהל");
    btn.type = "button";
    btn.addEventListener("click", () => promoteMember(member.groupId, member.id));
    return btn;
  }
  function renderRemoveAdminButton(member) {
    const btn = el("button", "games-member-action games-member-promote", "הסר ניהול");
    btn.type = "button";
    btn.addEventListener("click", () => demoteMember(member.groupId, member.id));
    return btn;
  }

  // Two-step armed control, same idea as resetBtn/setClearBtn: label flips to "בטוח?" for 4s,
  // a second click within the window confirms. Only one row is armed at a time (module-level
  // id) and, unlike those static buttons, member rows are rebuilt on every renderGroupPage(),
  // so arming/disarming re-renders instead of toggling a persistent element's classList.
  function armRemoveMember(memberId) {
    clearTimeout(removeMemberArmedTimeout);
    removeMemberArmedId = memberId;
    removeMemberArmedTimeout = setTimeout(() => {
      removeMemberArmedId = null;
      renderGroupPage();
    }, 4000);
  }
  function disarmRemoveMember() {
    clearTimeout(removeMemberArmedTimeout);
    removeMemberArmedId = null;
    removeMemberArmedTimeout = null;
  }
  function renderRemoveMemberButton(member) {
    const armed = removeMemberArmedId === member.id;
    const btn = el("button", "games-member-action games-member-remove" + (armed ? " armed" : ""), armed ? "בטוח?" : "הסר");
    btn.type = "button";
    btn.addEventListener("click", () => {
      if (removeMemberArmedId === member.id) {
        disarmRemoveMember();
        removeMember(member.groupId, member.id);
        return;
      }
      armRemoveMember(member.id);
      renderGroupPage();
    });
    return btn;
  }

  // Inline "+ הוסף חבר" add action, same collapse/expand pattern and CSS (.games-create-panel)
  // as the create-group panel (Task 3). Guest-only for now — no accounts yet — hence the note.
  function renderAddMemberPanel() {
    const wrap = el("div", "games-member-add");
    const toggle = el("button", "games-member-add-toggle", "+ הוסף חבר");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", String(addMemberOpen));
    toggle.addEventListener("click", toggleAddMemberPanel);
    wrap.appendChild(toggle);

    const panel = el("div", "games-create-panel");
    const panelIn = el("div", "games-create-panel-in");
    const content = el("div", "games-create-panel-content");

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.maxLength = 40;
    nameInput.placeholder = "שם";
    nameInput.autocomplete = "off";
    nameInput.setAttribute("aria-label", "שם החבר");
    nameInput.value = addMemberName;
    nameInput.addEventListener("input", () => { addMemberName = nameInput.value; });

    const submit = () => {
      const name = nameInput.value.trim();
      if (!name) { shakeEl(nameInput); return; }
      const member = addMemberByName(currentGroupId, name);
      if (!member) { shakeEl(nameInput); return; } // duplicate active identity/name
      closeAddMemberPanel();
    };
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
    });

    const submitBtn = el("button", "games-create-submit", "הוסף");
    submitBtn.type = "button";
    submitBtn.addEventListener("click", submit);

    const cancelBtn = el("button", "games-create-cancel", "ביטול");
    cancelBtn.type = "button";
    cancelBtn.addEventListener("click", closeAddMemberPanel);

    // Row 32: same shape as the create-group panel — title, full-width field, confirm + cancel.
    content.appendChild(el("h3", "games-section-title", "חבר חדש"));
    content.append(nameInput, submitBtn, cancelBtn);
    content.appendChild(el("p", "games-member-add-note", SERVER_NOTE));
    panelIn.appendChild(content);
    panel.appendChild(panelIn);

    if (addMemberOpen && addMemberJustOpened) {
      addMemberJustOpened = false;
      requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.add("open")));
    } else if (addMemberOpen) {
      panel.classList.add("open");
    }
    wrap.appendChild(panel);
    return wrap;
  }
  function toggleAddMemberPanel() {
    if (addMemberOpen) { closeAddMemberPanel(); return; }
    addMemberOpen = true;
    addMemberJustOpened = true;
    refreshGroupSettings();
  }
  // Plays the panel's collapse transition (matching closeCreateGroupPanel's approach) before
  // clearing the draft name and rebuilding the overlay — and the group page behind it, whose
  // member list just changed (renderGroupPage is guarded by appView, so it is a no-op elsewhere).
  function closeAddMemberPanel() {
    const panel = document.querySelector(".games-member-add .games-create-panel.open");
    const finish = () => {
      addMemberOpen = false; addMemberJustOpened = false; addMemberName = "";
      renderGroupPage();
      refreshGroupSettings();
    };
    if (!panel) { finish(); return; }
    panel.classList.remove("open");
    setTimeout(finish, 280);
  }

  // Collapsed "חברים לשעבר (N)" line, shown only when the group has any (see renderGroupMembers)
  // — expands to a flat list of names tagged "לשעבר". UI-only boolean, not persisted.
  function renderFormerMembers(former) {
    const wrap = el("div", "games-former-members");
    const toggle = el("button", "games-former-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", String(formerMembersOpen));
    toggle.innerHTML = "<span>חברים לשעבר (" + former.length + ")</span>" +
      '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3 3.5-3"></path></svg>';
    toggle.addEventListener("click", () => {
      if (formerMembersOpen) { closeFormerMembers(); return; }
      formerMembersOpen = true;
      formerMembersJustOpened = true;
      renderGroupPage();
    });
    wrap.appendChild(toggle);

    const details = el("div", "games-card-details");
    const detailsIn = el("div", "games-card-details-in");
    const content = el("div", "games-card-details-content");
    former.forEach(member => {
      const row = el("p", "games-member-row", member.displayName);
