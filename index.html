<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קופה סגורה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700&display=swap">
<style>
  :root {
    --ink: #08080E;
    --panel: #12121D;
    --panel-2: #191927;
    --line: #262538;
    --text: #EDECF5;
    --dim: #8E8CA3;
    --purple: #9D6BFF;
    --purple-deep: #6D3FD4;
    --teal: #2DE1C2;
    --teal-dim: #1A8F7C;
    --lose: #FF5C7A;
    --r: 14px;
    --font-d: "Secular One", "Rubik", sans-serif;
    --font-b: "Rubik", "Heebo", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { color-scheme: dark; }
  input, button, select, textarea { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-b);
    font-size: 16px;
    line-height: 1.5;
    direction: rtl;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(900px 420px at 85% -10%, rgba(157,107,255,.14), transparent 60%),
      radial-gradient(700px 380px at 0% 110%, rgba(45,225,194,.09), transparent 60%);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 14px 80px; }

  /* ---------- header ---------- */
  header { margin-bottom: 18px; }
  .eyebrow {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 12px; letter-spacing: .12em; color: var(--teal); font-weight: 500;
  }
  .sync-badge {
    font-size: 11px; letter-spacing: .03em; color: var(--dim);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    transition: color .3s, border-color .3s, box-shadow .3s;
  }
  .sync-badge.on { color: var(--teal); border-color: var(--teal-dim); box-shadow: 0 0 10px rgba(45,225,194,.25); }
  h1 {
    font-family: var(--font-d);
    font-weight: 400; font-size: 42px; margin: 4px 0 2px; line-height: 1.1;
    background: linear-gradient(105deg, var(--text) 30%, var(--purple) 65%, var(--teal) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: var(--purple);
    text-wrap: balance;
  }
  .sub { color: var(--dim); margin: 0; font-size: 14px; }

  /* ---------- buttons: shared press/hover animation ---------- */
  button {
    font: inherit; cursor: pointer; border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text);
    padding: 10px 14px; min-height: 44px;
    transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease,
                background-color .2s ease, color .2s ease, filter .2s ease;
    touch-action: manipulation;
  }
  button:hover { border-color: var(--purple); }
  button:active { transform: scale(.94); }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .btn-add {
    background: linear-gradient(120deg, var(--purple-deep), var(--purple));
    border: none; color: #fff; font-weight: 700; white-space: nowrap;
    box-shadow: 0 4px 18px rgba(157,107,255,.35);
  }
  .btn-add:hover { box-shadow: 0 6px 24px rgba(157,107,255,.55); filter: brightness(1.06); }

  .btn-chip {
    border-color: var(--teal-dim); color: var(--teal);
    font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
    position: relative; overflow: hidden;
  }
  .btn-chip:hover { border-color: var(--teal); box-shadow: 0 0 14px rgba(45,225,194,.3); }
  .btn-chip.bump { animation: bump .35s ease; }
  @keyframes bump {
    30% { transform: scale(1.12); box-shadow: 0 0 22px rgba(45,225,194,.6); }
  }

  .btn-x {
    color: var(--dim); border-color: transparent; background: transparent;
    min-height: 36px; padding: 4px 10px; font-size: 20px; line-height: 1;
  }
  .btn-x:hover { color: var(--lose); border-color: var(--lose); transform: rotate(90deg); }
  .btn-x:active { transform: rotate(90deg) scale(.9); }

  .btn-ghost { background: transparent; color: var(--dim); }
  .btn-ghost:hover { color: var(--lose); border-color: var(--lose); }

  /* ---------- add row ---------- */
  .addrow {
    display: flex; gap: 10px; margin-bottom: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r); padding: 10px;
  }
  .addrow input { flex: 1; min-width: 0; }
  input[type="text"], input[type="number"] {
    -webkit-appearance: none; appearance: none;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font: inherit; font-variant-numeric: tabular-nums;
    padding: 10px 12px; min-height: 44px;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus-visible { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(157,107,255,.25); }
  input::placeholder { color: var(--dim); opacity: .8; }
  input[type=number]::-webkit-inner-spin-button { display: none; }

  /* ---------- player cards ---------- */
  .players { display: flex; flex-direction: column; gap: 10px; }
  .pcard {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 10px;
    animation: deal .3s ease both;
  }
  @keyframes deal { from { opacity: 0; transform: translateY(8px); } }
  .pcard-top { display: flex; align-items: center; gap: 10px; }
  .pname { font-weight: 700; font-size: 18px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .net {
    font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
    font-size: 15px; border-radius: 999px; padding: 2px 12px;
    transition: background-color .3s, color .3s;
  }
  .net.pos { color: var(--teal); background: rgba(45,225,194,.12); }
  .net.neg { color: var(--lose); background: rgba(255,92,122,.12); }
  .net.zero { color: var(--dim); background: var(--panel-2); font-weight: 400; }
  .pcard-controls {
    display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center;
  }
  .field-label { font-size: 12px; color: var(--dim); }
  .buyin-line { display: flex; align-items: center; gap: 10px; }
  .buyin-total { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 14px; white-space: nowrap; }
  .buyin-total b { color: var(--text); font-size: 15px; }
  .pcard-controls input[type="number"] { width: 100%; }

  /* ---------- summary ---------- */
  .potbar {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin: 16px 0;
  }
  .pot-item {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .pot-label { font-size: 11px; color: var(--dim); letter-spacing: .04em; }
  .pot-value { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pot-value.bad { color: var(--lose); }
  .pot-value.good { color: var(--teal); }

  .warn {
    margin: 0 0 16px; padding: 12px 14px;
    border: 1px solid var(--lose);
    border-radius: var(--r);
    background: rgba(255,92,122,.09);
    color: var(--lose); font-size: 14px;
  }
  .warn strong { color: var(--text); }

  /* ---------- transfers ---------- */
  h2 {
    font-family: var(--font-d); font-weight: 400; font-size: 24px; margin: 26px 0 12px;
  }
  h2 .tick { color: var(--teal); }
  .transfers { display: flex; flex-direction: column; gap: 8px; }
  .transfer {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: linear-gradient(120deg, rgba(157,107,255,.10), rgba(45,225,194,.07));
    border: 1px solid var(--purple-deep);
    border-radius: var(--r);
    padding: 14px 16px; font-size: 16px;
    animation: deal .3s ease both;
  }
  .transfer .who { font-weight: 700; }
  .transfer .arrow { color: var(--dim); font-size: 14px; }
  .transfer .amount {
    margin-inline-start: auto; font-weight: 700; font-size: 20px;
    color: var(--teal); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .settle-empty { color: var(--dim); margin: 0; font-size: 14px; }

  .footer-actions { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--dim); margin-top: 10px; }
  .example-tag {
    font-size: 11px; color: var(--purple);
    border: 1px solid var(--purple-deep); border-radius: 999px; padding: 2px 10px;
  }

  @media (max-width: 380px) {
    h1 { font-size: 34px; }
    .potbar { grid-template-columns: 1fr 1fr; }
    .pot-item:last-child { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="eyebrow">קאש גיים · כניסה מינימלית ₪50 <span class="sync-badge" id="syncBadge">שמירה מקומית</span></div>
    <h1>קופה סגורה</h1>
    <p class="sub">רושמים כניסות תוך כדי המשחק, מזינים צ'יפים בסוף — ומקבלים מי משלם למי, במינימום העברות.</p>
  </header>

  <div class="addrow">
    <input type="text" id="newName" placeholder="שם שחקן חדש" autocomplete="off" aria-label="שם שחקן חדש">
    <button type="button" class="btn-add" id="addBtn">+ הוסף</button>
  </div>

  <div class="players" id="players"></div>

  <div class="potbar" id="potbar"></div>
  <div id="warnbox"></div>

  <h2><span class="tick">✦</span> מי משלם למי</h2>
  <div class="transfers" id="transfers"></div>

  <div class="footer-actions">
    <button type="button" class="btn-ghost" id="resetBtn">איפוס משחק</button>
  </div>
  <p class="hint">כל כפתור ₪50+ מוסיף כניסה נוספת. הנתונים נשמרים בשרת — תיכנסו מכל מכשיר לאותו לינק ותמצאו את המשחק בדיוק איפה שעזבתם.</p>
</div>

<script>
(function () {
  const MIN_BUYIN = 50;
  const KEY = "poker-settle-v1";

  const EXAMPLE = {
    example: true,
    players: [
      { name: "דביר",  buyins: [50, 50], cashout: 180 },
      { name: "יוסי",  buyins: [50],     cashout: 0   },
      { name: "רותם",  buyins: [50, 50, 50], cashout: 95 },
      { name: "עמית",  buyins: [50],     cashout: 25  },
    ],
  };

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.players)) return s;
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(EXAMPLE));
  }
  function save() {
    pendingRemote = null; // a local edit supersedes any remote state parked for later
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    scheduleRemoteSave();
  }

  // --- server sync (shared document, survives devices and reloads) ---
  const CLIENT_ID = Math.random().toString(36).slice(2);
  let gameDoc = null;
  let saveTimer = null;
  let pendingRemote = null;
  let dirtyUntil = 0; // while set, fresh local edits outrank incoming remote state

  function setSync(on, label) {
    const b = document.getElementById("syncBadge");
    if (!b) return;
    b.textContent = label;
    b.classList.toggle("on", on);
  }

  function remoteBody() {
    return {
      by: CLIENT_ID,
      example: !!state.example,
      players: state.players,
      updatedAt: new Date().toISOString(),
    };
  }

  function scheduleRemoteSave() {
    dirtyUntil = Date.now() + 6000;
    if (!gameDoc) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      saveTimer = null;
      gameDoc.set(remoteBody()).catch(() => setSync(false, "שגיאת שמירה — נשמר מקומית"));
    }, 400);
  }

  function applyRemote(data) {
    const incoming = { example: !!data.example, players: Array.isArray(data.players) ? data.players : [] };
    if (JSON.stringify(incoming) === JSON.stringify({ example: state.example, players: state.players })) return;
    // Don't yank the UI out from under an active edit — apply on blur.
    const ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT")) { pendingRemote = incoming; return; }
    state = incoming;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    render();
  }

  document.addEventListener("visibilitychange", () => {
    // Flush a pending debounced write immediately when the tab is hidden/closed.
    if (document.visibilityState === "hidden" && saveTimer && gameDoc) {
      clearTimeout(saveTimer);
      saveTimer = null;
      gameDoc.set(remoteBody()).catch(() => {});
    }
  });

  document.addEventListener("focusout", () => {
    if (!pendingRemote) return;
    // Let the click that caused this blur run first; if it made a local
    // edit, that edit wins and the parked remote state is dropped.
    setTimeout(() => {
      if (!pendingRemote) return;
      if (saveTimer || Date.now() < dirtyUntil) { pendingRemote = null; return; }
      const p = pendingRemote; pendingRemote = null;
      applyRemote({ example: p.example, players: p.players });
    }, 50);
  });

  function initSync() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    window.claude.use("db").then((db) => {
      if (!db) return; // no server storage in this view — stay on localStorage
      gameDoc = db.doc("games/current");
      gameDoc.onSnapshot((snap) => {
        setSync(true, "מסונכרן לשרת");
        if (!snap.exists) {
          // First device seeds the shared game with whatever it has locally.
          if (!state.example && state.players.length) scheduleRemoteSave();
          return;
        }
        const data = snap.data();
        if (!data) return;
        if (data.by === CLIENT_ID) { dirtyUntil = 0; return; } // our own write confirmed
        // A fresh local edit is still on its way to the server — don't let
        // an older remote snapshot overwrite it.
        if (saveTimer || Date.now() < dirtyUntil) return;
        applyRemote(data);
      }, () => setSync(false, "שמירה מקומית"));
    }).catch(() => {});
  }
  initSync();

  function markReal() {
    if (state.example) state.example = false;
  }

  const fmt = (n) => "₪" + (Math.round(n * 100) / 100).toLocaleString("he-IL");
  const sum = (a) => a.reduce((x, y) => x + y, 0);

  function totals() {
    const buy = sum(state.players.map(p => sum(p.buyins)));
    const out = sum(state.players.map(p => Number(p.cashout) || 0));
    return { buy, out, diff: out - buy };
  }

  // Greedy settlement: fewest transfers between net winners and losers.
  function settle() {
    const nets = state.players
      .map(p => ({ name: p.name, net: (Number(p.cashout) || 0) - sum(p.buyins) }))
      .filter(p => Math.abs(p.net) > 0.005);
    const winners = nets.filter(p => p.net > 0).sort((a, b) => b.net - a.net);
    const losers  = nets.filter(p => p.net < 0).sort((a, b) => a.net - b.net);
    const moves = [];
    let i = 0, j = 0;
    while (i < losers.length && j < winners.length) {
      const pay = Math.min(-losers[i].net, winners[j].net);
      moves.push({ from: losers[i].name, to: winners[j].name, amount: pay });
      losers[i].net += pay;
      winners[j].net -= pay;
      if (-losers[i].net < 0.005) i++;
      if (winners[j].net < 0.005) j++;
    }
    return moves;
  }

  function render() {
    const box = document.getElementById("players");
    box.innerHTML = "";
    state.players.forEach((p, idx) => {
      const card = document.createElement("div");
      card.className = "pcard";

      const top = document.createElement("div");
      top.className = "pcard-top";

      const name = document.createElement("span");
      name.className = "pname";
      name.textContent = p.name;
      top.appendChild(name);

      const net = document.createElement("span");
      net.dataset.net = idx;
      top.appendChild(net);

      const x = document.createElement("button");
      x.type = "button";
      x.className = "btn-x";
      x.textContent = "×";
      x.setAttribute("aria-label", "הסר את " + p.name);
      x.addEventListener("click", () => {
        state.players.splice(idx, 1);
        markReal(); save(); render();
      });
      top.appendChild(x);
      card.appendChild(top);

      const controls = document.createElement("div");
      controls.className = "pcard-controls";

      const buyLabel = document.createElement("span");
      buyLabel.className = "field-label";
      buyLabel.textContent = "כניסות";
      controls.appendChild(buyLabel);

      const buyLine = document.createElement("div");
      buyLine.className = "buyin-line";
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "btn-chip";
      chip.textContent = "₪50+";
      chip.setAttribute("aria-label", "הוסף כניסה של 50 שקלים ל" + p.name);
      chip.addEventListener("click", () => {
        p.buyins.push(MIN_BUYIN);
        markReal(); save();
        render();
        // replay the bump animation on the freshly rendered chip button
        const fresh = document.querySelectorAll(".btn-chip")[idx];
        if (fresh) { fresh.classList.add("bump"); setTimeout(() => fresh.classList.remove("bump"), 400); }
      });
      const total = document.createElement("span");
      total.className = "buyin-total";
      total.innerHTML = p.buyins.length + "× · סה\"כ <b>" + fmt(sum(p.buyins)) + "</b>";
      buyLine.appendChild(chip);
      buyLine.appendChild(total);
      controls.appendChild(buyLine);

      const cashLabel = document.createElement("span");
      cashLabel.className = "field-label";
      cashLabel.textContent = "צ'יפים בסוף";
      controls.appendChild(cashLabel);

      const inp = document.createElement("input");
      inp.type = "number";
      inp.min = "0";
      inp.step = "1";
      inp.inputMode = "decimal";
      inp.placeholder = "0";
      inp.value = p.cashout === "" ? "" : p.cashout;
      inp.setAttribute("aria-label", "שווי צ'יפים בסוף עבור " + p.name);
      inp.addEventListener("input", () => {
        p.cashout = inp.value === "" ? "" : Math.max(0, Number(inp.value));
        markReal(); save(); renderDerived();
      });
      controls.appendChild(inp);

      card.appendChild(controls);
      box.appendChild(card);
    });
    renderDerived();
  }

  function renderDerived() {
    state.players.forEach((p, idx) => {
      const el = document.querySelector('[data-net="' + idx + '"]');
      if (!el) return;
      const net = (Number(p.cashout) || 0) - sum(p.buyins);
      el.className = "net " + (net > 0.005 ? "pos" : net < -0.005 ? "neg" : "zero");
      el.textContent = (net > 0 ? "+" : "") + fmt(net).replace("₪-", "-₪");
    });

    const t = totals();
    const pot = document.getElementById("potbar");
    const diffCls = Math.abs(t.diff) < 0.005 ? "good" : "bad";
    pot.innerHTML =
      potItem("בקופה", fmt(t.buy), "") +
      potItem("צ'יפים שדווחו", fmt(t.out), "") +
      potItem("הפרש ספירה", (t.diff > 0 ? "+" : "") + fmt(t.diff).replace("₪-", "-₪"), diffCls) +
      (state.example ? '<span class="example-tag">נתוני דוגמה — כל עריכה הופכת אותם לשלכם</span>' : "");

    const warn = document.getElementById("warnbox");
    if (Math.abs(t.diff) >= 0.005 && t.buy > 0) {
      warn.innerHTML = '<p class="warn">הצ\'יפים לא סוגרים את הקופה: הפרש של <strong>' +
        fmt(Math.abs(t.diff)) + "</strong>. ספרו שוב לפני שמתחשבנים — ההתחשבנות למטה מוצגת לפי המספרים כפי שהוזנו.</p>";
    } else {
      warn.innerHTML = "";
    }

    const box = document.getElementById("transfers");
    const moves = settle();
    box.innerHTML = "";
    if (moves.length === 0) {
      box.innerHTML = '<p class="settle-empty">אין העברות — או שכולם על אפס, או שעוד לא הוזנו סכומי סיום.</p>';
    } else {
      moves.forEach((m, i) => {
        const div = document.createElement("div");
        div.className = "transfer";
        div.style.animationDelay = (i * 60) + "ms";
        div.innerHTML =
          '<span class="who">' + esc(m.from) + '</span>' +
          '<span class="arrow">משלם ל־</span>' +
          '<span class="who">' + esc(m.to) + '</span>' +
          '<span class="amount">' + fmt(m.amount) + '</span>';
        box.appendChild(div);
      });
    }
  }

  function potItem(label, value, cls) {
    return '<div class="pot-item"><span class="pot-label">' + label +
      '</span><span class="pot-value ' + cls + '">' + value + "</span></div>";
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function addPlayer() {
    const inp = document.getElementById("newName");
    const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    if (state.example) state = { example: false, players: [] };
    state.players.push({ name, buyins: [MIN_BUYIN], cashout: "" });
    inp.value = "";
    save(); render();
    inp.focus();
  }
  document.getElementById("addBtn").addEventListener("click", addPlayer);
  document.getElementById("newName").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addPlayer(); }
  });

  // window.confirm is blocked in the sandboxed frame — two-step confirm instead.
  let resetArmed = null;
  document.getElementById("resetBtn").addEventListener("click", (e) => {
    const btn = e.currentTarget;
    if (!resetArmed) {
      btn.textContent = "בטוחים? לחיצה נוספת תמחק הכול";
      resetArmed = setTimeout(() => {
        resetArmed = null;
        btn.textContent = "איפוס משחק";
      }, 4000);
      return;
    }
    clearTimeout(resetArmed);
    resetArmed = null;
    btn.textContent = "איפוס משחק";
    state = { example: false, players: [] };
    save(); render();
  });

  render();
})();
</script>

</body>
