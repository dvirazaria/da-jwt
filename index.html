    toggleTheme();
    refreshSettings();
  });
  document.getElementById("setSignInBtn").addEventListener("click", () => {
    // Keeps `me` and local history untouched — this is a path back into an account, not a
    // sign-out. showLogin() itself never clears `me`.
    document.getElementById("settings").hidden = true;
    showLogin();
  });
  document.getElementById("setSwapBtn").addEventListener("click", () => {
    signOutAccount(); // ends the Supabase session first when there is one; no-op in local mode
    me = null; saveMe();
    document.getElementById("settings").hidden = true;
    render();
    showLogin();
  });
  let setClearArmed = null;
  document.getElementById("setClearBtn").addEventListener("click", (e) => {
    const btn = e.currentTarget;
    if (!setClearArmed) {
      setClearArmed = setTimeout(() => {
        setClearArmed = null;
        btn.textContent = "איפוס רקורד";
        btn.classList.remove("armed");
      }, 4000);
      btn.textContent = "בטוח? זה מוחק את ההיסטוריה של כולם";
      btn.classList.add("armed");
      return;
    }
    clearTimeout(setClearArmed);
    setClearArmed = null;
    btn.textContent = "איפוס רקורד";
    btn.classList.remove("armed");
    state.history = [];
    markReal(); save();
    document.getElementById("settings").hidden = true;
    render();
  });

  // Hide the tab bar while the on-screen keyboard is open — iOS moves
  // fixed-bottom elements around with the keyboard, so we duck out instead.
  let kbTimer = null;
  document.addEventListener("focusin", (e) => {
    if (e.target && e.target.tagName === "INPUT") {
      clearTimeout(kbTimer);
      document.querySelector(".tabbar").classList.add("kb-open");
    }
  });
  document.addEventListener("focusout", () => {
    clearTimeout(kbTimer);
    kbTimer = setTimeout(() => {
      const ae = document.activeElement;
      if (!ae || ae.tagName !== "INPUT") {
        document.querySelector(".tabbar").classList.remove("kb-open");
      }
    }, 150);
  });


  // ---------- boot ----------
  appView = initialAppView(state);
  render();
  if (typeof screen.orientation?.lock === "function" && matchMedia("(display-mode: standalone)").matches) {
    try { screen.orientation.lock("portrait").catch(() => {}); } catch (e) {}
  }
  // Auth first: a redirect back from Google carries ?code=/#access_token=, and the join reader
  // below must not see those. bootBackend() runs immediately when supabase-js is already there,
  // otherwise once the deferred CDN script has executed (DOMContentLoaded is after that).
  if (readAuthRedirectError()) { authRedirectError = "ההתחברות לא הושלמה, נסו שוב"; stripAuthParamsFromUrl(); }
  function bootBackend() {
    if (!supabase) supabase = createBackendClient();
    refreshAuthBlock();
    initAuth();
  }
  if (supabase) bootBackend();
  else document.addEventListener("DOMContentLoaded", bootBackend, { once: true });
  // After the auth section, so initSync() can ask cloudMode() whether a session already owns the
  // data. A restored session arrives asynchronously and tears this down again (enterCloudMode).
  initSync();
  const joinToken = parseJoinToken(location.search);
  if (joinToken) {
    // Nothing is joined here — this only shows the code and strips the query. Real redemption
    // needs a backend (see the invite section's note); if the user isn't signed in yet, the
    // normal login screen still follows once they dismiss the notice.
    document.getElementById("joinNoticeCode").textContent = formatInviteCode(joinToken);
    document.getElementById("joinNoticeNote").textContent = SERVER_NOTE;
    // Row 21: name the group when this device already knows the token (an invite it created or
    // synced). Unknown tokens simply stay nameless — nothing is fabricated and nothing is joined.
    const localInvite = (state.invites || []).find(i => i && i.token === joinToken && !i.revokedAt);
    const invitedGroup = localInvite && (state.groups || []).find(g => g && g.id === localInvite.groupId);
    const groupLine = document.getElementById("joinNoticeGroup");
    groupLine.textContent = invitedGroup ? invitedGroup.name : "";
    groupLine.hidden = !invitedGroup;
    const notice = document.getElementById("joinNotice");
    notice.hidden = false;
    document.getElementById("joinNoticeContinueBtn").addEventListener("click", () => {
      notice.hidden = true;
      if (!me) showLogin();
    }, { once: true });
    // "לא עכשיו" dismisses without pushing the login screen — the app is usable without a name.
    document.getElementById("joinNoticeLaterBtn").addEventListener("click", () => {
      notice.hidden = true;
    }, { once: true });
    history.replaceState(null, "", location.pathname);
  } else if (!me) {
    showLogin();
  }
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
