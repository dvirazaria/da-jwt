<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סוגרים קופה">
<title>סוגרים קופה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap">
<style>
  :root {
    --bg: #05070A;
    --text: #EAF4F4;
    --dim: #64707A;
    --faint: #39434C;
    --line: rgba(234,244,244,.09);
    --accent: #35E0DC;
    --accent-press: #8FF0EC;
    --bad: #FF6D6D;
    --close-hold-fill: #EAF4F4;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #F5F8F9;
    --text: #0C1519;
    --dim: #5A6870;
    --faint: #9AA8AE;
    --line: rgba(12,21,25,.12);
    --accent: #089E98;
    --accent-press: #0CC2BB;
    --bad: #D4403E;
    --close-hold-fill: #05070A;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  input, button, select, textarea { color-scheme: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Heebo", "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    direction: rtl;
    transition: background-color .3s, color .3s;
  }
  .wrap {
    max-width: 520px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(110px + env(safe-area-inset-bottom, 0px));
  }

  /* ---------- header ---------- */
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: .06em; color: var(--dim); font-weight: 400;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background .4s, box-shadow .4s; }
  .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 14px var(--accent); opacity: .7; } }
  h1 {
    font-weight: 800; font-size: clamp(26px, 7vw, 34px); letter-spacing: -0.02em;
    margin: 14px 0 0; line-height: 1.05; color: var(--text);
  }
  h1 em { font-style: normal; color: inherit; }

  /* ---------- shared controls ---------- */
  button {
    font: inherit; cursor: pointer; background: none; border: none; color: var(--text);
    padding: 0; touch-action: manipulation;
    transition: transform .12s ease, color .18s ease, border-color .18s ease,
                background-color .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  button:active { transform: scale(.92); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  input[type="text"], input[type="number"], input[type="tel"], input[type="email"] {
    -webkit-appearance: none; appearance: none;
    background: none; border: none; border-bottom: 1px solid var(--line);
    border-radius: 0; color: var(--text);
    font: inherit; font-variant-numeric: tabular-nums;
    padding: 8px 2px; min-height: 42px; width: 100%;
    transition: border-color .2s;
  }
  input:focus-visible { outline: none; border-bottom-color: var(--accent); }
  input::placeholder { color: var(--faint); }
  input[type=number]::-webkit-inner-spin-button { display: none; }

  /* ---------- add row ---------- */
  .addrow { display: flex; align-items: flex-end; gap: 14px; margin: 18px 0 2px; flex-wrap: wrap; }
  .addrow input { flex: 1; font-size: 17px; }
  /* group member chips above the name input (Task 9) — forced onto their own line inside the
     wrapping .addrow flex row; chip entrance stagger reuses .chip + .anim (see .addrow above). */
  #addrowChips { flex-basis: 100%; margin-top: 0; }
  .btn-add {
    color: var(--accent); font-weight: 700; font-size: 15px;
    padding: 8px 2px 10px; white-space: nowrap; letter-spacing: .02em;
  }
  .btn-add:hover { color: var(--accent-press); }

  /* ---------- floating bottom tab bar ---------- */
  :root { --bar-bg: rgba(13,17,22,.78); }
  :root[data-theme="light"] { --bar-bg: rgba(245,248,249,.9); }
  html { background: var(--bg); }
  .tabbar {
    position: fixed; bottom: 10px; inset-inline: 17px; margin-inline: auto;
    max-width: 470px; z-index: 20;
    background: var(--bar-bg);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
    transition: transform .25s ease, opacity .25s ease;
  }
  :root[data-theme="light"] .tabbar { box-shadow: 0 8px 24px rgba(12,21,25,.14); }
  .tabbar.kb-open { transform: translateY(120px); opacity: 0; pointer-events: none; }
  .tabbar-in {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    width: 100%;
  }
  .tab {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--dim); font-size: 14px; font-weight: 700;
    border-radius: 999px; padding: 10px; min-height: 43px;
    transition: background-color .25s ease, color .25s ease, flex-grow .25s ease, transform .12s ease;
  }
  .tab svg { width: 22px; height: 22px; flex: 0 0 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab .tlabel {
    max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap;
    transition: max-width .3s ease, opacity .22s ease;
  }
  .tab.on {
    flex-grow: 1.7;
    background: var(--accent); color: var(--bg);
  }
  .tab.on .tlabel { max-width: 90px; opacity: 1; }
  .tab:active { transform: scale(.94); }

  /* ---------- player rows ---------- */
  .prow { border-bottom: 1px solid var(--line); }
  .anim { animation: rise .38s ease both; }
  .load-in { animation: rise .5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  /* small fade-in for feedback text/tags that appear in place (no movement) */
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes shake {
    20%, 60% { transform: translateX(5px); }
    40%, 80% { transform: translateX(-5px); }
  }
  .shake { animation: shake .35s ease; }
  .prow-line { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 56px; }
  .pname { font-weight: 700; font-size: 17px; flex: 1; min-width: 72px; overflow-wrap: anywhere; }
  .pmeta { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 300; }
  .pmeta b { color: var(--text); font-weight: 500; display: inline-block; }
  .pmeta b.pulse { animation: pulseVal .55s ease; }
  @keyframes pulseVal { 30% { color: var(--accent); transform: scale(1.18); } }

  .btn-plus {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); color: var(--dim);
    font-size: 21px; line-height: 1; font-weight: 400;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s ease, background-color .18s, color .18s, border-color .18s;
  }
  .btn-plus:hover { border-color: var(--accent); color: var(--accent); }
  .btn-plus.open { transform: rotate(45deg); background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn-plus.open:active { transform: rotate(45deg) scale(.92); }

  /* expanding buy-in menu */
  .pmenu { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
  .pmenu.open { grid-template-rows: 1fr; }
  .pmenu-in { overflow: hidden; }
  .pmenu-row { display: flex; align-items: center; gap: 10px; padding: 2px 0 16px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 18px; min-height: 40px; max-width: 160px;
    color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 15px;
    transition: max-width .3s ease, padding .3s ease, opacity .25s ease,
                border-color .2s, background-color .18s, color .18s, transform .12s ease;
    white-space: nowrap; overflow: hidden;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip:active { background: var(--accent); color: var(--bg); }
  .chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }

  /* staggered entrance for the amount chips when the picker opens */
  .pmenu.open .pmenu-row > * { animation: chipIn .32s ease both; }
  .pmenu.open .pmenu-row > :nth-child(1) { animation-delay: .04s; }
  .pmenu.open .pmenu-row > :nth-child(2) { animation-delay: .09s; }
  .pmenu.open .pmenu-row > :nth-child(3) { animation-delay: .14s; }
  .pmenu.open .pmenu-row > :nth-child(4) { animation-delay: .19s; }
  .pmenu.open .pmenu-row > :nth-child(5) { animation-delay: .24s; }
  @keyframes chipIn { from { opacity: 0; transform: translateY(6px) scale(.9); } }

  /* "other" chip morphs into a full-width input capsule overlaying the row */
  .pmenu-row { position: relative; }
  .chip-other { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
  .pmenu-row.other-mode > .chip:not(.chip-other),
  .pmenu-row.other-mode > .undo {
    opacity: 0; pointer-events: none;
  }
  .pmenu-row.other-mode .chip-other {
    position: absolute; inset-inline: 0; top: 0; z-index: 2;
    max-width: none; overflow: visible;
    background: var(--bg); border-color: var(--accent);
    transform-origin: left center;
    transition: none; /* the grow animation alone drives the expansion */
    animation: capsuleGrow .3s ease;
  }
  @keyframes capsuleGrow { from { transform: scaleX(.28); opacity: .6; } }
  .other-label { flex: 0 0 auto; }
  .other-mode .chip-other .other-label { color: var(--accent); }
  input.other-input {
    flex: 0 1 0%; width: 0; min-width: 0; min-height: 0; opacity: 0;
    border: none; background: none; padding: 0; margin: 0;
    font: inherit; color: var(--text); font-variant-numeric: tabular-nums;
    transition: opacity .2s ease;
  }
  .other-mode input.other-input { flex: 1 1 auto; width: auto; opacity: 1; }
  input.other-input:focus-visible { outline: none; }
  .other-go { color: var(--accent); font-weight: 700; font-size: 14px; padding: 4px 6px; white-space: nowrap; }
  .undo { color: var(--faint); font-size: 13px; margin-inline-start: auto; }
  .undo:hover { color: var(--bad); }


  /* entry details — quiet, inline, using the existing row language */
  /* D2: a flex row so "יציאה" (exit-toggle) sits beside "פירוט כניסות" (entry-toggle) instead of
     wrapping under it; the name forces its own line via flex-basis so long names don't crowd
     the two text actions onto a half-width row. */
  .player-heading {
    flex: 1; min-width: 0;
    display: flex; flex-wrap: wrap; align-items: center; column-gap: 14px; row-gap: 2px;
  }
  .player-heading .pname { flex-basis: 100%; }
  .entry-toggle {
    display: flex; align-items: center; gap: 5px; padding: 4px 0;
    color: var(--dim); font-size: 12px; font-weight: 400;
  }
  .entry-toggle:hover { color: var(--accent); }
  .entry-toggle svg {
    width: 12px; height: 12px; fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .25s ease;
  }
  .entry-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .exit-toggle {
    display: flex; align-items: center; padding: 4px 0;
    color: var(--dim); font-size: 12px; font-weight: 400;
    margin-inline-start: 10px; transition: color .2s;
  }
  .exit-toggle:hover { color: var(--bad); }
  .exit-tag { color: var(--dim); font-size: 12px; animation: fadeIn .25s ease; }
  .exit-edit {
    color: var(--dim); font-size: 12px; font-weight: 400;
    padding: 4px 0 4px 8px; margin-inline-start: 4px; transition: color .2s;
  }
  .exit-edit:hover { color: var(--accent); }
  .prow.exited .pname { opacity: .55; }
  .exit-row { align-items: center; }
  input.exit-cashout-input {
    flex: 1 1 auto; min-width: 0; min-height: 42px;
    border: none; border-bottom: 1px solid var(--line); background: none;
    border-radius: 0; padding: 8px 2px; margin: 0;
    font: inherit; color: var(--text); font-variant-numeric: tabular-nums;
    transition: border-color .2s;
  }
  input.exit-cashout-input:focus-visible { outline: none; border-bottom-color: var(--accent); }
  .exit-confirm {
    flex: 0 0 auto; min-height: 44px;
    border-color: var(--accent); color: var(--accent); font-weight: 700;
    white-space: nowrap;
  }
  .exit-confirm:hover { background: var(--accent); color: var(--bg); }
  .entry-details { display: grid; grid-template-rows: 0fr; visibility: hidden;
    transition: grid-template-rows .28s ease, visibility .28s; }
  .entry-details.open { grid-template-rows: 1fr; visibility: visible; }
  .entry-details-in { overflow: hidden; min-height: 0; }
  .entry-list { margin: 0; padding: 2px 0 12px; list-style: none; }
  .entry-item { display: flex; justify-content: flex-start; align-items: baseline;
    gap: 8px; padding: 5px 0; font-size: 13px; font-variant-numeric: tabular-nums; }
  .entry-time { color: var(--dim); font-weight: 300; }
  .entry-divider { width: 14px; height: 1px; flex: 0 0 14px; background: var(--line); }
  .entry-amount { color: var(--text); font-weight: 500; }
  .entry-empty { color: var(--dim); font-size: 12px; margin: 0; padding: 4px 0 12px; }

  /* settle rows */
  input[type="number"].srow-input { width: 104px; flex: 0 0 104px; text-align: end; font-size: 17px; }
  .net { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 16px; min-width: 74px; text-align: left; }
  .net.pos { color: var(--accent); }
  .net.neg { color: var(--bad); }
  .net.zero { color: var(--faint); font-weight: 300; }

  /* ---------- stats / results ---------- */
  .statline {
    display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline;
    color: var(--dim); font-size: 14px; font-weight: 300;
    margin: 16px 0 0; font-variant-numeric: tabular-nums;
  }
  .statline b { color: var(--text); font-weight: 700; font-size: 16px; }
  .statline .sep { color: var(--faint); }
  .statline .bad { color: var(--bad); font-weight: 700; }
  .statline .good { color: var(--accent); font-weight: 700; }

  .warn { color: var(--bad); font-size: 14px; margin: 14px 0 0; font-weight: 400; animation: rise .3s ease both; }

  .results { margin-top: 24px; }
  .results h2, .ptitle {
    font-size: 13px; letter-spacing: .04em; font-weight: 500;
    color: var(--dim); margin: 0 0 4px;
  }
  .transfer {
    display: flex; align-items: baseline; gap: 10px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
    animation: rise .3s ease both;
  }
  .transfer .who { font-weight: 700; font-size: 17px; }
  .transfer .arrow { color: var(--faint); font-size: 13px; }
  .transfer .amount {
    margin-inline-start: auto; font-weight: 900; font-size: 20px;
    color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .transfer-paid {
    flex: 0 0 auto; margin-inline-start: 10px; border: 1px solid var(--line);
    border-radius: 999px; color: var(--dim); font-size: 12px; font-weight: 500;
    padding: 4px 10px; min-height: 30px;
  }
  .transfer-paid:hover { color: var(--text); border-color: var(--dim); }
  .transfer-paid.is-paid { color: var(--accent); border-color: var(--accent); }
  .settle-empty { color: var(--faint); margin: 12px 0 0; font-size: 14px; font-weight: 300; }

  /* ---------- Games dashboard ---------- */
  .games-view header { text-align: center; }
  .games-view header .eyebrow { justify-content: center; }
  .games-home { margin-top: 26px; animation: rise .4s ease both; text-align: center; }
  .games-home-in { width: 100%; max-width: 380px; margin: 0 auto; }
  .games-home-title { margin: 0; font-size: 24px; font-weight: 800; }
  .games-home-lead { color: var(--dim); font-size: 14px; font-weight: 300; margin: 6px 0 26px; }
  .games-section { margin-top: 28px; text-align: center; }
  .games-section:first-of-type { margin-top: 0; }
  .games-section-title { color: var(--dim); font-size: 13px; font-weight: 500; margin: 0 0 10px; }
  .games-quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .games-quick-action {
    min-width: 0; min-height: 46px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    color: var(--text); font-size: 14px; font-weight: 600;
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .games-quick-action.primary { border-color: var(--accent); color: var(--accent); }
  .games-quick-action.primary:hover { background: var(--accent); color: var(--bg); }
  .games-active-card, .games-group-card { padding: 15px 0; border-bottom: 1px solid var(--line); text-align: center; }
  .games-card-status { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 11px; font-weight: 400; }
  .games-card-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .games-card-status.settlement::before { background: var(--faint); }
  .games-card-title { display: block; color: var(--text); font-size: 16px; font-weight: 700; }
  .games-card-meta, .games-card-time { display: block; color: var(--dim); font-size: 12px; font-weight: 300; }
  .games-card-time { margin-top: 2px; }
  .games-card-actions { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 10px; }
  .games-card-enter { border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); font-size: 13px; font-weight: 700; padding: 6px 15px; min-height: 34px; transition: background-color .2s, color .2s, border-color .2s; }
  .games-card-enter:hover { background: var(--accent); color: var(--bg); }
  .games-card-toggle { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; padding: 6px 0; transition: color .2s; }
  .games-card-toggle:hover { color: var(--accent); }
  .games-card-toggle svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .22s ease; }
  .games-card-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .games-card-details { display: grid; grid-template-rows: 0fr; visibility: hidden; transition: grid-template-rows .25s ease, visibility .25s; }
  .games-card-details.open { grid-template-rows: 1fr; visibility: visible; }
  .games-card-details-in { min-height: 0; overflow: hidden; }
  .games-card-details-content { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .games-detail-row { display: flex; align-items: baseline; justify-content: center; gap: 8px; padding: 3px 0; font-size: 12px; }
  .games-detail-name { color: var(--text); font-weight: 600; }
  .games-detail-meta { color: var(--dim); font-weight: 300; font-variant-numeric: tabular-nums; }
  .games-detail-totals { color: var(--dim); font-size: 12px; font-weight: 300; margin: 8px 0 0; }
  .games-detail-totals b { color: var(--text); font-weight: 600; }
  .games-group-head { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .games-group-head[role="button"] { cursor: pointer; transition: opacity .18s ease, transform .12s ease; }
  .games-group-head[role="button"]:active { transform: scale(.97); }
  .games-group-head[role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
  .games-group-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; display: flex; align-items: center; justify-content: center; background: var(--line); color: var(--dim); font-weight: 700; }
  .games-empty { color: var(--faint); font-size: 14px; font-weight: 300; margin: 0; }

  /* create-group inline panel — same grid-collapse transition as .pmenu */
  .games-create-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; margin-top: 14px; }
  .games-create-panel.open { grid-template-rows: 1fr; }
  .games-create-panel-in { overflow: hidden; }
  .games-create-panel-content { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 0 6px; }
  .games-create-avatar {
    width: 56px; height: 56px; border-radius: 50%; flex: 0 0 auto;
    border: 1px solid var(--line); background: var(--line); color: var(--dim);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-size: 22px; font-weight: 700;
  }
  .games-create-avatar:hover { border-color: var(--accent); color: var(--accent); }
  .games-create-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .games-create-panel input[type="text"] { max-width: 260px; text-align: center; }
  .games-create-submit {
    border: 1px solid var(--accent); border-radius: 999px; color: var(--accent);
    font-weight: 700; font-size: 15px; padding: 10px 24px; min-height: 44px;
  }
  .games-create-submit:hover { background: var(--accent); color: var(--bg); }
  .games-create-cancel { color: var(--dim); font-size: 13px; padding: 6px 2px; }
  .games-create-cancel:hover { color: var(--text); }

  /* group-page "start game" participant panel (Task 8) — checkbox rows + guest add, reusing
     .games-create-panel above for the collapse/expand animation */
  .group-start-panel { margin-top: 14px; }
  .group-start-member {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px;
    padding: 8px 4px; border-bottom: 1px solid var(--line);
    color: var(--text); font-size: 15px; font-weight: 600; text-align: start;
  }
  .group-start-member:last-of-type { border-bottom: none; }
  .group-start-check {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px;
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    transition: border-color .18s, background-color .18s;
  }
  .group-start-member[aria-checked="true"] .group-start-check { background: var(--accent); border-color: var(--accent); }
  .group-start-check svg {
    width: 13px; height: 13px; opacity: 0; stroke: var(--bg); stroke-width: 2.4;
    fill: none; stroke-linecap: round; stroke-linejoin: round; transform: scale(.4);
    transition: opacity .15s, transform .15s ease;
  }
  .group-start-member[aria-checked="true"] .group-start-check svg { opacity: 1; transform: scale(1); }
  .group-start-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .group-start-guests { margin-top: 4px; }
  .group-start-guest-row {
    display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 4px;
    border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 600; color: var(--text);
  }
  .group-start-guest-remove { margin-inline-start: auto; color: var(--dim); font-size: 12px; font-weight: 400; }
  .group-start-guest-remove:hover { color: var(--bad); }
  .group-start-add { margin-top: 10px; text-align: center; }
  .group-start-add-label { margin: 0 0 8px; color: var(--dim); font-size: 13px; font-weight: 600; }
  .group-start-add-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .group-start-confirm { transition: background-color .2s, color .2s, border-color .2s; }

  /* group page: header, primary action, leaderboard, last game, members, history */
  .games-group-header { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 40px; text-align: center; }
  .games-group-header-avatar {
    width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    background: var(--line); color: var(--dim); font-weight: 700; font-size: 26px;
  }
  .games-group-header-name { margin: 6px 0 0; font-size: 24px; font-weight: 800; }
  .games-group-header-meta { margin: 0; color: var(--dim); font-size: 13px; font-weight: 300; }
  .games-primary-action { margin-top: 22px; text-align: center; }
  .games-primary-action .btn-primary { min-width: 200px; }
  .btn-primary:disabled { opacity: .45; cursor: default; border-color: var(--line); color: var(--faint); }
  .btn-primary:disabled:hover { background: none; color: var(--faint); }
  /* status line above the CTA when the group's own game is open (Task 9): phase + player count + start time */
  .games-primary-status { margin: 0; color: var(--text); font-size: 13px; font-weight: 500; animation: fadeIn .25s ease; }
  .games-primary-reason { margin: 10px 0; color: var(--dim); font-size: 12px; font-weight: 300; animation: fadeIn .25s ease; }
  .games-leader-row, .games-member-row {
    margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line);
    font-size: 15px; font-weight: 600; color: var(--text); overflow-wrap: anywhere;
  }
  .games-leader-row:last-of-type, .games-member-row:last-of-type { border-bottom: none; }
  .games-member-tag { margin-inline-start: 6px; color: var(--dim); font-size: 12px; font-weight: 400; animation: fadeIn .25s ease; }

  /* group members: admin row actions, add-member panel, former members */
  .games-member-row.with-actions { display: flex; align-items: center; gap: 10px; text-align: start; }
  .games-member-name { flex: 1 1 auto; min-width: 0; display: inline-flex; align-items: center; flex-wrap: wrap; }
  .games-member-remove {
    flex: 0 0 auto; margin-inline-start: auto;
    color: var(--dim); font-size: 12px; font-weight: 400; padding: 4px 0 4px 8px;
    transition: color .2s;
  }
  .games-member-remove:hover, .games-member-remove.armed { color: var(--bad); }
  .games-member-add { margin-top: 14px; text-align: center; }
  .games-member-add-toggle { color: var(--dim); font-size: 13px; font-weight: 600; padding: 6px 2px; transition: color .2s; }
  .games-member-add-toggle:hover { color: var(--accent); }
  .games-member-add-note { margin: 0; color: var(--faint); font-size: 11px; font-weight: 300; }
  .games-former-members { margin-top: 14px; text-align: center; }
  .games-former-toggle { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; font-weight: 500; padding: 6px 2px; transition: color .2s; }
  .games-former-toggle:hover { color: var(--accent); }
  .games-former-toggle svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .22s ease; }
  .games-former-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }

  /* group history: tappable rows expanding into a per-game ranking (Task 11) */
  .games-history-item { padding: 8px 0; border-bottom: 1px solid var(--line); text-align: center; }
  .games-history-item:last-of-type { border-bottom: none; }
  .games-history-head { cursor: pointer; transition: opacity .18s ease, transform .12s ease; }
  .games-history-head:active { transform: scale(.97); }
  .games-history-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
  .games-history-row { margin: 0; font-size: 15px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
  .games-history-tag { margin-inline-start: 6px; color: var(--bad); font-size: 12px; font-weight: 500; animation: fadeIn .25s ease; }
  .games-history-rank { margin: 0; padding: 4px 0; font-size: 13px; font-weight: 500; color: var(--text); }
  /* Rank number ("1.") isolated in its own dir="ltr" span so the digit+dot never gets reversed
     by the bidi algorithm inside an RTL row (D4) — used by both the leaderboard and history rank. */
  .games-rank { margin-inline-end: 4px; font-variant-numeric: tabular-nums; }

  .btn-close-table {
    position: relative; overflow: hidden; isolation: isolate;
    display: block; width: min(100%, 340px); margin: 26px auto 0;
    border: 1px solid var(--accent); border-radius: 999px;
    color: var(--accent); font-weight: 700; font-size: 15px;
    padding: 12px 26px; min-height: 48px; touch-action: manipulation;
    white-space: nowrap; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .btn-close-table > span { position: relative; z-index: 1; }
  .btn-close-table::before {
    content: ""; position: absolute; z-index: 0;
    inset: 50% auto auto 50%; width: 0; height: calc(100% - 6px);
    border-radius: 999px; transform: translate(-50%, -50%);
    background: var(--close-hold-fill); pointer-events: none;
    transition: width 1s linear;
  }
  .btn-close-table:hover { background: var(--accent); color: var(--bg); }
  .btn-close-table.warn-state { border-color: var(--bad); color: var(--bad); }
  .btn-close-table.warn-state:hover { background: var(--bad); color: var(--bg); box-shadow: none; }
  .btn-close-table.blocked-state { cursor: default; opacity: .45; border-color: var(--line); color: var(--dim); }
  .btn-close-table.blocked-state:hover { background: none; color: var(--dim); }
  .btn-close-table.hold-state { opacity: 1; border-color: var(--line); color: var(--text); }
  .btn-close-table.hold-state::before { width: 100%; }
  .btn-close-table.force-state { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn-close-table.force-state::before { width: 0; transition: none; }
  .btn-close-table.force-state:hover { background: var(--accent-press); color: var(--bg); }
  .finish-game-hint { color: var(--dim); font-size: 12px; font-weight: 300; text-align: center; margin: 8px 0 0; }
  .return-edit-btn { display: block; margin: 18px auto 0; color: var(--dim); font-size: 13px; font-weight: 500; padding: 6px 2px; }
  .return-edit-btn:hover { color: var(--text); }
  .force-close-confirm { margin-top: 12px; color: var(--dim); font-size: 13px; }
  .force-close-confirm p { margin: 0 0 8px; }
  .force-close-actions { display: flex; align-items: center; gap: 14px; }
  .force-close-actions button { font-size: 13px; padding: 5px 2px; }
  .force-close-cancel { color: var(--dim); }
  .force-close-submit { color: var(--text); font-weight: 700; }

  /* ---------- profile (centered) ---------- */
  .profile { margin-top: 6px; text-align: center; }
  .psection { margin-top: 22px; animation: rise .4s ease both; }
  .profile .psection { display: flex; flex-direction: column; align-items: center; }
  .profile .pgrid { justify-items: center; width: 100%; max-width: 340px; }
  .profile .hgame { justify-content: center; width: 100%; }
  .profile .hgame .hnet { margin-inline-start: 0; min-width: 74px; text-align: start; }
  .profile-tabs { display: flex; justify-content: center; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); }
  .profile-tab { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 14px; font-weight: 500; padding: 7px 18px 8px; border-bottom: 2px solid transparent; }
  .profile-tab:hover { color: var(--text); }
  .profile-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .profile-tab-badge { width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(53,224,220,.1); }
  .debt-tabs { display: flex; justify-content: center; gap: 4px; width: 100%; max-width: 360px; margin: 0 auto 14px; border-bottom: 1px solid var(--line); }
  .debt-tab { flex: 1; color: var(--dim); font-size: 16px; font-weight: 500; padding: 8px 18px 9px; border-bottom: 2px solid transparent; }
  .debt-tab:hover { color: var(--text); }
  .debt-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .who-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .bignum {
    font-size: 52px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .bignum.pos { color: var(--accent); }
  .bignum.neg { color: var(--bad); }
  .bignum.zero { color: var(--dim); }
  .pstats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; color: var(--dim); font-size: 14px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .pstats b { color: var(--text); font-weight: 700; }
  .hgame {
    display: flex; align-items: baseline; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums; animation: rise .3s ease both;
  }
  .hgame .hdate { color: var(--dim); font-size: 13px; font-weight: 300; }
  .hgame .hplayers { color: var(--faint); font-size: 12px; font-weight: 300; }
  .hgame .hnet { margin-inline-start: auto; font-weight: 700; font-size: 17px; }
  .hnet.pos { color: var(--accent); } .hnet.neg { color: var(--bad); } .hnet.zero { color: var(--faint); font-weight: 300; }
  .debt-section { width: 100%; max-width: 380px; text-align: start; }
  .debt-pane { width: 100%; }
  .debt-group .empty-note { width: 100%; text-align: center; }
  .debt-group h3 { color: var(--dim); font-size: 13px; font-weight: 500; margin: 0 0 4px; }
  .debt-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); animation: rise .3s ease both; }
  .debt-copy { min-width: 0; flex: 1; }
  .debt-person { display: block; color: var(--text); font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
  .debt-meta { display: block; color: var(--dim); font-size: 12px; font-weight: 300; }
  .debt-amount { flex: 0 0 auto; color: var(--text); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .debt-paid-btn { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); font-size: 12px; font-weight: 500; padding: 4px 10px; min-height: 30px; }
  .debt-paid-btn:hover { color: var(--accent); border-color: var(--accent); }
  .friend-helper { color: var(--faint); font-size: 12px; font-weight: 300; margin-top: 8px; text-align: center; }
  .empty-note { color: var(--dim); font-size: 14px; font-weight: 300; margin-top: 10px; }
  .pid { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .pname-big { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin-top: 16px; }
  .pcell { display: flex; flex-direction: column; gap: 1px; }
  .plab { font-size: 12px; color: var(--dim); font-weight: 300; }
  .pval { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .example-tag { color: var(--accent); font-size: 12px; font-weight: 400; }

  /* ---------- corner controls (top-left, scroll with the page) ---------- */
  .corner {
    position: absolute; top: calc(6px + env(safe-area-inset-top, 0px)); left: 18px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    z-index: 30;
  }
  .corner-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--dim); font-size: 10px; font-weight: 500;
  }
  .corner-btn .cicon { display: flex; transition: transform .25s ease; }
  .corner-btn svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .corner-btn:hover { color: var(--accent); }
  .corner-btn:active .cicon { transform: scale(.85) rotate(-30deg); }
  .corner-btn.danger-armed { color: var(--bad); }
  header { padding-inline-end: 96px; }
  /* Keep the main content below the fixed corner controls after the app title was removed. */
  .game-view .wrap > header, .settle-view .wrap > header { min-height: 64px; }

  /* ---------- login overlay ---------- */
  .login {
    position: fixed; inset: 0; z-index: 40;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .login-in { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 18px; animation: rise .45s ease both; }
  .login .eyebrow { justify-content: flex-start; }
  .login h2 { font-weight: 900; font-size: 34px; margin: 0; line-height: 1.1; }
  .login p { color: var(--dim); font-size: 14px; font-weight: 300; margin: -8px 0 0; }
  .login .who-row { margin-top: 0; }
  .btn-primary {
    border: 1px solid var(--accent); border-radius: 999px;
    color: var(--accent); font-weight: 700; font-size: 15px;
    padding: 12px 26px; min-height: 48px; align-self: flex-start;
  }
  .btn-primary:hover { background: var(--accent); color: var(--bg); }
  .btn-skip { color: var(--dim); font-size: 13px; align-self: flex-start; }

  /* settings — flat, centered */
  .back-arrow {
    position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); inset-inline-start: 18px;
    color: var(--dim); padding: 8px;
  }
  .back-arrow svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .back-arrow:hover { color: var(--accent); }
  .set-in { align-items: center; text-align: center; gap: 20px; }
  .avatar {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--accent); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 800;
  }
  .set-name { font-size: 22px; font-weight: 800; margin-top: -6px; }
  .set-in input { max-width: 260px; text-align: center; font-size: 16px; }
  .theme-row { display: flex; align-items: center; gap: 14px; color: var(--dim); margin-top: 4px; }
  .theme-row svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .switch {
    width: 54px; height: 31px; border-radius: 999px;
    border: 1px solid var(--line); position: relative; flex: 0 0 54px;
    transition: border-color .25s;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; inset-inline-start: 3px;
    width: 23px; height: 23px; border-radius: 50%; background: var(--dim);
    transition: transform .25s ease, background-color .25s;
  }
  .switch.on { border-color: var(--accent); }
  .switch.on::after { transform: translateX(-23px); background: var(--accent); }
  .set-flat { font-size: 17px; font-weight: 500; color: var(--accent); padding: 10px; min-height: 46px; transition: color .2s, background-color .2s, border-color .2s; }
  .set-flat:hover { color: var(--accent-press); }
  .set-flat.danger { color: var(--bad); }
  .set-flat.danger:hover, .set-flat.danger.armed { color: var(--bad); }

  /* group page: invite (code / link / QR placeholder) */
  .games-invite-create {
    border: 1px solid var(--accent); border-radius: 999px; color: var(--accent);
    font-weight: 700; font-size: 15px; padding: 10px 24px; min-height: 44px;
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .games-invite-create:hover { background: var(--accent); color: var(--bg); }
  .games-invite-card { display: flex; flex-direction: column; align-items: center; gap: 12px; animation: rise .3s ease both; }
  .games-invite-code {
    margin: 0; text-align: center; color: var(--text);
    font-size: 28px; font-weight: 800; letter-spacing: .12em;
    font-variant-numeric: tabular-nums;
  }
  /* D6: the join-notice's own code display reads quieter than the group settings invite code. */
  #joinNoticeCode { color: var(--dim); }
  .games-invite-actions { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .games-invite-action {
    border: 1px solid var(--line); border-radius: 999px; color: var(--text);
    font-size: 13px; font-weight: 600; padding: 8px 16px; min-height: 40px;
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .games-invite-action:hover { border-color: var(--accent); color: var(--accent); }
  .games-invite-copied { color: var(--accent); font-size: 12px; font-weight: 500; animation: fadeIn .25s ease; }
  .games-invite-qr {
    width: 120px; height: 120px; border: 1px solid var(--line); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 10px; color: var(--dim); font-size: 12px; font-weight: 300;
  }
  .games-invite-note { margin: 0; color: var(--dim); font-size: 12px; font-weight: 300; max-width: 280px; }
  .games-invite-revoke { color: var(--dim); font-size: 12px; font-weight: 400; padding: 4px 0; transition: color .2s; }
  .games-invite-revoke:hover { color: var(--bad); }

  /* group page: settings corner button, member promote action, disabled group avatar picker */
  .games-group-settings-btn {
    position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); inset-inline-end: 0;
    display: inline-flex; align-items: center; min-height: 44px;
    color: var(--dim); font-size: 13px; font-weight: 500; padding: 10px 8px;
    transition: color .2s;
  }
  .games-group-settings-btn:hover { color: var(--accent); }
  .games-member-promote { flex: 0 0 auto; color: var(--dim); font-size: 12px; font-weight: 400; padding: 4px 0; transition: color .2s; }
  .games-member-promote:hover { color: var(--accent); }
  .games-create-avatar:disabled { cursor: default; opacity: .55; }
  .set-flat:disabled { opacity: .5; cursor: default; }
  .set-flat:disabled:hover { color: var(--faint); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<div class="corner load-in" style="animation-delay:.2s">
  <button type="button" class="corner-btn" id="themeBtn" aria-label="החלף בין מצב כהה למצב בהיר">
    <span class="cicon" id="themeIcon"></span>
  </button>
  <button type="button" class="corner-btn" id="resetBtn" aria-label="איפוס משחק">
    <span class="cicon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 1 2.2 5.3"></path><path d="M4.5 21v-4.5H9"></path></svg></span>
    <span id="resetLabel">איפוס</span>
  </button>
  <button type="button" class="corner-btn" id="settingsBtn" aria-label="הגדרות" hidden>
    <span class="cicon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>
    <span>הגדרות</span>
  </button>
</div>

<div class="login" id="settings" hidden>
  <button type="button" class="back-arrow" id="setBackBtn" aria-label="חזרה">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
