<title>סוגרים קופה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap">
<style>
  :root {
    --bg: #05070A;
    --text: #EAF4F4;
    --dim: #64707A;
    --faint: #39434C;
    --line: rgba(234,244,244,.09);
    --accent: #35E0DC;
    --accent-press: #8FF0EC;
    --bad: #FF6D6D;
    --close-hold-fill: #EAF4F4;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #F5F8F9;
    --text: #0C1519;
    --dim: #5A6870;
    --faint: #9AA8AE;
    --line: rgba(12,21,25,.12);
    --accent: #089E98;
    --accent-press: #0CC2BB;
    --bad: #D4403E;
    --close-hold-fill: #05070A;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  input, button, select, textarea { color-scheme: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Heebo", "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    direction: rtl;
    transition: background-color .3s, color .3s;
  }
  .wrap {
    max-width: 520px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(110px + env(safe-area-inset-bottom, 0px));
  }

  /* ---------- header ---------- */
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: .06em; color: var(--dim); font-weight: 400;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background .4s, box-shadow .4s; }
  .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 14px var(--accent); opacity: .7; } }
  h1 {
    font-weight: 800; font-size: clamp(26px, 7vw, 34px); letter-spacing: -0.02em;
    margin: 14px 0 0; line-height: 1.05; color: var(--text);
  }
  h1 em { font-style: normal; color: inherit; }

  /* ---------- shared controls ---------- */
  button {
    font: inherit; cursor: pointer; background: none; border: none; color: var(--text);
    padding: 0; touch-action: manipulation;
    transition: transform .12s ease, color .18s ease, border-color .18s ease,
                background-color .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  button:active { transform: scale(.92); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  input[type="text"], input[type="number"], input[type="tel"], input[type="email"] {
    -webkit-appearance: none; appearance: none;
    background: none; border: none; border-bottom: 1px solid var(--line);
    border-radius: 0; color: var(--text);
    font: inherit; font-variant-numeric: tabular-nums;
    padding: 8px 2px; min-height: 42px; width: 100%;
    transition: border-color .2s;
  }
  input:focus-visible { outline: none; border-bottom-color: var(--accent); }
  input::placeholder { color: var(--faint); }
  input[type=number]::-webkit-inner-spin-button { display: none; }

  /* ---------- add row ---------- */
  .addrow { display: flex; align-items: flex-end; gap: 14px; margin: 18px 0 2px; }
  .addrow input { flex: 1; font-size: 17px; }
  .btn-add {
    color: var(--accent); font-weight: 700; font-size: 15px;
    padding: 8px 2px 10px; white-space: nowrap; letter-spacing: .02em;
  }
  .btn-add:hover { color: var(--accent-press); }

  /* ---------- floating bottom tab bar ---------- */
  :root { --bar-bg: rgba(13,17,22,.78); }
  :root[data-theme="light"] { --bar-bg: rgba(245,248,249,.9); }
  html { background: var(--bg); }
  .tabbar {
    position: fixed; bottom: 10px; inset-inline: 17px; margin-inline: auto;
    max-width: 470px; z-index: 20;
    background: var(--bar-bg);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
    transition: transform .25s ease, opacity .25s ease;
  }
  :root[data-theme="light"] .tabbar { box-shadow: 0 8px 24px rgba(12,21,25,.14); }
  .tabbar.kb-open { transform: translateY(120px); opacity: 0; pointer-events: none; }
  .tabbar-in {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    width: 100%;
  }
  .tab {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--dim); font-size: 14px; font-weight: 700;
    border-radius: 999px; padding: 10px; min-height: 43px;
    transition: background-color .25s ease, color .25s ease, flex-grow .25s ease, transform .12s ease;
  }
  .tab svg { width: 22px; height: 22px; flex: 0 0 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab .tlabel {
    max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap;
    transition: max-width .3s ease, opacity .22s ease;
  }
  .tab.on {
    flex-grow: 1.7;
    background: var(--accent); color: var(--bg);
  }
  .tab.on .tlabel { max-width: 90px; opacity: 1; }
  .tab:active { transform: scale(.94); }

  /* ---------- player rows ---------- */
  .prow { border-bottom: 1px solid var(--line); }
  .prow.anim { animation: rise .38s ease both; }
  .load-in { animation: rise .5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes shake {
    20%, 60% { transform: translateX(5px); }
    40%, 80% { transform: translateX(-5px); }
  }
  .shake { animation: shake .35s ease; }
  .prow-line { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 56px; }
  .pname { font-weight: 700; font-size: 17px; flex: 1; min-width: 72px; overflow-wrap: anywhere; }
  .pmeta { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 300; }
  .pmeta b { color: var(--text); font-weight: 500; display: inline-block; }
  .pmeta b.pulse { animation: pulseVal .55s ease; }
  @keyframes pulseVal { 30% { color: var(--accent); transform: scale(1.18); } }

  .btn-plus {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); color: var(--dim);
    font-size: 21px; line-height: 1; font-weight: 400;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s ease, background-color .18s, color .18s, border-color .18s;
  }
  .btn-plus:hover { border-color: var(--accent); color: var(--accent); }
  .btn-plus.open { transform: rotate(45deg); background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn-plus.open:active { transform: rotate(45deg) scale(.92); }

  /* expanding buy-in menu */
  .pmenu { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
  .pmenu.open { grid-template-rows: 1fr; }
  .pmenu-in { overflow: hidden; }
  .pmenu-row { display: flex; align-items: center; gap: 10px; padding: 2px 0 16px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 18px; min-height: 40px; max-width: 160px;
    color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 15px;
    transition: max-width .3s ease, padding .3s ease, opacity .25s ease,
                border-color .2s, background-color .18s, color .18s, transform .12s ease;
    white-space: nowrap; overflow: hidden;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip:active { background: var(--accent); color: var(--bg); }
  .chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }

  /* staggered entrance for the amount chips when the picker opens */
  .pmenu.open .pmenu-row > * { animation: chipIn .32s ease both; }
  .pmenu.open .pmenu-row > :nth-child(1) { animation-delay: .04s; }
  .pmenu.open .pmenu-row > :nth-child(2) { animation-delay: .09s; }
  .pmenu.open .pmenu-row > :nth-child(3) { animation-delay: .14s; }
  .pmenu.open .pmenu-row > :nth-child(4) { animation-delay: .19s; }
  .pmenu.open .pmenu-row > :nth-child(5) { animation-delay: .24s; }
  @keyframes chipIn { from { opacity: 0; transform: translateY(6px) scale(.9); } }

  /* "other" chip morphs into a full-width input capsule overlaying the row */
  .pmenu-row { position: relative; }
  .chip-other { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
  .pmenu-row.other-mode > .chip:not(.chip-other),
  .pmenu-row.other-mode > .undo {
    opacity: 0; pointer-events: none;
  }
  .pmenu-row.other-mode .chip-other {
    position: absolute; inset-inline: 0; top: 0; z-index: 2;
    max-width: none; overflow: visible;
    background: var(--bg); border-color: var(--accent);
    transform-origin: left center;
    transition: none; /* the grow animation alone drives the expansion */
    animation: capsuleGrow .3s ease;
  }
  @keyframes capsuleGrow { from { transform: scaleX(.28); opacity: .6; } }
  .other-label { flex: 0 0 auto; }
  .other-mode .chip-other .other-label { color: var(--accent); }
  input.other-input {
    flex: 0 1 0%; width: 0; min-width: 0; min-height: 0; opacity: 0;
    border: none; background: none; padding: 0; margin: 0;
    font: inherit; color: var(--text); font-variant-numeric: tabular-nums;
    transition: opacity .2s ease;
  }
  .other-mode input.other-input { flex: 1 1 auto; width: auto; opacity: 1; }
  input.other-input:focus-visible { outline: none; }
  .other-go { color: var(--accent); font-weight: 700; font-size: 14px; padding: 4px 6px; white-space: nowrap; }
  .undo { color: var(--faint); font-size: 13px; margin-inline-start: auto; }
  .undo:hover { color: var(--bad); }


  /* entry details — quiet, inline, using the existing row language */
  .player-heading { flex: 1; min-width: 0; }
  .entry-toggle {
    display: flex; align-items: center; gap: 5px; padding: 4px 0;
    color: var(--dim); font-size: 12px; font-weight: 400;
  }
  .entry-toggle:hover { color: var(--accent); }
  .entry-toggle svg {
    width: 12px; height: 12px; fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .25s ease;
  }
  .entry-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .entry-details { display: grid; grid-template-rows: 0fr; visibility: hidden;
    transition: grid-template-rows .28s ease, visibility .28s; }
  .entry-details.open { grid-template-rows: 1fr; visibility: visible; }
  .entry-details-in { overflow: hidden; min-height: 0; }
  .entry-list { margin: 0; padding: 2px 0 12px; list-style: none; }
  .entry-item { display: flex; justify-content: flex-start; align-items: baseline;
    gap: 8px; padding: 5px 0; font-size: 13px; font-variant-numeric: tabular-nums; }
  .entry-time { color: var(--dim); font-weight: 300; }
  .entry-divider { width: 14px; height: 1px; flex: 0 0 14px; background: var(--line); }
  .entry-amount { color: var(--text); font-weight: 500; }
  .entry-empty { color: var(--dim); font-size: 12px; margin: 0; padding: 4px 0 12px; }

  /* settle rows */
  input[type="number"].srow-input { width: 104px; flex: 0 0 104px; text-align: end; font-size: 17px; }
  .net { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 16px; min-width: 74px; text-align: left; }
  .net.pos { color: var(--accent); }
  .net.neg { color: var(--bad); }
  .net.zero { color: var(--faint); font-weight: 300; }

  /* ---------- stats / results ---------- */
  .statline {
    display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline;
    color: var(--dim); font-size: 14px; font-weight: 300;
    margin: 16px 0 0; font-variant-numeric: tabular-nums;
  }
  .statline b { color: var(--text); font-weight: 700; font-size: 16px; }
  .statline .sep { color: var(--faint); }
  .statline .bad { color: var(--bad); font-weight: 700; }
  .statline .good { color: var(--accent); font-weight: 700; }

  .warn { color: var(--bad); font-size: 14px; margin: 14px 0 0; font-weight: 400; animation: rise .3s ease both; }

  .results { margin-top: 24px; }
  .results h2, .ptitle {
    font-size: 13px; letter-spacing: .04em; font-weight: 500;
    color: var(--dim); margin: 0 0 4px;
  }
  .transfer {
    display: flex; align-items: baseline; gap: 10px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
    animation: rise .3s ease both;
  }
  .transfer .who { font-weight: 700; font-size: 17px; }
  .transfer .arrow { color: var(--faint); font-size: 13px; }
  .transfer .amount {
    margin-inline-start: auto; font-weight: 900; font-size: 20px;
    color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .transfer-paid {
    flex: 0 0 auto; margin-inline-start: 10px; border: 1px solid var(--line);
    border-radius: 999px; color: var(--dim); font-size: 12px; font-weight: 500;
    padding: 4px 10px; min-height: 30px;
  }
  .transfer-paid:hover { color: var(--text); border-color: var(--dim); }
  .transfer-paid.is-paid { color: var(--accent); border-color: var(--accent); }
  .settle-empty { color: var(--faint); margin: 12px 0 0; font-size: 14px; font-weight: 300; }

  /* ---------- Games dashboard ---------- */
  .games-home { margin-top: 26px; animation: rise .4s ease both; }
  .games-home-in { width: 100%; max-width: 380px; margin: 0 auto; }
  .games-home-title { margin: 0; font-size: 24px; font-weight: 800; }
  .games-home-lead { color: var(--dim); font-size: 14px; font-weight: 300; margin: 6px 0 24px; }
  .games-section { margin-top: 22px; }
  .games-section-title { color: var(--dim); font-size: 13px; font-weight: 500; margin: 0 0 8px; }
  .games-card { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .games-card-copy { flex: 1; min-width: 0; }
  .games-card-title { display: block; color: var(--text); font-size: 16px; font-weight: 700; }
  .games-card-meta { display: block; color: var(--dim); font-size: 12px; font-weight: 300; }
  .games-card-action { flex: 0 0 auto; color: var(--accent); font-size: 13px; font-weight: 700; padding: 6px 0; }
  .games-card-action:hover { color: var(--accent-press); }
  .games-card-action.muted { color: var(--faint); cursor: default; }
  .games-card-action:disabled { opacity: .65; }
  .games-empty { color: var(--faint); font-size: 14px; font-weight: 300; margin: 0; }
  .games-start { display: block; width: 100%; margin-top: 12px; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); font-size: 15px; font-weight: 700; padding: 11px 20px; min-height: 46px; }
  .games-start:hover { background: var(--accent); color: var(--bg); }

  .btn-close-table {
    position: relative; overflow: hidden; isolation: isolate;
    display: block; width: min(100%, 340px); margin: 26px auto 0;
    border: 1px solid var(--accent); border-radius: 999px;
    color: var(--accent); font-weight: 700; font-size: 15px;
    padding: 12px 26px; min-height: 48px; touch-action: manipulation;
    white-space: nowrap; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .btn-close-table > span { position: relative; z-index: 1; }
  .btn-close-table::before {
    content: ""; position: absolute; z-index: 0;
    inset: 50% auto auto 50%; width: 0; height: calc(100% - 6px);
    border-radius: 999px; transform: translate(-50%, -50%);
    background: var(--close-hold-fill); pointer-events: none;
    transition: width 1s linear;
  }
  .btn-close-table:hover { background: var(--accent); color: var(--bg); }
  .btn-close-table.warn-state { border-color: var(--bad); color: var(--bad); }
  .btn-close-table.warn-state:hover { background: var(--bad); color: var(--bg); box-shadow: none; }
  .btn-close-table.blocked-state { cursor: default; opacity: .45; border-color: var(--line); color: var(--faint); }
  .btn-close-table.blocked-state:hover { background: none; color: var(--faint); }
  .btn-close-table.hold-state { opacity: 1; border-color: var(--line); color: var(--text); }
  .btn-close-table.hold-state::before { width: 100%; }
  .btn-close-table.force-state { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn-close-table.force-state::before { width: 0; transition: none; }
  .btn-close-table.force-state:hover { background: var(--accent-press); color: var(--bg); }
  .finish-game-hint { color: var(--dim); font-size: 12px; font-weight: 300; text-align: center; margin: 8px 0 0; }
  .return-edit-btn { display: block; margin: 18px auto 0; color: var(--dim); font-size: 13px; font-weight: 500; padding: 6px 2px; }
  .return-edit-btn:hover { color: var(--text); }
  .force-close-confirm { margin-top: 12px; color: var(--dim); font-size: 13px; }
  .force-close-confirm p { margin: 0 0 8px; }
  .force-close-actions { display: flex; align-items: center; gap: 14px; }
  .force-close-actions button { font-size: 13px; padding: 5px 2px; }
  .force-close-cancel { color: var(--dim); }
  .force-close-submit { color: var(--text); font-weight: 700; }

  /* ---------- profile (centered) ---------- */
  .profile { margin-top: 6px; text-align: center; }
  .psection { margin-top: 22px; animation: rise .4s ease both; }
  .profile .psection { display: flex; flex-direction: column; align-items: center; }
  .profile .pgrid { justify-items: center; width: 100%; max-width: 340px; }
  .profile .hgame { justify-content: center; width: 100%; }
  .profile .hgame .hnet { margin-inline-start: 0; min-width: 74px; text-align: start; }
  .profile-tabs { display: flex; justify-content: center; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); }
  .profile-tab { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 14px; font-weight: 500; padding: 7px 18px 8px; border-bottom: 2px solid transparent; }
  .profile-tab:hover { color: var(--text); }
  .profile-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .profile-tab-badge { width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(53,224,220,.1); }
  .debt-tabs { display: flex; justify-content: center; gap: 4px; width: 100%; max-width: 360px; margin: 0 auto 14px; border-bottom: 1px solid var(--line); }
  .debt-tab { flex: 1; color: var(--dim); font-size: 16px; font-weight: 500; padding: 8px 18px 9px; border-bottom: 2px solid transparent; }
  .debt-tab:hover { color: var(--text); }
  .debt-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .who-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .bignum {
    font-size: 52px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .bignum.pos { color: var(--accent); }
  .bignum.neg { color: var(--bad); }
  .bignum.zero { color: var(--dim); }
  .pstats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; color: var(--dim); font-size: 14px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .pstats b { color: var(--text); font-weight: 700; }
  .hgame {
    display: flex; align-items: baseline; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums; animation: rise .3s ease both;
  }
  .hgame .hdate { color: var(--dim); font-size: 13px; font-weight: 300; }
  .hgame .hplayers { color: var(--faint); font-size: 12px; font-weight: 300; }
  .hgame .hnet { margin-inline-start: auto; font-weight: 700; font-size: 17px; }
  .hnet.pos { color: var(--accent); } .hnet.neg { color: var(--bad); } .hnet.zero { color: var(--faint); font-weight: 300; }
  .debt-section { width: 100%; max-width: 380px; text-align: start; }
  .debt-pane { width: 100%; }
  .debt-group .empty-note { width: 100%; text-align: center; }
  .debt-group h3 { color: var(--dim); font-size: 13px; font-weight: 500; margin: 0 0 4px; }
  .debt-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .debt-copy { min-width: 0; flex: 1; }
  .debt-person { display: block; color: var(--text); font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
  .debt-meta { display: block; color: var(--dim); font-size: 12px; font-weight: 300; }
  .debt-amount { flex: 0 0 auto; color: var(--text); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .debt-paid-btn { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); font-size: 12px; font-weight: 500; padding: 4px 10px; min-height: 30px; }
  .debt-paid-btn:hover { color: var(--accent); border-color: var(--accent); }
  .empty-note { color: var(--faint); font-size: 14px; font-weight: 300; margin-top: 10px; }
  .pid { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .pname-big { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin-top: 16px; }
  .pcell { display: flex; flex-direction: column; gap: 1px; }
  .plab { font-size: 12px; color: var(--dim); font-weight: 300; }
  .pval { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .example-tag { color: var(--accent); font-size: 12px; font-weight: 400; }

  /* ---------- corner controls (top-left, scroll with the page) ---------- */
  .corner {
    position: absolute; top: calc(6px + env(safe-area-inset-top, 0px)); left: 18px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    z-index: 30;
  }
  .corner-btn {

<script>
(function () {
  const MIN_BUYIN = 50;
  const BUYIN_OPTIONS = [50, 100, 150];
  // localStorage keys keep the historical "poker-settle" prefix for data continuity
  const KEY = "poker-settle-v1";
  const ME_KEY = "poker-settle-me";
  const THEME_KEY = "poker-settle-theme";
  const CONTACT_KEY = "poker-settle-contact";
  const PROFILE_DEBT_SEEN_KEY = "poker-settle-profile-debts-seen";
  const HISTORY_MAX = 60;
  const HOLD_TO_FORCE_CLOSE_MS = 1000;
  const FINISH_GAME_HOLD_MS = 1000;

  const EXAMPLE = {
    example: true,
    players: [
      { name: "דביר",  buyins: [50, 50], cashout: 180 },
      { name: "יוסי",  buyins: [50],     cashout: 0   },
      { name: "רותם",  buyins: [50, 50, 50], cashout: 95 },
      { name: "עמית",  buyins: [50],     cashout: 25  },
    ],
    history: [],
  };

  const expandedEntries = new Set();
  let state = load();
  let appView = "games";         // "games" | "game" | "settle" | "profile"
  let openMenu = null;        // player name whose buy-in menu is open
  let menuJustOpened = null;  // menu that should animate open on the next render
  let pendingAmount = null;   // amount selected once, waiting for the confirming second tap
  let customOpen = null;      // player name whose custom-amount input is open
  let animNext = "all";       // row entrance animation for the next render: "all" | "one" | null
  let animName = null;        // the player to animate when animNext === "one"
  let me = loadMe();
  let profileTab = "balance";
  let debtTab = "owed";

  // ---------- theme (default: dark), floating sun/moon toggle ----------
  const SUN_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5 5l1.8 1.8M17.2 17.2 19 19M19 5l-1.8 1.8M6.8 17.2 5 19"></path></svg>';
  const MOON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13.5A8 8 0 0 1 10.5 4a8 8 0 1 0 9.5 9.5Z"></path></svg>';
  try {
    if (localStorage.getItem(THEME_KEY) === "light") document.documentElement.dataset.theme = "light";
  } catch (e) {}
  function renderThemeIcon() {
    const isLight = document.documentElement.dataset.theme === "light";
    // show the appView you'll switch TO: moon while in light appView, sun while in dark
    document.getElementById("themeIcon").innerHTML = isLight ? MOON_SVG : SUN_SVG;
  }
  document.getElementById("themeBtn").addEventListener("click", () => toggleTheme());
  renderThemeIcon();

  function loadMe() {
    try { return localStorage.getItem(ME_KEY) || null; } catch (e) { return null; }
  }
  function saveMe() {
    try { me ? localStorage.setItem(ME_KEY, me) : localStorage.removeItem(ME_KEY); } catch (e) {}
  }

  function normalizePhase(value, source) {
    if (value === "active" || value === "settlement" || value === "closed") return value;
    if (source && !source.example && Array.isArray(source.players) && source.players.length) return "active";
    return "closed";
  }
  function initialAppView(gameState) {
    if (!gameState || gameState.example) return "games";
    if (gameState.phase === "active") return "game";
    if (gameState.phase === "settlement") return "settle";
    return "games";
  }

  function profileDebtIds(debts, userName) {
    return (Array.isArray(debts) ? debts : [])
      .filter(debt => debt && debt.status === "open" && (debt.debtorName === userName || debt.creditorName === userName))
      .map(debt => String(debt.id));
  }
  function hasUnseenProfileDebt(debts, userName, seenIds) {
    const seen = new Set(Array.isArray(seenIds) ? seenIds.map(String) : []);
    return profileDebtIds(debts, userName).some(id => !seen.has(id));
  }
  function markProfileDebtsSeen(debts, userName, seenIds) {
    return Array.from(new Set([
      ...(Array.isArray(seenIds) ? seenIds.map(String) : []),
      ...profileDebtIds(debts, userName),
    ]));
  }
  function loadProfileDebtSeen(userName) {
    if (!userName) return [];
    try {
      const saved = JSON.parse(localStorage.getItem(PROFILE_DEBT_SEEN_KEY) || "{}");
      return Array.isArray(saved[userName]) ? saved[userName].map(String) : [];
    } catch (e) { return []; }
  }
  function saveProfileDebtSeen(userName, ids) {
    if (!userName) return;
    try {
      const saved = JSON.parse(localStorage.getItem(PROFILE_DEBT_SEEN_KEY) || "{}");
      saved[userName] = Array.from(new Set(ids.map(String))).slice(-240);
      localStorage.setItem(PROFILE_DEBT_SEEN_KEY, JSON.stringify(saved));
    } catch (e) {}
  }
  function markProfileDebtsSeenForUser(debts, userName) {
    saveProfileDebtSeen(userName, markProfileDebtsSeen(debts, userName, loadProfileDebtSeen(userName)));
  }

  function normalizeDebt(debt) {
    if (!debt || typeof debt !== "object") return null;
    const gameId = String(debt.gameId || "");
    const debtorUserId = String(debt.debtorUserId || "");
    const creditorUserId = String(debt.creditorUserId || "");
    const debtorName = String(debt.debtorName || "");
    const creditorName = String(debt.creditorName || "");
    const amount = Math.round(Number(debt.amount) || 0);
    const createdAt = typeof debt.createdAt === "string" ? debt.createdAt : "";
    const gameDate = typeof debt.gameDate === "string" ? debt.gameDate : createdAt;
    const status = debt.status === "paid" ? "paid" : "open";
    return {
      id: String(debt.id || ["debt", gameId, debtorUserId || debtorName, creditorUserId || creditorName, amount].join("-")),
      gameId,
      groupId: debt.groupId || debt.clanId || null,
      debtorUserId, creditorUserId, debtorName, creditorName, amount,
      status, createdAt, gameDate,
      paidAt: status === "paid" && typeof debt.paidAt === "string" ? debt.paidAt : null,
    };
  }

  function normalize(s) {
    if (!s || !Array.isArray(s.players)) return null;
    // Deterministic legacy IDs let devices migrate the same old snapshot consistently.
    // Old amounts have no recorded time: never manufacture a timestamp for them.
    const gameId = s.gameId || "legacy-" + encodeURIComponent(JSON.stringify([
      s.updatedAt || "", s.players.map(p => p.name),
    ]));
    return {
      example: !!s.example,
      gameId,
      phase: normalizePhase(s.phase, s),
      players: s.players.map((p, index) => {
        const id = p.id || gameId + "-player-" + index;
        const buyins = Array.isArray(p.buyins) ? [...p.buyins] : [];
        return { ...p, id, buyins, entryLog: buyins.map((amount, i) => {
          const saved = p.entryLog && p.entryLog[i];
          return saved && saved.amount === amount && saved.playerId === id && saved.gameId === gameId
            ? { ...saved }
            : { id: id + "-entry-" + i, timestamp: null, amount, playerId: id, gameId };
        }) };
      }),
      history: Array.isArray(s.history) ? s.history : [],
      debts: Array.isArray(s.debts) ? s.debts.map(normalizeDebt).filter(Boolean) : [],
      settlementStatuses: s.settlementStatuses && typeof s.settlementStatuses === "object"
        ? { ...s.settlementStatuses } : {},
      groupId: s.groupId || s.clanId || null,
      updatedAt: typeof s.updatedAt === "string" ? s.updatedAt : "",
    };
  }
  function newId() {
    return typeof crypto.randomUUID === "function" ? crypto.randomUUID()
      : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
  }
  function addEntry(player, amount) {
    const entry = { id: newId(), timestamp: new Date().toISOString(),
      amount, playerId: player.id, gameId: state.gameId };
    player.buyins.push(amount);
    player.entryLog.push(entry);
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = normalize(JSON.parse(raw));
        if (s) return s;
      }
    } catch (e) {}
    return normalize(JSON.parse(JSON.stringify(EXAMPLE)));
  }
  function save() {
    pendingRemote = null; // a local edit supersedes any remote state parked for later
    state.updatedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    scheduleRemoteSave();
  }

  // --- server sync (shared document, survives devices and reloads) ---
  const CLIENT_ID = Math.random().toString(36).slice(2);
  let gameDoc = null;
  let saveTimer = null;
  let pendingRemote = null;
  let dirtyUntil = 0; // while set, fresh local edits outrank incoming remote state

  function setSync(on, label) {
    const d = document.getElementById("syncDot");
    if (d) { d.classList.toggle("on", on); d.title = label; }
  }

  function remoteBody() {
    return {
      by: CLIENT_ID,
      gameId: state.gameId,
      phase: state.phase,
      example: !!state.example,
      players: state.players,
      history: state.history,
      debts: state.debts,
      settlementStatuses: state.settlementStatuses,
      groupId: state.groupId || null,
      updatedAt: state.updatedAt || new Date().toISOString(),
    };
  }

  function scheduleRemoteSave() {
    dirtyUntil = Date.now() + 6000;
    if (!gameDoc) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      saveTimer = null;
      gameDoc.set(remoteBody()).catch(() => setSync(false, "שגיאת שמירה — נשמר מקומית"));
    }, 400);
  }

  function applyRemote(data) {
    // Snapshot bodies are frozen objects — deep-clone so later edits
    // (push into buyins, cashout assignment) don't silently fail.
    const incoming = normalize(JSON.parse(JSON.stringify({
      gameId: data.gameId,
      phase: data.phase,
      example: !!data.example,
      players: Array.isArray(data.players) ? data.players : [],
      history: Array.isArray(data.history) ? data.history : [],
      debts: Array.isArray(data.debts) ? data.debts : [],
      settlementStatuses: data.settlementStatuses && typeof data.settlementStatuses === "object" ? data.settlementStatuses : {},
      groupId: data.groupId || data.clanId || null,
      updatedAt: typeof data.updatedAt === "string" ? data.updatedAt : "",
    })));
    if (JSON.stringify({ g: incoming.gameId, q: incoming.phase, e: incoming.example, p: incoming.players, h: incoming.history, d: incoming.debts, s: incoming.settlementStatuses }) ===
        JSON.stringify({ g: state.gameId, q: state.phase, e: state.example, p: state.players, h: state.history, d: state.debts, s: state.settlementStatuses })) return;
    // Don't yank the UI out from under an active edit — apply on blur.
    const ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT")) { pendingRemote = incoming; return; }
    state = incoming;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    render();
  }

  document.addEventListener("visibilitychange", () => {
    // Flush a pending debounced write immediately when the tab is hidden/closed.
    if (document.visibilityState === "hidden" && saveTimer && gameDoc) {
      clearTimeout(saveTimer);
      saveTimer = null;
      gameDoc.set(remoteBody()).catch(() => {});
    }
  });

  // Applies a parked remote snapshot once it is safe: not during an active
  // edit and not while a local write is pending — retries instead of dropping,
  // so an update from another device is never silently lost.
  function tryApplyParked() {
    if (!pendingRemote) return;
    const ae = document.activeElement;
    if (ae && ae.tagName === "INPUT") return; // will retry on the next focusout
    if (saveTimer || Date.now() < dirtyUntil) {
      setTimeout(tryApplyParked, 600);
      return;
    }
    const p = pendingRemote; pendingRemote = null;
    applyRemote(p);
  }
  document.addEventListener("focusout", () => {
    // let the click that caused this blur run first
    setTimeout(tryApplyParked, 50);
  });

  function initSync() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    window.claude.use("db").then((db) => {
      if (!db) return; // no server storage in this view — stay on localStorage
      gameDoc = db.doc("games/current");
      gameDoc.onSnapshot((snap) => {
        setSync(true, "מסונכרן");
        if (!snap.exists) {
          // First device seeds the shared game with whatever it has locally.
          if (!state.example && (state.players.length || state.history.length)) scheduleRemoteSave();
          return;
        }
        const data = snap.data();
        if (!data) return;
        if (data.by === CLIENT_ID) { dirtyUntil = 0; return; } // our own write confirmed
        // Local state that is strictly newer than the server doc (e.g. edits
        // made while a previous session's write failed) wins: push it up
        // instead of letting the stale doc overwrite it.
        if (state.updatedAt && data.updatedAt && state.updatedAt > data.updatedAt) {
          scheduleRemoteSave();
          return;
        }
        // A fresh local edit is still on its way to the server — don't let
        // an older remote snapshot overwrite it.
        if (saveTimer || Date.now() < dirtyUntil) return;
        applyRemote(data);
      }, () => setSync(false, "שמירה מקומית"));
    }).catch(() => {});
  }
  initSync();

  // Example data promises "any edit resets it": the first real interaction
  // wipes the demo players instead of quietly turning them into real ones.
  // Returns true when it wiped, so callers can stop their own action.
  function markReal() {
    if (!state.example) return false;
    state = {
      example: false, phase: "active", gameId: newId(), players: [], history: state.history,
      debts: state.debts, settlementStatuses: {}, groupId: state.groupId || null,
      updatedAt: state.updatedAt,
    };
    expandedEntries.clear();
    return true;
  }

  const fmt = (n) => "₪" + (Math.round(n * 100) / 100).toLocaleString("he-IL");
  const fmtSigned = (n) => ((n > 0 ? "+" : "") + fmt(n)).replace("₪-", "-₪");
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  const wholeMoney = (n) => Math.round(Number(n) || 0);

  function tableBalance(players) {
    const buy = players.reduce((total, p) => total + p.buyins.reduce((x, amount) => x + wholeMoney(amount), 0), 0);
    const out = players.reduce((total, p) => total + wholeMoney(p.cashout), 0);
    const difference = Math.round(buy - out);
    return { buy, out, difference, isBalanced: difference === 0 };
  }

  function totals() {
    const balance = tableBalance(state.players);
    return { buy: balance.buy, out: balance.out, diff: balance.difference };
  }

  function buildHistoryEntry(snapshot, balance, at, moves = [], paidStatuses = {}) {
    return {
      gameId: snapshot.gameId,
      at,
      isBalanced: balance.isBalanced,
      balanceDifference: balance.difference,
      transfers: moves.map((move, index) => ({
        id: settlementKey(snapshot.gameId, move, index),
        from: move.from,
        to: move.to,
        amount: wholeMoney(move.amount),
        status: paidStatuses[settlementKey(snapshot.gameId, move, index)] ? "paid" : "open",
      })),
      players: snapshot.players.map(p => ({
        id: p.id,
        entryLog: p.entryLog.map(entry => ({ ...entry })),
        name: p.name,
        buyin: sum(p.buyins),
        cashout: Number(p.cashout) || 0,
        net: (Number(p.cashout) || 0) - sum(p.buyins),
      })),
    };
  }

  function balanceDescription(diff) {
    if (diff > 0) return "חסר " + fmt(diff);
    if (diff < 0) return "עודף " + fmt(Math.abs(diff));
    return "0";
  }

  function settlementKey(gameId, move, index) {
    return [gameId, index, move.from, move.to, wholeMoney(move.amount)].join("::");
  }

  function buildDebtRecords(snapshot, moves, paidStatuses, at) {
    return moves.reduce((debts, move, index) => {
      const key = settlementKey(snapshot.gameId, move, index);
      if (paidStatuses && paidStatuses[key]) return debts;
      const debtor = snapshot.players.find(p => p.name === move.from);
      const creditor = snapshot.players.find(p => p.name === move.to);
      if (!debtor || !creditor) return debts;
      debts.push({
        id: "debt-" + key,
        gameId: snapshot.gameId,
        groupId: snapshot.groupId || snapshot.clanId || null,
        debtorUserId: debtor.id,
        creditorUserId: creditor.id,
        debtorName: debtor.name,
        creditorName: creditor.name,
        amount: wholeMoney(move.amount),
        status: "open",
        createdAt: at,
        gameDate: at,
        paidAt: null,
      });
      return debts;
    }, []);
  }

  function updateDebtAsPaid(debts, debtId, actorName, paidAt) {
    const debt = debts.find(item => item.id === debtId);
    if (!debt || debt.status !== "open" || debt.creditorName !== actorName) return false;
    debt.status = "paid";
    debt.paidAt = paidAt;
    return true;
  }

  function closeButtonLabel(isBalanced, forceUnlocked, closeArmed) {
    if (!isBalanced) return forceUnlocked ? "סגור בכל זאת" : "לחיצה ארוכה כדי לסגור למרות הפער";
    return closeArmed ? "לסגור את השולחן? לחיצה נוספת מאשרת" : "סגירת שולחן ורישום לרקורד";
  }

  function setCloseButtonLabel(button, label) {
    const text = button.querySelector("#closeTableLabel");
    if (text) text.textContent = label;
    else button.textContent = label;
  }

  // Greedy settlement: fewest transfers between net winners and losers.
  function settle() {
    const nets = state.players
      .map(p => ({ name: p.name, net: (Number(p.cashout) || 0) - sum(p.buyins) }))
      .filter(p => Math.abs(p.net) > 0.005);
    const winners = nets.filter(p => p.net > 0).sort((a, b) => b.net - a.net);
    const losers  = nets.filter(p => p.net < 0).sort((a, b) => a.net - b.net);
    const moves = [];
    let i = 0, j = 0;
    while (i < losers.length && j < winners.length) {
      const pay = Math.min(-losers[i].net, winners[j].net);
      moves.push({ from: losers[i].name, to: winners[j].name, amount: pay });
      losers[i].net += pay;
      winners[j].net -= pay;
      if (-losers[i].net < 0.005) i++;
      if (winners[j].net < 0.005) j++;
    }
    return moves;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  // Replays the shake animation on an input to signal invalid entry.
  function shakeEl(inp) {
    inp.classList.remove("shake");
    void inp.offsetWidth; // restart the animation
    inp.classList.add("shake");
    inp.focus();
  }
  function toggleTheme() {
    const nowLight = document.documentElement.dataset.theme !== "light";
    if (nowLight) document.documentElement.dataset.theme = "light";
    else delete document.documentElement.dataset.theme;
    try { localStorage.setItem(THEME_KEY, nowLight ? "light" : "dark"); } catch (e) {}
    renderThemeIcon();
  }

  // Plays the picker's collapse transition, then runs `done`. A call that
  // arrives while a close is already animating is DROPPED (not queued) —
  // this is what makes a rapid double-tap on a confirm harmless.
  let menuClosing = false;
  function animateMenuClose(done) {
    if (menuClosing) return;
    const m = document.querySelector(".pmenu.open");
    if (!m) { done(); return; }
    menuClosing = true;
    const plus = document.querySelector(".btn-plus.open");
    if (plus) plus.classList.remove("open");
    m.classList.remove("open");
    setTimeout(() => { menuClosing = false; done(); }, 300);
  }

  // Confirms a buy-in: the picker collapses, then the money lands with a
  // count-up animation on the player's total, plus a light haptic.
  function confirmBuyin(p, idx, amount) {
    if (menuClosing) return; // a confirm is already in flight
    pendingAmount = null;
    dirtyUntil = Date.now() + 6000; // block remote overwrites during the animation window
    const closingFor = p.name;
    animateMenuClose(() => {
      // re-resolve the player: a remote sync may have replaced `state` meanwhile
      const player = state.players.find(x => x.id === p.id);
      if (openMenu === closingFor) { openMenu = null; customOpen = null; }
      if (!player) { render(); return; }
      const from = sum(player.buyins);
      addEntry(player, amount);
      save();
      try { if (navigator.vibrate) navigator.vibrate(20); } catch (e) {}
      render();
      const nidx = state.players.indexOf(player);
      const fresh = document.querySelectorAll(".prow")[nidx];
      const totalEl = fresh && fresh.querySelector(".pmeta b");
      if (totalEl) countUp(totalEl, from, from + amount);
    });
  }

  function countUp(elm, from, to) {
    const dur = 650;
    const t0 = performance.now();
    (function tick(now) {
      const t = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      elm.textContent = fmt(Math.round(from + (to - from) * eased));
      if (t < 1) requestAnimationFrame(tick);
      else {
        elm.classList.add("pulse");
        setTimeout(() => elm.classList.remove("pulse"), 600);
      }
    })(t0);
  }

  function setAppView(nextView) {
    appView = nextView;
    if (nextView !== "game") { openMenu = null; customOpen = null; }
    if (nextView !== "settle") {
      clearCloseHold();
      forceCloseArmed = false;
      forceCloseUnlocked = false;
      forceCloseUnlockDifference = null;
      longPressJustUnlocked = false;
    }
    animNext = "all";
    render();
  }

  function startUngroupedGame() {
    state = {
      example: false,
      phase: "active",
      gameId: newId(),
      players: [],
      history: state.history,
      debts: state.debts,
      settlementStatuses: {},
      groupId: null,
      updatedAt: state.updatedAt,
    };
    expandedEntries.clear();
    openMenu = null; customOpen = null; pendingAmount = null;
    save();
    setAppView("game");
  }

  function continueCurrentGame() {
    if (state.example || state.phase === "closed") return;
    setAppView(state.phase === "settlement" ? "settle" : "game");
  }

  function renderGamesDashboard() {
    const box = document.getElementById("gamesHome");
    box.innerHTML = "";
    const inner = el("div", "games-home-in");
    inner.appendChild(el("h2", "games-home-title", "משחקים"));
    inner.appendChild(el("p", "games-home-lead", "המשחקים הפעילים והקבוצות שלך במקום אחד."));

    const activeSection = el("section", "games-section");
    activeSection.appendChild(el("h3", "games-section-title", "משחקים פעילים"));
    const hasCurrentGame = !state.example && state.phase !== "closed";
    if (hasCurrentGame) {
      const card = el("div", "games-card");
      const copy = el("div", "games-card-copy");
      copy.appendChild(el("span", "games-card-title", state.phase === "settlement" ? "סגירה וחישוב" : "משחק פעיל"));
      copy.appendChild(el("span", "games-card-meta", state.players.length + " שחקנים · " + fmt(totals().buy) + " בקופה"));
      const action = el("button", "games-card-action", state.phase === "settlement" ? "המשך סגירה" : "כנס לשולחן");
      action.type = "button";
      action.addEventListener("click", continueCurrentGame);
      card.append(copy, action);
      activeSection.appendChild(card);
    } else {
      activeSection.appendChild(el("p", "games-empty", "אין משחקים פעילים"));
      const start = el("button", "games-start", "משחק ללא קבוצה");
      start.type = "button";
      start.addEventListener("click", startUngroupedGame);
      activeSection.appendChild(start);
    }
    inner.appendChild(activeSection);

    const groupsSection = el("section", "games-section");
    groupsSection.appendChild(el("h3", "games-section-title", "הקבוצות שלי"));
    groupsSection.appendChild(el("p", "games-empty", "עוד אין קבוצות"));
    const createGroup = el("button", "games-card-action muted", "צור קבוצה");
    createGroup.type = "button";
    createGroup.disabled = true;
    createGroup.setAttribute("aria-disabled", "true");
    groupsSection.appendChild(createGroup);
    inner.appendChild(groupsSection);
    box.appendChild(inner);
  }

  function render() {
    const anim = animNext; animNext = null;
    const inGames = appView === "games" || appView === "game" || appView === "settle";
    document.getElementById("modeGames").classList.toggle("on", inGames);
    document.getElementById("modeProfile").classList.toggle("on", appView === "profile");
    document.getElementById("addrow").hidden = appView !== "game";
    document.getElementById("settingsBtn").hidden = appView !== "profile";
    document.getElementById("resetBtn").hidden = appView === "profile" || appView === "games";
    document.getElementById("gamesHome").hidden = appView !== "games";

    const rows = document.getElementById("rows");
    rows.innerHTML = "";
    rows.hidden = !inGames || appView === "games";

    if (appView === "game" || appView === "settle") state.players.forEach((p, idx) => {
      const row = el("div", "prow");
      if (anim === "all") { row.classList.add("anim"); row.style.animationDelay = (idx * 50) + "ms"; }
      else if (anim === "one" && p.name === animName) { row.classList.add("anim"); }
      const line = el("div", "prow-line");

      if (appView === "game") {
        const heading = el("div", "player-heading");
        heading.appendChild(el("span", "pname", p.name));
        line.appendChild(heading);
        const details = el("div", "entry-details");
        details.id = "entry-details-" + idx;
        const detailsInner = el("div", "entry-details-in");
        const toggle = el("button", "entry-toggle", "פירוט כניסות");
        toggle.type = "button";
        toggle.setAttribute("aria-label", "פירוט כניסות של " + p.name);
        toggle.setAttribute("aria-controls", details.id);
        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        arrow.setAttribute("viewBox", "0 0 12 12");
        arrow.setAttribute("aria-hidden", "true");
        arrow.innerHTML = '<path d="M3 4.5 6 7.5 9 4.5"/>';
        toggle.appendChild(arrow);
        const updateExpanded = () => {
          const expanded = expandedEntries.has(p.id);
          toggle.setAttribute("aria-expanded", String(expanded));
          details.setAttribute("aria-hidden", String(!expanded));
          details.classList.toggle("open", expanded);
        };
        toggle.addEventListener("click", () => {
          if (expandedEntries.has(p.id)) expandedEntries.delete(p.id);
          else expandedEntries.add(p.id);
          updateExpanded();
        });
        updateExpanded();
        heading.appendChild(toggle);
        // Array order is the actual insertion order, including entries across midnight.
        const entries = p.entryLog.filter(entry => entry.gameId === state.gameId && entry.playerId === p.id);
        if (entries.length) {
          const list = el("ol", "entry-list");
          entries.forEach(entry => {
            const item = el("li", "entry-item");
            const date = entry.timestamp ? new Date(entry.timestamp) : null;
            const knownTime = date && Number.isFinite(date.getTime());
            const time = el("time", "entry-time", knownTime
              ? date.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }) : "—");
            time.dir = "ltr";
            if (knownTime) { time.dateTime = entry.timestamp; time.title = date.toLocaleString("he-IL"); }
            else { time.title = "שעת הכניסה לא תועדה"; time.setAttribute("aria-label", time.title); }
            const amount = el("span", "entry-amount", fmt(entry.amount));
            amount.dir = "ltr";
            item.append(time, el("span", "entry-divider"), amount);
            list.appendChild(item);
          });
          detailsInner.appendChild(list);
        } else detailsInner.appendChild(el("p", "entry-empty", "אין כניסות עדיין"));
        details.appendChild(detailsInner);
        const meta = el("span", "pmeta");
        meta.innerHTML = "<b>" + fmt(sum(p.buyins)) + "</b> · " + p.buyins.length + " כניסות";
        line.appendChild(meta);

        const plus = el("button", "btn-plus", "+");
        plus.type = "button";
        plus.setAttribute("aria-label", "הוסף כניסה ל" + p.name);
        plus.setAttribute("aria-expanded", openMenu === p.name ? "true" : "false");
        if (openMenu === p.name) plus.classList.add("open");
        plus.addEventListener("click", () => {
          if (markReal()) { save(); render(); return; } // first touch wipes the demo data
          const opening = openMenu !== p.name;
          if (!opening) {
            // animate the collapse before removing the menu from the DOM
            const closingFor = p.name;
            animateMenuClose(() => {
              // don't slam shut a different menu the user opened meanwhile
              if (openMenu === closingFor) {
                openMenu = null; customOpen = null; pendingAmount = null;
                render();
              }
            });
            return;
          }
          openMenu = p.name;
          menuJustOpened = p.name;
          customOpen = null;
          pendingAmount = null;
          render();
        });
        line.appendChild(plus);
        row.appendChild(line);

        const isOpen = openMenu === p.name;
        const menu = el("div", "pmenu");
        if (isOpen && menuJustOpened === p.name) {
          // fresh open: start collapsed and let the transition play
          menuJustOpened = null;
          requestAnimationFrame(() => requestAnimationFrame(() => menu.classList.add("open")));
        } else if (isOpen) {
          menu.classList.add("open");
        }
        const inner = el("div", "pmenu-in");
        const mrow = el("div", "pmenu-row");
        // the "other" capsule collapses back to a plain chip
        const collapseOther = () => {
          customOpen = null;
          mrow.classList.remove("other-mode");
          cinp.value = "";
          cgo.hidden = true;
        };
        BUYIN_OPTIONS.forEach(amount => {
          const selected = isOpen && pendingAmount === amount;
          const chip = el("button", "chip" + (selected ? " active" : ""), "₪" + amount + "+");
          chip.type = "button";
          chip.setAttribute("aria-pressed", selected ? "true" : "false");
          chip.addEventListener("click", () => {
            if (pendingAmount === amount) {
              confirmBuyin(p, idx, amount); // second tap on the selected amount = confirm
            } else {
              pendingAmount = amount;       // first tap = select and highlight, in place
              collapseOther();
              mrow.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
              chip.classList.add("active");
            }
          });
          mrow.appendChild(chip);
        });

        // "other": the chip itself stretches into an input capsule
        const other = el("div", "chip chip-other");
        other.setAttribute("role", "button");
        other.setAttribute("tabindex", "0");
        const olabel = el("span", "other-label", "אחר");
        const cinp = document.createElement("input");
        cinp.type = "number";
        cinp.className = "other-input";
        cinp.min = String(MIN_BUYIN);
        cinp.step = "1";
        cinp.inputMode = "decimal";
        cinp.placeholder = "סכום · מינ' ₪" + MIN_BUYIN;
        cinp.setAttribute("aria-label", "סכום כניסה חופשי עבור " + p.name);
        const cgo = el("button", "other-go", "הוסף");
        cgo.type = "button";
        cgo.hidden = customOpen !== p.name;
        const confirmCustom = () => {
          const amount = Number(cinp.value);
          if (!cinp.value || !isFinite(amount) || amount < MIN_BUYIN) { shakeEl(cinp); return; }
          confirmBuyin(p, idx, Math.round(amount));
        };
        const expandOther = () => {
          customOpen = p.name;
          pendingAmount = null;
          mrow.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
          mrow.classList.add("other-mode");
          cgo.hidden = false;
          setTimeout(() => cinp.focus(), 180);
        };
        other.addEventListener("click", (e) => {
          if (e.target === cinp || e.target === cgo) return;
          if (mrow.classList.contains("other-mode")) collapseOther();
          else expandOther();
        });
        other.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !mrow.classList.contains("other-mode")) { e.preventDefault(); expandOther(); }
        });
        cinp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); confirmCustom(); }
        });
        cgo.addEventListener("click", confirmCustom);
        other.appendChild(olabel);
        other.appendChild(cinp);
        other.appendChild(cgo);
        mrow.appendChild(other);
        if (customOpen === p.name) { mrow.classList.add("other-mode"); cgo.hidden = false; }
        if (p.buyins.length > 0) {
          const undo = el("button", "undo", "בטל אחרונה (₪" + p.buyins[p.buyins.length - 1] + ")");
          undo.type = "button";
          undo.addEventListener("click", () => {
            if (markReal()) { save(); render(); return; }
            p.buyins.pop();
            p.entryLog.pop();
            if (p.buyins.length === 0) state.players.splice(idx, 1); // no entries left = out of the game
            save(); render();
          });
          mrow.appendChild(undo);
        }
        inner.appendChild(mrow);
        menu.appendChild(inner);
        row.appendChild(menu);
        row.appendChild(details);
      } else {
        line.appendChild(el("span", "pname", p.name));
        const inp = document.createElement("input");
        inp.type = "number";
        inp.min = "0";
        inp.step = "1";
        inp.inputMode = "decimal";
        inp.placeholder = "צ'יפים";
        inp.className = "srow-input";
        inp.value = p.cashout === "" ? "" : p.cashout;
        inp.setAttribute("aria-label", "שווי צ'יפים בסוף עבור " + p.name);
        inp.addEventListener("input", () => {
          if (markReal()) { save(); render(); return; }
          const raw = inp.value === "" ? "" : Number(inp.value);
          p.cashout = raw === "" ? "" : Math.max(0, raw);
          if (raw !== "" && raw < 0) inp.value = "0"; // keep the field consistent with the clamped state
          save(); renderDerived();
        });
        line.appendChild(inp);

        const net = el("span", "net");
        net.dataset.net = idx;
        line.appendChild(net);
        row.appendChild(line);
      }

      rows.appendChild(row);
    });

    renderDerived();
    renderProfile();
    if (appView === "games") renderGamesDashboard();
  }

  function renderDerived() {
    const t = totals();

    const finishBtn = document.getElementById("finishGameBtn");
    const finishHint = document.getElementById("finishGameHint");
    const returnBtn = document.getElementById("returnToGameBtn");
    const canFinishGame = appView === "game" && state.phase === "active" && !state.example;
    finishBtn.hidden = !canFinishGame;
    returnBtn.hidden = appView !== "settle" || state.example;
    if (!canFinishGame && finishGameHoldTimer) clearFinishGameHold();
    if (!canFinishGame && finishHint) finishHint.hidden = true;

    if (appView === "settle") {
      state.players.forEach((p, idx) => {
        const e = document.querySelector('[data-net="' + idx + '"]');
        if (!e) return;
        const net = (Number(p.cashout) || 0) - sum(p.buyins);
        e.className = "net " + (net > 0.005 ? "pos" : net < -0.005 ? "neg" : "zero");
        e.textContent = fmtSigned(net);
      });
    }

    const stat = document.getElementById("statline");
    stat.hidden = appView === "profile" || appView === "games";
    if (appView === "game") {
      stat.innerHTML =
        'בקופה <b>' + fmt(t.buy) + '</b><span class="sep">·</span>' +
        state.players.length + " שחקנים" +
        (state.example ? '<span class="sep">·</span><span class="example-tag">נתוני דוגמה — כל עריכה מאפסת אותם</span>' : "");
    } else if (appView === "settle") {
      stat.innerHTML =
        'בקופה <b>' + fmt(t.buy) + '</b><span class="sep">·</span>' +
        'דווח <b>' + fmt(t.out) + '</b><span class="sep">·</span>' +
        'הפרש <span class="' + (t.diff === 0 ? "good" : "bad") + '">' + (t.diff === 0 ? "0 ✓" : balanceDescription(t.diff)) + "</span>";
    } else stat.innerHTML = "";

    const warn = document.getElementById("warnbox");
    if (appView === "settle" && t.diff !== 0 && t.buy > 0) {
      warn.innerHTML = '<p class="warn">השולחן לא מאוזן — ' + balanceDescription(t.diff) + '.</p>';
    } else {
      warn.innerHTML = "";
    }

    const results = document.getElementById("results");
    results.hidden = appView !== "settle";
    if (appView === "settle") {
      const box = document.getElementById("transfers");
      const moves = settle();
      box.innerHTML = "";
      if (moves.length === 0) {
        box.innerHTML = '<p class="settle-empty">אין העברות — הזינו לכל שחקן את שווי הצ\'יפים שסיים איתו.</p>';
      } else {
        moves.forEach((m, i) => {
          const div = el("div", "transfer");
          div.style.animationDelay = (i * 60) + "ms";
          div.appendChild(el("span", "who", m.from));
          div.appendChild(el("span", "arrow", "משלם ל־"));
          div.appendChild(el("span", "who", m.to));
          div.appendChild(el("span", "amount", fmt(m.amount)));
          const paymentId = settlementKey(state.gameId, m, i);
          const paid = !!state.settlementStatuses[paymentId];
          const paidBtn = el("button", "transfer-paid" + (paid ? " is-paid" : ""), paid ? "✓ שולם" : "שולם");
          paidBtn.type = "button";
          paidBtn.setAttribute("aria-pressed", String(paid));
          paidBtn.addEventListener("click", () => {
            if (paid) delete state.settlementStatuses[paymentId];
            else state.settlementStatuses[paymentId] = true;
            save();
            renderDerived();
          });
          div.appendChild(paidBtn);
          box.appendChild(div);
        });
      }
      const closeBtn = document.getElementById("closeTableBtn");
      const forceConfirm = document.getElementById("forceCloseConfirm");
      const hasTable = state.players.length && !state.example;
      const balanced = t.diff === 0;
      if (!hasTable || balanced || (forceCloseUnlocked && forceCloseUnlockDifference !== t.diff)) {
        forceCloseUnlocked = false;
        forceCloseUnlockDifference = null;
        forceCloseArmed = false;
      }
      closeBtn.hidden = !hasTable;
      closeBtn.disabled = false;
      closeBtn.setAttribute("aria-disabled", String(!balanced && !forceCloseUnlocked));
      closeBtn.classList.toggle("blocked-state", !balanced && !forceCloseUnlocked);
      closeBtn.classList.toggle("force-state", !balanced && forceCloseUnlocked);
      closeBtn.classList.toggle("warn-state", closeArmed);
      forceConfirm.hidden = !hasTable || balanced || !forceCloseArmed;
      setCloseButtonLabel(closeBtn, closeButtonLabel(balanced, forceCloseUnlocked, closeArmed));
      if (forceCloseArmed) document.getElementById("forceCloseMessage").textContent =
        "השולחן לא מאוזן — " + balanceDescription(t.diff) + ". לסגור את המשחק בכל זאת?";
    }
  }

  // ---------- confetti (monochrome) for a balanced close ----------
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = document.createElement("canvas");
    cv.style.cssText = "position:fixed;inset:0;z-index:60;pointer-events:none";
    document.body.appendChild(cv);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);
    const styles = getComputedStyle(document.documentElement);
    const COLORS = [
      styles.getPropertyValue("--accent").trim(),
      styles.getPropertyValue("--text").trim(),
      styles.getPropertyValue("--dim").trim(),
    ];
    const parts = Array.from({ length: 90 }, () => ({
      x: Math.random() * innerWidth,
      y: -20 - Math.random() * innerHeight * 0.4,
      w: 5 + Math.random() * 5,
      h: 8 + Math.random() * 8,
      vy: 2.2 + Math.random() * 3,
      vx: -1 + Math.random() * 2,
      rot: Math.random() * Math.PI,
      vr: -0.12 + Math.random() * 0.24,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      alpha: 0.5 + Math.random() * 0.5,
    }));
    const t0 = performance.now();
    (function tick(now) {
      const elapsed = now - t0;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      const fade = elapsed > 2200 ? Math.max(0, 1 - (elapsed - 2200) / 500) : 1;
      parts.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin((now / 300) + p.rot) * 0.6; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = p.alpha * fade;
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (elapsed < 2700) requestAnimationFrame(tick);
      else cv.remove();
    })(t0);
  }

  // ---------- close table -> record ----------
  let closeArmed = false;
  let closeArmTimer = null;
  let forceCloseArmed = false;
  let forceCloseUnlocked = false;
  let forceCloseUnlockDifference = null;
  let closeHoldTimer = null;
  let longPressJustUnlocked = false;
  let finishGameHoldTimer = null;

  function clearFinishGameHold() {
    if (finishGameHoldTimer) clearTimeout(finishGameHoldTimer);
    finishGameHoldTimer = null;
    const btn = document.getElementById("finishGameBtn");
    const hint = document.getElementById("finishGameHint");
    if (btn) btn.classList.remove("hold-state");
    if (hint) hint.hidden = true;
  }

  function beginFinishGameHold(e) {
    if (appView !== "game" || state.phase !== "active" || state.example) return;
    if (e.button !== undefined && e.button !== 0) return;
    clearFinishGameHold();
    const btn = e.currentTarget;
    const hint = document.getElementById("finishGameHint");
    btn.classList.add("hold-state");
    if (hint) hint.hidden = false;
    if (btn.setPointerCapture && e.pointerId !== undefined) btn.setPointerCapture(e.pointerId);
    finishGameHoldTimer = setTimeout(() => {
      finishGameHoldTimer = null;
      btn.classList.remove("hold-state");
      if (hint) hint.hidden = true;
      finishGame();
    }, FINISH_GAME_HOLD_MS);
  }

  function endFinishGameHold(e) {
    clearFinishGameHold();
    const btn = e.currentTarget;
    if (btn.releasePointerCapture && e.pointerId !== undefined && btn.hasPointerCapture && btn.hasPointerCapture(e.pointerId)) {
      btn.releasePointerCapture(e.pointerId);
    }
  }

  function finishGame() {
    if (state.example || state.phase !== "active") return;
    state.phase = "settlement";
    save();
    setAppView("settle");
  }

  function returnToGameEdit() {
    if (state.example || state.phase === "closed") return;
    state.phase = "active";
    save();
    setAppView("game");
  }

  function clearCloseHold() {
    if (closeHoldTimer) clearTimeout(closeHoldTimer);
    closeHoldTimer = null;
    const btn = document.getElementById("closeTableBtn");
    if (btn) btn.classList.remove("hold-state");
  }

  function beginCloseHold(e) {
    const t = totals();
    if (appView !== "settle" || !state.players.length || state.example || t.diff === 0 || forceCloseUnlocked) return;
    if (e.button !== undefined && e.button !== 0) return;
    clearCloseHold();
    const btn = e.currentTarget;
    btn.classList.add("hold-state");
    if (btn.setPointerCapture && e.pointerId !== undefined) btn.setPointerCapture(e.pointerId);
    closeHoldTimer = setTimeout(() => {
      closeHoldTimer = null;
      const current = totals();
      if (appView !== "settle" || !state.players.length || state.example || current.diff === 0) return;
      btn.classList.remove("hold-state");
      forceCloseUnlocked = true;
      forceCloseUnlockDifference = current.diff;
      forceCloseArmed = false;
      longPressJustUnlocked = true;
      renderDerived();
    }, HOLD_TO_FORCE_CLOSE_MS);
  }

  function endCloseHold(e) {
    clearCloseHold();
    const btn = e.currentTarget;
    if (btn.releasePointerCapture && e.pointerId !== undefined && btn.hasPointerCapture && btn.hasPointerCapture(e.pointerId)) {
      btn.releasePointerCapture(e.pointerId);
    }
  }

  function finishCloseTable() {
    const t = totals();
    const balanced = t.diff === 0;
    const btn = document.getElementById("closeTableBtn");
    const closingAt = new Date().toISOString();
    const moves = settle();
    const paidStatuses = { ...state.settlementStatuses };
    const newDebts = buildDebtRecords(state, moves, paidStatuses, closingAt);
    clearTimeout(closeArmTimer);
    closeArmed = false;
    forceCloseArmed = false;
    forceCloseUnlocked = false;
    forceCloseUnlockDifference = null;
    longPressJustUnlocked = false;
    btn.classList.remove("warn-state");
    setCloseButtonLabel(btn, "סגירת שולחן ורישום לרקורד");
    const entry = buildHistoryEntry(state, { difference: t.diff, isBalanced: balanced }, closingAt, moves, paidStatuses);
    state.debts = [...newDebts, ...state.debts];
    state.history.unshift(entry);
    if (state.history.length > HISTORY_MAX) state.history.length = HISTORY_MAX;
    state.players = [];
    state.gameId = newId();
    state.phase = "closed";
    state.settlementStatuses = {};
    expandedEntries.clear();
    state.example = false;
    openMenu = null; customOpen = null;
    save();
    setAppView("games");
    if (balanced) confetti();
  }

  document.getElementById("closeTableBtn").addEventListener("click", (e) => {
    const btn = e.currentTarget;
    const t = totals();
    if (longPressJustUnlocked) {
      longPressJustUnlocked = false;
      return;
    }
    if (t.diff !== 0) {
      if (!forceCloseUnlocked) return;
      forceCloseArmed = true;
      renderDerived();
      return;
    }
    if (!closeArmed) {
      closeArmed = true;
      btn.classList.add("warn-state");
      setCloseButtonLabel(btn, "לסגור את השולחן? לחיצה נוספת מאשרת");
      closeArmTimer = setTimeout(() => {
        closeArmed = false;
        btn.classList.remove("warn-state");
        setCloseButtonLabel(btn, "סגירת שולחן ורישום לרקורד");
      }, 5000);
      return;
    }
    finishCloseTable();
  });

  const closeTableBtn = document.getElementById("closeTableBtn");
  closeTableBtn.addEventListener("pointerdown", beginCloseHold);
  closeTableBtn.addEventListener("pointerup", endCloseHold);
  closeTableBtn.addEventListener("pointercancel", endCloseHold);
  closeTableBtn.addEventListener("lostpointercapture", endCloseHold);
  const finishGameBtn = document.getElementById("finishGameBtn");
  finishGameBtn.addEventListener("pointerdown", beginFinishGameHold);
  finishGameBtn.addEventListener("pointerup", endFinishGameHold);
  finishGameBtn.addEventListener("pointercancel", endFinishGameHold);
  finishGameBtn.addEventListener("lostpointercapture", endFinishGameHold);
  document.getElementById("returnToGameBtn").addEventListener("click", returnToGameEdit);
  document.getElementById("forceCloseCancel").addEventListener("click", () => {
    forceCloseArmed = false;
    renderDerived();
  });
  document.getElementById("forceCloseConfirmBtn").addEventListener("click", () => {
    if (totals().diff === 0) { forceCloseArmed = false; renderDerived(); return; }
    finishCloseTable();
  });

  // ---------- login (who are you — asked once per device, on first open) ----------

    const chips = document.getElementById("loginChips");
    chips.innerHTML = "";
    knownNames().forEach(n => {
      const chip = el("button", "chip", n);

        render();

    const inp = document.getElementById("loginName");

  });

  // ---------- profile ----------
  function knownNames() {
    const names = [];
    state.history.forEach(g => g.players.forEach(p => { if (!names.includes(p.name)) names.push(p.name); }));
    state.players.forEach(p => { if (!state.example && !names.includes(p.name)) names.push(p.name); });
    return names;
  }

  function debtDateLabel(debt) {
    const date = new Date(debt.gameDate || debt.createdAt);
    if (Number.isNaN(date.getTime())) return "תאריך לא ידוע";
    return date.toLocaleDateString("he-IL", { day: "numeric", month: "numeric", year: "2-digit" });
  }

  function markDebtPaid(debtId) {
    if (!updateDebtAsPaid(state.debts, debtId, me, new Date().toISOString())) return;
    save();
    render();
  }

  function renderDebtGroup(parent, title, debts, creditorView, showTitle = true) {
    const group = el("div", "debt-group");
    if (showTitle) group.appendChild(el("h3", "", title));
    if (debts.length === 0) {
      group.appendChild(el("p", "empty-note", "אין חובות פתוחות"));
      parent.appendChild(group);
      return;
    }
    debts.forEach(debt => {
      const row = el("div", "debt-row");
      const copy = el("div", "debt-copy");
      copy.appendChild(el("span", "debt-person", creditorView ? debt.debtorName : debt.creditorName));
      copy.appendChild(el("span", "debt-meta", debtDateLabel(debt) + " · " + (creditorView ? "ממתין" : "ממתין לתשלום")));
      row.appendChild(copy);
      row.appendChild(el("span", "debt-amount", fmt(debt.amount)));
      if (creditorView) {
        const paid = el("button", "debt-paid-btn", "שולם");
        paid.type = "button";
        paid.addEventListener("click", () => markDebtPaid(debt.id));
        row.appendChild(paid);
      }
      group.appendChild(row);
    });
    parent.appendChild(group);
  }

  function renderProfile() {
    const box = document.getElementById("profile");
    box.hidden = appView !== "profile";
    if (appView !== "profile") return;
    box.innerHTML = "";

    if (!me) {
      const sec = el("section", "psection");
      sec.appendChild(el("h2", "ptitle", "פרופיל"));
      sec.appendChild(el("p", "empty-note", "עוד לא בחרת שם, ולכן אין רקורד אישי לשמור."));
      const connect = el("button", "btn-primary", "בחירת שם");
      connect.type = "button";
      connect.style.marginTop = "14px";
      connect.addEventListener("click", () => showLogin());
      sec.appendChild(connect);
      box.appendChild(sec);
      return;
    }

    const games = state.history
      .map(g => ({ at: g.at, players: g.players, mine: g.players.find(p => p.name === me) }))
      .filter(g => g.mine);
    const total = sum(games.map(g => g.mine.net));
    const wins = games.filter(g => g.mine.net > 0.005).length;
    const best = games.length ? Math.max(...games.map(g => g.mine.net)) : 0;
    const worst = games.length ? Math.min(...games.map(g => g.mine.net)) : 0;
    const openDebts = (state.debts || []).filter(debt => debt.status === "open");
    if (profileTab === "debts") markProfileDebtsSeenForUser(openDebts, me);
    const hasNewProfileDebts = hasUnseenProfileDebt(openDebts, me, loadProfileDebtSeen(me));

    // identity
    const idSec = el("section", "psection pid");
    const idName = el("div", "pname-big", me);
    idSec.appendChild(idName);
    const tabs = el("div", "profile-tabs");
    tabs.setAttribute("role", "tablist");
    [
      ["balance", "מאזן"],
      ["debts", "חובות"],
    ].forEach(([key, label]) => {
      const tab = el("button", "profile-tab" + (profileTab === key ? " active" : ""), label);
      tab.type = "button";
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-selected", String(profileTab === key));
      if (key === "debts" && hasNewProfileDebts) {
        const badge = el("span", "profile-tab-badge");
        badge.title = "חובות חדשים";
        badge.setAttribute("aria-label", "חובות חדשים");
        tab.appendChild(badge);
      }
      tab.addEventListener("click", () => {
        if (profileTab === key) return;
        profileTab = key;
        if (key === "debts") markProfileDebtsSeenForUser(openDebts, me);
        renderProfile();
      });
      tabs.appendChild(tab);
    });
    idSec.appendChild(tabs);
    box.appendChild(idSec);

    const debtSec = el("section", "psection debt-section");
    debtSec.style.animationDelay = ".03s";
    debtSec.hidden = profileTab !== "debts";
    debtSec.appendChild(el("h2", "ptitle", "חובות"));
    const debtTabs = el("div", "debt-tabs");
    debtTabs.setAttribute("role", "tablist");
    const debtTabOptions = [
      ["owed", "אני חייב", openDebts.filter(debt => debt.debtorName === me), false],
      ["owedToMe", "חייבים לי", openDebts.filter(debt => debt.creditorName === me), true],
    ];
    debtTabOptions.forEach(([key, label]) => {
      const tab = el("button", "debt-tab" + (debtTab === key ? " active" : ""), label);
      tab.type = "button";
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-selected", String(debtTab === key));
      tab.addEventListener("click", () => {
        if (debtTab === key) return;
        debtTab = key;
        renderProfile();
      });
      debtTabs.appendChild(tab);
    });
    debtSec.appendChild(debtTabs);
    const selectedDebtTab = debtTabOptions.find(([key]) => key === debtTab) || debtTabOptions[0];
    const debtPane = el("div", "debt-pane");
    renderDebtGroup(debtPane, selectedDebtTab[1], selectedDebtTab[2], selectedDebtTab[3], false);
    debtSec.appendChild(debtPane);
    box.appendChild(debtSec);

    // total balance
    const balSec = el("section", "psection");
    balSec.style.animationDelay = ".06s";
    balSec.hidden = profileTab !== "balance";
    balSec.appendChild(el("h2", "ptitle", "מאזן כולל"));
    const big = el("div", "bignum " + (total > 0.005 ? "pos" : total < -0.005 ? "neg" : "zero"), fmtSigned(total));
    balSec.appendChild(big);
    const grid = el("div", "pgrid");
    [
      ["ערבים ששוחקו", String(games.length)],
      ["ערבים ברווח", String(wins)],
      ["הערב הטוב ביותר", fmtSigned(best)],
      ["הערב הגרוע ביותר", fmtSigned(worst)],
    ].forEach(([lab, val]) => {
      const cell = el("div", "pcell");
      cell.appendChild(el("span", "plab", lab));
      cell.appendChild(el("span", "pval", val));
      grid.appendChild(cell);
    });
    balSec.appendChild(grid);
    box.appendChild(balSec);

    // recent nights
    const histSec = el("section", "psection");
    histSec.style.animationDelay = ".12s";
    histSec.hidden = profileTab !== "balance";
    histSec.appendChild(el("h2", "ptitle", "ערבים אחרונים"));
    if (games.length === 0) {
      histSec.appendChild(el("p", "empty-note", "עוד אין ערבים ברקורד. אחרי שסוגרים שולחן בטאב “חישוב”, הערב יופיע כאן."));
    } else {
      games.slice(0, 12).forEach((g, i) => {
        const row = el("div", "hgame");
        row.style.animationDelay = (i * 40) + "ms";
        const d = new Date(g.at);
        row.appendChild(el("span", "hdate", d.toLocaleDateString("he-IL", { day: "numeric", month: "short" })));
        row.appendChild(el("span", "hplayers", g.players.length + " שחקנים"));
        const net = el("span", "hnet " + (g.mine.net > 0.005 ? "pos" : g.mine.net < -0.005 ? "neg" : "zero"), fmtSigned(g.mine.net));
        row.appendChild(net);
        histSec.appendChild(row);
      });
    }
    box.appendChild(histSec);
  }

  function addPlayer() {
    const inp = document.getElementById("newName");
    const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    markReal();
    if (state.players.some(x => x.name === name)) {
      shakeEl(inp); // duplicate names would merge menus, records and transfers
      return;
    }
    const player = { id: newId(), name, buyins: [], entryLog: [], cashout: "" };
    addEntry(player, MIN_BUYIN);
    state.players.push(player);
    inp.value = "";
    state.phase = "active";
    appView = "game";
    openMenu = name;
    customOpen = null;
    pendingAmount = null;
    animNext = "one"; animName = name;
    save(); render();
  }

  // confirm() is blocked in the artifact sandbox; the two-step arm/confirm

        resetArmed = null;
        btn.classList.remove("danger-armed");

      return;

    resetArmed = null;

  let kbTimer = null;
  document.addEventListener("focusin", (e) => {
    if (e.target && e.target.tagName === "INPUT") {
      clearTimeout(kbTimer);
      document.querySelector(".tabbar").classList.add("kb-open");
    }
  });
  document.addEventListener("focusout", () => {
    clearTimeout(kbTimer);
    kbTimer = setTimeout(() => {
      const ae = document.activeElement;
      if (!ae || ae.tagName !== "INPUT") {
        document.querySelector(".tabbar").classList.remove("kb-open");
      }
    }, 150);
  });


  // ---------- boot ----------
  appView = initialAppView(state);
  render();
  if (!me) showLogin();
})();
</script>
